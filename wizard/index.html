<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F6FD">
<title>🧙 마법사 대결</title>
<style>
  :root {
    --bg: #F4F6FD;
    --card: #ffffff;
    --ink: #2C3560;
    --muted: #7C86A8;
    --line: #E3E9F8;
    --blue: #6C8BFF;
    --pink: #FF6B8A;
    --gold: #FFC53D;
    --green: #55BE8A;
    --shadow: 0 3px 10px rgba(80,100,160,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(123,167,255,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,170,210,.16), transparent 40%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 6px 0 10px; letter-spacing: .04em; }

  /* ---------- 난이도 ---------- */
  .seg {
    display: flex; gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .seg button {
    flex: 1;
    background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700;
    border: none; border-radius: 10px;
    padding: 9px 2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }

  /* ---------- 점수 ---------- */
  .bars { display: flex; gap: 8px; margin-bottom: 9px; }
  .bar {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 8px 6px 9px;
    box-shadow: var(--shadow);
  }
  .bar b { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .bar span { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; min-height: 36px; line-height: 1.45; }
  #hint b { color: #23883C; font-weight: 800; }

  /* ---------- 싸움터 ---------- */
  #arenawrap { position: relative; }
  canvas {
    display: block;
    width: 100%;
    background: #EAF0FF;
    border-radius: 16px;
    box-shadow: var(--shadow);
    touch-action: pan-y;   /* 위아래로 쓸면 화면이 내려간다 */
  }

  #cover {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding: 0 18px;
    background: rgba(255,255,255,.94);
    border-radius: 16px;
  }
  #cover.on { display: flex; }
  #cover p { margin: 0; font-size: 23px; font-weight: 800; }
  #cover small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.6; }

  #found {
    position: absolute; left: 50%; top: 14px;
    transform: translate(-50%, -14px);
    padding: 9px 16px;
    background: rgba(255,255,255,.96);
    border: 2px solid var(--gold);
    border-radius: 16px;
    box-shadow: var(--shadow);
    font-size: 15px; font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    white-space: nowrap;
  }
  #found.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 버튼 ---------- */
  button {
    font: inherit; font-weight: 700;
    border: none; border-radius: 12px;
    padding: 11px 18px;
    background: var(--blue); color: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.warm { background: var(--pink); }
  button.calm { background: var(--green); }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .row button { flex: 1; max-width: 220px; }

  /* ---------- 마법 재료 ---------- */
  #runes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  #runes button {
    padding: 9px 2px 10px;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--line);
    line-height: 1.3;
  }
  #runes button .e { display: block; font-size: 24px; }
  #runes button .n { display: block; font-size: 11px; font-weight: 800; }
  #runes button[aria-pressed="true"] { border-color: var(--blue); background: #EEF3FF; transform: translateY(-2px); }
  #runes button .c { display: block; font-size: 10px; font-weight: 800; color: var(--blue); height: 12px; }

  /* ---------- 만들어진 마법 ---------- */
  #mix {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding: 10px 12px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    text-align: left;
    min-height: 62px;
  }
  #mix.ready { border-color: var(--gold); background: #FFFBEE; }
  #mixEmo { font-size: 28px; width: 34px; text-align: center; }
  #mixTxt { flex: 1; font-size: 14px; font-weight: 800; line-height: 1.4; }
  #mixTxt small { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  #castBtn { padding: 11px 16px; white-space: nowrap; }

  /* ---------- 마법 도감 ---------- */
  #dex {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 5px;
    margin-top: 10px; padding: 9px 8px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  #dex i {
    font-size: 19px; font-style: normal;
    filter: grayscale(1); opacity: .25;
  }
  #dex i.on { filter: none; opacity: 1; }

  #tip { font-size: 12.5px; color: var(--muted); line-height: 1.75; margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <h1>🧙 마법사 대결</h1>

  <div class="seg" id="levelRow">
    <button data-lv="easy" aria-pressed="true">느긋하게</button>
    <button data-lv="normal" aria-pressed="false">보통</button>
    <button data-lv="hard" aria-pressed="false">도전</button>
  </div>

  <div class="bars">
    <div class="bar"><b>⭐ 단계</b><span id="stage">1/8</span></div>
    <div class="bar"><b>📖 마법</b><span id="known">0/15</span></div>
    <div class="bar"><b>🏆 최고</b><span id="best">1</span></div>
  </div>

  <p id="hint">재료 두 개를 고르면 마법이 만들어진다</p>

  <div id="arenawrap">
    <canvas id="cv"></canvas>
    <div id="found"></div>
    <div id="cover">
      <p id="coverMsg">마법사 대결</p>
      <div class="row" id="coverRow">
        <button id="coverBtn">시작</button>
      </div>
    </div>
  </div>

  <div id="runes"></div>

  <div id="mix">
    <span id="mixEmo">❔</span>
    <span id="mixTxt">재료 두 개를 골라 보자<small>같은 재료를 두 번 골라도 된다</small></span>
    <button id="castBtn" disabled>시전!</button>
  </div>

  <div id="dex"></div>

  <p id="tip">재료 두 개를 섞으면 마법이 된다 · 섞는 순서는 상관없다<br>몬스터마다 약점이 있다 · 약점 재료가 들어가면 피해가 두 배<br>몬스터가 힘을 모으면 다음 턴에 크게 때린다 · 그땐 방패를!<br>쓰러뜨릴수록 더 센 몬스터가 나온다 · 8단계 🐉 용까지 가 보자</p>
</main>

<script>
/* 재료 두 개를 섞으면 마법 하나가 나온다. 섞는 순서는 상관없어서
   두 재료를 가나다순으로 붙인 글자를 열쇠로 쓴다. 불+물과 물+불은 같은 마법이다. */

const LEVELS = {
  easy:   { name: '느긋하게', hp: 150, foeHp: 0.8, foeAtk: 0.6, heal: 1.0 },
  normal: { name: '보통',     hp: 110, foeHp: 1.0, foeAtk: 1.0, heal: 0.55 },
  hard:   { name: '도전',     hp: 95,  foeHp: 1.2, foeAtk: 1.3, heal: 0.45 }
};

const ELEMS = {
  fire:  { emo: '🔥', name: '불',   col: '#FF7043' },
  water: { emo: '💧', name: '물',   col: '#4FB6E8' },
  bolt:  { emo: '⚡', name: '번개', col: '#FFC53D' },
  leaf:  { emo: '🌿', name: '풀',   col: '#55BE8A' },
  rock:  { emo: '🪨', name: '돌',   col: '#A98D77' }
};
const ELEM_ORDER = ['fire', 'water', 'bolt', 'leaf', 'rock'];

/* dmg 때리기 · heal 내 체력 회복 · shield 막아 주는 방패 · burn 몇 턴 동안 계속 아픔 · stun 한 턴 쉬게 하기 */
const SPELLS = {
  'fire,fire':   { emo: '🔥', name: '화염구',      dmg: 26, note: '뜨거운 불덩이를 던진다' },
  'fire,water':  { emo: '♨️', name: '뜨거운 김',   dmg: 14, burn: 5, note: '화상을 입힌다' },
  'bolt,fire':   { emo: '💥', name: '폭발',        dmg: 24, note: '펑 하고 터진다' },
  'fire,leaf':   { emo: '🌋', name: '산불',        dmg: 12, burn: 9, note: '세 턴 동안 계속 탄다' },
  'fire,rock':   { emo: '☄️', name: '용암 덩어리', dmg: 27, note: '가장 센 한 방' },
  'water,water': { emo: '🌊', name: '파도',        dmg: 22, note: '큰 물결로 밀어친다' },
  'bolt,water':  { emo: '⚡', name: '감전',        dmg: 18, stun: 0.45, note: '가끔 못 움직이게 한다' },
  'leaf,water':  { emo: '💚', name: '치유 물약',   heal: 32, note: '내 체력을 크게 채운다' },
  'rock,water':  { emo: '🏔️', name: '진흙 사태',  dmg: 24, note: '진흙을 쏟아붓는다' },
  'bolt,bolt':   { emo: '🌩️', name: '천둥',       dmg: 28, note: '하늘에서 벼락이 떨어진다' },
  'bolt,leaf':   { emo: '🍃', name: '빛나는 잎',   dmg: 16, heal: 14, note: '때리면서 조금 낫는다' },
  'bolt,rock':   { emo: '🧲', name: '자석 폭풍',   dmg: 21, stun: 0.4, note: '가끔 못 움직이게 한다' },
  'leaf,leaf':   { emo: '🌿', name: '숲의 기운',   heal: 20, shield: 15, note: '낫고 방패도 생긴다' },
  'leaf,rock':   { emo: '🌵', name: '가시덩굴',    dmg: 18, shield: 12, note: '때리고 방패도 생긴다' },
  'rock,rock':   { emo: '🛡️', name: '바위 방패',  dmg: 8, shield: 32, note: '큰 공격을 막아 준다' }
};

/* 도감에 보여 줄 차례 */
const DEX = [
  'fire,fire', 'water,water', 'bolt,bolt', 'leaf,leaf', 'rock,rock',
  'fire,water', 'bolt,fire', 'fire,leaf', 'fire,rock', 'bolt,water',
  'leaf,water', 'rock,water', 'bolt,leaf', 'bolt,rock', 'leaf,rock'
];

const MONSTERS = [
  { emo: '🐛', name: '꿈틀이', hp: 42,  atk: 7,  weak: 'fire' },
  { emo: '🦇', name: '박쥐',   hp: 58,  atk: 9,  weak: 'bolt' },
  { emo: '🕷️', name: '거미',   hp: 74,  atk: 10, weak: 'fire' },
  { emo: '🧟', name: '좀비',   hp: 92,  atk: 12, weak: 'leaf' },
  { emo: '👻', name: '유령',   hp: 108, atk: 13, weak: 'bolt' },
  { emo: '🦂', name: '전갈',   hp: 126, atk: 15, weak: 'water' },
  { emo: '🐍', name: '큰뱀',   hp: 150, atk: 16, weak: 'rock' },
  { emo: '🐉', name: '용',     hp: 215, atk: 19, weak: 'water' }
];
const LAST = MONSTERS.length;

const KEY = 'craft-wizard-';

/* ---------- 화면 조각 ---------- */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrapEl = document.getElementById('arenawrap');
const coverEl = document.getElementById('cover');
const coverMsg = document.getElementById('coverMsg');
const coverBtn = document.getElementById('coverBtn');
const foundEl = document.getElementById('found');
const stageEl = document.getElementById('stage');
const knownEl = document.getElementById('known');
const bestEl = document.getElementById('best');
const hintEl = document.getElementById('hint');
const runesEl = document.getElementById('runes');
const mixEl = document.getElementById('mix');
const mixEmo = document.getElementById('mixEmo');
const mixTxt = document.getElementById('mixTxt');
const castBtn = document.getElementById('castBtn');
const dexEl = document.getElementById('dex');
const levelRow = document.getElementById('levelRow');

/* ---------- 상태 ---------- */

let key, lv;
let W = 396, H = 240;
let stage = 1, best = 1;
let php = 100, pmax = 100, shield = 0;
let foe = null, fhp = 0, fmax = 0, burn = 0, burnLeft = 0, stun = false, charge = false;
let picked = [];
let known = new Set();
let phase = 'idle';       // idle 내 차례 · busy 마법이 날아가는 중 · over 끝
let started = false;

let bits = [], pops = [], rings = [], bolts = [];
let shake = 0, foeHurt = 0, meHurt = 0, foeStep = 0, castArm = 0;
let raf = null, last = 0, clock = 0;
let ac = null;

function put(k2, v) { try { localStorage.setItem(KEY + k2, v); } catch (e) {} }
function get(k2) { try { return localStorage.getItem(KEY + k2); } catch (e) { return null; } }
function mixKey(a, b) { return [a, b].sort().join(','); }
function foeOf(n) {
  const base = MONSTERS[(n - 1) % LAST];
  const loop = Math.floor((n - 1) / LAST);          // 여덟 마리를 다 잡으면 더 센 놈들이 다시 온다
  const mul = Math.pow(2.2, loop);
  return { emo: base.emo, name: loop ? base.name + ' ' + (loop + 1) + '세' : base.name, weak: base.weak,
           hp: Math.round(base.hp * mul * lv.foeHp), atk: Math.round(base.atk * mul * lv.foeAtk) };
}

/* ---------- 소리 ---------- */

function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}

function tone(freq, dur, type, vol, delay) {
  if (!ac) return;
  const a0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a0);
  g.gain.exponentialRampToValueAtTime(vol, a0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(a0);
  o.stop(a0 + dur + 0.05);
}

const sfx = {
  pick:  () => tone(700, 0.05, 'triangle', 0.06),
  cast:  () => { [440, 620, 880].forEach((f, i) => tone(f, 0.1, 'triangle', 0.07, i * 0.05)); },
  hit:   () => { tone(180, 0.16, 'sawtooth', 0.09); tone(90, 0.2, 'square', 0.06, 0.02); },
  crit:  () => { [300, 500, 800, 1200].forEach((f, i) => tone(f, 0.12, 'square', 0.08, i * 0.05)); },
  heal:  () => { [660, 880, 1100].forEach((f, i) => tone(f, 0.16, 'sine', 0.09, i * 0.08)); },
  guard: () => tone(320, 0.22, 'sine', 0.1),
  ouch:  () => tone(140, 0.26, 'square', 0.11),
  charge:() => { [200, 260, 330].forEach((f, i) => tone(f, 0.18, 'sawtooth', 0.06, i * 0.09)); },
  win:   () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.2, 'triangle', 0.11, i * 0.12)),
  lose:  () => [400, 330, 260, 180].forEach((f, i) => tone(f, 0.26, 'sawtooth', 0.09, i * 0.14))
};

/* ---------- 알림 ---------- */

function say(t) { hintEl.innerHTML = t; }

let foundTimer = null;
function banner(t) {
  foundEl.textContent = t;
  foundEl.classList.add('on');
  clearTimeout(foundTimer);
  foundTimer = setTimeout(() => foundEl.classList.remove('on'), 1900);
}

function pop(x, y, txt, col, big) { pops.push({ x, y, txt, col, t: 0, big: !!big }); }

function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (spd || 1) * (50 + Math.random() * 170);
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50, life: 0.45 + Math.random() * 0.35, t: 0, col, r: 2 + Math.random() * 4 });
  }
}

/* ---------- 자리 ---------- */

function mePos() { return { x: W * 0.24, y: H * 0.72 }; }
function foePos() { return { x: W * 0.74 + foeStep, y: H * 0.66 }; }

/* ---------- 새 싸움 ---------- */

function newRun() {
  stage = 1;
  pmax = lv.hp;
  php = pmax;
  shield = 0;
  startStage();
}

function startStage() {
  foe = foeOf(stage);
  fmax = foe.hp;
  fhp = fmax;
  burn = 0; burnLeft = 0; stun = false; charge = false;
  picked = [];
  phase = 'idle';
  foeStep = 0;
  paint();
  say('<b>' + foe.name + '</b>이(가) 나타났다! 약점은 ' + ELEMS[foe.weak].emo + ' ' + ELEMS[foe.weak].name);
}

/* ---------- 마법 쓰기 ---------- */

function spellOf(list) {
  if (list.length !== 2) return null;
  return SPELLS[mixKey(list[0], list[1])] || null;
}

function cast() {
  const sp = spellOf(picked);
  if (!sp || phase !== 'idle') return;
  const k2 = mixKey(picked[0], picked[1]);
  const isNew = !known.has(k2);
  known.add(k2);
  put('dex', [...known].join(','));

  phase = 'busy';
  castArm = 1;
  ensureAudio();
  sfx.cast();
  paintButtons();

  const els = [picked[0], picked[1]];
  const weak = els.includes(foe.weak);
  const me = mePos(), fp = foePos();

  /* 마법이 날아가는 모습 */
  bolts.push({ x0: me.x, y0: me.y - 28, x1: fp.x, y1: fp.y, t: 0, dur: 0.42, cols: els.map(e => ELEMS[e].col), emo: sp.emo });
  if (isNew) banner('✨ 새 마법! ' + sp.emo + ' ' + sp.name);
  say('🧙 <b>' + sp.name + '</b>!');

  setTimeout(() => {
    const fp2 = foePos();
    els.forEach(e => burst(fp2.x, fp2.y, ELEMS[e].col, 14));

    if (sp.dmg) {
      let d = sp.dmg + Math.round(Math.random() * 4);
      if (weak) d = Math.round(d * 2);
      fhp = Math.max(0, fhp - d);
      foeHurt = 1;
      shake = weak ? 11 : 6;
      pop(fp2.x, fp2.y - 44, '-' + d, '#FF6B8A', weak);
      if (weak) {
        pop(fp2.x, fp2.y - 74, '약점! 두 배', '#FFB300');
        sfx.crit();
      } else sfx.hit();
      rings.push({ x: fp2.x, y: fp2.y, r: 10, max: 78, t: 0, col: ELEMS[els[0]].col });
    }
    if (sp.heal) {
      const h = Math.min(sp.heal, pmax - php);
      php += h;
      const me2 = mePos();
      pop(me2.x, me2.y - 46, '+' + h, '#23883C');
      burst(me2.x, me2.y - 16, '#7BE0A8', 14);
      sfx.heal();
    }
    if (sp.shield) {
      shield += sp.shield;
      const me2 = mePos();
      pop(me2.x, me2.y - 70, '🛡️ +' + sp.shield, '#4FB6E8');
      sfx.guard();
    }
    if (sp.burn) {
      burn = sp.burn + (weak ? 3 : 0);
      burnLeft = 3;
      pop(fp2.x + 34, fp2.y - 62, '🔥 화상', '#FF7043');
    }
    if (sp.stun && Math.random() < sp.stun) {
      stun = true;
      pop(fp2.x - 30, fp2.y - 62, '💫 기절', '#8E7BFF');
    }

    picked = [];
    paint();

    if (fhp <= 0) { setTimeout(winStage, 700); return; }
    setTimeout(foeTurn, 780);
  }, 430);
}

/* ---------- 몬스터 차례 ---------- */

function foeTurn() {
  if (phase === 'over') return;
  const fp = foePos();

  /* 화상은 먼저 아프다 */
  if (burnLeft > 0) {
    fhp = Math.max(0, fhp - burn);
    burnLeft--;
    foeHurt = 1;
    pop(fp.x, fp.y - 44, '-' + burn, '#FF7043');
    burst(fp.x, fp.y, '#FF7043', 8);
    sfx.hit();
    paint();
    if (fhp <= 0) { setTimeout(winStage, 700); return; }
  }

  if (stun) {
    stun = false;
    say('💫 ' + foe.name + '이(가) 비틀거린다. 한 턴 쉰다!');
    paint();
    setTimeout(myTurn, 800);
    return;
  }

  if (charge) {
    charge = false;
    setTimeout(() => hitMe(2.2, '💢 모아 둔 힘으로 크게 때린다!'), 350);
    return;
  }

  /* 가끔 힘을 모은다. 다음 턴에 크게 때리니까 미리 방패를 만들 수 있다 */
  if (Math.random() < 0.3 && fhp > fmax * 0.25) {
    charge = true;
    sfx.charge();
    say('💢 <b>' + foe.name + '</b>이(가) 힘을 모으고 있다! 다음 턴에 크게 때린다');
    rings.push({ x: fp.x, y: fp.y, r: 60, max: 12, t: 0, col: '#FF6B8A', shrink: true });
    paint();
    setTimeout(myTurn, 900);
    return;
  }

  setTimeout(() => hitMe(1, ''), 200);
}

function hitMe(mul, msg) {
  if (phase === 'over') return;
  foeStep = -1;                       // 달려들었다가 돌아온다
  setTimeout(() => { foeStep = 0; }, 260);
  let d = Math.round(foe.atk * mul * (0.85 + Math.random() * 0.3));
  const me = mePos();

  if (shield > 0) {
    const blocked = Math.min(shield, d);
    shield -= blocked;
    d -= blocked;
    pop(me.x - 6, me.y - 72, '🛡️ ' + blocked + ' 막음', '#4FB6E8');
    sfx.guard();
  }
  if (d > 0) {
    php = Math.max(0, php - d);
    meHurt = 1;
    shake = 7;
    pop(me.x, me.y - 46, '-' + d, '#FF6B8A');
    burst(me.x, me.y - 14, '#FF9AA8', 10);
    sfx.ouch();
  }
  say(msg || ('👾 ' + foe.name + '의 공격!'));
  paint();

  if (php <= 0) { setTimeout(lose, 700); return; }
  setTimeout(myTurn, 700);
}

function myTurn() {
  if (phase === 'over') return;
  phase = 'idle';
  picked = [];
  paint();
  if (charge) say('💢 위험! 다음 공격이 세다 · 🪨+🪨 <b>바위 방패</b>를 써 보자');
  else say('내 차례! 재료 두 개를 골라 마법을 만들자');
}

/* ---------- 이기고 지고 ---------- */

function winStage() {
  const fp = foePos();
  burst(fp.x, fp.y, '#FFC53D', 26, 1.4);
  sfx.win();
  if (stage >= best) { best = stage; put('best', best); }

  if (stage >= LAST) {
    phase = 'over';
    overWin = true;
    coverMsg.innerHTML = '🏆 ' + foe.name + '까지 이겼다!<small>' + stage + '단계를 모두 넘었다<br>이제 더 센 몬스터들이 다시 온다</small>';
    coverBtn.textContent = '더 싸우기';
    coverEl.classList.add('on');
    stage++;
    paint();
    return;
  }
  stage++;
  const back = Math.round(pmax * lv.heal);
  const h = Math.min(back, pmax - php);
  php += h;
  paint();
  say('🎉 이겼다! 체력을 <b>' + h + '</b> 회복했다');
  setTimeout(startStage, 1100);
}

function lose() {
  phase = 'over';
  overWin = false;
  sfx.lose();
  coverMsg.innerHTML = '😵 쓰러졌다<small>' + stage + '단계 ' + foe.name + '에게 졌다<br>다시 1단계부터 해 보자</small>';
  coverBtn.textContent = '다시 하기';
  coverEl.classList.add('on');
  paint();
}

/* ---------- 단추와 숫자 ---------- */

function drawRunes() {
  runesEl.innerHTML = '';
  ELEM_ORDER.forEach(id => {
    const e = ELEMS[id];
    const b = document.createElement('button');
    b.dataset.el = id;
    b.innerHTML = '<span class="e">' + e.emo + '</span><span class="n">' + e.name + '</span><span class="c"></span>';
    runesEl.appendChild(b);
  });
}

function drawDex() {
  dexEl.innerHTML = '';
  DEX.forEach(k2 => {
    const sp = SPELLS[k2];
    const i = document.createElement('i');
    const got = known.has(k2);
    i.textContent = got ? sp.emo : '❔';
    i.className = got ? 'on' : '';
    i.title = got ? sp.name : '아직 안 만들어 본 마법';
    dexEl.appendChild(i);
  });
}

function paintButtons() {
  [...runesEl.children].forEach(b => {
    const n = picked.filter(p => p === b.dataset.el).length;
    b.setAttribute('aria-pressed', n > 0);
    b.querySelector('.c').textContent = n === 2 ? '●●' : n === 1 ? '●' : '';
    b.disabled = phase !== 'idle';
  });

  const sp = spellOf(picked);
  if (picked.length === 0) {
    mixEmo.textContent = '❔';
    mixTxt.innerHTML = '재료 두 개를 골라 보자<small>같은 재료를 두 번 골라도 된다</small>';
    mixEl.classList.remove('ready');
  } else if (picked.length === 1) {
    mixEmo.textContent = ELEMS[picked[0]].emo;
    mixTxt.innerHTML = ELEMS[picked[0]].name + ' …<small>하나만 더 고르면 마법이 된다</small>';
    mixEl.classList.remove('ready');
  } else if (sp) {
    const got = known.has(mixKey(picked[0], picked[1]));
    mixEmo.textContent = got ? sp.emo : '❔';
    mixTxt.innerHTML = got
      ? sp.name + '<small>' + sp.note + '</small>'
      : '처음 보는 마법!<small>시전해서 무엇이 나오는지 보자</small>';
    mixEl.classList.add('ready');
  }
  castBtn.disabled = !(sp && phase === 'idle');
}

function paint() {
  stageEl.textContent = (stage > LAST ? stage : stage + '/' + LAST);
  knownEl.textContent = known.size + '/' + DEX.length;
  bestEl.textContent = best;
  paintButtons();
  drawDex();
}

/* ---------- 판 크기 ---------- */

/* 화면 세로가 짧으면 판을 줄여서 한 화면에 다 들어오게 한다.
   판 위에서는 손가락으로 쓸어도 화면이 안 내려가기 때문이다 */
function availH(minH, maxH) {
  const pageH = document.documentElement.scrollHeight;
  const cvH = cv.getBoundingClientRect().height || 0;
  const room = (window.innerHeight || 800) - (pageH - cvH) - 4;
  return Math.round(Math.max(minH, Math.min(maxH, room)));
}

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = wrapEl.clientWidth || 396;
  H = availH(190, Math.round(W * 0.62));
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------- 그리기 ---------- */

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function hpBar(x, y, w, cur, max, col, label) {
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  rr(x, y, w, 30, 9); ctx.fill();
  ctx.fillStyle = '#E6EAF6';
  rr(x + 6, y + 17, w - 12, 8, 4); ctx.fill();
  const k2 = Math.max(0, Math.min(1, cur / max));
  if (k2 > 0) {
    ctx.fillStyle = col;
    rr(x + 6, y + 17, Math.max(4, (w - 12) * k2), 8, 4); ctx.fill();
  }
  ctx.fillStyle = '#2C3560';
  ctx.font = '800 11px "Apple SD Gothic Neo", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 7, y + 9);
  ctx.textAlign = 'right';
  ctx.fillText(Math.ceil(cur) + '/' + max, x + w - 7, y + 9);
}

function drawWizard() {
  const p = mePos();
  const s = H * 0.3;
  const hurt = meHurt > 0 ? (Math.random() - 0.5) * 6 : 0;
  ctx.save();
  ctx.translate(p.x + hurt, p.y);

  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.beginPath(); ctx.ellipse(0, 6, s * 0.4, s * 0.1, 0, 0, 7); ctx.fill();

  /* 지팡이 */
  ctx.strokeStyle = '#8B5E3C';
  ctx.lineWidth = Math.max(3, s * 0.07);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s * 0.38, 2); ctx.lineTo(s * 0.44, -s * 0.8);
  ctx.stroke();
  const gl = castArm > 0 ? 1 + castArm * 0.8 : 1;
  ctx.fillStyle = '#FFD75E';
  ctx.beginPath(); ctx.arc(s * 0.44, -s * 0.82, s * 0.11 * gl, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,180,.45)';
  ctx.beginPath(); ctx.arc(s * 0.44, -s * 0.82, s * 0.2 * gl, 0, 7); ctx.fill();

  /* 망토 */
  ctx.fillStyle = '#6C5BD4';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.5);
  ctx.lineTo(s * 0.34, 4);
  ctx.quadraticCurveTo(0, s * 0.1, -s * 0.34, 4);
  ctx.closePath(); ctx.fill();

  /* 얼굴 */
  ctx.fillStyle = '#FFD9B0';
  ctx.beginPath(); ctx.arc(0, -s * 0.56, s * 0.16, 0, 7); ctx.fill();
  ctx.fillStyle = '#2C3560';
  ctx.beginPath();
  ctx.arc(-s * 0.06, -s * 0.57, s * 0.022, 0, 7);
  ctx.arc(s * 0.06, -s * 0.57, s * 0.022, 0, 7);
  ctx.fill();

  /* 뾰족 모자 */
  ctx.fillStyle = '#4A3FB0';
  ctx.beginPath();
  ctx.moveTo(-s * 0.24, -s * 0.66);
  ctx.lineTo(s * 0.24, -s * 0.66);
  ctx.lineTo(s * 0.05, -s * 1.12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFC53D';
  ctx.fillRect(-s * 0.26, -s * 0.72, s * 0.52, s * 0.07);

  /* 방패 */
  if (shield > 0) {
    ctx.strokeStyle = 'rgba(79,182,232,.85)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -s * 0.4, s * 0.62 + Math.sin(clock * 4) * 2, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(79,182,232,.12)';
    ctx.beginPath(); ctx.arc(0, -s * 0.4, s * 0.62, 0, 7); ctx.fill();
    ctx.fillStyle = '#2C3560';
    ctx.font = '800 11px "Apple SD Gothic Neo", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🛡️ ' + shield, 0, -s * 1.12);
  }
  ctx.restore();
}

function drawFoe() {
  const p = foePos();
  const s = H * 0.3;
  const bob = Math.sin(clock * 2.2) * 4;
  const hurt = foeHurt > 0 ? (Math.random() - 0.5) * 8 : 0;
  ctx.save();
  ctx.translate(p.x + hurt, p.y + bob);

  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.beginPath(); ctx.ellipse(0, 10 - bob, s * 0.4, s * 0.1, 0, 0, 7); ctx.fill();

  if (charge) {
    ctx.fillStyle = 'rgba(255,107,138,' + (0.16 + Math.sin(clock * 9) * 0.1) + ')';
    ctx.beginPath(); ctx.arc(0, -s * 0.3, s * 0.72, 0, 7); ctx.fill();
  }
  if (foeHurt > 0) {
    ctx.fillStyle = 'rgba(255,90,120,' + (foeHurt * 0.4) + ')';
    ctx.beginPath(); ctx.arc(0, -s * 0.3, s * 0.6, 0, 7); ctx.fill();
  }

  ctx.font = Math.round(s * 1.05) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(foe.emo, 0, -s * 0.3);

  ctx.font = '800 12px "Apple SD Gothic Neo", sans-serif';
  ctx.fillStyle = '#2C3560';
  let tag = '약점 ' + ELEMS[foe.weak].emo;
  if (burnLeft > 0) tag += ' · 🔥' + burnLeft;
  if (charge) tag = '💢 힘을 모으는 중!';
  ctx.fillText(tag, 0, s * 0.3);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  /* 배경 */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#DCE6FF');
  g.addColorStop(1, '#F6F1FF');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#C9DFF7';
  ctx.beginPath();
  ctx.ellipse(W * 0.5, H * 1.05, W * 0.75, H * 0.36, 0, 0, 7);
  ctx.fill();
  ctx.font = '18px serif';
  ctx.textAlign = 'center';
  ctx.fillText('✨', W * 0.12, H * 0.18);
  ctx.fillText('🌙', W * 0.88, H * 0.16);

  if (foe) { drawFoe(); }
  drawWizard();

  /* 체력 막대 */
  const bw = Math.min(W * 0.44, 172);
  hpBar(10, 8, bw, php, pmax, '#55BE8A', '🧙 나');
  if (foe) hpBar(W - 10 - bw, 8, bw, fhp, fmax, '#FF6B8A', foe.emo + ' ' + foe.name);

  /* 날아가는 마법 */
  bolts.forEach(b => {
    const k2 = Math.min(1, b.t / b.dur);
    const x = b.x0 + (b.x1 - b.x0) * k2;
    const y = b.y0 + (b.y1 - b.y0) * k2 - Math.sin(k2 * Math.PI) * 34;
    for (let i = 0; i < 6; i++) {
      const kk = Math.max(0, k2 - i * 0.05);
      const tx = b.x0 + (b.x1 - b.x0) * kk;
      const ty = b.y0 + (b.y1 - b.y0) * kk - Math.sin(kk * Math.PI) * 34;
      ctx.globalAlpha = (1 - i / 6) * 0.5;
      ctx.fillStyle = b.cols[i % b.cols.length];
      ctx.beginPath(); ctx.arc(tx, ty, 9 - i, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.emo, x, y);
  });

  /* 조각 */
  bits.forEach(b => {
    ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
    ctx.fillStyle = b.col;
    ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  });
  ctx.globalAlpha = 1;

  /* 고리 */
  rings.forEach(r2 => {
    const k2 = r2.t / 0.5;
    ctx.globalAlpha = Math.max(0, 1 - k2);
    ctx.strokeStyle = r2.col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(r2.x, r2.y, r2.r + (r2.max - r2.r) * k2, 0, 7);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  /* 떠오르는 글씨 */
  pops.forEach(p => {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.05);
    ctx.font = '800 ' + (p.big ? 24 : 17) + 'px "Apple SD Gothic Neo", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.strokeText(p.txt, p.x, p.y - p.t * 32);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, p.x, p.y - p.t * 32);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

/* ---------- 흐르는 시간 ---------- */

function tick(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  clock += dt;

  shake = Math.max(0, shake - dt * 40);
  foeHurt = Math.max(0, foeHurt - dt * 3);
  meHurt = Math.max(0, meHurt - dt * 3);
  castArm = Math.max(0, castArm - dt * 2);

  bolts.forEach(b => b.t += dt);
  bolts = bolts.filter(b => b.t < b.dur);
  bits.forEach(b => { b.t += dt; b.vy += 640 * dt; b.x += b.vx * dt; b.y += b.vy * dt; });
  bits = bits.filter(b => b.t < b.life);
  pops.forEach(p => p.t += dt);
  pops = pops.filter(p => p.t < 1.05);
  rings.forEach(r2 => r2.t += dt);
  rings = rings.filter(r2 => r2.t < 0.5);

  draw();
  raf = requestAnimationFrame(tick);
}

/* ---------- 누르기 ---------- */

runesEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-el]');
  if (!b || phase !== 'idle' || !started) return;
  ensureAudio();
  const id = b.dataset.el;
  const at = picked.indexOf(id);
  if (picked.length >= 2 && at < 0) { say('재료는 두 개까지! 고른 재료를 다시 누르면 빠진다'); return; }
  if (at >= 0 && picked.length === 2) picked.splice(at, 1);
  else picked.push(id);
  sfx.pick();
  paintButtons();
});

castBtn.addEventListener('click', () => { if (started) cast(); });

coverBtn.addEventListener('click', () => {
  ensureAudio();
  coverEl.classList.remove('on');
  if (!started) { started = true; startStage(); return; }
  if (phase === 'over') {
    if (overWin) { php = pmax; shield = 0; startStage(); }
    else newRun();
  }
});

levelRow.addEventListener('click', e => {
  const b = e.target.closest('button[data-lv]');
  if (!b) return;
  key = b.dataset.lv;
  lv = LEVELS[key];
  put('level', key);
  [...levelRow.children].forEach(x => x.setAttribute('aria-pressed', x.dataset.lv === key));
  newRun();
  say(lv.name + '(으)로 바꾸고 1단계부터 다시 시작!');
});

window.addEventListener('resize', fit);

/* ---------- 시작 ---------- */

let overWin = false;

key = get('level') || 'easy';
if (!LEVELS[key]) key = 'easy';
lv = LEVELS[key];
[...levelRow.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.lv === key));

best = +get('best') || 1;
known = new Set((get('dex') || '').split(',').filter(Boolean));

drawRunes();
fit();
fit();
newRun();
paint();

coverMsg.innerHTML = '🧙 마법사 대결<small>불·물·번개·풀·돌 중 두 개를 섞어<br>나만의 마법을 만들어 싸운다<br>마법은 모두 15가지!</small>';
coverBtn.textContent = '시작';
coverEl.classList.add('on');

last = performance.now();
raf = requestAnimationFrame(tick);
</script>
