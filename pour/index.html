<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F6FD">
<title>🧪 물 붓기 퍼즐</title>
<style>
  :root {
    --bg: #F4F6FD;
    --card: #ffffff;
    --ink: #2C3560;
    --muted: #7C86A8;
    --line: #E3E9F8;
    --blue: #6C8BFF;
    --pink: #FF6B8A;
    --gold: #FFC53D;
    --shadow: 0 3px 10px rgba(80,100,160,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(123,167,255,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,170,210,.16), transparent 40%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 6px 0 10px; letter-spacing: .04em; }

  /* ---------- 난이도 ---------- */
  .seg {
    display: flex; gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .seg button {
    flex: 1;
    background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700;
    border: none; border-radius: 10px;
    padding: 9px 2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }

  /* ---------- 점수 ---------- */
  .bars { display: flex; gap: 8px; margin-bottom: 10px; }
  .bar {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 8px 6px 9px;
    box-shadow: var(--shadow);
  }
  .bar b { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .bar span { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 18px; }
  #hint b { color: #23883C; font-weight: 800; }

  /* ---------- 판 ---------- */
  #boardwrap { position: relative; }
  #board {
    display: flex; flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 10px 12px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 16px 10px 14px;
    min-height: 200px;
  }

  /* ---------- 병 ---------- */
  .tube {
    position: relative;
    width: 44px;
    padding: 0; border: none; background: none;
    cursor: pointer;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1);
  }
  .glass {
    position: relative;
    height: 132px;
    display: flex; flex-direction: column-reverse;
    background: #F7F9FF;
    border: 3px solid #DDE4F7;
    border-top: none;
    border-radius: 6px 6px 20px 20px;
    overflow: hidden;
  }
  .tube.up { transform: translateY(-14px); }
  .tube.up .glass { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(108,139,255,.22); }
  .tube.tip { animation: tip .32s ease; }
  .tube.no { animation: no .3s ease; }
  .tube.done .glass { border-color: #B9E7C9; }
  .tube.pop { animation: pop .34s cubic-bezier(.34,1.56,.64,1); }

  .seg-liq { height: 30px; width: 100%; }
  .seg-liq.drop { animation: drop .26s cubic-bezier(.34,1.56,.64,1); }
  .cap {
    position: absolute; top: -20px; left: 0; right: 0;
    font-size: 15px; line-height: 1;
    opacity: 0; transform: scale(.4);
    transition: opacity .2s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .tube.done .cap { opacity: 1; transform: scale(1); }

  @keyframes drop { from { transform: translateY(-26px); opacity: .25; } to { transform: none; opacity: 1; } }
  @keyframes tip  { 50% { transform: translateY(-14px) rotate(-16deg); } }
  @keyframes no   { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop  { 40% { transform: translateY(-20px) scale(1.06); } }

  /* ---------- 단추 ---------- */
  .tools { display: flex; gap: 6px; margin-top: 12px; }
  .tools button {
    flex: 1;
    font: inherit; font-size: 13px; font-weight: 800;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 2px; cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .tools button:disabled { opacity: .4; }

  /* ---------- 이겼을 때 ---------- */
  #cover {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    background: rgba(255,255,255,.92);
    border-radius: 16px;
    font: inherit;
    border: none; cursor: pointer;
  }
  #cover .big { font-size: 26px; font-weight: 800; }
  #cover .sub { font-size: 14px; color: var(--muted); font-weight: 700; line-height: 1.6; }
  #cover .go {
    font-size: 14px; font-weight: 800; color: #fff;
    background: var(--blue); border-radius: 12px; padding: 11px 20px;
  }
  .conf {
    position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px;
    animation: fall 1.5s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(320px) rotate(540deg); opacity: 0; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🧪 물 붓기 퍼즐</h1>

  <div class="seg" id="levelRow" role="group" aria-label="난이도">
    <button data-k="easy" aria-pressed="true">쉬움</button>
    <button data-k="normal" aria-pressed="false">보통</button>
    <button data-k="hard" aria-pressed="false">어려움</button>
  </div>

  <div class="bars">
    <div class="bar"><b>옮긴 횟수</b><span id="moves">0</span></div>
    <div class="bar"><b>남은 색</b><span id="left">0</span></div>
    <div class="bar"><b>최소 기록</b><span id="best">-</span></div>
  </div>

  <p id="hint">같은 색끼리 모으면 이겨. 병을 누르면 맨 위 물이 뜨고, 다른 병을 누르면 부어져.</p>

  <div id="boardwrap">
    <div id="board"></div>
    <button id="cover" hidden></button>
  </div>

  <div class="tools">
    <button id="undoBtn">↩️ 되돌리기</button>
    <button id="hintBtn">💡 힌트</button>
    <button id="againBtn">🔄 다시</button>
    <button id="newBtn">✨ 새 판</button>
  </div>
</main>

<script>
/* ---------- 설정 ---------- */
const H = 4;                      // 병 하나에 물 네 칸
// 쉬움은 앞의 세 색만 쓰니까, 서로 제일 안 헷갈리는 색을 앞에 둔다
const COLORS = ['#FF5E5B','#3B8EEA','#FFD23F','#4FB477','#8E6BFF','#FF9F1C','#2EC4B6','#FF6FB5','#8B5E3C'];

const LEVELS = {
  easy:   { name: '쉬움',   colors: 3, empties: 2 },
  normal: { name: '보통',   colors: 5, empties: 2 },
  hard:   { name: '어려움', colors: 8, empties: 2 }
};
const KEY_LEVEL = 'craft-pour-level';
const KEY_BEST  = 'craft-pour-best';   // 난이도별로 따로 쌓인다

let key = 'easy';
let lv = LEVELS[key];
let tubes = [];          // [[색번호, ...], ...]  0번이 바닥
let start = [];          // 이 판의 처음 모습 (다시 하기용)
let history = [];
let picked = -1;
let moves = 0;
let won = false;
let ac = null;

const board = document.getElementById('board');
const cover = document.getElementById('cover');
const hintEl = document.getElementById('hint');
const levelRow = document.getElementById('levelRow');

/* ---------- 소리 ---------- */
function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type, vol) {
  if (!ac) return;
  const at = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ac.destination);
  o.start(at);
  o.stop(at + dur + 0.05);
}
const sfx = {
  pick:  () => tone(700, 0.06, 'triangle', 0.07),
  pour:  (n) => tone(380 + n * 60, 0.12, 'sine', 0.11),
  done:  () => { [784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.10), i * 90)); },
  undo:  () => tone(300, 0.08, 'sine', 0.07),
  no:    () => tone(170, 0.12, 'square', 0.07),
  win:   () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.12), i * 120)); }
};

/* ---------- 규칙 ---------- */
function topRun(t) {                       // 맨 위에 같은 색이 몇 칸 연달아 있나
  if (!t.length) return 0;
  const c = t[t.length - 1];
  let n = 1;
  while (n < t.length && t[t.length - 1 - n] === c) n++;
  return n;
}
function canPour(s, from, to) {
  if (from === to) return 0;
  const a = s[from], b = s[to];
  if (!a.length || b.length >= H) return 0;
  if (b.length && b[b.length - 1] !== a[a.length - 1]) return 0;
  return Math.min(topRun(a), H - b.length);
}
function isFull(t) { return t.length === H && t.every(v => v === t[0]); }
function isWin(s) { return s.every(t => t.length === 0 || isFull(t)); }
function cloneState(s) { return s.map(t => t.slice()); }
function applyMove(s, m) {
  const out = cloneState(s);
  const n = canPour(out, m.from, m.to);
  for (let i = 0; i < n; i++) out[m.to].push(out[m.from].pop());
  return out;
}

/* ---------- 푸는 기계 (힌트 + 풀 수 있는 판 만들기) ---------- */
function canon(s) { return s.map(t => t.join(',')).sort().join('|'); }

function legalMoves(s) {
  const out = [];
  for (let i = 0; i < s.length; i++) {
    const a = s[i];
    if (!a.length) continue;
    const uniform = a.every(v => v === a[0]);
    if (uniform && a.length === H) continue;               // 이미 다 찬 병은 건드리지 않는다
    for (let j = 0; j < s.length; j++) {
      const n = canPour(s, i, j);
      if (!n) continue;
      if (uniform && !s[j].length) continue;               // 한 색뿐인 병을 빈 병으로 통째로 옮기는 건 헛수고
      let score = s[j].length ? 2 : 0;
      if (s[j].length + n === H) score += 3;               // 병을 완성하는 수를 먼저 본다
      if (n === a.length) score += 1;                      // 병을 통째로 비우는 수도 좋다
      out.push({ from: i, to: j, score: score });
    }
  }
  return out;
}

/* 푸는 순서를 통째로 돌려준다. 못 풀면 null.
   첫 수만 매번 새로 계산하면 방금 한 수를 되돌리는 수를 알려줄 수 있어서,
   한 번 세운 순서를 끝까지 들고 간다. */
function solvePath(s0, cap) {
  cap = cap || 60000;
  const nodes = [{ s: s0, p: -1, m: null }];
  const stack = [0];
  const seen = new Set();
  let n = 0;
  while (stack.length) {
    if (++n > cap) return null;
    const id = stack.pop();
    const cur = nodes[id];
    const k = canon(cur.s);
    if (seen.has(k)) continue;
    seen.add(k);
    if (isWin(cur.s)) {
      const path = [];
      let x = id;
      while (nodes[x].m) { path.unshift(nodes[x].m); x = nodes[x].p; }
      return path;
    }
    const ms = legalMoves(cur.s);
    ms.sort((a, b) => a.score - b.score);                  // 좋은 수를 스택 맨 위에 둔다
    for (const m of ms) {
      nodes.push({ s: applyMove(cur.s, m), p: id, m: m });
      stack.push(nodes.length - 1);
    }
  }
  return null;
}
function solvable(s) { return isWin(s) || solvePath(s, 30000) !== null; }

/* 세워둔 순서를 들고 있다가, 플레이어가 그대로 두면 다음 수를 이어서 알려준다 */
let plan = null;
function exactKey(s) { return s.map(t => t.join(',')).join('|'); }
function planNow() {
  if (plan && plan.key === exactKey(tubes)) return plan.moves;
  const moves = solvePath(cloneState(tubes), 60000);
  plan = moves ? { key: exactKey(tubes), moves: moves } : null;
  return moves;
}
function planAdvance(from, to) {
  if (!plan) return;
  const next = plan.moves[0];
  if (next && next.from === from && next.to === to) {
    plan.moves.shift();
    plan.key = exactKey(tubes);
    if (!plan.moves.length) plan = null;
  } else {
    plan = null;
  }
}

/* ---------- 판 만들기 ---------- */
function shuffled(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function deal() {
  const pool = [];
  for (let c = 0; c < lv.colors; c++) for (let k = 0; k < H; k++) pool.push(c);
  shuffled(pool);
  const s = [];
  for (let i = 0; i < lv.colors; i++) s.push(pool.slice(i * H, i * H + H));
  for (let i = 0; i < lv.empties; i++) s.push([]);
  return s;
}
function makeBoard() {
  for (let t = 0; t < 60; t++) {
    const s = deal();
    if (isWin(s)) continue;                 // 이미 다 맞춰진 판은 버린다
    if (solvable(s)) return s;
  }
  return deal();                            // 여기까지 오는 일은 거의 없다
}

/* ---------- 그리기 ---------- */
function render(fresh) {
  board.innerHTML = '';
  tubes.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tube' + (i === picked ? ' up' : '') + (isFull(t) ? ' done' : '');
    btn.dataset.i = i;

    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = '✨';
    btn.appendChild(cap);

    const glass = document.createElement('div');
    glass.className = 'glass';
    t.forEach((c, d) => {
      const seg = document.createElement('div');
      seg.className = 'seg-liq' + (!fresh && justLanded(i, d) ? ' drop' : '');
      seg.style.background = COLORS[c];
      glass.appendChild(seg);
    });
    btn.appendChild(glass);
    btn.addEventListener('click', () => tap(i));
    board.appendChild(btn);
  });

  document.getElementById('moves').textContent = moves;
  document.getElementById('left').textContent =
    tubes.filter(t => t.length && !isFull(t)).length;
  const b = getBest();
  document.getElementById('best').textContent = b ? b : '-';
}

let landed = null;                       // 방금 부어진 칸 (애니메이션용)
function justLanded(i, d) {
  return landed && landed.to === i && d >= landed.at;
}

/* ---------- 조작 ---------- */
function tap(i) {
  if (won) return;
  ensureAudio();

  if (picked < 0) {
    if (!tubes[i].length) { shake(i); return; }
    if (isFull(tubes[i])) { shake(i); return; }
    picked = i;
    sfx.pick();
    render(true);
    return;
  }
  if (picked === i) { picked = -1; render(true); return; }

  const n = canPour(tubes, picked, i);
  if (!n) { sfx.no(); shake(i); return; }

  history.push({ s: cloneState(tubes), moves: moves });
  const from = picked;
  const at = tubes[i].length;
  for (let k = 0; k < n; k++) tubes[i].push(tubes[from].pop());
  moves++;
  picked = -1;
  planAdvance(from, i);
  landed = { to: i, at: at };
  sfx.pour(n);
  render(false);
  landed = null;

  const el = board.querySelector('[data-i="' + from + '"]');
  if (el) { el.classList.add('tip'); setTimeout(() => el.classList.remove('tip'), 340); }

  if (isFull(tubes[i])) {
    const t2 = board.querySelector('[data-i="' + i + '"]');
    if (t2) { t2.classList.add('pop'); setTimeout(() => t2.classList.remove('pop'), 360); }
    sfx.done();
  }
  if (isWin(tubes)) finish();
  else hintEl.textContent = '';
}

function shake(i) {
  const el = board.querySelector('[data-i="' + i + '"]');
  if (!el) return;
  el.classList.add('no');
  setTimeout(() => el.classList.remove('no'), 320);
}

function undo() {
  if (!history.length || won) return;
  const h = history.pop();
  tubes = h.s;
  moves = h.moves;
  plan = null;
  picked = -1;
  sfx.undo();
  render(true);
  hintEl.textContent = '';
}

function showHint() {
  if (won) return;
  ensureAudio();
  const moves = planNow();
  const m = moves && moves.length ? moves[0] : null;
  if (!m) {
    hintEl.innerHTML = '여기서는 더 못 풀어 😅 <b>되돌리기</b>를 눌러서 한 수 물러 보자.';
    sfx.no();
    return;
  }
  hintEl.innerHTML = '저 두 병을 봐 — 왼쪽 걸 눌러서 오른쪽에 부어 봐.';
  [m.from, m.to].forEach((i, k) => {
    const el = board.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    el.classList.add(k === 0 ? 'up' : 'pop');
    setTimeout(() => el.classList.remove(k === 0 ? 'up' : 'pop'), 900);
  });
  sfx.pick();
}

/* ---------- 이겼을 때 ---------- */
function finish() {
  won = true;
  picked = -1;
  sfx.win();
  const b = getBest();
  const isBest = !b || moves < b;
  if (isBest) setBest(moves);

  cover.hidden = false;
  cover.innerHTML =
    '<div class="big">🎉 다 모았다!</div>' +
    '<div class="sub">' + moves + '번 만에 끝냈어' +
    (isBest ? '<br><b>최소 기록이야!</b>' : (b ? '<br>최소 기록은 ' + b + '번' : '')) + '</div>' +
    '<div class="go">새 판 하기</div>';
  confetti();
}
function confetti() {
  const wrap = document.getElementById('boardwrap');
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = Math.random() * 100 + '%';
    d.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    d.style.animationDelay = (Math.random() * 0.5) + 's';
    wrap.appendChild(d);
    setTimeout(() => d.remove(), 2200);
  }
}

/* ---------- 기록 ---------- */
function getBest() {
  let raw = null;
  try { raw = localStorage.getItem(KEY_BEST + '-' + key); } catch (e) {}
  const n = parseInt(raw, 10);
  return isNaN(n) ? 0 : n;
}
function setBest(n) {
  try { localStorage.setItem(KEY_BEST + '-' + key, String(n)); } catch (e) {}
}

/* ---------- 새 게임 ---------- */
function newGame() {
  tubes = makeBoard();
  start = cloneState(tubes);
  plan = null;
  history = [];
  picked = -1;
  moves = 0;
  won = false;
  cover.hidden = true;
  hintEl.textContent = '같은 색끼리 모으면 이겨. 맨 위 색이 같아야만 부어져.';
  render(true);
}
function again() {
  tubes = cloneState(start);
  plan = null;
  history = [];
  picked = -1;
  moves = 0;
  won = false;
  cover.hidden = true;
  hintEl.textContent = '';
  render(true);
}

function setLevel(k) {
  if (!LEVELS[k]) k = 'easy';
  key = k;
  lv = LEVELS[k];
  document.querySelectorAll('#levelRow button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.k === k ? 'true' : 'false');
  });
  try { localStorage.setItem(KEY_LEVEL, k); } catch (e) {}
  newGame();
}

levelRow.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setLevel(b.dataset.k);
});
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('hintBtn').addEventListener('click', showHint);
document.getElementById('againBtn').addEventListener('click', again);
document.getElementById('newBtn').addEventListener('click', newGame);
cover.addEventListener('click', newGame);

let startKey = 'easy';
try { startKey = localStorage.getItem(KEY_LEVEL) || 'easy'; } catch (e) {}
setLevel(startKey);
</script>
</body>
</html>
