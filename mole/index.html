<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>두더지 잡기</title>
<style>
  :root{
    --grass1:#7BC96F; --grass2:#8FD383;
    --dirt:#6B4A2E; --hole:#3D2A18;
    --ink:#2E2418;
    --card:#FFF9EE;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(var(--grass1), var(--grass2));
    color:var(--ink);
    display:flex; justify-content:center;
    touch-action:manipulation;
    user-select:none;
  }
  .wrap{width:100%; max-width:440px; padding:14px; display:flex; flex-direction:column; gap:12px; height:100%;}

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    font-weight:900; font-size:1.15rem;
  }
  .hud .time.low{color:#D7263D; animation:blinkT .5s infinite;}
  @keyframes blinkT{50%{opacity:.4}}

  #field{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:10px;
    align-content:center;
  }
  .hole{
    position:relative;
    aspect-ratio:1;
    overflow:hidden;
    cursor:pointer;
  }
  .hole .pit{
    position:absolute; bottom:6%; left:10%; right:10%;
    height:26%;
    background:radial-gradient(ellipse at center, var(--hole) 60%, var(--dirt));
    border-radius:50%;
    box-shadow:inset 0 6px 8px rgba(0,0,0,.5);
  }
  .hole .critter{
    position:absolute; left:14%; right:14%; bottom:10%;
    transform:translateY(110%);
    transition:transform .12s ease-out;
    z-index:1;
  }
  .hole.up .critter{transform:translateY(8%);}
  .hole .critter svg{width:100%; display:block;}
  .hole .rim{
    position:absolute; bottom:4%; left:6%; right:6%;
    height:16%;
    background:var(--dirt);
    border-radius:50%;
    z-index:2;
  }
  .hole.bonk .critter{transform:translateY(8%) scale(1.1, 0.65) !important; transition:transform .08s;}
  .pop-text{
    position:absolute; left:50%; top:20%;
    transform:translateX(-50%);
    font-weight:900; font-size:1.3rem;
    pointer-events:none;
    z-index:3;
    animation:rise .7s forwards;
    text-shadow:0 2px 4px rgba(0,0,0,.3);
    white-space:nowrap;
  }
  @keyframes rise{from{opacity:1; margin-top:0}to{opacity:0; margin-top:-34px}}

  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(46,36,24,.82);
    color:#FFF9EE;
    text-align:center;
    padding:24px;
    z-index:10;
  }
  .overlay h1{font-size:2rem; margin-bottom:12px;}
  .overlay p{font-size:1.1rem; line-height:1.7;}
  .big-btn{
    margin-top:22px;
    font-family:inherit;
    font-size:1.3rem; font-weight:900;
    color:#fff; background:#E07A3F;
    border:none; border-radius:14px;
    padding:14px 42px;
    cursor:pointer;
    box-shadow:0 5px 0 #9C4F1F;
  }
  .big-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #9C4F1F;}
  .final{font-size:3.2rem; font-weight:900; color:#FFD166; margin:10px 0;}
  .best-line{opacity:.85;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>🏆 <span id="score">0</span>점</span>
    <span>🔥 x<span id="streak">0</span></span>
    <span class="time">⏰ <span id="time">45</span>초</span>
  </div>
  <div id="field"></div>
</div>

<div class="overlay" id="start">
  <h1>🔨 두더지 잡기</h1>
  <p>
    두더지를 탭해서 잡아! <b>+1점</b><br>
    반짝이는 황금 두더지는 <b style="color:#FFD166">+3점</b><br>
    🦝 <b>너구리는 친구야! 때리면 -3점</b> 😡<br>
    연속으로 잡으면 🔥 콤보 보너스!
  </p>
  <button class="big-btn" onclick="startGame()">시작! (45초)</button>
</div>

<div class="overlay hidden" id="over">
  <h1>⏰ 끝!</h1>
  <div class="final" id="final">0점</div>
  <p class="best-line" id="best-line"></p>
  <p id="grade"></p>
  <button class="big-btn" onclick="startGame()">한 판 더!</button>
</div>

<script>
const KEY = 'mole-whack-best-v1';
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;
async function storageGet(k){
  if(hasCloudStorage){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem(k);
}
async function storageSet(k,v){
  try{
    if(hasCloudStorage) await window.storage.set(k,v);
    else localStorage.setItem(k,v);
  }catch(e){}
}

/* ---------- SVG critters ---------- */
const MOLE_SVG = `
<svg viewBox="0 0 100 90">
  <ellipse cx="50" cy="55" rx="34" ry="34" fill="#7A5230"/>
  <ellipse cx="50" cy="66" rx="20" ry="16" fill="#A97C50"/>
  <circle cx="38" cy="44" r="4.5" fill="#1C1408"/>
  <circle cx="62" cy="44" r="4.5" fill="#1C1408"/>
  <ellipse cx="50" cy="56" rx="7" ry="5.5" fill="#E8909C"/>
  <path d="M43 66 Q50 71 57 66" stroke="#1C1408" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M28 62 Q20 60 18 66" stroke="#7A5230" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M72 62 Q80 60 82 66" stroke="#7A5230" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M40 33 L44 26 M50 31 L50 24 M60 33 L56 26" stroke="#7A5230" stroke-width="4" stroke-linecap="round"/>
</svg>`;
const GOLD_SVG = MOLE_SVG
  .replaceAll('#7A5230', '#E0A93C')
  .replaceAll('#A97C50', '#F5D284')
  .replace('</svg>', `<text x="50" y="16" font-size="16" text-anchor="middle">✨</text></svg>`);
const RACCOON_SVG = `
<svg viewBox="0 0 100 90">
  <ellipse cx="50" cy="56" rx="34" ry="32" fill="#8D8D93"/>
  <path d="M24 34 Q20 16 36 22 Q31 28 30 36 Z" fill="#8D8D93"/>
  <path d="M76 34 Q80 16 64 22 Q69 28 70 36 Z" fill="#8D8D93"/>
  <path d="M27 31 Q26 21 35 25 Q31 28 30 34 Z" fill="#4A4A50"/>
  <path d="M73 31 Q74 21 65 25 Q69 28 70 34 Z" fill="#4A4A50"/>
  <path d="M22 48 Q32 39 45 46 Q42 58 30 59 Q24 55 22 48 Z" fill="#4A4A50"/>
  <path d="M78 48 Q68 39 55 46 Q58 58 70 59 Q76 55 78 48 Z" fill="#4A4A50"/>
  <ellipse cx="50" cy="64" rx="17" ry="13" fill="#EDEDEF"/>
  <circle cx="36" cy="50" r="4.5" fill="#fff"/><circle cx="37" cy="51" r="2.6" fill="#1C1C1E"/>
  <circle cx="64" cy="50" r="4.5" fill="#fff"/><circle cx="63" cy="51" r="2.6" fill="#1C1C1E"/>
  <ellipse cx="50" cy="61" rx="5" ry="4" fill="#1C1C1E"/>
  <path d="M45 70 Q50 75 55 70" stroke="#1C1C1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>`;

/* ---------- game ---------- */
const N = 9;
const field = document.getElementById('field');
let holes = [];
let running = false;
let score, streak, timeLeft, best = 0;
let spawnTimer = null, tickTimer = null;
let spawnGap = 900, upTime = 950;

function buildField(){
  field.innerHTML = '';
  holes = [];
  for(let i=0;i<N;i++){
    const h = document.createElement('div');
    h.className = 'hole';
    h.innerHTML = `<div class="pit"></div><div class="critter"></div><div class="rim"></div>`;
    h.dataset.type = '';
    h.addEventListener('pointerdown', ()=>whack(i));
    field.appendChild(h);
    holes.push(h);
  }
}
buildField();

function startGame(){
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  score = 0; streak = 0; timeLeft = 45;
  spawnGap = 900; upTime = 950;
  holes.forEach(h=>{ h.classList.remove('up','bonk'); h.dataset.type=''; });
  running = true;
  updateHud();
  clearInterval(tickTimer);
  tickTimer = setInterval(tick, 1000);
  scheduleSpawn();
}

function tick(){
  timeLeft--;
  updateHud();
  if(timeLeft <= 10) document.querySelector('.time').classList.add('low');
  else document.querySelector('.time').classList.remove('low');
  if(timeLeft <= 0) endGame();
}

function scheduleSpawn(){
  clearTimeout(spawnTimer);
  if(!running) return;
  spawnTimer = setTimeout(()=>{
    spawn();
    // 점점 빨라짐
    spawnGap = Math.max(380, spawnGap - 14);
    upTime = Math.max(520, upTime - 10);
    scheduleSpawn();
  }, spawnGap);
}

function spawn(){
  if(!running) return;
  const empty = holes.filter(h=>!h.classList.contains('up'));
  if(!empty.length) return;
  const h = empty[Math.floor(Math.random()*empty.length)];
  const r = Math.random();
  let type = 'mole', svg = MOLE_SVG;
  if(r < 0.10){ type='gold'; svg = GOLD_SVG; }
  else if(r < 0.28){ type='raccoon'; svg = RACCOON_SVG; }
  h.dataset.type = type;
  h.querySelector('.critter').innerHTML = svg;
  h.classList.add('up');
  const myToken = Symbol();
  h._token = myToken;
  setTimeout(()=>{
    if(h._token === myToken && h.classList.contains('up')){
      h.classList.remove('up');
      // 일반/황금 두더지를 놓치면 콤보 끊김
      if(h.dataset.type !== 'raccoon' && running){
        streak = 0;
        updateHud();
      }
      h.dataset.type = '';
    }
  }, upTime);
}

function whack(i){
  if(!running) return;
  const h = holes[i];
  if(!h.classList.contains('up')) return;
  const type = h.dataset.type;
  h.dataset.type = '';
  h._token = null;

  h.classList.add('bonk');
  setTimeout(()=>{ h.classList.remove('bonk','up'); }, 120);

  if(type === 'raccoon'){
    score = Math.max(0, score - 3);
    streak = 0;
    popText(h, '친구야!! -3', '#D7263D');
    navigator.vibrate && navigator.vibrate(120);
  }else if(type === 'gold'){
    streak++;
    const bonus = 3 + Math.floor(streak/5);
    score += bonus;
    popText(h, `+${bonus} ✨`, '#FFD166');
  }else{
    streak++;
    const bonus = 1 + Math.floor(streak/5);
    score += bonus;
    popText(h, `+${bonus}`, '#FFF9EE');
  }
  updateHud();
}

function popText(h, text, color){
  const el = document.createElement('div');
  el.className = 'pop-text';
  el.textContent = text;
  el.style.color = color;
  h.appendChild(el);
  setTimeout(()=>el.remove(), 700);
}

function updateHud(){
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('time').textContent = Math.max(0,timeLeft);
}

function endGame(){
  running = false;
  clearTimeout(spawnTimer);
  clearInterval(tickTimer);
  holes.forEach(h=>{ h.classList.remove('up'); h.dataset.type=''; });
  best = Math.max(best, score);
  storageSet(KEY, String(best));
  document.getElementById('final').textContent = score + '점';
  document.getElementById('best-line').textContent = '🏆 최고 기록: ' + best + '점';
  const g = document.getElementById('grade');
  g.textContent =
    score >= 80 ? '🥇 두더지 헌터 마스터!' :
    score >= 55 ? '🥈 대단한 실력!' :
    score >= 30 ? '🥉 제법인데?' :
    '🌱 연습하면 늘어!';
  document.getElementById('over').classList.remove('hidden');
}

/* ---------- boot ---------- */
(async function(){
  const raw = await storageGet(KEY);
  if(raw) best = parseInt(raw)||0;
})();
</script>
<script src="../rest.js?v=7"></script>
</body>
</html>
