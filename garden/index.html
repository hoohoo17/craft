<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>나의 정원</title>
<style>
  :root{
    --sky:#CDEBF7; --sky2:#E8F7EE;
    --soil:#8A5D3B; --soil-dry:#B08D6A;
    --ink:#3A4A3E;
    --card:#FFFFFF;
    --green:#6BA368;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(var(--sky), var(--sky2));
    color:var(--ink);
    min-height:100vh;
    display:flex; justify-content:center;
    user-select:none;
  }
  .wrap{width:100%; max-width:440px; padding:16px 14px 30px; display:flex; flex-direction:column; gap:14px;}

  header{display:flex; justify-content:space-between; align-items:center;}
  h1{font-size:1.45rem;}
  .book-btn{
    font-family:inherit; font-size:1rem; font-weight:800;
    background:var(--card); color:var(--ink);
    border:none; border-radius:20px;
    padding:8px 16px;
    box-shadow:0 3px 8px rgba(0,0,0,.12);
    cursor:pointer;
  }
  .book-btn:active{transform:translateY(2px);}

  .coin{
    font-weight:900; font-size:1.05rem;
    background:#FFF3C4; color:#8A6A10;
    border-radius:20px; padding:7px 14px;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
  }
  .menu{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .menu .book-btn{font-size:.95rem; padding:7px 13px;}
  .shop-coin{text-align:center; font-weight:800; margin-bottom:4px; color:#8A6A10;}
  .shop-sub{text-align:center; font-size:.85rem; opacity:.6; margin-bottom:12px;}
  .shop-group{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:1rem; margin:18px 0 8px; color:var(--green);
  }
  .shop-group span{font-size:.85rem; opacity:.7;}
  .seed-item.owned{background:rgba(107,163,104,.14); border-color:rgba(107,163,104,.5);}
  .seed-item.tooexp{opacity:.5;}
  .seed-item .icon{font-size:2rem; width:44px; flex:none; text-align:center;}
  .seed-item .cost{font-size:.9rem; font-weight:900; color:#8A6A10; white-space:nowrap;}

  .tip{
    background:var(--card);
    border-radius:12px;
    padding:10px 14px;
    font-size:.95rem;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
  }

  .garden{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
  }
  .plot{
    position:relative;
    background:var(--card);
    border-radius:16px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    aspect-ratio:1/1.15;
    display:flex; flex-direction:column;
    overflow:hidden;
    cursor:pointer;
  }
  .plot .view{flex:1; display:flex; align-items:flex-end; justify-content:center; padding:6px;}
  .plot svg{width:82%; display:block;}
  .plot .status{
    padding:7px 8px 9px;
    text-align:center;
    font-size:.85rem; font-weight:800;
    background:rgba(107,163,104,.12);
    min-height:2.2em;
    display:flex; align-items:center; justify-content:center;
  }
  .plot.ready{animation:glow 1.6s infinite;}
  @keyframes glow{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.1);}
    50%{box-shadow:0 4px 20px rgba(255,196,60,.75);}
  }
  .moist{
    position:absolute; top:8px; left:8px; right:8px;
    height:7px;
    background:rgba(0,0,0,.1);
    border-radius:4px;
    overflow:hidden;
  }
  .moist > div{height:100%; background:#5AAFE0; border-radius:4px; transition:width .4s;}
  .pull-btn{
    position:absolute; top:6px; right:6px;
    z-index:4;
    font-family:inherit; font-size:.9rem; font-weight:900;
    background:rgba(255,255,255,.92); color:#8A5D3B;
    border:2px solid rgba(0,0,0,.1); border-radius:50%;
    width:26px; height:26px; line-height:1;
    padding:0; cursor:pointer; display:none;
  }
  .plot.growing .pull-btn{display:block;}
  /* 화면 안에서 물어보는 줄 — 창을 띄우지 않는다 */
  .ask{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .ask button{
    font-family:inherit; font-size:.9rem; font-weight:800;
    border:none; border-radius:10px; padding:6px 14px; cursor:pointer;
  }
  .ask .yes{background:#E2705F; color:#fff;}
  .ask .no{background:rgba(0,0,0,.1); color:var(--ink);}

  .dry-mark{
    position:absolute; top:20px; right:10px;
    font-size:1.15rem;
    display:none;
  }
  .plot.dry .dry-mark{display:block; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.3}}

  .pop{
    position:absolute; left:50%; top:38%;
    transform:translateX(-50%);
    font-weight:900; font-size:1.15rem;
    pointer-events:none;
    animation:rise .8s forwards;
    text-shadow:0 1px 3px rgba(255,255,255,.8);
    white-space:nowrap;
    z-index:3;
  }
  @keyframes rise{from{opacity:1; margin-top:0}to{opacity:0; margin-top:-30px}}

  /* sheets */
  .sheet-bg{
    position:fixed; inset:0;
    background:rgba(40,60,45,.45);
    display:none;
    align-items:flex-end; justify-content:center;
    z-index:10;
  }
  .sheet-bg.show{display:flex;}
  .sheet{
    background:var(--card);
    width:100%; max-width:440px;
    border-radius:22px 22px 0 0;
    padding:20px 18px 28px;
    max-height:75vh;
    overflow-y:auto;
  }
  .sheet h2{font-size:1.2rem; margin-bottom:14px; text-align:center;}
  .seed-list{display:flex; flex-direction:column; gap:10px;}
  .seed-item{
    display:flex; align-items:center; gap:12px;
    border:2px solid rgba(0,0,0,.08);
    border-radius:14px;
    padding:10px 12px;
    cursor:pointer;
    background:none;
    font-family:inherit; text-align:left;
    width:100%;
  }
  .seed-item:active{background:rgba(107,163,104,.1);}
  .seed-item svg{width:44px; flex:none;}
  .seed-item .info{flex:1;}
  .seed-item .nm{font-weight:900; font-size:1.05rem;}
  .seed-item .tm{font-size:.85rem; opacity:.65;}
  .close-btn{
    margin-top:16px; width:100%;
    font-family:inherit; font-size:1rem; font-weight:800;
    background:rgba(0,0,0,.07); color:var(--ink);
    border:none; border-radius:12px;
    padding:12px; cursor:pointer;
  }

  .ending-bg{
    position:fixed; inset:0; z-index:30;
    background:rgba(30,45,35,.75);
    display:none; align-items:center; justify-content:center;
    padding:22px;
  }
  .ending-bg.show{display:flex;}
  .ending-card{
    background:var(--card);
    border-radius:22px;
    padding:28px 22px 22px;
    width:100%; max-width:360px;
    text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.35);
    animation:pop .4s ease-out;
  }
  @keyframes pop{from{transform:scale(.75); opacity:0} to{transform:scale(1); opacity:1}}
  .ending-card .crown{font-size:3.6rem; line-height:1;}
  .ending-card h2{font-size:1.7rem; margin:10px 0 8px; color:var(--green);}
  .ending-card .sub{font-size:1rem; opacity:.75; line-height:1.55; margin-bottom:16px;}
  .ending-card .stats{
    background:rgba(107,163,104,.12);
    border-radius:14px; padding:12px 14px; margin-bottom:6px;
    font-size:.95rem; text-align:left;
  }
  .ending-card .stats div{display:flex; justify-content:space-between; padding:3px 0;}
  .ending-card .stats b{font-weight:900;}
  @media (prefers-reduced-motion:reduce){.ending-card{animation:none}}

  .book-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .book-cell{
    text-align:center;
    border:2px solid rgba(0,0,0,.08);
    border-radius:14px;
    padding:10px 4px;
  }
  .book-cell svg{width:56px;}
  .book-cell .nm{font-weight:800; font-size:.85rem;}
  .book-cell .ct{font-size:.8rem; opacity:.65;}
  .book-cell.locked{filter:grayscale(1); opacity:.4;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌷 나의 정원</h1>
    <span class="coin" id="coin">🌼 0</span>
  </header>
  <div class="menu">
    <button class="book-btn" onclick="openBook()">📖 꽃 도감 <span id="book-count"></span></button>
    <button class="book-btn" onclick="openShop()">🛒 도구 가게</button>
    <button class="book-btn" id="water-all" onclick="waterAll()" style="display:none">🪣 전부 물 주기</button>
  </div>
  <p class="tip" id="tip">빈 화분을 탭해서 씨앗을 심어 봐!</p>
  <div class="garden" id="garden"></div>
</div>

<!-- seed picker -->
<div class="sheet-bg" id="seed-sheet">
  <div class="sheet">
    <h2>🌱 어떤 씨앗을 심을까?</h2>
    <div class="seed-list" id="seed-list"></div>
    <button class="close-btn" onclick="closeSheets()">닫기</button>
  </div>
</div>

<!-- tool shop -->
<div class="sheet-bg" id="shop-sheet">
  <div class="sheet">
    <h2>🛒 도구 가게</h2>
    <p class="shop-coin" id="shop-coin"></p>
    <div class="seed-list" id="shop-list"></div>
    <button class="close-btn" onclick="closeSheets()">닫기</button>
  </div>
</div>

<!-- ending -->
<div class="ending-bg" id="ending">
  <div class="ending-card">
    <div class="crown">🏆</div>
    <h2>정원 완성!</h2>
    <p class="sub">도구 60개를 전부 모았어요.<br>이제 이 정원에서 못 하는 건 없어요 🌸</p>
    <div class="stats" id="ending-stats"></div>
    <button class="close-btn" onclick="closeEnding()">계속 정원 가꾸기 🌱</button>
  </div>
</div>

<!-- flower book -->
<div class="sheet-bg" id="book-sheet">
  <div class="sheet">
    <h2>📖 꽃 도감</h2>
    <div class="book-grid" id="book-grid"></div>
    <button class="close-btn" onclick="closeSheets()">닫기</button>
  </div>
</div>

<script>
/* ---------- storage ---------- */
const KEY = 'my-garden-v1';
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;
async function storageGet(k){
  if(hasCloudStorage){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem(k);
}
async function storageSet(k,v){
  try{
    if(hasCloudStorage) await window.storage.set(k,v);
    else localStorage.setItem(k,v);
  }catch(e){}
}

/* ---------- flowers ---------- */
// growMin: 다 자라는 데 걸리는 시간(분)
// petals: 꽃잎 수 — 종류마다 달라서 모양이 구분된다. 자라는 시간 순서대로.
const FLOWERS = [
  {id:'dandelion', name:'민들레',   growMin:2,    petals:12, color:'#FFD93D', center:'#E8A200', price:1,    desc:'금방 피어요'},
  {id:'portulaca', name:'채송화',   growMin:5,    petals:5,  color:'#FF9A3C', center:'#E8630A', price:1,    desc:'5분'},
  {id:'tulip',     name:'튤립',     growMin:15,   petals:6,  color:'#FF7BAC', center:'#E84A8A', price:3,    desc:'15분'},
  {id:'daisy',     name:'데이지',   growMin:30,   petals:10, color:'#FFFFFF', center:'#FFD23D', price:6,    desc:'30분'},
  {id:'cosmos',    name:'코스모스', growMin:45,   petals:8,  color:'#FFB3D1', center:'#FFD23D', price:9,    desc:'45분'},
  {id:'sunflower', name:'해바라기', growMin:60,   petals:14, color:'#FFC43D', center:'#7A4A1D', price:12,   desc:'1시간'},
  {id:'carnation', name:'카네이션', growMin:90,   petals:7,  color:'#FF5C7A', center:'#C9264A', price:18,   desc:'1시간 30분'},
  {id:'rose',      name:'장미',     growMin:120,  petals:6,  color:'#E23B4E', center:'#8E1226', price:24,   desc:'2시간'},
  {id:'hydrangea', name:'수국',     growMin:180,  petals:5,  color:'#7FB3E8', center:'#4A7FC1', price:36,   desc:'3시간'},
  {id:'morning',   name:'나팔꽃',   growMin:240,  petals:5,  color:'#8E7CF0', center:'#5B47C7', price:48,   desc:'4시간'},
  {id:'lily',      name:'백합',     growMin:300,  petals:6,  color:'#FFF8EE', center:'#E8B84A', price:60,   desc:'5시간'},
  {id:'cherry',    name:'벚꽃',     growMin:360,  petals:5,  color:'#FFD6E3', center:'#FF8FB1', price:72,   desc:'6시간'},
  {id:'lavender',  name:'라벤더',   growMin:480,  petals:7,  color:'#B79CE8', center:'#7A5EC4', price:96,   desc:'8시간'},
  {id:'lotus',     name:'연꽃',     growMin:600,  petals:10, color:'#FFC2D6', center:'#F7E07A', price:120,  desc:'10시간'},
  {id:'rainbow',   name:'무지개꽃', growMin:720,  petals:6,  color:'rainbow', center:'#fff',    price:144,  desc:'12시간 · 아주 귀한 꽃!'},
  {id:'golden',    name:'황금꽃',   growMin:1440, petals:8,  color:'#FFD24A', center:'#B8860B', price:288,  desc:'24시간 · 전설의 꽃!'},
];
const MOIST_HOURS = 5; // 물 가득 → 마름까지 5시간

/* ---------- 도구 가게 ---------- */
// 꽃을 팔아 모은 포인트로 산다. 한 번 사면 계속 쓴다.
// kind 로 효과가 정해진다: plot(화분+1) speed(빨리 자람) price(꽃값)
//                        dry(물 오래감) can(전부 물주기) sprinkler(안 마름)
//                        lucky(대박 확률) theme(정원 색)
const TOOLS = [];
function addTool(t){ TOOLS.push(t); }

// 🪴 화분 늘리기 — 7번째부터 20번째까지 하나씩
[300,450,650,900,1200,1600,2100,2700,3400,4200,5100,6100,7200,8400].forEach((cost,i)=>{
  addTool({id:'plot'+i, kind:'plot', name:`화분 ${7+i}번째`, icon:'🪴', cost,
           desc:`화분이 하나 더 늘어나요 (${6+i} → ${7+i}개)`});
});

// 🌿 비료 — 한 단계마다 25%씩 빨라진다
[150,250,400,600,900,1300,1800,2500,3400,4500].forEach((cost,i)=>{
  addTool({id:'speed'+i, kind:'speed', name:`비료 ${i+1}단계`, icon:'🌿', cost,
           desc:`꽃이 ${(1.25+0.25*i).toFixed(2)}배 빨리 자라요`});
});

// 💰 꽃값 — 한 단계마다 25%씩 비싸게 팔린다
[200,350,550,800,1200,1700,2400,3300,4400,6000].forEach((cost,i)=>{
  addTool({id:'price'+i, kind:'price', name:`꽃시장 단골 ${i+1}단계`, icon:'💰', cost,
           desc:`꽃 값이 ${(1.25+0.25*i).toFixed(2)}배가 돼요`});
});

// 💧 물 도구
addTool({id:'can', kind:'can', name:'물뿌리개', icon:'🪣', cost:30,
         desc:'화분 전부에 한 번에 물 주기'});
[80,160,320,640].forEach((cost,i)=>{
  addTool({id:'dry'+i, kind:'dry', name:`촉촉이 ${i+1}단계`, icon:'💧', cost,
           desc:`물이 ${(1.5+0.5*i).toFixed(1)}배 오래가요`});
});
addTool({id:'sprinkler', kind:'sprinkler', name:'스프링클러', icon:'💦', cost:1200,
         desc:'물이 아예 마르지 않아요'});

// 🍀 행운 — 수확할 때 가끔 두 배로 팔린다
[500,1000,2000,3500,5500].forEach((cost,i)=>{
  addTool({id:'lucky'+i, kind:'lucky', name:`네잎클로버 ${i+1}개`, icon:'🍀', cost,
           desc:`수확할 때 ${10*(i+1)}% 확률로 두 배!`});
});

// 🎨 정원 색 — 산 걸 누르면 배경이 바뀐다
const THEMES = [
  ['하늘색','#CDEBF7','#E8F7EE'], ['노을','#FFD8C2','#FFF0DA'], ['한밤','#B9C6E8','#DCE3F5'],
  ['봄들판','#D8F2C6','#F0FADF'], ['바다','#BFE9F0','#DFF6F2'], ['라벤더','#E0D4F7','#F2ECFC'],
  ['복숭아','#FFDCE5','#FFF0F3'], ['민트','#C9F0E0','#E6FAF3'], ['모래','#F2E4C9','#FBF4E4'],
  ['숲속','#C6E3CB','#E4F3E6'], ['포도','#DCC9F0','#EFE6FA'], ['레몬','#FBF0BF','#FDF9E2'],
  ['장미빛','#F7C9D4','#FCE8ED'], ['잿빛하늘','#D8DEE4','#EEF1F4'], ['무지개','#FFD6E0','#D6F0FF'],
];
THEMES.forEach((t,i)=>{
  addTool({id:'theme'+i, kind:'theme', name:`정원 색 · ${t[0]}`, icon:'🎨', cost:120,
           desc:'정원 배경이 바뀌어요', c1:t[1], c2:t[2]});
});

const has = id => !!(S && S.tools && S.tools[id]);
const countKind = k => TOOLS.filter(t=>t.kind===k && has(t.id)).length;
// 효과 계산
const speedMul  = () => 1 + 0.25 * countKind('speed');
const priceMul  = () => 1 + 0.25 * countKind('price');
const dryHours  = () => MOIST_HOURS * (1 + 0.5 * countKind('dry'));
const luckyRate = () => 0.10 * countKind('lucky');

/* ---------- SVG ---------- */
function petals(cx, cy, r, color, n=6){
  let s = '';
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
    const c = color==='rainbow' ? `hsl(${i*360/n},80%,65%)` : color;
    s += `<ellipse cx="${px}" cy="${py}" rx="${r*0.62}" ry="${r*0.42}" fill="${c}" transform="rotate(${a*180/Math.PI} ${px} ${py})"/>`;
  }
  return s;
}
function svgPlot(state){
  // state: {stage:0빈,1새싹,2줄기,3꽃봉오리,4활짝, f:flower, dry:bool}
  const soil = state.dry ? 'var(--soil-dry)' : 'var(--soil)';
  let inner = '';
  const f = state.f;
  if(state.stage >= 1){
    inner += `<path d="M50 84 Q49 70 50 ${state.stage>=2?36:62}" stroke="#5E9455" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    inner += `<path d="M50 72 Q40 66 38 58 Q48 60 50 68 Z" fill="#6BA368"/>`;
    if(state.stage>=2) inner += `<path d="M50 58 Q60 52 62 44 Q52 46 50 54 Z" fill="#6BA368"/>`;
  }
  if(state.stage === 3 && f){
    const c = f.color==='rainbow' ? '#C9B3FF' : f.color;
    inner += `<ellipse cx="50" cy="32" rx="9" ry="12" fill="${c}"/><path d="M44 36 Q50 26 56 36" fill="#6BA368"/>`;
  }
  if(state.stage === 4 && f){
    inner += petals(50, 30, 13, f.color, f.petals || 6);
    inner += `<circle cx="50" cy="30" r="8" fill="${f.center}"/>`;
    inner += `<text x="72" y="24" font-size="12">✨</text>`;
  }
  return `<svg viewBox="0 0 100 96">
    <ellipse cx="50" cy="86" rx="34" ry="9" fill="${soil}"/>
    <path d="M18 86 Q50 74 82 86 L78 93 Q50 99 22 93 Z" fill="${soil}"/>
    ${inner}
  </svg>`;
}
function svgFlowerIcon(f){
  return `<svg viewBox="0 0 100 100">${petals(50,50,16,f.color,f.petals||6)}<circle cx="50" cy="50" r="10" fill="${f.center}"/></svg>`;
}

/* ---------- state ---------- */
const PLOTS = 6;          // 기본 화분 수
const BIG_PLOTS = 20;     // 화분을 다 사면 20개까지
const plotCount = () => Math.min(BIG_PLOTS, PLOTS + countKind('plot'));
let S = null;
let pickTarget = -1;
let saveTimer = null;

function defaultState(){
  return {
    plots: Array.from({length:BIG_PLOTS}, ()=>({f:null, prog:0, moist:0})),
    book: {},           // {flowerId: count}
    points: 0,          // 꽃 팔아서 모은 포인트
    tools: {},          // {toolId: true}
    lastTs: Date.now()
  };
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ S.lastTs = Date.now(); storageSet(KEY, JSON.stringify(S)); }, 400);
}

/* ---------- time progression ---------- */
function applyTime(hours){
  for(const p of S.plots){
    if(!p.f) continue;
    // 물이 남아 있던 시간만큼만 자람 (스프링클러가 있으면 늘 촉촉)
    const hrs = dryHours();                       // 촉촉이를 사면 더 오래간다
    const moistHours = has('sprinkler') ? hours : (p.moist/100) * hrs;
    const growHours = Math.min(hours, moistHours);
    const f = FLOWERS.find(x=>x.id===p.f);
    if(growHours > 0 && p.prog < 100){
      p.prog = Math.min(100, p.prog + (growHours*60 / f.growMin) * 100 * speedMul());
    }
    if(has('sprinkler')) p.moist = 100;
    else p.moist = Math.max(0, p.moist - (hours/hrs)*100);
  }
}

/* ---------- actions ---------- */
function stageOf(p){
  if(!p.f) return 0;
  if(p.prog >= 100) return 4;
  if(p.prog >= 66) return 3;
  if(p.prog >= 33) return 2;
  return 1;
}

function tapPlot(i){
  const p = S.plots[i];
  if(!p.f){
    pickTarget = i;
    document.getElementById('seed-sheet').classList.add('show');
    return;
  }
  if(p.prog >= 100){
    // 수확!
    const f = FLOWERS.find(x=>x.id===p.f);
    S.book[f.id] = (S.book[f.id]||0) + 1;
    const lucky = Math.random() < luckyRate();     // 네잎클로버 대박
    const earned = Math.round(f.price * priceMul() * (lucky ? 2 : 1));
    S.points = (S.points||0) + earned;
    popText(i, lucky ? `대박! ${f.name} +${earned} 🍀` : `${f.name} 팔았다! +${earned} 🌼`);
    S.plots[i] = {f:null, prog:0, moist:0};
    setTip(`${f.name}를 팔아서 ${earned}포인트! 도감에도 넣었어 📖`);
    render();
    scheduleSave();
    return;
  }
  // 물 주기
  if(p.moist >= 95){
    popText(i, '물은 충분해! 💧');
  }else{
    p.moist = 100;
    popText(i, '물 주기 완료! 💧');
    setTip('물이 마르면 꽃이 안 자라니까 가끔 들러서 챙겨 줘!');
  }
  render();
  scheduleSave();
}

function plant(fid){
  if(pickTarget < 0) return;
  S.plots[pickTarget] = {f:fid, prog:0, moist:100};
  const f = FLOWERS.find(x=>x.id===fid);
  setTip(`${f.name} 씨앗을 심었어! ${f.desc.includes('분')||f.desc.includes('시간') ? '다 자라는 데 ' + f.desc.split('·')[0].trim() : ''} 🌱`);
  closeSheets();
  render();
  scheduleSave();
}

/* ---------- UI ---------- */
function setTip(t){ document.getElementById('tip').textContent = t; }   // innerHTML 을 지우고 글자만

function popText(i, text){
  const plotEl = document.querySelectorAll('.plot')[i];
  const el = document.createElement('div');
  el.className = 'pop';
  el.textContent = text;
  plotEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function render(){
  const g = document.getElementById('garden');
  updateCoin();
  // 큰 정원을 사면 화분 수가 늘어나므로, 개수가 다르면 새로 그린다
  if(g.children.length !== plotCount()){
    g.innerHTML = '';
    for(let i=0;i<plotCount();i++){
      const d = document.createElement('div');
      d.className = 'plot';
      d.innerHTML = `<div class="moist"><div></div></div><div class="dry-mark">🥀</div>` +
        `<button class="pull-btn" title="뽑기">✕</button>` +
        `<div class="view"></div><div class="status"></div>`;
      d.addEventListener('pointerdown', ()=>tapPlot(i));
      d.querySelector('.pull-btn').addEventListener('pointerdown', e=>{ e.stopPropagation(); askPull(i); });
      g.appendChild(d);
    }
  }
  S.plots.forEach((p, i)=>{
    const el = g.children[i];
    if(!el) return;            // 아직 안 열린 화분(큰 정원 사기 전)
    const stage = stageOf(p);
    const f = p.f ? FLOWERS.find(x=>x.id===p.f) : null;
    const dry = p.f && p.moist <= 0 && p.prog < 100;
    el.querySelector('.view').innerHTML = svgPlot({stage, f, dry});
    el.querySelector('.moist > div').style.width = (p.f && p.prog<100 ? p.moist : 0) + '%';
    el.classList.toggle('ready', p.prog >= 100);
    el.classList.toggle('growing', !!p.f && p.prog < 100);   // 자라는 중에만 뽑기 버튼
    el.classList.toggle('dry', !!dry);
    const st = el.querySelector('.status');
    if(!p.f) st.textContent = '➕ 씨앗 심기';
    else if(p.prog >= 100) st.textContent = '✨ 활짝! 탭해서 수확';
    else if(dry) st.textContent = '🥀 목말라! 탭해서 물 주기';
    else st.textContent = `${f.name} ${Math.floor(p.prog)}% 🌱`;
  });
  const total = Object.values(S.book).reduce((a,b)=>a+b,0);
  document.getElementById('book-count').textContent = total ? `(${total})` : '';
}

function buildSeedList(){
  document.getElementById('seed-list').innerHTML = FLOWERS.map(f=>`
    <button class="seed-item" onclick="plant('${f.id}')">
      ${svgFlowerIcon(f)}
      <span class="info">
        <span class="nm">${f.name}</span><br>
        <span class="tm">⏱️ ${f.desc}</span>
      </span>
    </button>`).join('');
}

// 창을 띄우지 않고 안내줄에서 물어본다(폰에서 confirm이 막힐 때가 있다)
function askInTip(msg, onYes){
  const tip = document.getElementById('tip');
  tip.innerHTML = `<span class="ask"><span>${msg}</span>` +
    `<button class="yes" id="ask-yes">네</button>` +
    `<button class="no" id="ask-no">아니요</button></span>`;
  document.getElementById('ask-yes').onclick = ()=>{ onYes(); };
  document.getElementById('ask-no').onclick  = ()=>{ setTip('알겠어! 계속 키우자 🌱'); };
}

function askPull(i){
  const p = S.plots[i];
  if(!p || !p.f || p.prog >= 100) return;
  const f = FLOWERS.find(x=>x.id===p.f);
  askInTip(`자라던 ${f.name}을(를) 뽑을까? 포인트는 못 받아.`, ()=>{
    S.plots[i] = {f:null, prog:0, moist:0};
    popText(i, '뽑았다! 🌱');
    setTip(`${f.name}을(를) 뽑았어. 새 씨앗을 심어 보자!`);
    render();
    scheduleSave();
  });
}

// 도구를 전부 사면 나오는 엔딩
function allToolsOwned(){ return TOOLS.every(t=>has(t.id)); }

function showEnding(){
  const grown = Object.values(S.book||{}).reduce((a,b)=>a+b, 0);
  const kinds = FLOWERS.filter(f=>(S.book||{})[f.id]).length;
  document.getElementById('ending-stats').innerHTML =
    `<div><span>🛒 모은 도구</span><b>${TOOLS.length} / ${TOOLS.length}개</b></div>` +
    `<div><span>🌸 키운 꽃</span><b>${grown}송이</b></div>` +
    `<div><span>📖 꽃 도감</span><b>${kinds} / ${FLOWERS.length}종</b></div>` +
    `<div><span>🪴 화분</span><b>${plotCount()}개</b></div>` +
    `<div><span>🌼 남은 포인트</span><b>${S.points||0}</b></div>`;
  document.getElementById('ending').classList.add('show');
}
function closeEnding(){ document.getElementById('ending').classList.remove('show'); }

function checkEnding(){
  if(!allToolsOwned() || S.ending) return;
  S.ending = true;              // 한 번만 저절로 뜬다
  setTip('🏆 축하해! 도구를 전부 모았어!');
  showEnding();
  scheduleSave();
}

function updateCoin(){
  const pts = S.points || 0;
  document.getElementById('coin').textContent = '🌼 ' + pts;
  document.getElementById('water-all').style.display = has('can') ? '' : 'none';
}

// 가게는 종류별로 묶어서 보여 준다(60개나 되니까)
const SHOP_GROUPS = [
  {kinds:['can','dry','sprinkler'], title:'💧 물 도구'},
  {kinds:['speed'],                 title:'🌿 비료 — 빨리 자라기'},
  {kinds:['price','lucky'],         title:'💰 더 비싸게 팔기'},
  {kinds:['plot'],                  title:'🪴 화분 늘리기'},
  {kinds:['theme'],                 title:'🎨 정원 색'},
];

function openShop(){
  const pts = S.points || 0;
  document.getElementById('shop-coin').textContent = `가진 포인트: 🌼 ${pts}`;
  const owned = TOOLS.filter(t=>has(t.id)).length;
  let html = `<p class="shop-sub">가진 도구 ${owned} / ${TOOLS.length}개</p>`;
  if(allToolsOwned()){
    html += `<button class="seed-item owned" onclick="showEnding()">
      <span class="icon">🏆</span>
      <span class="info"><span class="nm">정원 완성!</span><br>
      <span class="tm">엔딩을 다시 보기</span></span>
      <span class="cost">보기</span></button>`;
  }
  SHOP_GROUPS.forEach(g=>{
    const list = TOOLS.filter(t=>g.kinds.includes(t.kind));
    const mine = list.filter(t=>has(t.id)).length;
    html += `<h3 class="shop-group">${g.title} <span>${mine}/${list.length}</span></h3>`;
    html += list.map(t=>{
      const own = has(t.id);
      const canBuy = !own && pts >= t.cost;
      const swatch = t.kind === 'theme'
        ? `<span class="icon" style="background:linear-gradient(${t.c1},${t.c2});border-radius:10px"></span>`
        : `<span class="icon">${t.icon}</span>`;
      return `<button class="seed-item ${own?'owned':(canBuy?'':'tooexp')}" onclick="buyTool('${t.id}')">
        ${swatch}
        <span class="info">
          <span class="nm">${t.name}</span><br>
          <span class="tm">${t.desc}</span>
        </span>
        <span class="cost">${own ? (t.kind==='theme' ? '🎨 쓰기' : '✅ 있음') : '🌼 ' + t.cost}</span>
      </button>`;
    }).join('');
  });
  document.getElementById('shop-list').innerHTML = html;
  document.getElementById('shop-sheet').classList.add('show');
}

// 산 정원 색을 화면에 입힌다
function applyTheme(){
  const t = TOOLS.find(x=>x.kind==='theme' && x.id === S.theme);
  if(!t) return;
  document.documentElement.style.setProperty('--sky', t.c1);
  document.documentElement.style.setProperty('--sky2', t.c2);
}

function buyTool(id){
  const t = TOOLS.find(x=>x.id===id);
  if(!t) return;
  if(has(id)){
    if(t.kind === 'theme'){          // 이미 산 색은 눌러서 바꿔 쓴다
      S.theme = id;
      applyTheme();
      setTip(`정원을 ${t.name.replace('정원 색 · ','')} 색으로 바꿨어! 🎨`);
      openShop();
      scheduleSave();
    }
    return;
  }
  const pts = S.points || 0;
  if(pts < t.cost){
    setTip(`${t.name}은(는) 🌼 ${t.cost}이 필요해. 꽃을 더 팔아 보자!`);
    return;
  }
  S.points = pts - t.cost;
  S.tools = S.tools || {};
  S.tools[id] = true;
  if(t.kind === 'theme'){ S.theme = id; applyTheme(); }
  setTip(`${t.icon} ${t.name} 샀다! ${t.desc}`);
  openShop();          // 가게 목록을 새로 그린다
  render();
  scheduleSave();
  checkEnding();
}

function waterAll(){
  if(!has('can')) return;
  let n = 0;
  S.plots.forEach((p,i)=>{
    if(i >= plotCount() || !p.f || p.prog >= 100) return;
    if(p.moist < 95){ p.moist = 100; n++; }
  });
  setTip(n ? `${n}개 화분에 물을 줬어! 💧` : '물이 다 넉넉해! 💧');
  render();
  scheduleSave();
}

function openBook(){
  const grid = document.getElementById('book-grid');
  grid.innerHTML = FLOWERS.map(f=>{
    const ct = S.book[f.id]||0;
    return `<div class="book-cell ${ct? '':'locked'}">
      ${svgFlowerIcon(f)}
      <div class="nm">${ct? f.name : '???'}</div>
      <div class="ct">${ct? ct+'송이' : '아직 못 키움'}</div>
    </div>`;
  }).join('');
  document.getElementById('book-sheet').classList.add('show');
}
function closeSheets(){
  document.querySelectorAll('.sheet-bg').forEach(s=>s.classList.remove('show'));
  pickTarget = -1;
}
document.querySelectorAll('.sheet-bg').forEach(s=>{
  s.addEventListener('pointerdown', e=>{ if(e.target===s) closeSheets(); });
});

/* ---------- ticks ---------- */
setInterval(()=>{
  if(!S) return;
  applyTime(10/3600); // 10초씩
  render();
  scheduleSave();
}, 10000);

window.addEventListener('visibilitychange', ()=>{
  if(!S) return;
  if(document.hidden){ S.lastTs = Date.now(); storageSet(KEY, JSON.stringify(S)); }
  else{
    const hours = (Date.now()-S.lastTs)/3600000;
    if(hours > 0.003) applyTime(hours);
    S.lastTs = Date.now();
    render();
  }
});

/* ---------- boot ---------- */
(async function(){
  try{
    const raw = await storageGet(KEY);
    S = raw ? JSON.parse(raw) : defaultState();
  }catch(e){ S = defaultState(); }
  // 가게가 생기기 전에 저장된 정원도 그대로 이어서 할 수 있게 채워 준다
  if(!Array.isArray(S.plots)) S.plots = [];
  while(S.plots.length < BIG_PLOTS) S.plots.push({f:null, prog:0, moist:0});
  if(typeof S.points !== 'number') S.points = 0;
  if(!S.tools || typeof S.tools !== 'object') S.tools = {};
  if(!S.book || typeof S.book !== 'object') S.book = {};
  const hours = (Date.now() - (S.lastTs||Date.now()))/3600000;
  if(hours > 0.003) applyTime(hours);
  S.lastTs = Date.now();
  applyTheme();
  buildSeedList();
  render();
  checkEnding();
  const growing = S.plots.filter(p=>p.f && p.prog<100).length;
  const ready = S.plots.filter(p=>p.prog>=100).length;
  if(ready) setTip(`✨ 활짝 핀 꽃이 ${ready}송이 기다리고 있어!`);
  else if(growing) setTip(`🌱 ${growing}개가 자라는 중이야. 물 확인해 줘!`);
  scheduleSave();
})();
</script>
