<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>??</title>
<style>
  html, body { margin: 0; height: 100%; background: #050818; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  .tw  { animation: twinkle 3s ease-in-out infinite; }
  .tw2 { animation: twinkle 4.2s ease-in-out infinite 1.1s; }
  .tw3 { animation: twinkle 5s ease-in-out infinite 2.3s; }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  .shoot { animation: shoot 7s linear infinite; }
  @keyframes shoot {
    0%, 82% { transform: translate(0,0); opacity: 0; }
    84% { opacity: 1; }
    92% { transform: translate(-180px, 90px); opacity: 0; }
    100% { transform: translate(-180px, 90px); opacity: 0; }
  }
  .ripple  { animation: drift 6s ease-in-out infinite alternate; }
  .ripple2 { animation: drift 8s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(14px); } }
</style>
</head>

  <!-- ??? -->

  <!-- ??? 2 -->

    <g id="orca">
      <path d="M-30 0 Q-10 -22 20 -8 Q34 -2 30 6 Q10 14 -14 10 Q-28 8 -30 0 Z" fill="#0b0f1e"/>

      <circle cx="-6" cy="0" r="2"/>
      <circle cx="4" cy="-4" r="1.5"/>
      <circle cx="10" cy="2" r="1.8"/>

  <!-- 클릭 영역: 스페이스 니들 꼭대기 -->

</svg>
<script>
(function(){
  var clicks = 0, playing = false;
  var egg = document.getElementById('egg');
  var body = document.getElementById('eggBody');
  var bubble = document.getElementById('eggBubble');
  var hit = document.getElementById('moonHit');
  if (!egg || !body || !hit) return;
  hit.addEventListener('click', function(){
    if (playing) return;
    clicks++;
    if (clicks < 3) return;
    clicks = 0; playing = true;
    egg.setAttribute('opacity','1');
    var start = null, DUR = 9000;
    function frame(t){
      if (!start) start = t;
      var p = (t - start) / DUR;
      if (p >= 1) { egg.setAttribute('opacity','0'); if (bubble) bubble.setAttribute('opacity','0'); playing = false; return; }
      var x = -60 + p * 820;
      var y = 385 + Math.sin(p * Math.PI * 6) * 3;
      body.setAttribute('transform','translate(' + x + ',' + y + ')');
      if (bubble) bubble.setAttribute('opacity', (p > 0.3 && p < 0.75) ? '1' : '0');
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
(function(){
  var playing = false;
  var egg2 = document.getElementById('egg2');
  var orca = document.getElementById('orca');
  var splash = document.getElementById('splash');
  var hit = document.getElementById('needleHit');
  if (!egg2 || !orca || !hit) return;
  hit.addEventListener('click', function(){
    if (playing) return;
    playing = true;
    egg2.setAttribute('opacity','1');
    var start = null, DUR = 2600;
    var x0 = 120, x1 = 380, waterY = 372, peak = 90;
    function frame(t){
      if (!start) start = t;
      var p = (t - start) / DUR;
      if (p >= 1) {
        egg2.setAttribute('opacity','0');
        splash.setAttribute('opacity','0');
        playing = false;
        return;
      }
      var x = x0 + (x1 - x0) * p;
      var y = waterY - Math.sin(p * Math.PI) * peak;
      var angle = Math.cos(p * Math.PI) * 35;
      orca.setAttribute('transform','translate(' + x + ',' + y + ') scale(-1,1) rotate(' + angle + ')');
      if (p > 0.85) {
        splash.setAttribute('opacity','0.8');
        splash.setAttribute('transform','translate(' + x1 + ',' + waterY + ') scale(' + (1 + (p - 0.85) * 8) + ')');
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
</script>

</html>
