<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 한 세계로 고정: 하늘빛 종이 위에 떠 있는 작은 섬. 머리말, 섬(캔버스), 나라, 붓 상자 순서의 한 화면. */
:root{
  color-scheme:light;
  --sky:#dff1f7;
  --paper:#fffdf6;
  --ink:#24323a;
  --muted:#5d6f78;
  --line:#bcd6df;
  --accent:#2f8f6b;
  --accent-ink:#ffffff;
  --god:#7a4fd0;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:linear-gradient(180deg,#cfeaf4 0%,var(--sky) 40%,#eef7f2 100%);
  color:var(--ink);font-family:var(--body);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.name{
  font-family:var(--display);font-size:34px;line-height:1.1;color:var(--ink);
  border:0;background:transparent;padding:0;width:100%;max-width:12em;outline:none;
  border-bottom:2px dashed transparent;
}
.name:focus{border-bottom-color:var(--line)}
.clock{font-family:var(--display);font-size:18px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink);margin-left:3px;font-variant-numeric:tabular-nums}

.stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 #a9cdd9,0 10px 30px rgba(36,50,58,.15);background:#1d5b8f}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.toast{
  position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);opacity:0;max-width:92%;
  background:rgba(255,253,246,.95);color:var(--ink);padding:7px 14px;border-radius:999px;
  font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.box{background:var(--paper);border-radius:14px;padding:10px;box-shadow:0 3px 0 #d9e6e2}
.label{font-size:12px;color:var(--muted);margin:0 2px 6px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tool{
  border:2px solid transparent;background:#f1f5ef;border-radius:10px;padding:6px 2px 5px;
  font-family:var(--body);font-size:13px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px
}
.tool i{font-style:normal;font-size:22px;line-height:1}
.tool[aria-pressed="true"]{border-color:var(--accent);background:#e3f3ea}
.tools.god .tool{background:#f2eefb}
.tools.god .tool[aria-pressed="true"]{border-color:var(--god);background:#e7defa}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:flex;background:#f1f5ef;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-family:var(--body);font-size:13px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:0;background:#f1f5ef;border-radius:10px;padding:8px 12px;font-family:var(--body);font-size:13px;color:var(--ink);cursor:pointer}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0 2px}
.kings{display:flex;flex-wrap:wrap;gap:6px}
.king{display:flex;align-items:center;gap:6px;background:#f6f4ee;border-radius:999px;padding:5px 11px 5px 7px;font-size:13px}
.king .dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.king b{font-family:var(--display);font-weight:400;font-size:15px}
.king small{color:var(--muted);font-variant-numeric:tabular-nums}
.king .war{color:#c9483a;font-size:12px}
button:focus-visible,.name:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <a class="back" href="https://hoohoo17.github.io/craft/">← 게임 목록</a>
  <header>
    <div style="flex:1;min-width:200px">
      <input class="name" id="name" maxlength="16" aria-label="섬 이름" value="나만의 섬">
      <div class="stats" id="stats"></div>
    </div>
    <div class="clock"><span id="clock"></span>
      <div class="seg" id="speed" aria-label="시간 빠르기">
        <button data-v="0" aria-pressed="false" aria-label="멈춤">⏸</button>
        <button data-v="1" aria-pressed="true">1배</button>
        <button data-v="3" aria-pressed="false">3배</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="섬 지도. 끌어서 칠하세요"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <div class="box">
    <div class="label">나라</div>
    <div class="kings" id="kings"></div>
  </div>

  <div class="box">
    <div class="label">신의 힘</div>
    <div class="tools god" id="godTools"></div>
    <div class="label" style="margin-top:10px">땅 칠하기</div>
    <div class="tools" id="terrainTools"></div>
    <div class="label" style="margin-top:10px">생물 놓기</div>
    <div class="tools" id="lifeTools"></div>
    <div class="row">
      <span class="hint">붓 크기</span>
      <div class="seg" id="brush">
        <button data-s="1" aria-pressed="true">작게</button>
        <button data-s="2" aria-pressed="false">보통</button>
        <button data-s="3" aria-pressed="false">크게</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="undo">↶ 되돌리기</button>
      <button class="btn" id="photo">📷 사진</button>
      <button class="btn main" id="fresh">🏝 새 섬</button>
    </div>
  </div>
  <p class="hint">집을 지으면 나라가 세워지고 주민이 이사 와요. 주민은 스스로 집과 밭과 길을 늘리고, 영토가 맞닿은 나라끼리는 전쟁을 벌여 집을 빼앗기도 해요. 번개와 불, 비, 운석으로 세상을 흔들어 보세요. 섬은 이 기기에 저절로 저장돼요.</p>
</div>

<script>
(() => {
const W = 40, H = 28, CS = 16, N = W*H;
const T = {WATER:0, SAND:1, GRASS:2, TREE:3, MOUNT:4, FLOWER:5, ROAD:6, HOUSE:7, SAPLING:8, FIELD:9, FIRE:10, BURNT:11};
const FLAMMABLE = {[T.TREE]:.5, [T.GRASS]:.12, [T.FLOWER]:.2, [T.SAPLING]:.3, [T.FIELD]:.3, [T.HOUSE]:.4};
const GOD_TOOLS = [
  {id:'bolt', ico:'⚡', name:'번개'},
  {id:'fire', ico:'🔥', name:'불'},
  {id:'rain', ico:'🌧', name:'비'},
  {id:'meteor', ico:'☄️', name:'운석'},
];
const TERRAIN_TOOLS = [
  {id:'t'+T.WATER, ico:'🌊', name:'바다'},
  {id:'t'+T.SAND, ico:'🏖', name:'모래'},
  {id:'t'+T.GRASS, ico:'🌿', name:'풀밭'},
  {id:'t'+T.TREE, ico:'🌳', name:'나무'},
  {id:'t'+T.FLOWER, ico:'🌼', name:'꽃'},
  {id:'t'+T.MOUNT, ico:'⛰', name:'산'},
  {id:'t'+T.ROAD, ico:'🟫', name:'길'},
  {id:'t'+T.FIELD, ico:'🌾', name:'밭'},
  {id:'t'+T.HOUSE, ico:'🏠', name:'집'},
];
const LIFE_TOOLS = [
  {id:'rabbit', ico:'🐇', name:'토끼'},
  {id:'sheep', ico:'🐑', name:'양'},
  {id:'wolf', ico:'🐺', name:'늑대'},
  {id:'fish', ico:'🐟', name:'물고기'},
  {id:'bird', ico:'🕊', name:'새'},
  {id:'erase', ico:'🧺', name:'데려가기'},
];
const SPEED = {rabbit:1.6, sheep:.6, wolf:1.9, person:1.1, fish:.8, bird:3};
const KCOLORS = ['#e4573d','#3f7fd1','#f0b429','#8b5cc7','#2f9e6e','#e46fa1','#1fa8b0','#a0602d'];
const SYL = ['가','나','라','마','미','소','하','도','루','벨','온','세','리','타','유','진','바','로','아','윤'];
const DAY_LEN = 90; // 초
const KEY = 'craft-island-v2';

const cv = document.getElementById('cv');
cv.width = W*CS; cv.height = H*CS;
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
const bctx = bg.getContext('2d');
const tc = document.createElement('canvas'); tc.width = cv.width; tc.height = cv.height;
const tctx = tc.getContext('2d');

let grid = new Uint8Array(N), ages = new Uint16Array(N), owner = new Int16Array(N).fill(-1);
let terr = new Int16Array(N).fill(-1);
let ents = [], fx = [];
let kingdoms = new Map(), nextKid = 0;
let houses = [], borders = new Set();
let tod = .3, day = 1, harvest = 0, speedMul = 1;
let tool = 'bolt', brush = 1;
let dirty = true, changed = false, terrDirty = true, shake = 0, flash = 0;
const undoStack = [];

const idx = (x,y) => y*W + x;
const inb = (x,y) => x>=0 && y>=0 && x<W && y<H;
const hash = (x,y,s=0) => { let h = (x*374761393 + y*668265263 + s*1442695041) | 0; h = (h ^ (h>>>13)) * 1274126177; return ((h ^ (h>>>16)) >>> 0) / 4294967296; };
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const cx = e => Math.floor(e.x), cy = e => Math.floor(e.y);

/* ---------- 땅 바꾸기 ---------- */
function setTile(i, t){
  if (grid[i] === t) return;
  if (grid[i] === T.HOUSE || t === T.HOUSE) terrDirty = true;
  if (grid[i] === T.HOUSE) owner[i] = -1;
  grid[i] = t; ages[i] = 0; dirty = changed = true;
}

/* ---------- 나라 ---------- */
function newKingdom(){
  const used = new Set([...kingdoms.values()].map(k => k.name));
  let name;
  for (let k=0;k<30;k++){ name = pick(SYL)+pick(SYL)+'국'; if (!used.has(name)) break; }
  const usedC = new Set([...kingdoms.values()].map(k => k.color));
  const color = KCOLORS.find(c => !usedC.has(c)) || pick(KCOLORS);
  const k = {id: nextKid++, name, color, wars: new Set()};
  kingdoms.set(k.id, k);
  return k;
}
function nearestKingdom(x, y, r){
  let best = -1, bd = 1e9;
  for (const h of houses){ const d = Math.abs(h.x-x)+Math.abs(h.y-y); if (d <= r && d < bd && h.k >= 0){ bd = d; best = h.k; } }
  return best;
}
function atWar(a, b){ const k = kingdoms.get(a); return !!(k && k.wars.has(b)); }
function anyWar(a){ const k = kingdoms.get(a); return !!(k && k.wars.size); }
function computeTerr(){
  houses = [];
  for (let i=0;i<N;i++) if (grid[i] === T.HOUSE) houses.push({i, x:i%W, y:Math.floor(i/W), k:owner[i]});
  terr.fill(-1);
  const R = 3;
  for (const h of houses){
    if (h.k < 0) continue;
    for (let dy=-R;dy<=R;dy++) for (let dx=-R;dx<=R;dx++){
      if (Math.abs(dx)+Math.abs(dy) > R+1) continue;
      const x = h.x+dx, y = h.y+dy;
      if (!inb(x,y) || grid[idx(x,y)] === T.WATER) continue;
      const i = idx(x,y), d = Math.abs(dx)+Math.abs(dy);
      if (terr[i] < 0 || d === 0) terr[i] = h.k;
    }
  }
  borders = new Set();
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const a = terr[idx(x,y)]; if (a < 0) continue;
    for (const [dx,dy] of [[1,0],[0,1]]){
      if (!inb(x+dx,y+dy)) continue;
      const b = terr[idx(x+dx,y+dy)];
      if (b >= 0 && b !== a) borders.add(a < b ? a+'-'+b : b+'-'+a);
    }
  }
  // 집이 하나도 없는 나라는 사라져요
  const alive = new Set(houses.map(h => h.k));
  for (const [id,k] of kingdoms){
    if (!alive.has(id)){
      kingdoms.delete(id);
      for (const o of kingdoms.values()) o.wars.delete(id);
      toast(`${k.name}이 사라졌어요`);
    }
  }
  renderTerr();
  terrDirty = false;
}
function renderTerr(){
  tctx.clearRect(0,0,tc.width,tc.height);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const k = terr[idx(x,y)]; if (k < 0) continue;
    const kg = kingdoms.get(k); if (!kg) continue;
    tctx.fillStyle = kg.color; tctx.globalAlpha = .16; tctx.fillRect(x*CS,y*CS,CS,CS);
    tctx.globalAlpha = .85;
    const px = x*CS, py = y*CS;
    if (!inb(x-1,y) || terr[idx(x-1,y)] !== k) tctx.fillRect(px,py,2,CS);
    if (!inb(x+1,y) || terr[idx(x+1,y)] !== k) tctx.fillRect(px+CS-2,py,2,CS);
    if (!inb(x,y-1) || terr[idx(x,y-1)] !== k) tctx.fillRect(px,py,CS,2);
    if (!inb(x,y+1) || terr[idx(x,y+1)] !== k) tctx.fillRect(px,py+CS-2,CS,2);
  }
  tctx.globalAlpha = 1;
}

/* ---------- 섬 만들기 ---------- */
function generate(){
  let n = new Float32Array(N).map(() => Math.random());
  for (let pass=0; pass<4; pass++){
    const m = new Float32Array(N);
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      let s=0,c=0;
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) if (inb(x+dx,y+dy)){ s+=n[idx(x+dx,y+dy)]; c++; }
      m[idx(x,y)] = s/c;
    }
    n = m;
  }
  let lo=1, hi=0; n.forEach(v => { lo=Math.min(lo,v); hi=Math.max(hi,v); });
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = idx(x,y);
    const nx = (x - W/2 + .5)/(W/2), ny = (y - H/2 + .5)/(H/2);
    const h = ((n[i]-lo)/(hi-lo||1))*.55 + (1-Math.hypot(nx,ny))*.85;
    let t;
    if (h < .52) t = T.WATER;
    else if (h < .58) t = T.SAND;
    else if (h < .82) t = Math.random() < .04 ? T.FLOWER : T.GRASS;
    else if (h < .97) t = Math.random() < .7 ? T.TREE : T.GRASS;
    else t = T.MOUNT;
    grid[i] = t; ages[i] = 0; owner[i] = -1;
  }
  ents = []; fx = []; kingdoms = new Map(); nextKid = 0;
  for (let k=0;k<5;k++) spawnRandom('rabbit');
  for (let k=0;k<3;k++) spawnRandom('sheep');
  for (let k=0;k<2;k++) spawnRandom('wolf');
  for (let k=0;k<7;k++) spawnRandom('fish');
  for (let k=0;k<3;k++) spawnRandom('bird');
  tod = .3; day = 1; harvest = 0; undoStack.length = 0;
  dirty = changed = terrDirty = true;
}

function walkable(type, x, y, e){
  if (!inb(x,y)) return false;
  const t = grid[idx(x,y)];
  if (type === 'bird') return true;
  if (type === 'fish') return t === T.WATER;
  if (t === T.WATER || t === T.MOUNT || t === T.FIRE) return false;
  if (t === T.HOUSE) return type === 'person' && e && e.home === idx(x,y);
  return true;
}
function spawnRandom(type){
  for (let k=0;k<200;k++){
    const x = Math.floor(Math.random()*W), y = Math.floor(Math.random()*H);
    if (walkable(type,x,y)) { ents.push(makeEnt(type,x,y)); return; }
  }
}
function makeEnt(type, x, y, home){
  return {type, x:x+.5, y:y+.5, tx:x+.5, ty:y+.5, wait:Math.random()*2, dir:1,
          home: home ?? -1, alpha:1, phase:Math.random()*6, age:0, life:rnd(360,720), hunger:0};
}
function kill(e, color){
  if (e.dead) return;
  e.dead = true;
  fx.push({type:'puff', x:e.x, y:e.y, t:0, d:.6, color: color || 'rgba(230,230,230,'});
}

/* ---------- 지형 그리기 ---------- */
function isWater(x,y){ return !inb(x,y) || grid[idx(x,y)] === T.WATER; }
function drawGround(g, px, py, x, y){
  g.fillStyle = '#6fbf4a'; g.fillRect(px,py,CS,CS);
  if (hash(x,y,1) < .5){ g.fillStyle='#5eab3d'; g.fillRect(px+Math.floor(hash(x,y,2)*12)+1, py+Math.floor(hash(x,y,3)*12)+1, 2, 3); }
  if (hash(x,y,4) < .35){ g.fillStyle='#86cf5e'; g.fillRect(px+Math.floor(hash(x,y,5)*12)+1, py+Math.floor(hash(x,y,6)*12)+1, 2, 2); }
}
function drawBurnt(g, px, py, x, y){
  g.fillStyle = '#4d433b'; g.fillRect(px,py,CS,CS);
  g.fillStyle = '#3a322c';
  for (let k=0;k<3;k++) g.fillRect(px+Math.floor(hash(x,y,90+k)*12)+1, py+Math.floor(hash(x,y,95+k)*12)+1, 3, 2);
  const s = Math.min(1, ages[idx(x,y)]/40);
  if (s > .3){ g.fillStyle = '#6fbf4a'; for (let k=0;k<Math.floor(s*6);k++) g.fillRect(px+Math.floor(hash(x,y,100+k)*13)+1, py+Math.floor(hash(x,y,110+k)*13)+1, 2, 2); }
}
function drawTile(g, x, y){
  const i = idx(x,y), t = grid[i], px = x*CS, py = y*CS;
  switch (t){
    case T.WATER: {
      let near = false;
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) if (!isWater(x+dx,y+dy)) near = true;
      g.fillStyle = near ? '#3f93c9' : '#1f5f94'; g.fillRect(px,py,CS,CS);
      if (hash(x,y,7) < .25){ g.fillStyle = near ? '#5aa9d8' : '#2a6ea6'; g.fillRect(px+Math.floor(hash(x,y,8)*10)+2, py+Math.floor(hash(x,y,9)*12)+2, 4, 1); }
      break;
    }
    case T.SAND:
      g.fillStyle = '#ecd89f'; g.fillRect(px,py,CS,CS);
      g.fillStyle = '#d9c184';
      for (let k=0;k<3;k++) g.fillRect(px+Math.floor(hash(x,y,10+k)*14)+1, py+Math.floor(hash(x,y,20+k)*14)+1, 1, 1);
      break;
    case T.GRASS: drawGround(g,px,py,x,y); break;
    case T.TREE: {
      drawGround(g,px,py,x,y);
      const ox = Math.floor(hash(x,y,11)*4)-2;
      g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(px+8+ox, py+14, 6, 2, 0, 0, 7); g.fill();
      g.fillStyle = '#7a5230'; g.fillRect(px+7+ox, py+9, 2, 5);
      g.fillStyle = hash(x,y,12) < .5 ? '#2f7d3a' : '#3b8a3f';
      g.beginPath(); g.arc(px+8+ox, py+7, 6, 0, 7); g.fill();
      g.fillStyle = '#4fa354'; g.beginPath(); g.arc(px+6+ox, py+5, 2.5, 0, 7); g.fill();
      break;
    }
    case T.SAPLING: {
      drawGround(g,px,py,x,y);
      const s = Math.min(1, ages[i]/20);
      g.fillStyle = '#7a5230'; g.fillRect(px+7, py+10-Math.round(s*3), 2, 4+Math.round(s*3));
      g.fillStyle = '#4fa354'; g.beginPath(); g.arc(px+8, py+9-s*3, 2+s*2, 0, 7); g.fill();
      break;
    }
    case T.MOUNT:
      drawGround(g,px,py,x,y);
      g.fillStyle = '#7d8590'; g.beginPath(); g.moveTo(px, py+CS); g.lineTo(px+8, py+1); g.lineTo(px+CS, py+CS); g.fill();
      g.fillStyle = '#9aa2ab'; g.beginPath(); g.moveTo(px+8, py+1); g.lineTo(px+CS, py+CS); g.lineTo(px+9, py+CS); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(px+5, py+6.5); g.lineTo(px+8, py+1); g.lineTo(px+11, py+6.5); g.lineTo(px+8,py+5); g.fill();
      break;
    case T.FLOWER: {
      drawGround(g,px,py,x,y);
      const cols = ['#f25f8a','#ffd23f','#ffffff','#b46ef0'];
      for (let k=0;k<3;k++){
        const fx2 = px+2+Math.floor(hash(x,y,30+k)*11), fy = py+2+Math.floor(hash(x,y,40+k)*11);
        g.fillStyle = cols[Math.floor(hash(x,y,50+k)*4)]; g.fillRect(fx2-1,fy,3,1); g.fillRect(fx2,fy-1,1,3);
        g.fillStyle = '#f6a623'; g.fillRect(fx2,fy,1,1);
      }
      break;
    }
    case T.ROAD:
      g.fillStyle = '#c9a46a'; g.fillRect(px,py,CS,CS);
      g.fillStyle = '#b48e55';
      for (let k=0;k<3;k++) g.fillRect(px+Math.floor(hash(x,y,60+k)*13)+1, py+Math.floor(hash(x,y,70+k)*13)+1, 2, 2);
      break;
    case T.FIELD: {
      g.fillStyle = '#8a5a36'; g.fillRect(px,py,CS,CS);
      const ripe = ages[i] >= 30, s = Math.min(1, ages[i]/30);
      for (let r=0;r<3;r++){
        g.fillStyle = '#734a2b'; g.fillRect(px, py+3+r*5, CS, 1);
        g.fillStyle = ripe ? '#f2c94c' : '#6fbf4a';
        for (let c=0;c<4;c++){ const h = 1+Math.round(s*3); g.fillRect(px+2+c*4, py+3+r*5-h, 2, h); }
      }
      break;
    }
    case T.HOUSE: {
      drawGround(g,px,py,x,y);
      const kg = kingdoms.get(owner[i]);
      g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(px+3, py+14, 12, 2);
      g.fillStyle = '#f4e9d2'; g.fillRect(px+3, py+7, 10, 8);
      g.fillStyle = kg ? kg.color : '#9a8f80';
      g.beginPath(); g.moveTo(px+1, py+8); g.lineTo(px+8, py+1); g.lineTo(px+15, py+8); g.fill();
      g.fillStyle = '#7a5230'; g.fillRect(px+7, py+10, 3, 5);
      g.fillStyle = '#8fc6e8'; g.fillRect(px+4, py+9, 2, 2); g.fillRect(px+11, py+9, 2, 2);
      break;
    }
    case T.FIRE: case T.BURNT: drawBurnt(g,px,py,x,y); break;
  }
}
function renderBg(){
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) drawTile(bctx,x,y);
  dirty = false;
}

/* ---------- 생물 그리기 ---------- */
function drawEnt(e, now){
  const px = e.x*CS, py = e.y*CS;
  const moving = Math.abs(e.tx-e.x)+Math.abs(e.ty-e.y) > .02;
  ctx.save(); ctx.globalAlpha = e.alpha; ctx.translate(px, py); ctx.scale(e.dir,1);
  if (e.type === 'rabbit'){
    const hop = moving ? -Math.abs(Math.sin(now*10+e.phase))*3 : 0;
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,3,4,1.5,0,0,7); ctx.fill();
    ctx.translate(0,hop);
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(0,0,4,3,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(3,-2,2.3,0,7); ctx.fill();
    ctx.fillRect(2,-7,1.3,4); ctx.fillRect(3.8,-7,1.3,4);
    ctx.fillStyle='#f3a4b6'; ctx.fillRect(2.3,-6,.7,2.5);
    ctx.fillStyle='#24323a'; ctx.fillRect(4,-2.5,1,1);
  } else if (e.type === 'sheep'){
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,4,6,1.8,0,0,7); ctx.fill();
    ctx.fillStyle='#3a3a3a'; ctx.fillRect(-4,1,1.5,3); ctx.fillRect(2,1,1.5,3);
    ctx.fillStyle='#f7f5ef';
    [[-3,-1],[0,-2],[3,-1],[-1,1],[2,1]].forEach(([a,b]) => { ctx.beginPath(); ctx.arc(a,b,3,0,7); ctx.fill(); });
    ctx.fillStyle='#3a3a3a'; ctx.beginPath(); ctx.ellipse(6,-1,2,2.5,0,0,7); ctx.fill();
  } else if (e.type === 'wolf'){
    const step = moving ? Math.sin(now*14+e.phase) : 0;
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,4,6,1.6,0,0,7); ctx.fill();
    ctx.fillStyle='#5b6068';
    ctx.fillRect(-4,1,1.5,3+step); ctx.fillRect(3,1,1.5,3-step);
    ctx.beginPath(); ctx.ellipse(0,0,5.5,2.8,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5,-1); ctx.lineTo(-9,-3); ctx.lineTo(-6,1); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5.5,-2.5,2.6,2,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4.5,-4); ctx.lineTo(5,-7); ctx.lineTo(6.5,-4); ctx.fill();
    ctx.fillStyle='#8c929b'; ctx.fillRect(7,-2.5,2,1.5);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(6,-3.2,1,1);
  } else if (e.type === 'person'){
    const kg = kingdoms.get(owner[e.home]);
    const step = moving ? Math.sin(now*12+e.phase) : 0;
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,5,3.5,1.3,0,0,7); ctx.fill();
    ctx.fillStyle='#3b4252'; ctx.fillRect(-2,2,1.6,3+step); ctx.fillRect(.5,2,1.6,3-step);
    ctx.fillStyle=kg ? kg.color : '#999'; ctx.fillRect(-2.5,-3,5,5.5);
    ctx.fillStyle='#f2c9a0'; ctx.beginPath(); ctx.arc(0,-5.5,2.6,0,7); ctx.fill();
    ctx.fillStyle='#3b2a20'; ctx.fillRect(-2.6,-8.3,5.2,1.8);
    if (kg && kg.wars.size){ ctx.strokeStyle='#d8dde3'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(3,2); ctx.lineTo(3.5,-9); ctx.stroke(); ctx.fillStyle='#d8dde3'; ctx.fillRect(2.5,-10,2,2); }
  } else if (e.type === 'fish'){
    ctx.globalAlpha = e.alpha*.85;
    const wig = Math.sin(now*8+e.phase)*1.2;
    ctx.fillStyle='#ff8a3d'; ctx.beginPath(); ctx.ellipse(0,0,4,2,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(-7,-2.5+wig); ctx.lineTo(-7,2.5+wig); ctx.fill();
    ctx.fillStyle='#24323a'; ctx.fillRect(2,-1,1,1);
  } else if (e.type === 'bird'){
    const f = Math.sin(now*14+e.phase)*3;
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0,10,3,1,0,0,7); ctx.fill();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-5,-f); ctx.lineTo(0,0); ctx.lineTo(5,-f); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 시간과 빛 ---------- */
function darkness(){ const s = Math.sin(2*Math.PI*(tod-.25)); return Math.max(0, Math.min(1, (.2 - s)/.6)); }
function dusk(){ const s = Math.sin(2*Math.PI*(tod-.25)); return Math.max(0, 1 - Math.abs(s - .05)/.25); }

/* ---------- 움직임 ---------- */
function neighbors(e){
  const x = cx(e), y = cy(e), reach = e.type === 'bird' ? 6 : 1, out = [];
  for (let dy=-reach; dy<=reach; dy++) for (let dx=-reach; dx<=reach; dx++){
    if (!dx && !dy) continue;
    if (reach === 1 && dx && dy) continue;
    if (walkable(e.type, x+dx, y+dy, e)) out.push([x+dx, y+dy]);
  }
  return out;
}
function toward(opts, gx, gy){
  let best = null, bd = 1e9;
  for (const o of opts){ const d = Math.abs(o[0]-gx)+Math.abs(o[1]-gy) + Math.random()*.5; if (d < bd){ bd = d; best = o; } }
  return best;
}
function nearestEnt(e, types, r){
  let best = null, bd = r*r;
  for (const o of ents){ if (o.dead || !types.includes(o.type)) continue; const d = (o.x-e.x)**2 + (o.y-e.y)**2; if (d < bd){ bd = d; best = o; } }
  return best;
}
function nearestEnemyHouse(e, k){
  let best = null, bd = 1e9;
  for (const h of houses){ if (!atWar(k, h.k)) continue; const d = Math.abs(h.x-e.x)+Math.abs(h.y-e.y); if (d < bd){ bd = d; best = h; } }
  return best;
}
function chooseTarget(e){
  const opts = neighbors(e);
  if (!opts.length) return;
  let choice;
  if (e.type === 'person'){
    const k = owner[e.home];
    if (darkness() > .45){
      choice = Math.random() < .85 ? toward(opts, e.home%W, Math.floor(e.home/W)) : pick(opts);
    } else if (anyWar(k) && Math.random() < .7){
      const foe = nearestEnt(e, ['person'], 5);
      const h = foe && atWar(k, owner[foe.home]) ? {x:cx(foe), y:cy(foe)} : nearestEnemyHouse(e, k);
      choice = h ? toward(opts, h.x, h.y) : pick(opts);
    } else {
      const roads = opts.filter(([x,y]) => grid[idx(x,y)] === T.ROAD || grid[idx(x,y)] === T.FIELD);
      const outside = opts.filter(([x,y]) => grid[idx(x,y)] !== T.HOUSE);
      choice = roads.length && Math.random() < .7 ? pick(roads) : pick(outside.length ? outside : opts);
    }
  } else if (e.type === 'wolf'){
    const prey = nearestEnt(e, ['rabbit','sheep'], 6);
    choice = prey ? toward(opts, cx(prey), cy(prey)) : pick(opts);
  } else if (e.type === 'rabbit' || e.type === 'sheep'){
    const w = nearestEnt(e, ['wolf'], 3);
    choice = w ? toward(opts, 2*cx(e)-cx(w), 2*cy(e)-cy(w)) : pick(opts);
  } else choice = pick(opts);
  e.tx = choice[0]+.5; e.ty = choice[1]+.5;
  if (e.tx !== e.x) e.dir = e.tx > e.x ? 1 : -1;
}
function rescue(e){
  const x = cx(e), y = cy(e);
  for (let r=1;r<=3;r++) for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
    if (walkable(e.type,x+dx,y+dy,e)){ e.x=e.tx=x+dx+.5; e.y=e.ty=y+dy+.5; return true; }
  }
  return false;
}
function updateEnts(dt){
  const dark = darkness();
  for (const e of ents){
    if (e.dead) continue;
    const x = cx(e), y = cy(e), ci = idx(x,y);
    if (grid[ci] === T.FIRE && e.type !== 'bird'){ kill(e, 'rgba(255,140,60,'); continue; }
    if (!walkable(e.type,x,y,e) && !rescue(e)){ e.dead = true; continue; }
    if (e.type === 'person'){
      if (e.home < 0 || grid[e.home] !== T.HOUSE){ kill(e); continue; }
      e.age += dt; if (e.age > e.life){ kill(e); continue; }
      const atHome = ci === e.home;
      const target = dark > .45 && atHome ? 0 : (dark > .8 ? 0 : 1);
      e.alpha += (target - e.alpha) * Math.min(1, dt*2);
      if (e.alpha < .05 && dark > .45) continue;
      if (grid[ci] === T.FIELD && ages[ci] >= 30){ ages[ci] = 0; harvest++; dirty = changed = true; }
      // 싸움
      const k = owner[e.home];
      if (anyWar(k) && e.alpha > .5){
        for (const o of ents){
          if (o === e || o.dead || o.type !== 'person' || o.alpha < .5) continue;
          if (!atWar(k, owner[o.home])) continue;
          if ((o.x-e.x)**2 + (o.y-e.y)**2 < .8 && Math.random() < dt*1.2){
            kill(Math.random() < .5 ? e : o, 'rgba(220,70,60,'); break;
          }
        }
        if (e.dead) continue;
      }
    } else if (e.type === 'wolf'){
      e.hunger += dt;
      if (e.hunger > 90){ kill(e); continue; }
      for (const o of ents){
        if (o.dead || (o.type !== 'rabbit' && o.type !== 'sheep')) continue;
        if ((o.x-e.x)**2 + (o.y-e.y)**2 < .35){ kill(o, 'rgba(220,70,60,'); e.hunger = 0; break; }
      }
    }
    const dx = e.tx - e.x, dy = e.ty - e.y, dist = Math.hypot(dx,dy);
    if (dist < .02){
      e.wait -= dt;
      if (e.wait <= 0){ chooseTarget(e); e.wait = e.type === 'bird' ? rnd(0,.4) : e.type === 'wolf' ? rnd(.1,1) : rnd(.4, e.type === 'sheep' ? 4 : 2.2); }
    } else {
      const sp = SPEED[e.type]*dt;
      if (sp >= dist){ e.x = e.tx; e.y = e.ty; } else { e.x += dx/dist*sp; e.y += dy/dist*sp; }
    }
  }
  ents = ents.filter(e => !e.dead);
}

/* ---------- 불 (0.4초마다) ---------- */
function fireTick(){
  const n4 = [[1,0],[-1,0],[0,1],[0,-1]];
  const spread = [];
  for (let i=0;i<N;i++){
    if (grid[i] !== T.FIRE) continue;
    ages[i]++;
    const x = i%W, y = Math.floor(i/W);
    for (const [dx,dy] of n4){
      if (!inb(x+dx,y+dy)) continue;
      const j = idx(x+dx,y+dy), p = FLAMMABLE[grid[j]];
      if (p && Math.random() < p*.6) spread.push(j);
    }
    if (ages[i] >= 6){ grid[i] = T.BURNT; ages[i] = 0; dirty = true; }
  }
  spread.forEach(j => { if (grid[j] !== T.FIRE) setTile(j, T.FIRE); });
}

/* ---------- 섬의 하루 (1초마다) ---------- */
let firstResident = true;
function tick(){
  const dark = darkness();
  const n4 = [[1,0],[-1,0],[0,1],[0,-1]];
  for (let i=0;i<N;i++){
    const t = grid[i];
    if (t === T.SAPLING){ if (++ages[i] >= 20){ grid[i] = T.TREE; ages[i] = 0; dirty = true; } else if (ages[i] % 5 === 0) dirty = true; }
    else if (t === T.FIELD && ages[i] < 30){ ages[i]++; if (ages[i] % 6 === 0 || ages[i] === 30) dirty = true; }
    else if (t === T.BURNT){ if (++ages[i] >= 40){ grid[i] = T.GRASS; ages[i] = 0; dirty = true; } else if (ages[i] % 10 === 0) dirty = true; }
  }
  for (let k=0;k<40;k++){
    const x = Math.floor(Math.random()*W), y = Math.floor(Math.random()*H), t = grid[idx(x,y)];
    if (t !== T.TREE && t !== T.FLOWER) continue;
    const [dx,dy] = pick(n4);
    if (!inb(x+dx,y+dy) || grid[idx(x+dx,y+dy)] !== T.GRASS) continue;
    if (t === T.TREE && Math.random() < .06) setTile(idx(x+dx,y+dy), T.SAPLING);
    if (t === T.FLOWER && Math.random() < .04) setTile(idx(x+dx,y+dy), T.FLOWER);
  }
  // 주민 이사
  const counts = new Map(), pop = new Map();
  let people = 0;
  ents.forEach(e => { if (e.type === 'person'){ people++; counts.set(e.home,(counts.get(e.home)||0)+1); pop.set(owner[e.home], (pop.get(owner[e.home])||0)+1); } });
  if (dark < .3){
    for (const h of houses){
      if (people >= 150 || h.k < 0) break;
      if ((counts.get(h.i)||0) < 2 && Math.random() < .12){
        const p = makeEnt('person', h.x, h.y, h.i); p.alpha = 0;
        ents.push(p); people++; changed = true;
        if (firstResident){ firstResident = false; toast('첫 주민이 이사 왔어요'); }
      }
    }
    // 나라가 스스로 커져요: 집, 밭, 길
    for (const [id,k] of kingdoms){
      const mine = houses.filter(h => h.k === id);
      if (!mine.length) continue;
      const full = (pop.get(id)||0) >= mine.length*2;
      if (full && mine.length < 30 && Math.random() < .25){
        const h = pick(mine);
        for (let tries=0; tries<12; tries++){
          const x = h.x + Math.floor(rnd(-2,3)), y = h.y + Math.floor(rnd(-2,3));
          if (!inb(x,y)) continue;
          const i = idx(x,y), t = grid[i];
          if (t !== T.GRASS && t !== T.SAND && t !== T.FLOWER) continue;
          if (terr[i] >= 0 && terr[i] !== id) continue;
          let crowded = false;
          for (const [dx,dy] of n4) if (inb(x+dx,y+dy) && grid[idx(x+dx,y+dy)] === T.HOUSE) crowded = true;
          if (crowded) continue;
          setTile(i, T.HOUSE); owner[i] = id; terrDirty = true; break;
        }
      }
      if (Math.random() < .08){
        const h = pick(mine), fields = mine.length;
        const x = h.x + Math.floor(rnd(-2,3)), y = h.y + Math.floor(rnd(-2,3));
        if (inb(x,y) && grid[idx(x,y)] === T.GRASS && terr[idx(x,y)] === id){
          let f = 0; for (let i=0;i<N;i++) if (grid[i] === T.FIELD && terr[i] === id) f++;
          if (f < fields) setTile(idx(x,y), T.FIELD);
        }
      }
    }
    // 자주 다니는 풀밭은 길이 돼요
    ents.forEach(e => {
      if (e.type !== 'person' || e.alpha < .5) return;
      const i = idx(cx(e), cy(e));
      if (grid[i] === T.GRASS && Math.random() < .006) setTile(i, T.ROAD);
    });
  }
  // 전쟁과 평화
  for (const key of borders){
    const [a,b] = key.split('-').map(Number);
    const A = kingdoms.get(a), B = kingdoms.get(b);
    if (!A || !B) continue;
    if (!A.wars.has(b) && Math.random() < .012){
      A.wars.add(b); B.wars.add(a); changed = true; toast(`⚔ ${A.name}과 ${B.name}이 전쟁을 시작했어요`);
    }
  }
  for (const A of kingdoms.values()){
    for (const b of [...A.wars]){
      if (b < A.id) continue;
      const B = kingdoms.get(b);
      if (B && Math.random() < .008){ A.wars.delete(b); B.wars.delete(A.id); changed = true; toast(`🕊 ${A.name}과 ${B.name}이 평화를 맺었어요`); }
    }
  }
  // 점령: 지키는 사람이 없는 적의 집 옆에 서 있으면 빼앗아요
  if (dark < .45){
    for (const e of ents){
      if (e.type !== 'person' || e.alpha < .5) continue;
      const k = owner[e.home];
      if (!anyWar(k)) continue;
      for (const h of houses){
        if (!atWar(k, h.k) || Math.abs(h.x+.5-e.x) > 1.3 || Math.abs(h.y+.5-e.y) > 1.3) continue;
        const guarded = ents.some(o => o.type === 'person' && o.alpha > .5 && owner[o.home] === h.k && (o.x-h.x-.5)**2 + (o.y-h.y-.5)**2 < 6);
        if (!guarded && Math.random() < .3){
          const from = kingdoms.get(h.k), to = kingdoms.get(k);
          owner[h.i] = k; h.k = k; dirty = changed = terrDirty = true;
          fx.push({type:'ring', x:h.x+.5, y:h.y+.5, t:0, d:.6, color:to.color});
          toast(`${to.name}이 ${from.name}의 집을 빼앗았어요`);
        }
        break;
      }
    }
  }
  // 동물 번식
  const animals = ents.filter(e => e.type !== 'person');
  if (animals.length < 120){
    ['rabbit','sheep','wolf','fish','bird'].forEach(type => {
      const same = animals.filter(e => e.type === type && (type !== 'wolf' || e.hunger < 30));
      const p = {rabbit:.06, sheep:.025, wolf:.012, fish:.04, bird:.015}[type];
      if (same.length >= 2 && Math.random() < p){
        const m = pick(same), x = cx(m), y = cy(m);
        if (walkable(type,x,y)){ ents.push(makeEnt(type,x,y)); changed = true; }
      }
    });
  }
  ents.forEach(e => {
    if (e.type !== 'rabbit' && e.type !== 'sheep') return;
    const i = idx(cx(e), cy(e));
    if (grid[i] === T.FLOWER && Math.random() < .03) setTile(i, T.GRASS);
  });
}

/* ---------- 신의 힘 ---------- */
function killAround(x, y, r, color){
  ents.forEach(e => { if ((e.x-x-.5)**2 + (e.y-y-.5)**2 <= r*r) kill(e, color); });
}
function bolt(x, y){
  fx.push({type:'bolt', x:x+.5, y:y+.5, t:0, d:.3, seed:Math.random()*99});
  flash = .35;
  const i = idx(x,y);
  if (FLAMMABLE[grid[i]]) setTile(i, T.FIRE);
  else if (grid[i] === T.SAND || grid[i] === T.ROAD) setTile(i, T.BURNT);
  killAround(x, y, 1.2, 'rgba(255,240,150,');
}
function ignite(x, y){
  const i = idx(x,y);
  if (FLAMMABLE[grid[i]]) setTile(i, T.FIRE);
}
function rain(x, y){
  fx.push({type:'rain', x:x+.5, y:y+.5, t:0, d:1.4});
  for (let dy=-3;dy<=3;dy++) for (let dx=-3;dx<=3;dx++){
    if (dx*dx+dy*dy > 10 || !inb(x+dx,y+dy)) continue;
    const i = idx(x+dx,y+dy), t = grid[i];
    if (t === T.FIRE){ grid[i] = T.BURNT; ages[i] = 20; dirty = changed = true; }
    else if (t === T.BURNT){ if (Math.random() < .5) setTile(i, T.GRASS); }
    else if (t === T.GRASS){ const r = Math.random(); if (r < .06) setTile(i, T.SAPLING); else if (r < .12) setTile(i, T.FLOWER); }
    else if (t === T.FIELD){ ages[i] = Math.min(30, ages[i]+10); dirty = true; }
  }
}
function meteor(x, y){
  fx.push({type:'meteor', x:x+.5, y:y+.5, t:0, d:.7, done(){
    shake = .5; flash = .5;
    fx.push({type:'ring', x:x+.5, y:y+.5, t:0, d:.7, color:'#ffb347', r:4});
    for (let dy=-4;dy<=4;dy++) for (let dx=-4;dx<=4;dx++){
      if (!inb(x+dx,y+dy)) continue;
      const d = Math.hypot(dx,dy), i = idx(x+dx,y+dy);
      if (d <= 1.5) setTile(i, T.WATER);
      else if (d <= 2.6) setTile(i, grid[i] === T.WATER ? T.WATER : T.BURNT);
      else if (d <= 3.6 && FLAMMABLE[grid[i]] && Math.random() < .55) setTile(i, T.FIRE);
    }
    killAround(x, y, 3, 'rgba(255,140,60,');
  }});
}

/* ---------- 칠하기 ---------- */
let painting = false, last = null, lastPower = 0;
function cellFrom(ev){
  const r = cv.getBoundingClientRect();
  return [Math.max(0,Math.min(W-1,Math.floor((ev.clientX - r.left)/r.width*W))), Math.max(0,Math.min(H-1,Math.floor((ev.clientY - r.top)/r.height*H)))];
}
function placeHouse(x, y){
  const i = idx(x,y);
  if (grid[i] === T.WATER || grid[i] === T.MOUNT) return;
  setTile(i, T.HOUSE);
  computeTerr();
  let k = nearestKingdom(x, y, 6);
  if (k < 0){ const nk = newKingdom(); k = nk.id; toast(`🏰 ${nk.name}이 세워졌어요`); }
  owner[i] = k; terrDirty = dirty = true;
}
function applyAt(x, y, first){
  const now = performance.now();
  if (tool === 'bolt'){ if (first || now - lastPower > 120){ bolt(x,y); lastPower = now; } return; }
  if (tool === 'meteor'){ if (first) meteor(x,y); return; }
  if (tool === 'rain'){ if (first || now - lastPower > 250){ rain(x,y); lastPower = now; } return; }
  const rad = brush-1;
  const each = fn => { for (let dy=-rad;dy<=rad;dy++) for (let dx=-rad;dx<=rad;dx++){
    const nx = x+dx, ny = y+dy;
    if (!inb(nx,ny) || (rad === 2 && Math.abs(dx)+Math.abs(dy) > 3)) continue;
    fn(nx, ny);
  } };
  if (tool === 'fire'){ each(ignite); return; }
  if (tool.startsWith('t')){
    const tile = +tool.slice(1);
    if (tile === T.HOUSE){ if (grid[idx(x,y)] !== T.HOUSE) placeHouse(x,y); return; }
    each((nx,ny) => setTile(idx(nx,ny), tile));
  } else if (tool === 'erase'){
    ents.forEach(e => { if (e.type !== 'person' && Math.abs(cx(e)-x) <= rad && Math.abs(cy(e)-y) <= rad) e.dead = true; });
    ents = ents.filter(e => !e.dead); changed = true;
  } else {
    if (!walkable(tool,x,y)) return;
    if (ents.filter(e => e.type !== 'person').length >= 160) { toast('섬이 꽉 찼어요'); return; }
    ents.push(makeEnt(tool,x,y)); changed = true;
  }
}
function snapshot(){
  return {grid:grid.slice(), ages:ages.slice(), owner:owner.slice(), ents:JSON.stringify(ents), kings:serKings(), nextKid};
}
function pushUndo(){ undoStack.push(snapshot()); if (undoStack.length > 30) undoStack.shift(); }
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
  pushUndo(); painting = true;
  const [x,y] = cellFrom(ev); last = [x,y]; applyAt(x,y,true);
});
cv.addEventListener('pointermove', ev => {
  if (!painting) return;
  const [x,y] = cellFrom(ev);
  if (last && x === last[0] && y === last[1]) return;
  const single = !tool.startsWith('t') && tool !== 'erase' && tool !== 'fire' || tool === 't'+T.HOUSE;
  const steps = Math.max(Math.abs(x-last[0]), Math.abs(y-last[1]));
  for (let s=1;s<=steps;s++){
    if (single && s < steps) continue;
    applyAt(Math.round(last[0] + (x-last[0])*s/steps), Math.round(last[1] + (y-last[1])*s/steps), false);
  }
  last = [x,y];
});
const stop = () => { painting = false; last = null; };
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);

/* ---------- 화면 ---------- */
function makeTools(el, list){
  list.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.id = t.id; b.setAttribute('aria-pressed', t.id === tool);
    b.innerHTML = `<i aria-hidden="true">${t.ico}</i>${t.name}`;
    b.onclick = () => { tool = t.id; document.querySelectorAll('.tool').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === tool)); };
    el.appendChild(b);
  });
}
makeTools(document.getElementById('godTools'), GOD_TOOLS);
makeTools(document.getElementById('terrainTools'), TERRAIN_TOOLS);
makeTools(document.getElementById('lifeTools'), LIFE_TOOLS);
const segPick = (sel, fn) => document.querySelectorAll(sel+' button').forEach(b => b.onclick = () => {
  fn(b); document.querySelectorAll(sel+' button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
segPick('#brush', b => brush = +b.dataset.s);
segPick('#speed', b => speedMul = +b.dataset.v);
document.getElementById('undo').onclick = () => {
  const u = undoStack.pop(); if (!u){ toast('더 되돌릴 게 없어요'); return; }
  grid = u.grid; ages = u.ages; owner = u.owner; ents = JSON.parse(u.ents); kingdoms = deKings(u.kings); nextKid = u.nextKid;
  dirty = changed = terrDirty = true;
};
document.getElementById('fresh').onclick = () => {
  if (confirm('지금 섬을 바다에 보내고 새 섬을 만들까요?')) { generate(); firstResident = true; toast('새 섬이 솟아올랐어요'); }
};
const nameEl = document.getElementById('name');
document.getElementById('photo').onclick = () => {
  const a = document.createElement('a');
  a.download = (nameEl.value.trim() || '나만의 섬') + '.png';
  a.href = cv.toDataURL('image/png'); a.click();
};
nameEl.addEventListener('input', () => { changed = true; document.title = nameEl.value || '나만의 섬'; });

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

function updateStats(){
  let trees=0;
  for (let i=0;i<N;i++) if (grid[i]===T.TREE) trees++;
  const c = {person:0,rabbit:0,sheep:0,wolf:0,fish:0,bird:0};
  const pop = new Map();
  ents.forEach(e => { c[e.type]++; if (e.type === 'person') pop.set(owner[e.home], (pop.get(owner[e.home])||0)+1); });
  document.getElementById('stats').innerHTML =
    `<span>주민<b>${c.person}</b></span><span>나라<b>${kingdoms.size}</b></span><span>나무<b>${trees}</b></span>` +
    `<span>동물<b>${c.rabbit+c.sheep+c.wolf+c.fish+c.bird}</b></span><span>수확<b>${harvest}</b></span>`;
  const h = Math.floor(tod*24), m = Math.floor((tod*24 - h)*6)*10;
  const icon = darkness() > .5 ? '🌙' : (dusk() > .4 ? '🌅' : '☀️');
  document.getElementById('clock').textContent = `${icon} ${day}일째 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const kEl = document.getElementById('kings');
  if (!kingdoms.size){ kEl.innerHTML = '<span class="hint">아직 나라가 없어요. 땅에 집을 지어 보세요.</span>'; return; }
  kEl.innerHTML = [...kingdoms.values()].map(k => {
    const hs = houses.filter(h => h.k === k.id).length;
    const foes = [...k.wars].map(id => kingdoms.get(id)?.name).filter(Boolean);
    return `<span class="king"><span class="dot" style="background:${k.color}"></span><b>${k.name}</b>` +
      `<small>주민 ${pop.get(k.id)||0} · 집 ${hs}</small>${foes.length ? `<span class="war">⚔ ${foes.join(', ')}</span>` : ''}</span>`;
  }).join('');
}

/* ---------- 저장 ---------- */
function serKings(){ return [...kingdoms.values()].map(k => ({id:k.id, name:k.name, color:k.color, wars:[...k.wars]})); }
function deKings(a){ return new Map(a.map(k => [k.id, {id:k.id, name:k.name, color:k.color, wars:new Set(k.wars)}])); }
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify({
      v:2, name:nameEl.value, grid:Array.from(grid), ages:Array.from(ages), owner:Array.from(owner),
      kings:serKings(), nextKid, tod, day, harvest,
      ents: ents.map(e => ({t:e.type, x:+e.x.toFixed(2), y:+e.y.toFixed(2), h:e.home, a:Math.round(e.age), l:Math.round(e.life), u:Math.round(e.hunger)}))
    }));
  } catch(_) {}
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s || s.v !== 2 || s.grid.length !== N) return false;
    grid = Uint8Array.from(s.grid); ages = Uint16Array.from(s.ages); owner = Int16Array.from(s.owner);
    kingdoms = deKings(s.kings); nextKid = s.nextKid;
    tod = s.tod; day = s.day; harvest = s.harvest || 0;
    nameEl.value = s.name || '나만의 섬'; document.title = nameEl.value;
    ents = s.ents.map(o => { const e = makeEnt(o.t, Math.floor(o.x), Math.floor(o.y), o.h); e.x = e.tx = o.x; e.y = e.ty = o.y; e.age = o.a||0; e.life = o.l||e.life; e.hunger = o.u||0; return e; });
    firstResident = !ents.some(e => e.type === 'person');
    dirty = terrDirty = true; return true;
  } catch(_) { return false; }
}
if (!load()) generate();
computeTerr();
setInterval(() => { if (changed){ save(); changed = false; } }, 3000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ---------- 효과 그리기 ---------- */
function drawFx(rdt){
  for (const f of fx){
    f.t += rdt;
    const p = Math.min(1, f.t/f.d), px = f.x*CS, py = f.y*CS;
    if (f.type === 'puff'){
      ctx.fillStyle = f.color + (1-p)*.8 + ')';
      ctx.beginPath(); ctx.arc(px, py - p*6, 3 + p*5, 0, 7); ctx.fill();
    } else if (f.type === 'ring'){
      ctx.strokeStyle = f.color; ctx.globalAlpha = 1-p; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px, py, 4 + p*(f.r||1.5)*CS, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.type === 'bolt'){
      ctx.strokeStyle = `rgba(255,250,200,${1-p})`; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(px + (hash(1,0,f.seed)-.5)*40, 0);
      for (let k=1;k<=6;k++){ const yy = py*k/6; ctx.lineTo(px + (k<6 ? (hash(k,1,f.seed)-.5)*24 : 0), yy); }
      ctx.stroke();
      ctx.fillStyle = `rgba(255,240,150,${(1-p)*.6})`; ctx.beginPath(); ctx.arc(px, py, 10, 0, 7); ctx.fill();
    } else if (f.type === 'meteor'){
      const sx = px + 10*CS*(1-p), sy = py - 12*CS*(1-p);
      const grad = ctx.createLinearGradient(sx, sy, sx + 50, sy - 60);
      grad.addColorStop(0, 'rgba(255,200,90,.9)'); grad.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 50, sy - 60); ctx.stroke();
      ctx.fillStyle = '#ffe2a0'; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(px, py, 4+p*10, 2+p*5, 0, 0, 7); ctx.fill();
      if (p >= 1 && f.done){ const d = f.done; f.done = null; d(); }
    } else if (f.type === 'rain'){
      const a = p < .2 ? p/.2 : p > .8 ? (1-p)/.2 : 1;
      ctx.fillStyle = `rgba(90,100,120,${a*.75})`;
      [[-14,-34,14],[2,-38,17],[18,-33,13]].forEach(([dx,dy,r]) => { ctx.beginPath(); ctx.arc(px+dx, py+dy, r, 0, 7); ctx.fill(); });
      ctx.strokeStyle = `rgba(160,200,255,${a*.8})`; ctx.lineWidth = 1.2;
      for (let k=0;k<22;k++){
        const rx = px + (hash(k,2,3)-.5)*90, ry = py - 25 + ((f.t*160 + hash(k,3,4)*60) % 70);
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx-2, ry+6); ctx.stroke();
      }
    }
  }
  fx = fx.filter(f => f.t < f.d || f.done);
}

/* ---------- 반복 ---------- */
let prev = performance.now(), acc = 0, facc = 0;
function frame(now){
  const rdt = Math.max(0, Math.min(.1, (now - prev)/1000)); prev = now;
  const dt = rdt * speedMul;
  const before = tod;
  tod += dt/DAY_LEN;
  if (tod >= 1) tod -= 1;
  if (before < .3 && tod >= .3){ day++; changed = true; }
  acc += dt; if (acc >= 1){ acc -= 1; tick(); }
  facc += dt; while (facc >= .4){ facc -= .4; fireTick(); }
  updateEnts(dt);
  if (terrDirty) computeTerr();
  if (dirty) renderBg();
  if (Math.floor(now/500) !== Math.floor((now-rdt*1000)/500)) updateStats();

  const t = now/1000;
  ctx.save();
  if (shake > 0){ shake -= rdt; ctx.translate((Math.random()-.5)*8, (Math.random()-.5)*8); }
  ctx.drawImage(bg, 0, 0);
  ctx.drawImage(tc, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (let k=0;k<18;k++){
    const x = Math.floor(hash(k, Math.floor(t*1.5), 3)*W), y = Math.floor(hash(k, Math.floor(t*1.5), 4)*H);
    if (grid[idx(x,y)] === T.WATER) ctx.fillRect(x*CS+4+(k%8), y*CS+6+(k%5), 3, 1);
  }
  // 불꽃
  for (let i=0;i<N;i++){
    if (grid[i] !== T.FIRE) continue;
    const px = (i%W)*CS, py = Math.floor(i/W)*CS;
    for (let k=0;k<3;k++){
      const fh = 6 + Math.sin(t*14 + i + k*2)*3 + k;
      const fxp = px + 3 + k*4;
      ctx.fillStyle = k === 1 ? '#ffd23f' : '#ff7a2f';
      ctx.beginPath(); ctx.moveTo(fxp-2.5, py+14); ctx.lineTo(fxp, py+14-fh); ctx.lineTo(fxp+2.5, py+14); ctx.fill();
    }
    if (Math.random() < .05) fx.push({type:'puff', x:(i%W)+.5, y:Math.floor(i/W)+.2, t:0, d:.9, color:'rgba(90,90,90,'});
  }
  const vis = ents.filter(e => e.alpha > .03).sort((a,b) => (a.type==='bird') - (b.type==='bird') || a.y - b.y);
  vis.forEach(e => drawEnt(e, t));
  drawFx(rdt);

  const d = darkness(), du = dusk();
  if (du > 0){ ctx.fillStyle = `rgba(255,140,60,${du*.18})`; ctx.fillRect(0,0,cv.width,cv.height); }
  if (d > 0){ ctx.fillStyle = `rgba(10,20,60,${d*.58})`; ctx.fillRect(0,0,cv.width,cv.height); }
  if (d > .25){
    const a = Math.min(1,(d-.25)*2);
    for (let i=0;i<N;i++){
      const px = (i%W)*CS, py = Math.floor(i/W)*CS;
      if (grid[i] === T.HOUSE){
        ctx.fillStyle = `rgba(255,214,110,${a})`; ctx.fillRect(px+4,py+9,2,2); ctx.fillRect(px+11,py+9,2,2);
        ctx.fillStyle = `rgba(255,200,90,${a*.18})`; ctx.beginPath(); ctx.arc(px+8,py+10,9,0,7); ctx.fill();
      } else if (grid[i] === T.FIRE){
        ctx.fillStyle = `rgba(255,140,50,${a*.3})`; ctx.beginPath(); ctx.arc(px+8,py+8,12,0,7); ctx.fill();
      } else if (grid[i] === T.FLOWER){
        const ffx = px+8+Math.sin(t*1.3+i)*5, ffy = py+7+Math.cos(t*1.7+i*.7)*4;
        ctx.fillStyle = `rgba(220,255,120,${a*(.5+.5*Math.sin(t*4+i))})`; ctx.fillRect(ffx,ffy,1.5,1.5);
      }
    }
  }
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,240,${flash*.6})`; ctx.fillRect(0,0,cv.width,cv.height); flash -= rdt*2; }
  ctx.restore();
  requestAnimationFrame(frame);
}
updateStats();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
