<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>부침개 뒤집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --kitchen:#F3E3C6; --kitchen-deep:#E0C793; --pan:#3B3B3F; --pan-deep:#232326;
  --cream:#FFFDF5; --gold:#FFD84D; --gold-deep:#F0B90B; --ink:#101010; --red:#E4572E;
  --disp:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(#FFF6E0 0%, var(--kitchen) 55%, var(--kitchen-deep) 100%);
  font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;touch-action:manipulation;
  user-select:none;height:100vh;display:flex;align-items:center;justify-content:center}
#wrap{width:100%;max-width:440px;padding:16px;text-align:center}

.mark{font-family:var(--disp);font-size:clamp(30px,9vw,46px);line-height:1.15;margin:0 0 8px;color:var(--red);
  text-shadow:4px 4px 0 var(--gold)}
.tag{font-size:clamp(12px,3.4vw,15px);opacity:.8;line-height:1.7;margin-bottom:16px}

.btn{all:unset;pointer-events:auto;cursor:pointer;display:inline-block;
  font-family:var(--disp);font-size:clamp(18px,5vw,23px);letter-spacing:.06em;color:var(--ink);
  background:var(--gold);padding:14px 36px;border-radius:999px;border:3px solid var(--ink);
  box-shadow:0 7px 0 var(--gold-deep),0 7px 0 3px var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(3px);box-shadow:0 4px 0 var(--gold-deep),0 4px 0 3px var(--ink)}
.btn:active{transform:translateY(7px);box-shadow:0 0 0 var(--gold-deep),0 0 0 3px var(--ink)}
.btn.small{font-size:15px;padding:11px 24px;background:var(--cream);box-shadow:0 6px 0 #DCD6C4,0 6px 0 3px var(--ink)}
.btn.small:hover{box-shadow:0 3px 0 #DCD6C4,0 3px 0 3px var(--ink)}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}

#hud{display:none;justify-content:space-between;font-family:var(--disp);font-size:15px;margin:0 4px 8px}
#hud.on{display:flex}

#panWrap{display:none;position:relative;width:min(70vw,260px);height:min(70vw,260px);margin:8px auto 12px}
#panWrap.on{display:block}
#pan{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%, #55555A, var(--pan) 55%, var(--pan-deep));
  border:8px solid #17171A;box-shadow:0 10px 0 #17171A, inset 0 -10px 20px rgba(0,0,0,.4)}
#handle{position:absolute;right:-58px;top:50%;transform:translateY(-50%);width:70px;height:16px;
  background:#8B5E3C;border:3px solid var(--ink);border-radius:8px}
#jeon{position:absolute;left:50%;top:50%;width:72%;height:72%;transform:translate(-50%,-50%);
  border-radius:46% 54% 50% 50% / 54% 50% 50% 46%;background:#F5DFA0;
  box-shadow:inset 0 6px 14px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:rgba(0,0,0,.55);font-family:var(--disp);transition:background-color .1s}
#state{font-family:var(--disp);font-size:clamp(16px,5vw,22px);min-height:1.5em;color:var(--red);margin-bottom:4px}

.big{font-family:var(--disp);font-size:clamp(28px,8vw,42px);margin:0 0 4px;color:var(--red);
  text-shadow:3px 3px 0 var(--gold)}
.num{font-family:var(--disp);font-size:clamp(46px,14vw,78px);line-height:1;margin:4px 0}
.line{font-size:14px;opacity:.85;margin-top:4px}
.best{margin-top:8px;font-size:12px;opacity:.65}
</style>
</head>
<body>
<div id="wrap">
  <div id="head"></div>
  <div id="hud"><span>부친 개수 <b id="cntTxt">0</b>/<b id="totTxt">8</b></span><span>점수 <b id="scoreTxt">0</b></span></div>
  <div id="state"></div>
  <div id="panWrap"><div id="pan"><div id="handle"></div><div id="jeon"></div></div></div>
  <div class="row"><button class="btn" id="flipBtn" style="display:none">뒤집기!</button></div>
</div>
<script>
const head=document.getElementById('head');
const hud=document.getElementById('hud');
const panWrap=document.getElementById('panWrap');
const jeon=document.getElementById('jeon');
const state=document.getElementById('state');
const flipBtn=document.getElementById('flipBtn');
const cntTxt=document.getElementById('cntTxt');
const scoreTxt=document.getElementById('scoreTxt');
const TOTAL=8;

let AC=null;
function beep(freq,dur,type,vol){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.13, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+(dur||.12));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(dur||.12));
  }catch(e){}
}
function lerpColor(a,b,t){
  const ah=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const bh=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c=ah.map((v,i)=>Math.round(v+(bh[i]-v)*t));
  return 'rgb('+c.join(',')+')';
}

let round=0, score=0, perfectN=0, goodN=0, missN=0;
let gauge=0, cookDur=2600, raf=null, playing=false, lastT=0;
let best=0;
try{ best=parseInt(localStorage.getItem('buchimgae_best'),10)||0; }catch(e){}

function showTitle(){
  playing=false; if(raf) cancelAnimationFrame(raf);
  hud.classList.remove('on'); panWrap.classList.remove('on'); flipBtn.style.display='none';
  state.textContent='';
  head.innerHTML = `
    <div class="mark">🥞<br>부침개 뒤집기</div>
    <div class="tag">노릇노릇해졌을 때 [뒤집기!]를 눌러요<br>너무 빠르면 덜 익고, 너무 늦으면 타요</div>
    <div class="row"><button class="btn" id="start">시작하기</button></div>
    ${best?`<div class="best">최고 점수 ${best}점</div>`:''}`;
  document.getElementById('start').onclick = e=>{ e.stopPropagation(); beep(660,.1,'triangle'); startGame(); };
}

function startGame(){
  round=0; score=0; perfectN=0; goodN=0; missN=0;
  scoreTxt.textContent=0; cntTxt.textContent=0;
  head.innerHTML='';
  hud.classList.add('on'); panWrap.classList.add('on'); flipBtn.style.display='inline-block';
  nextPancake();
}

function nextPancake(){
  gauge=0; cookDur=Math.max(1700, 2600-round*70);
  playing=true; lastT=performance.now();
  jeon.style.background = '#F5DFA0';
  jeon.textContent = '';
  state.textContent = '지글지글...';
  raf=requestAnimationFrame(loop);
}

function loop(now){
  const dt=Math.min(40, now-lastT); lastT=now;
  if (playing){
    gauge += dt/cookDur*100;
    if (gauge>=100){ gauge=100; finish(false); }
    updateJeon();
  }
  if (playing) raf=requestAnimationFrame(loop);
}

function updateJeon(){
  let col;
  if (gauge<55) col = lerpColor('#F5DFA0','#E8B860', gauge/55);
  else if (gauge<85) col = lerpColor('#E8B860','#8B5E2A', (gauge-55)/30);
  else col = lerpColor('#8B5E2A','#1E140A', (gauge-85)/15);
  jeon.style.background = col;
  state.textContent = gauge<40 ? '아직 하얘요' : gauge<55 ? '조금씩 익어요' : gauge<80 ? '노릇노릇!' : gauge<95 ? '이제 진해져요' : '타는 중!!';
}

function finish(byTap){
  playing=false; cancelAnimationFrame(raf);
  let kind;
  if (!byTap){ kind='burnt'; }
  else if (gauge>=55 && gauge<=80) kind='perfect';
  else if (gauge>=40 && gauge<=90) kind='good';
  else if (gauge<40) kind='raw';
  else kind='burnt';

  if (kind==='perfect'){ score+=3; perfectN++; state.textContent='노릇노릇 완성!'; beep(880,.14,'triangle',.14); }
  else if (kind==='good'){ score+=1; goodN++; state.textContent='먹을 만해요'; beep(600,.12,'triangle',.12); }
  else if (kind==='raw'){ missN++; state.textContent='덜 익었어요'; beep(300,.14,'sine',.1); }
  else { missN++; state.textContent='탔어요!'; beep(150,.2,'sawtooth',.12); jeon.style.background='#1E140A'; }

  scoreTxt.textContent=score;
  round++;
  cntTxt.textContent=round;
  setTimeout(()=>{
    if (round>=TOTAL) showResult();
    else nextPancake();
  }, 900);
}

function showResult(){
  hud.classList.remove('on'); panWrap.classList.remove('on'); flipBtn.style.display='none'; state.textContent='';
  const isBest = score>best;
  if (isBest){ best=score; try{ localStorage.setItem('buchimgae_best', best); }catch(e){} }
  const rank = score>=20 ? '부침개 장인!' : score>=12 ? '제법 노릇해요' : '다음엔 타이밍을 맞혀보자';
  head.innerHTML = `
    <div class="big">${isBest?'신기록!':'다 부쳤어요!'}</div>
    <div class="num">${score}</div>
    <div class="line">노릇 ${perfectN} · 먹을 만 ${goodN} · 실패 ${missN}</div>
    <div class="line">${rank}</div>
    <div class="best">최고 점수 ${best}점</div>
    <div class="row">
      <button class="btn" id="again">다시하기</button>
      <button class="btn small" id="home">처음으로</button>
    </div>`;
  document.getElementById('again').onclick = e=>{ e.stopPropagation(); startGame(); };
  document.getElementById('home').onclick = e=>{ e.stopPropagation(); showTitle(); };
}

flipBtn.addEventListener('click', ()=>{ if(playing) finish(true); });
addEventListener('keydown', e=>{ if(e.code==='Space' && playing){ e.preventDefault(); finish(true); } });

showTitle();
</script>
<script src="../rest.js?v=9"></script>
</body>
</html>
