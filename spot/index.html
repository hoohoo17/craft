<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F6FD">
<title>🔍 틀린 그림 찾기</title>
<style>
  :root {
    --bg: #F4F6FD;
    --card: #ffffff;
    --ink: #2C3560;
    --muted: #7C86A8;
    --line: #E3E9F8;
    --blue: #6C8BFF;
    --pink: #FF6B8A;
    --gold: #FFC53D;
    --shadow: 0 3px 10px rgba(80,100,160,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(123,167,255,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,170,210,.16), transparent 40%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 6px 0 10px; letter-spacing: .04em; }

  /* ---------- 난이도 ---------- */
  .seg {
    display: flex; gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .seg button {
    flex: 1;
    background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700;
    border: none; border-radius: 10px;
    padding: 9px 2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }

  /* ---------- 점수 ---------- */
  .bars { display: flex; gap: 8px; margin-bottom: 10px; }
  .bar {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 8px 6px 9px;
    box-shadow: var(--shadow);
  }
  .bar b { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .bar span { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 18px; }
  #hint b { color: #23883C; font-weight: 800; }

  /* ---------- 그림 두 장 ---------- */
  #boardwrap { position: relative; }
  .shot {
    display: block;
    width: 100%;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    touch-action: manipulation;
    cursor: pointer;
  }
  .mid {
    display: flex; align-items: center; gap: 8px;
    margin: 7px 0;
    font-size: 11px; font-weight: 800; color: var(--muted);
    letter-spacing: .06em;
  }
  .mid::before, .mid::after {
    content: ''; flex: 1; height: 2px; background: var(--line); border-radius: 2px;
  }

  /* ---------- 덮는 화면 ---------- */
  #cover {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    background: rgba(255,255,255,.94);
    border-radius: 16px;
  }
  #cover.on { display: flex; }
  #cover p { margin: 0; font-size: 23px; font-weight: 800; }
  #cover small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.6; }

  /* ---------- 버튼 ---------- */
  button {
    font: inherit; font-weight: 700;
    border: none; border-radius: 12px;
    padding: 11px 18px;
    background: var(--blue); color: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.warm { background: var(--pink); }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .row button { flex: 1; max-width: 200px; }
  #peekBtn { background: var(--card); color: var(--ink); }
  #tip { margin: 12px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>🔍 틀린 그림 찾기</h1>

  <div class="seg" id="levelRow" role="group" aria-label="난이도">
    <button data-k="easy">쉬움</button>
    <button data-k="normal">보통</button>
    <button data-k="hard">어려움</button>
  </div>

  <div class="bars">
    <div class="bar"><b>찾은 곳</b><span id="found">0</span></div>
    <div class="bar"><b>남은 힌트</b><span id="peeks">2</span></div>
    <div class="bar"><b>깬 그림</b><span id="cleared">0</span></div>
  </div>

  <p id="hint">두 그림에서 다른 곳을 찾아 눌러 보자</p>

  <div id="boardwrap">
    <canvas id="cvA" class="shot" aria-label="위 그림"></canvas>
    <div class="mid">위아래를 견줘 보자</div>
    <canvas id="cvB" class="shot" aria-label="아래 그림"></canvas>
    <div id="cover">
      <p id="coverMsg"></p>
      <div class="row" style="margin:0">
        <button id="coverBtn" class="warm">🔄 새 그림</button>
      </div>
    </div>
  </div>

  <div class="row">
    <button id="peekBtn">🔎 힌트</button>
    <button id="newBtn" class="warm">🔄 새 그림</button>
  </div>

  <p id="tip">위 그림과 아래 그림은 딱 몇 군데만 다르다<br>다른 곳을 찾으면 그 자리를 눌러라 · 위아래 아무 데나 눌러도 된다<br>시간은 재지 않는다 · 잘못 눌러도 잃는 건 없다 · 힌트는 한 판에 두 번</p>
</main>

<script>
/* 그림은 그때그때 새로 만든다. 같은 그림이 두 번 나오지 않는다.
   먼저 한 장을 그려 놓고, 그걸 베낀 다음 몇 군데만 손대는 식이다.
   잘못 눌러도 깎이는 건 없다. 지는 일이 없다. */

const LEVELS = {
  easy:   { name: '쉬움',   items: 8,  diffs: 3, kinds: ['gone', 'swap', 'big'] },
  normal: { name: '보통',   items: 10, diffs: 4, kinds: ['gone', 'swap', 'big', 'small', 'move'] },
  hard:   { name: '어려움', items: 12, diffs: 5, kinds: ['gone', 'swap', 'big', 'small', 'move', 'flip'] }
};

const WW = 360, PH = 180;          // 그림 한 장의 크기. 어느 화면에서나 이 크기로 셈한다
const COLS = 5, ROWS = 3;          // 물건을 놓는 자리
const BASE = 30;                   // 물건 크기
const GRAB = 30;                   // 이만큼 가까이 누르면 찾은 것으로 친다
const PEEKS = 2;                   // 한 판에 쓸 수 있는 힌트
const KEY_LEVEL = 'craft-spot-level';
const KEY_DONE  = 'craft-spot-cleared';

const THINGS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐸','🐵','🐷','🐔','🐤','🦆','🐝','🦋','🐞',
                '🐠','🐢','🌻','🌷','🌳','🍎','🍓','🍉','🍰','🍪','🎈','🚗','🚲','🚀','⚽',
                '🎩','👑','⭐','🌙','☂️','🎁','🧸','🪁','🍄','🦀'];

const cvA = document.getElementById('cvA');
const cvB = document.getElementById('cvB');
const ctxA = cvA.getContext('2d');
const ctxB = cvB.getContext('2d');
const wrapEl = document.getElementById('boardwrap');
const coverEl = document.getElementById('cover');
const coverMsg = document.getElementById('coverMsg');
const coverBtn = document.getElementById('coverBtn');
const foundEl = document.getElementById('found');
const peeksEl = document.getElementById('peeks');
const clearedEl = document.getElementById('cleared');
const hintEl = document.getElementById('hint');
const peekBtn = document.getElementById('peekBtn');
const levelRow = document.getElementById('levelRow');

let key, lv;
let S = 1;
let itemsA = [], itemsB = [];
let diffs = [];                    // { kind, pa, pb, found, at }
let clouds = [];
let peeksLeft = PEEKS;
let peekAt = 0, peekOn = null;
let misses = [];                   // 헛짚은 자리
let sparks = [];                   // 다 찾았을 때 터지는 것
let done = false;
let raf = null;

/* ---------- 고르기 ---------- */

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 그림 만들기 ---------- */

function makeScene() {
  // 칸을 골라 물건을 하나씩 얹는다. 칸을 나눠 놓으면 서로 겹치지 않는다
  const cells = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) cells.push({ r, c });
  }
  shuffle(cells);

  const bag = shuffle(THINGS.slice());
  const cw = WW / COLS, ch = PH / ROWS;

  const edge = BASE / 2 + 6;
  itemsA = cells.slice(0, lv.items).map((cell, i) => ({
    x: clamp(cell.c * cw + cw / 2 + (Math.random() - .5) * (cw - BASE - 8), edge, WW - edge),
    y: clamp(cell.r * ch + ch / 2 + (Math.random() - .5) * (ch - BASE - 8), edge, PH - edge),
    ch: bag[i],
    size: BASE,
    flip: false
  }));

  clouds = [
    { x: 40 + Math.random() * 40, y: 26, r: 13 },
    { x: 230 + Math.random() * 70, y: 20, r: 11 }
  ];

  // 베낀 뒤에 몇 군데만 손댄다
  itemsB = itemsA.map(o => Object.assign({}, o));
  diffs = [];

  const spots = shuffle(itemsA.map((_, i) => i)).slice(0, lv.diffs);
  const kinds = shuffle(lv.kinds.slice());

  spots.forEach((idx, n) => {
    const kind = kinds[n % kinds.length];
    const a = itemsA[idx], b = itemsB[idx];
    const pa = { x: a.x, y: a.y };
    let pb = { x: a.x, y: a.y };

    if (kind === 'gone') {
      b.hidden = true;
    } else if (kind === 'swap') {
      const used = itemsA.map(o => o.ch);
      const left = THINGS.filter(t => !used.includes(t));
      b.ch = left.length ? pick(left) : pick(THINGS);
    } else if (kind === 'big') {
      b.size = BASE + 16;
      // 커지면서 판 밖으로 삐져나가지 않게 안쪽으로 들인다
      const m = b.size / 2 + 3;
      b.x = clamp(a.x, m, WW - m);
      b.y = clamp(a.y, m, PH - m);
      pb = { x: b.x, y: b.y };
    } else if (kind === 'small') {
      b.size = BASE - 11;
    } else if (kind === 'move') {
      const ang = Math.random() * Math.PI * 2;
      const d = 24;
      b.x = clamp(a.x + Math.cos(ang) * d, 24, WW - 24);
      b.y = clamp(a.y + Math.sin(ang) * d, 24, PH - 24);
      pb = { x: b.x, y: b.y };
    } else if (kind === 'flip') {
      b.flip = true;
    }

    diffs.push({ kind, pa, pb, found: false, at: 0 });
  });
}

/* ---------- 새 판 ---------- */

function newGame() {
  makeScene();
  peeksLeft = PEEKS;
  peekOn = null;
  misses = [];
  sparks = [];
  done = false;
  peekBtn.disabled = false;
  coverEl.classList.remove('on');
  hintEl.textContent = '두 그림에서 다른 곳을 찾아 눌러 보자';
  paint();
  loop();
}

/* ---------- 누르기 ---------- */

function at(cv, e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S };
}

function tap(cv, which, e) {
  ensureAudio();
  if (done) return;
  const p = at(cv, e);

  // 위아래 어느 쪽을 눌러도, 두 자리 중 가까운 쪽에 닿으면 찾은 것으로 친다
  let hit = null, near = GRAB;
  for (const d of diffs) {
    if (d.found) continue;
    for (const q of [d.pa, d.pb]) {
      const gap = Math.hypot(p.x - q.x, p.y - q.y);
      if (gap < near) { near = gap; hit = d; }
    }
  }

  if (!hit) {
    misses.push({ x: p.x, y: p.y, which, at: performance.now() });
    bump();
    return;
  }

  hit.found = true;
  hit.at = performance.now();
  ding();
  paint();

  const left = diffs.filter(d => !d.found).length;
  hintEl.innerHTML = left
    ? '<b>찾았다!</b> ' + left + '곳 남았다'
    : '<b>다 찾았다!</b>';
  if (!left) win();
}

/* ---------- 힌트 ---------- */

function peek() {
  ensureAudio();
  if (done || peeksLeft <= 0) return;
  const left = diffs.filter(d => !d.found);
  if (!left.length) return;
  peeksLeft--;
  peekBtn.disabled = peeksLeft <= 0;
  peekOn = pick(left);
  peekAt = performance.now();
  paint();
  hintEl.textContent = '여기 어디쯤이다';
}

/* ---------- 다 찾았을 때 ---------- */

function win() {
  done = true;
  peekBtn.disabled = true;

  const n = loadCleared() + 1;
  saveCleared(n);
  paint();

  for (let i = 0; i < 26; i++) {
    sparks.push({
      x: WW / 2, y: PH / 2,
      vx: (Math.random() - .5) * 260,
      vy: -60 - Math.random() * 200,
      c: pick(['#FF6B8A', '#FFC53D', '#6C8BFF', '#55BE8A']),
      at: performance.now()
    });
  }
  cheer();

  const used = PEEKS - peeksLeft;
  const stars = Math.max(1, 3 - used);
  coverMsg.innerHTML = '다 찾았다! 🎉' +
    '<small>' + '⭐'.repeat(stars) + '<br>' +
    (used ? '힌트 ' + used + '번 썼다' : '힌트 없이 다 찾았다!') + '<br>' +
    '이걸로 ' + n + '장째' + '</small>';
  coverEl.classList.add('on');
}

/* ---------- 소리 ---------- */

let ac = null;

function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  }
  if (ac && ac.state === 'suspended') ac.resume();
}

function tone(freq, at0, dur, type, vol) {
  if (!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at0);
  g.gain.exponentialRampToValueAtTime(vol, at0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(at0);
  o.stop(at0 + dur + 0.05);
}

function ding() {
  if (!ac) return;
  const t = ac.currentTime;
  tone(880, t, 0.1, 'triangle', 0.18);
  tone(1320, t + 0.07, 0.14, 'triangle', 0.16);
}
function bump() {
  if (!ac) return;
  tone(170, ac.currentTime, 0.09, 'sine', 0.12);
}
function cheer() {
  if (!ac) return;
  const t = ac.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.09, 0.2, 'triangle', 0.16));
}

/* ---------- 그리기 ---------- */

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  S = (wrapEl.clientWidth || WW) / WW;
  [cvA, cvB].forEach((cv, i) => {
    cv.width = Math.round(WW * S * dpr);
    cv.height = Math.round(PH * S * dpr);
    cv.style.height = (PH * S) + 'px';
    (i ? ctxB : ctxA).setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  });
  draw();
}

function drawShot(ctx, items, which) {
  ctx.clearRect(0, 0, WW, PH);

  const sky = ctx.createLinearGradient(0, 0, 0, PH);
  sky.addColorStop(0, '#E6F0FF');
  sky.addColorStop(1, '#F8FBFF');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, WW, PH);

  ctx.fillStyle = '#fff';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r, c.y + 3, c.r * .8, 0, Math.PI * 2);
    ctx.arc(c.x - c.r, c.y + 3, c.r * .7, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#CDEBD3';
  ctx.fillRect(0, PH - 26, WW, 26);
  ctx.fillStyle = '#A9DBB4';
  ctx.fillRect(0, PH - 26, WW, 3);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  items.forEach(o => {
    if (o.hidden) return;
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.flip) ctx.scale(-1, 1);
    ctx.font = o.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(o.ch, 0, 0);
    ctx.restore();
  });

  const now = performance.now();

  // 찾아낸 자리에 동그라미를 쳐 둔다
  diffs.forEach(d => {
    if (!d.found) return;
    const p = which === 'a' ? d.pa : d.pb;
    const k = Math.min(1, (now - d.at) / 260);
    const r = 34 - k * 10;
    ctx.strokeStyle = '#2E9E5B';
    ctx.lineWidth = 3;
    ctx.globalAlpha = .35 + k * .65;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // 힌트로 켜 둔 자리
  if (peekOn) {
    const k = (now - peekAt) / 1800;
    if (k < 1) {
      const p = which === 'a' ? peekOn.pa : peekOn.pb;
      ctx.strokeStyle = '#FFB03A';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 5]);
      ctx.globalAlpha = 1 - k;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 30 + Math.sin(k * 18) * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    } else {
      peekOn = null;
    }
  }

  // 헛짚은 자리
  misses.forEach(m => {
    if (m.which !== which) return;
    const k = (now - m.at) / 520;
    if (k > 1) return;
    ctx.strokeStyle = '#C3CCE6';
    ctx.lineWidth = 3;
    ctx.globalAlpha = 1 - k;
    ctx.beginPath();
    ctx.moveTo(m.x - 8, m.y - 8); ctx.lineTo(m.x + 8, m.y + 8);
    ctx.moveTo(m.x + 8, m.y - 8); ctx.lineTo(m.x - 8, m.y + 8);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // 다 찾았을 때 터지는 것
  sparks.forEach(s => {
    const t = (now - s.at) / 1000;
    if (t > 1.4) return;
    ctx.fillStyle = s.c;
    ctx.globalAlpha = Math.max(0, 1 - t / 1.4);
    ctx.fillRect(s.x + s.vx * t - 3, s.y + s.vy * t + 300 * t * t - 3, 6, 6);
    ctx.globalAlpha = 1;
  });
}

function draw() {
  drawShot(ctxA, itemsA, 'a');
  drawShot(ctxB, itemsB, 'b');
}

function loop() {
  if (raf) cancelAnimationFrame(raf);
  const now = performance.now();
  misses = misses.filter(m => now - m.at < 520);
  sparks = sparks.filter(s => now - s.at < 1400);
  draw();
  raf = requestAnimationFrame(loop);
}

/* ---------- 기록 ---------- */

function loadCleared() {
  let raw = null;
  try { raw = localStorage.getItem(KEY_DONE + '-' + key); } catch (e) {}
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : 0;
}
function saveCleared(n) {
  try { localStorage.setItem(KEY_DONE + '-' + key, String(n)); } catch (e) {}
}
function paint() {
  foundEl.textContent = diffs.filter(d => d.found).length + ' / ' + diffs.length;
  peeksEl.textContent = peeksLeft;
  clearedEl.textContent = loadCleared();
}

/* ---------- 난이도 ---------- */

function setLevel(k) {
  key = LEVELS[k] ? k : 'easy';
  lv = LEVELS[key];
  try { localStorage.setItem(KEY_LEVEL, key); } catch (e) {}
  [...levelRow.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === key)));
  newGame();
  fit();
}

levelRow.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setLevel(b.dataset.k);
});
cvA.addEventListener('pointerdown', e => tap(cvA, 'a', e));
cvB.addEventListener('pointerdown', e => tap(cvB, 'b', e));
peekBtn.addEventListener('click', peek);
coverBtn.addEventListener('click', newGame);
document.getElementById('newBtn').addEventListener('click', newGame);
window.addEventListener('resize', fit);

let startKey = 'easy';
try { startKey = localStorage.getItem(KEY_LEVEL) || 'easy'; } catch (e) {}
setLevel(startKey);
