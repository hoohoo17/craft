<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두더지 피하기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e8f8ff; color: #2b2b4a;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px; touch-action: none;
  }
  h1 { font-size: 26px; margin-bottom: 6px; }
  .hud { display: flex; gap: 24px; font-size: 18px; margin-bottom: 8px; }
  canvas { background: #b9e56b; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.12); max-width: 100%; }
  .records { margin-top: 12px; background: #fff; border-radius: 12px; padding: 12px 18px; width: 100%; max-width: 480px; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .records .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .records h3 { font-size: 18px; }
  .records .cnt { font-size: 13px; opacity: .55; }
  .records .refresh { margin-left: auto; font-size: 13px; padding: 4px 10px; background: #eef3f6; color: #2b2b4a; border-radius: 8px; }
  .records ol { list-style: none; font-size: 17px; line-height: 1.7; }
  .records li { display: flex; align-items: center; gap: 8px; }
  .records .no { width: 22px; text-align: center; opacity: .55; }
  .records .no.medal { opacity: 1; font-size: 18px; }
  .records .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .records .sc { font-weight: bold; }
  .records .empty { opacity: .6; }
  .records .fresh { color: #ff5a1f; font-weight: bold; }
  .records .note { font-size: 13px; margin-top: 6px; min-height: 16px; opacity: .6; }
  .records .note.warn { color: #d24b2b; opacity: 1; }
  .hint { margin-top: 10px; font-size: 14px; opacity: .7; text-align: center; }
  .msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); }
  .msg.show { display: flex; }
  .box { background: #fff; padding: 28px 36px; border-radius: 16px; text-align: center; }
  .box h2 { font-size: 28px; margin-bottom: 10px; }
  .box p { font-size: 18px; margin-bottom: 18px; }
  button { margin: 4px; font: inherit; font-size: 20px; padding: 10px 26px; border: none; border-radius: 10px; background: #ff7a45; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>🐹 두더지 피하기</h1>
<div class="hud"><span>점수 <b id="score">0</b></span></div>
<canvas id="c" width="480" height="480"></canvas>
<div class="records">
  <div class="head"><h3>🏅 기록</h3><span class="cnt" id="recCount"></span><button class="refresh" id="refreshBtn">새로고침</button></div>
  <ol id="recList"><li class="empty">불러오는 중…</li></ol>
  <div class="note" id="recNote"></div>
</div>
<div class="hint">← → ↑ ↓ 키나 탭으로 칸을 옮겨요. 땅이 흔들리는 칸에서 도망쳐!</div>

<div class="msg" id="msg">
  <div class="box">
    <h2>😵 잡혔다!</h2>
    <p id="msgText"></p>
    <div style="margin-bottom:12px"><input id="nameInput" maxlength="8" placeholder="이름 쓰기" style="font:inherit;font-size:18px;padding:8px 12px;border:2px solid #ccc;border-radius:10px;width:150px;text-align:center"> <button onclick="saveRecord()" style="background:#2e9e5b">기록하기</button></div>
    <button onclick="share()">📤 친구에게 자랑하기</button>
    <button onclick="restart()">다시 하기</button>
    <p id="copied" style="margin:10px 0 0;font-size:14px;color:#2e9e5b;height:18px"></p>
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const N = 3, CELL = W / N;
let player, holes, score, lives, running, lastTime, spawnTimer, spawnGap;

function reset() {
  player = { r: 1, c: 1 };
  holes = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) holes.push({ r, c, state: 'idle', t: 0 });
  score = 0; lives = 3; running = true; spawnTimer = 0; spawnGap = 1.6;
  updateHud();
}
function updateHud() {
  document.getElementById('score').textContent = score;
}
function restart() { document.getElementById('msg').classList.remove('show'); reset(); }
let best = 0;

/* ---------- 기록 (댓글 서버를 그대로 쓴다) ----------
   그 서버는 승인 전 글의 내용은 감추고 '이름'만 공개하니까,
   기록을 이름 칸에 '이름|점수' 로 담아 둔다. 그래서 다른 폰에서도 보인다. */
const RKEY = 'moledodge:ranking:1';
const API = 'https://craft-comments.jaehoo.workers.dev?page=mole-rank-v1';
const TOP = 5;
let records = [], recorded = false, rankBusy = false;

const recList = document.getElementById('recList');
const recNote = document.getElementById('recNote');
const recCount = document.getElementById('recCount');

const sortRank = list => list.sort((a, b) => b.sc - a.sc).slice(0, TOP);
function sane(list) {
  return Array.isArray(list)
    ? list.filter(r => r && typeof r.name === 'string' && Number.isFinite(+r.sc))
          .map(r => ({ name: r.name, sc: +r.sc })).slice(0, TOP)
    : [];
}
function renderRecords(freshIdx = -1) {
  recCount.textContent = records.length ? 'TOP ' + TOP : '';
  if (!records.length) { recList.innerHTML = '<li class="empty">아직 기록이 없어요</li>'; return; }
  const MEDAL = ['🥇', '🥈', '🥉'];
  recList.innerHTML = records.map((r, i) =>
    '<li class="' + (i === freshIdx ? 'fresh' : '') + '">' +
    '<span class="no' + (i < 3 ? ' medal' : '') + '">' + (MEDAL[i] || (i + 1)) + '</span>' +
    '<span class="nm">' + String(r.name).replace(/[<>&]/g, '') + '</span>' +
    '<span class="sc">' + r.sc + '점</span></li>').join('');
}
function note(msg, warn) {
  recNote.textContent = msg || '';
  recNote.classList.toggle('warn', !!warn);
}
function readLocal() {
  try { return sane(JSON.parse(localStorage.getItem(RKEY))); } catch (e) { return []; }
}
function writeLocal() {
  try { localStorage.setItem(RKEY, JSON.stringify(records)); } catch (e) {}
}
const encodeRank = r => (r.name.split('|').join('') + '|' + r.sc).slice(0, 20);
function decodeRank(name) {
  const m = /^(.*)\|(\d+)$/.exec(String(name || ''));
  return m && m[1] ? { name: m[1], sc: +m[2] } : null;
}
async function fetchBoard() {
  const res = await fetch(API, { cache: 'no-store' });
  if (!res.ok) throw new Error('http ' + res.status);
  const rows = await res.json();
  if (!Array.isArray(rows)) throw new Error('bad payload');
  return sortRank(rows.map(c => decodeRank(c && c.name)).filter(Boolean));
}
async function loadRecords() {
  if (rankBusy) return;
  rankBusy = true;
  try {
    if (!records.length) { records = readLocal(); renderRecords(); }
    records = await fetchBoard();
    writeLocal();
    note('');
  } catch (e) {
    records = readLocal();
    note('오프라인 · 이 기기 기록만 표시', true);
  }
  renderRecords();
  rankBusy = false;
}
async function saveRecord() {
  if (recorded || rankBusy) return;
  const name = (document.getElementById('nameInput').value || '').trim().slice(0, 6) || '이름없음';
  const rec = { name, sc: score };
  recorded = true;
  rankBusy = true;
  document.getElementById('copied').textContent = '기록했어! 🏅';

  records = sortRank(records.concat([rec]));
  writeLocal();
  renderRecords(records.indexOf(rec));

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: encodeRank(rec), message: rec.sc + '점' }),
    });
    if (!res.ok) throw new Error('http ' + res.status);
    records = await fetchBoard();
    writeLocal();
    note('');
    renderRecords(records.findIndex(r => r.name === rec.name && r.sc === rec.sc));
  } catch (e) {
    note('저장 실패 · 이 기기에만 기록됨', true);
  }
  rankBusy = false;
}
document.getElementById('refreshBtn').addEventListener('click', loadRecords);
loadRecords();

function endGame() {
  running = false;
  best = Math.max(best, score);
  recorded = false;
  document.getElementById('nameInput').value = '';
  document.getElementById('msgText').textContent = '점수: ' + score + '   |   최고: ' + best;
  document.getElementById('copied').textContent = '';
  document.getElementById('msg').classList.add('show');
}
async function share() {
  const text = '🐹 두더지 피하기에서 ' + score + '점 기록! 나보다 잘할 수 있어?';
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) {} }
  try { await navigator.clipboard.writeText(text); document.getElementById('copied').textContent = '복사됐어! 친구한테 붙여넣기 해봐 ✅'; }
  catch (e) { document.getElementById('copied').textContent = text; }
}

const WARN = 1.0, UP = 0.9;

function update(dt) {
  if (!running) return;
  spawnTimer += dt;
  if (spawnTimer >= spawnGap) {
    spawnTimer = 0;
    const idle = holes.filter(h => h.state === 'idle');
    if (idle.length) { const h = idle[Math.floor(Math.random() * idle.length)]; h.state = 'warn'; h.t = 0; }
    spawnGap = Math.max(0.7, spawnGap - 0.03);
  }
  for (const h of holes) {
    if (h.state === 'idle') continue;
    h.t += dt;
    if (h.state === 'warn' && h.t >= WARN) {
      h.state = 'up'; h.t = 0;
      if (h.r === player.r && h.c === player.c) { endGame(); return; }
      score += 1; updateHud();
    } else if (h.state === 'up' && h.t >= UP) { h.state = 'idle'; h.t = 0; }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const h of holes) {
    const cx = h.c * CELL + CELL/2, cy = h.r * CELL + CELL/2;
    // hole
    ctx.fillStyle = '#7a4b2a';
    ctx.beginPath(); ctx.ellipse(cx, cy + 25, 55, 22, 0, 0, Math.PI*2); ctx.fill();
    if (h.state === 'warn') {
      const shake = Math.sin(h.t * 40) * 4;
      ctx.fillStyle = '#a56b3c';
      ctx.beginPath(); ctx.ellipse(cx + shake, cy + 25, 55, 22, 0, 0, Math.PI*2); ctx.fill();
      ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('❗', cx, cy - 20);
    }
    if (h.state === 'up') {
      const pop = Math.min(1, h.t / 0.15);
      ctx.font = `${Math.round(64 * pop)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🐹', cx, cy);
      ctx.textBaseline = 'alphabetic';
    }
  }
  // player
  const px = player.c * CELL + CELL/2, py = player.r * CELL + CELL/2 - 10;
  ctx.font = '60px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🧒', px, py);
  ctx.textBaseline = 'alphabetic';
}

function loop(t) {
  if (!lastTime) lastTime = t;
  const dt = Math.min(0.05, (t - lastTime) / 1000); lastTime = t;
  update(dt); draw(); requestAnimationFrame(loop);
}

function move(dr, dc) {
  if (!running) return;
  player.r = Math.max(0, Math.min(N-1, player.r + dr));
  player.c = Math.max(0, Math.min(N-1, player.c + dc));
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(0, -1);
  if (e.key === 'ArrowRight') move(0, 1);
  if (e.key === 'ArrowUp') move(-1, 0);
  if (e.key === 'ArrowDown') move(1, 0);
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
function tap(clientX, clientY) {
  if (!running) return;
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width), y = (clientY - rect.top) * (H / rect.height);
  player.c = Math.max(0, Math.min(N-1, Math.floor(x / CELL)));
  player.r = Math.max(0, Math.min(N-1, Math.floor(y / CELL)));
}
cv.addEventListener('mousedown', e => tap(e.clientX, e.clientY));
cv.addEventListener('touchstart', e => { e.preventDefault(); tap(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

reset(); requestAnimationFrame(loop);
</script>
<script src="../rest.js?v=9"></script>
</body>
</html>
