<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>비밀 암호 기계</title>
<style>
  :root{
    --bg:#12131C; --panel:#1E2030; --panel2:#272A3E;
    --ink:#EDEFFA; --dim:#9AA0C0;
    --accent:#FFC53D; --accent2:#6C5CE7; --ok:#3DDC97;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    width:100%; max-width:460px; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    gap:10px;
  }

  header{text-align:center; padding:4px 0 2px;}
  h1{font-size:1.25rem; letter-spacing:-.5px;}
  h1 .gear{display:inline-block;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  header p{font-size:.78rem; color:var(--dim); margin-top:3px; font-weight:700;}

  .seg{
    display:flex; background:var(--panel); border-radius:14px; padding:4px; gap:4px;
  }
  .seg button{
    flex:1; border:0; background:transparent; color:var(--dim);
    font-family:inherit; font-size:.95rem; font-weight:800;
    padding:9px 0; border-radius:10px; cursor:pointer;
  }
  .seg button.on{background:var(--accent2); color:#fff;}

  .chips{display:flex; gap:6px;}
  .chips button{
    flex:1; border:2px solid var(--panel2); background:var(--panel);
    color:var(--dim); font-family:inherit; font-weight:800; font-size:.86rem;
    padding:10px 0; border-radius:12px; cursor:pointer; line-height:1.35;
  }
  .chips button .e{display:block; font-size:1.2rem; margin-bottom:1px;}
  .chips button.on{border-color:var(--accent); color:var(--accent); background:var(--panel2);}

  .keyrow{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border-radius:14px; padding:10px 14px;
  }
  .keyrow.hide{display:none;}
  .keyrow label{font-size:.9rem; font-weight:800; white-space:nowrap;}
  .keyrow input{flex:1;}
  .keynum{
    min-width:34px; text-align:center; font-weight:900; font-size:1.1rem;
    color:var(--accent);
  }

  textarea{
    width:100%; min-height:96px; resize:vertical;
    background:var(--panel); color:var(--ink);
    border:2px solid var(--panel2); border-radius:14px;
    padding:12px 14px; font-family:inherit; font-size:1.02rem; font-weight:600;
    line-height:1.5; outline:none;
  }
  textarea:focus{border-color:var(--accent2);}
  textarea::placeholder{color:#5D6288;}

  .go{
    border:0; border-radius:16px; cursor:pointer;
    background:var(--accent); color:#1A1A22;
    font-family:inherit; font-weight:900; font-size:1.12rem;
    padding:15px 0; width:100%;
    box-shadow:0 5px 0 #C99417;
  }
  .go:active{transform:translateY(4px); box-shadow:0 1px 0 #C99417;}
  .shake{animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
  }

  .note{
    background:var(--panel); border:2px dashed #3A3E5C; border-radius:14px;
    padding:14px; min-height:96px;
    font-size:1.05rem; font-weight:700; line-height:1.55;
    word-break:break-all; white-space:pre-wrap;
    color:var(--ok);
  }
  .note.empty{color:#5D6288; font-weight:600;}
  .note.num{font-family:ui-monospace,Menlo,monospace; font-size:.95rem; letter-spacing:.3px;}

  .outrow{display:flex; gap:6px;}
  .outrow button{
    flex:1; border:0; border-radius:12px; cursor:pointer;
    background:var(--panel2); color:var(--ink);
    font-family:inherit; font-weight:800; font-size:.9rem; padding:11px 0;
  }
  .outrow button:active{opacity:.7;}
  .hint{font-size:.76rem; color:var(--dim); text-align:center; line-height:1.5; font-weight:600;}
  .back{
    display:block; text-align:center; color:var(--dim);
    font-size:.85rem; font-weight:800; text-decoration:none; padding:6px 0 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="gear" id="gear">⚙️</span> 비밀 암호 기계</h1>
    <p>넣으면 암호가 되고, 다시 넣으면 풀린다</p>
  </header>

  <div class="seg">
    <button id="m-enc" class="on">🔒 암호로 만들기</button>
    <button id="m-dec">🔓 암호 풀기</button>
  </div>

  <div class="chips">
    <button data-w="shift" class="on"><span class="e">🔁</span>밀기</button>
    <button data-w="mirror"><span class="e">🪞</span>거울</button>
    <button data-w="number"><span class="e">🔢</span>숫자</button>
  </div>

  <div class="keyrow" id="keyrow">
    <label>비밀 열쇠</label>
    <input type="range" id="key" min="1" max="9" value="3">
    <span class="keynum" id="keynum">3</span>
  </div>

  <textarea id="in" placeholder="여기에 쓰면 돼. 예) 오늘 떡볶이 먹자"></textarea>

  <button class="go" id="go">기계 돌리기</button>

  <div class="note empty" id="out">여기에 결과가 나와</div>

  <div class="outrow">
    <button id="copy">📋 복사하기</button>
    <button id="swap">↩️ 결과를 다시 넣기</button>
  </div>

  <p class="hint" id="hint">
    🔁 밀기는 <b>열쇠 숫자가 똑같아야</b> 풀려.<br>
    열쇠를 모르는 사람은 못 읽어.
  </p>

  <a class="back" href="../index.html">← 게임 목록으로</a>
</div>

<script>
(function(){
  var HB=0xAC00, HE=0xD7A3, HN=HE-HB+1;

  function shift(text,k){
    var out='';
    for (var ch of text){
      var c=ch.codePointAt(0);
      if(c>=HB&&c<=HE)      out+=String.fromCodePoint(HB+(((c-HB+k)%HN)+HN)%HN);
      else if(c>=97&&c<=122) out+=String.fromCodePoint(97+(((c-97+k)%26)+26)%26);
      else if(c>=65&&c<=90)  out+=String.fromCodePoint(65+(((c-65+k)%26)+26)%26);
      else if(c>=48&&c<=57)  out+=String.fromCodePoint(48+(((c-48+k)%10)+10)%10);
      else out+=ch;
    }
    return out;
  }
  function mirror(t){ return Array.from(t).reverse().join(''); }
  function toNum(t){ return Array.from(t).map(function(ch){return ch.codePointAt(0);}).join('.'); }
  function fromNum(t){
    var parts=t.trim().split(/[.\s]+/).filter(Boolean), out='';
    for(var i=0;i<parts.length;i++){
      var n=parseInt(parts[i],10);
      if(isNaN(n)||n<1||n>0x10FFFF) return null;
      out+=String.fromCodePoint(n);
    }
    return out;
  }

  var way='shift', mode='enc', busy=false;
  var $=function(id){return document.getElementById(id);};
  var inEl=$('in'), outEl=$('out'), keyEl=$('key'), gear=$('gear');

  keyEl.addEventListener('input',function(){ $('keynum').textContent=keyEl.value; });

  $('m-enc').onclick=function(){ setMode('enc'); };
  $('m-dec').onclick=function(){ setMode('dec'); };
  function setMode(m){
    mode=m;
    $('m-enc').classList.toggle('on',m==='enc');
    $('m-dec').classList.toggle('on',m==='dec');
    $('go').textContent = m==='enc' ? '기계 돌리기' : '암호 풀기';
    inEl.placeholder = m==='enc'
      ? '여기에 쓰면 돼. 예) 오늘 떡볶이 먹자'
      : '받은 암호를 여기에 붙여넣어';
  }

  var chips=document.querySelectorAll('.chips button');
  chips.forEach(function(b){
    b.onclick=function(){
      chips.forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      way=b.dataset.w;
      $('keyrow').classList.toggle('hide', way!=='shift');
      $('hint').innerHTML = way==='shift'
        ? '🔁 밀기는 <b>열쇠 숫자가 똑같아야</b> 풀려.<br>열쇠를 모르는 사람은 못 읽어.'
        : way==='mirror'
        ? '🪞 거울은 글자 순서를 통째로 뒤집어.<br>한 번 더 돌리면 원래대로 돌아와.'
        : '🔢 숫자는 글자마다 번호를 붙여.<br>점(.)까지 통째로 보내야 풀 수 있어.';
    };
  });

  function run(){
    if(busy) return;
    var src=inEl.value;
    if(!src.trim()){
      show('먼저 뭐라도 써 줘 🙂', true); bump(); return;
    }
    var k=parseInt(keyEl.value,10);
    var res;
    if(way==='shift')       res = shift(src, mode==='enc'? k : -k);
    else if(way==='mirror') res = mirror(src);
    else                    res = mode==='enc' ? toNum(src) : fromNum(src);

    if(res===null){
      show('이건 숫자 암호가 아닌 것 같아.\n숫자랑 점(.)만 들어있어야 해!', true); bump(); return;
    }
    scramble(res);
  }

  function bump(){
    var g=$('go');
    g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
  }

  var POOL='★☆●○◆◇■□▲△▼▽♠♥♣♦§¶◎※✦✧⌘⍟';
  function scramble(finalText){
    busy=true; bump();
    gear.classList.add('spin');
    outEl.classList.remove('empty');
    outEl.classList.toggle('num', way==='number' && mode==='enc');
    var arr=Array.from(finalText), n=arr.length, step=0;
    var total=8;
    var t=setInterval(function(){
      step++;
      var shown=arr.map(function(ch,i){
        if(ch===' '||ch==='\n') return ch;
        return (i < n*step/total) ? ch : POOL[(Math.random()*POOL.length)|0];
      }).join('');
      outEl.textContent=shown;
      if(step>=total){
        clearInterval(t);
        outEl.textContent=finalText;
        gear.classList.remove('spin');
        busy=false;
      }
    },45);
  }

  function show(msg,dim){
    outEl.classList.toggle('empty',!!dim);
    outEl.classList.remove('num');
    outEl.textContent=msg;
  }

  $('go').onclick=run;

  $('copy').onclick=function(){
    var txt=outEl.textContent;
    if(outEl.classList.contains('empty')||!txt) return;
    var done=function(){
      var b=$('copy'), old=b.textContent;
      b.textContent='✅ 복사했어!';
      setTimeout(function(){ b.textContent=old; },1100);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,fallback);
    } else fallback();
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(ta);
    }
  };

  $('swap').onclick=function(){
    if(outEl.classList.contains('empty')) return;
    inEl.value=outEl.textContent;
    setMode(mode==='enc'?'dec':'enc');
    show('이제 아래 버튼을 눌러 봐 👇', true);
  };
})();
</script>
</body>
</html>
