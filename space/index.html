<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F6FD">
<title>👾 우주 침략자 막기</title>
<style>
  :root {
    --bg: #F4F6FD;
    --card: #ffffff;
    --ink: #2C3560;
    --muted: #7C86A8;
    --line: #E3E9F8;
    --blue: #6C8BFF;
    --pink: #FF6B8A;
    --gold: #FFC53D;
    --green: #55BE8A;
    --shadow: 0 3px 10px rgba(80,100,160,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(123,167,255,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,170,210,.16), transparent 40%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 6px 0 10px; letter-spacing: .04em; }

  .seg {
    display: flex; gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .seg button {
    flex: 1;
    background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700;
    border: none; border-radius: 10px;
    padding: 9px 2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }

  .bars { display: flex; gap: 8px; margin-bottom: 9px; }
  .bar {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 8px 6px 9px;
    box-shadow: var(--shadow);
  }
  .bar b { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .bar span { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; min-height: 18px; }
  #hint b { color: #23883C; font-weight: 800; }

  #skywrap { position: relative; }
  canvas {
    display: block;
    width: 100%;
    background: #101033;
    border-radius: 16px;
    box-shadow: var(--shadow);
    touch-action: pan-y;   /* 위아래로 쓸면 화면이 내려간다 */
  }

  #cover {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding: 0 18px;
    background: rgba(255,255,255,.94);
    border-radius: 16px;
  }
  #cover.on { display: flex; }
  #cover p { margin: 0; font-size: 23px; font-weight: 800; }
  #cover small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.6; }

  #found {
    position: absolute; left: 50%; top: 14px;
    transform: translate(-50%, -14px);
    padding: 9px 16px;
    background: rgba(255,255,255,.96);
    border: 2px solid var(--gold);
    border-radius: 16px;
    box-shadow: var(--shadow);
    font-size: 15px; font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    white-space: nowrap;
  }
  #found.on { opacity: 1; transform: translate(-50%, 0); }

  button {
    font: inherit; font-weight: 700;
    border: none; border-radius: 12px;
    padding: 11px 18px;
    background: var(--blue); color: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.warm { background: var(--pink); }
  button.calm { background: var(--green); }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .row button { flex: 1; max-width: 220px; }

  /* ---------- 지금 가진 힘 ---------- */
  #gear {
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    margin-top: 10px; padding: 9px 8px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    font-size: 12.5px; font-weight: 800;
  }
  #gear span { padding: 3px 9px; border-radius: 9px; background: #EEF3FF; color: var(--blue); }
  #gear span.off { background: #F2F4FA; color: var(--muted); }

  #tip { font-size: 12.5px; color: var(--muted); line-height: 1.75; margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <h1>👾 우주 침략자 막기</h1>

  <div class="seg" id="levelRow">
    <button data-lv="easy" aria-pressed="true">느긋하게</button>
    <button data-lv="normal" aria-pressed="false">보통</button>
    <button data-lv="hard" aria-pressed="false">도전</button>
  </div>

  <div class="bars">
    <div class="bar"><b>⭐ 점수</b><span id="score">0</span></div>
    <div class="bar"><b>❤️ 목숨</b><span id="lives">5</span></div>
    <div class="bar"><b>🌊 물결</b><span id="wave">1</span></div>
  </div>

  <p id="hint">화면을 손가락으로 쓸어서 움직이자 · 총알은 저절로 나간다</p>

  <div id="skywrap">
    <canvas id="cv"></canvas>
    <div id="found"></div>
    <div id="cover">
      <p id="coverMsg">우주 침략자 막기</p>
      <div class="row" id="coverRow">
        <button id="coverBtn">시작</button>
      </div>
    </div>
  </div>

  <div id="gear"></div>

  <div class="row">
    <button id="newBtn" class="warm">🔄 새로 하기</button>
  </div>

  <p id="tip">손가락을 대고 움직이면 우주선이 따라온다 · 총은 저절로 쏜다<br>👾 1대 · 🛸 2대 · 👹 3대를 맞혀야 터진다 · 위쪽 줄일수록 점수가 높다<br>가끔 떨어지는 🔫 총 늘리기 · ⚡ 빨리 쏘기 · 🛡️ 방패 · ❤️ 목숨을 받아 먹자<br>맞으면 총이 한 줄 줄어든다 · 총은 100줄, 목숨은 100개까지 늘어난다<br>5물결마다 👽 우두머리가 온다 · 잡으면 🔫 총 다섯 줄을 준다</p>
</main>

<script>
/* 손가락이 닿은 가로 자리를 우주선이 따라간다. 총은 저절로 나간다.
   침략자들은 한 덩어리로 좌우로 움직이다가 벽에 닿으면 한 칸 내려온다. */

const LEVELS = {
  easy:   { name: '느긋하게', lives: 5, foeSpd: 0.7, bomb: 0.5, ship: 1.2 },
  normal: { name: '보통',     lives: 3, foeSpd: 1.0, bomb: 1.0, ship: 1.0 },
  hard:   { name: '도전',     lives: 3, foeSpd: 1.3, bomb: 1.6, ship: 0.9 }
};

const KINDS = {
  grunt: { emo: '👾', hp: 1, pts: 10, col: '#8E7BFF' },
  mid:   { emo: '🛸', hp: 2, pts: 20, col: '#4FB6E8' },
  elite: { emo: '👹', hp: 3, pts: 30, col: '#FF6B8A' }
};

const ITEMS = {
  gun:    { emo: '🔫', name: '총 늘리기' },
  fast:   { emo: '⚡', name: '빨리 쏘기' },
  shield: { emo: '🛡️', name: '방패' },
  life:   { emo: '❤️', name: '목숨 하나' }
};
const ITEM_KEYS = ['gun', 'gun', 'fast', 'shield', 'life'];

const COLS = 6, ROWS = 4;
const MAXGUN = 100, MAXLIFE = 100;   // 총은 100줄까지, 목숨은 100개까지
const KEY = 'craft-space-';

/* ---------- 화면 조각 ---------- */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrapEl = document.getElementById('skywrap');
const coverEl = document.getElementById('cover');
const coverMsg = document.getElementById('coverMsg');
const coverBtn = document.getElementById('coverBtn');
const foundEl = document.getElementById('found');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const waveEl = document.getElementById('wave');
const hintEl = document.getElementById('hint');
const gearEl = document.getElementById('gear');
const newBtn = document.getElementById('newBtn');
const levelRow = document.getElementById('levelRow');

/* ---------- 상태 ---------- */

let key, lv;
let W = 396, H = 470, unit = 20;
let score = 0, best = 0, lives = 3, wave = 1;
let foes = [], bullets = [], bombs = [], items = [], bits = [], pops = [], stars = [];
let fx = 0, fy = 0, dir = 1;
let boss = null;
let shipX = 198, aimX = 198, shipY = 0, invuln = 0, shield = false;
let gunLvl = 1, fastLvl = 0;
let cool = 0, bombCool = 1.2;
let phase = 'ready';       // ready 시작 전 · play 노는 중 · clear 물결 사이 · over 끝
let started = false;
let shake = 0, flash = 0;
let raf = null, last = 0, clock = 0;
let ac = null;
let holding = false;

function put(k2, v) { try { localStorage.setItem(KEY + k2, v); } catch (e) {} }
function get(k2) { try { return localStorage.getItem(KEY + k2); } catch (e) { return null; } }

/* ---------- 소리 ---------- */

function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}

function tone(freq, dur, type, vol, delay, slide) {
  if (!ac) return;
  const a0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, a0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, a0 + dur);
  g.gain.setValueAtTime(0.0001, a0);
  g.gain.exponentialRampToValueAtTime(vol, a0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, a0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(a0);
  o.stop(a0 + dur + 0.05);
}

const sfx = {
  shoot: () => tone(900, 0.07, 'square', 0.03, 0, 1500),
  boom:  () => { tone(200, 0.16, 'sawtooth', 0.07, 0, 60); },
  big:   () => { tone(120, 0.34, 'sawtooth', 0.11, 0, 40); tone(300, 0.2, 'square', 0.06); },
  item:  () => [660, 880, 1170].forEach((f, i) => tone(f, 0.12, 'triangle', 0.09, i * 0.06)),
  ouch:  () => tone(160, 0.35, 'square', 0.12, 0, 60),
  wave:  () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'triangle', 0.1, i * 0.1)),
  over:  () => [420, 330, 250, 170].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.1, i * 0.16))
};

/* ---------- 알림 ---------- */

function say(t) { hintEl.innerHTML = t; }

let foundTimer = null;
function banner(t) {
  foundEl.textContent = t;
  foundEl.classList.add('on');
  clearTimeout(foundTimer);
  foundTimer = setTimeout(() => foundEl.classList.remove('on'), 1600);
}

function pop(x, y, txt, col, big) { pops.push({ x, y, txt, col, t: 0, big: !!big }); }

function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (spd || 1) * (60 + Math.random() * 200);
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, t: 0, col, r: 2 + Math.random() * 3.5 });
  }
}

/* ---------- 판 크기 ---------- */

/* 화면 세로가 짧으면 판을 줄여서 한 화면에 다 들어오게 한다.
   판 위에서는 손가락으로 쓸어도 화면이 안 내려가기 때문이다 */
function availH(minH, maxH) {
  const pageH = document.documentElement.scrollHeight;
  const cvH = cv.getBoundingClientRect().height || 0;
  const room = (window.innerHeight || 800) - (pageH - cvH) - 4;
  return Math.round(Math.max(minH, Math.min(maxH, room)));
}

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = wrapEl.clientWidth || 396;
  H = availH(300, Math.round(Math.min(W * 1.2, 500)));
  unit = W / 10;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  shipY = H - unit * 1.3;
  if (!stars.length) makeStars();
}

function makeStars() {
  stars = [];
  for (let i = 0; i < 46; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.6, spd: 6 + Math.random() * 26 });
  }
}

/* ---------- 물결 만들기 ---------- */

function startWave(n) {
  wave = n;
  foes = []; bombs = []; bullets = []; items = [];
  fx = 0; fy = 0; dir = 1;
  boss = null;
  bombCool = 1.0;
  phase = 'play';

  if (n % 5 === 0) {
    const hp = Math.round((26 + n * 9) * (lv.foeSpd * 0.6 + 0.5));
    boss = { x: W / 2, y: unit * 2, hp: hp, max: hp, dir: 1, hurt: 0 };
    say('👽 <b>우두머리</b>가 나타났다! 계속 쏴서 체력을 깎자');
    banner('👽 ' + n + '물결 · 우두머리!');
  } else {
    const rows = Math.min(ROWS + Math.floor((n - 1) / 3), 5);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        const kind = r === 0 ? 'elite' : (r < 3 ? 'mid' : 'grunt');
        foes.push({ c: c, r: r, kind: kind, hp: KINDS[kind].hp + Math.floor((n - 1) / 6), alive: true, hurt: 0 });
      }
    }
    say('🌊 <b>' + n + '물결</b> 시작!');
    banner('🌊 ' + n + '물결');
  }
  paint();
}

function foeX(f) { return unit * (1.3 + f.c * 1.5) + fx; }
function foeY(f) { return unit * (1.5 + f.r * 1.25) + fy; }
function aliveFoes() { return foes.filter(f => f.alive); }

/* ---------- 새 판 ---------- */

function newGame() {
  score = 0;
  lives = lv.lives;
  gunLvl = 1; fastLvl = 0; shield = false; invuln = 0;
  shipX = W / 2; aimX = W / 2;
  bits = []; pops = [];
  phase = 'play';
  coverEl.classList.remove('on');
  startWave(1);
  paint();
}

/* ---------- 숫자 고치기 ---------- */

function paint() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  waveEl.textContent = wave;
  gearEl.innerHTML =
    '<span class="' + (gunLvl > 1 ? '' : 'off') + '">🔫 총 ' + gunLvl + '줄</span>' +
    '<span class="' + (fastLvl > 0 ? '' : 'off') + '">⚡ 빠르기 ' + fastLvl + '</span>' +
    '<span class="' + (shield ? '' : 'off') + '">🛡️ 방패 ' + (shield ? '있음' : '없음') + '</span>' +
    '<span class="off">🏆 최고 ' + best + '</span>';
}

/* ---------- 쏘기 ---------- */

function fireGap() { return 0.36 / (1 + 0.45 * fastLvl); }

/* 총이 늘어날수록 더 넓게 퍼져서 나간다. 100줄이면 화면을 가득 덮는다 */
function fire() {
  const y = shipY - unit * 0.5;
  const n = gunLvl;
  const span = Math.min(W * 0.94, unit * 0.44 * (n - 1));
  for (let i = 0; i < n; i++) {
    const dx = n === 1 ? 0 : -span / 2 + span * (i / (n - 1));
    bullets.push({ x: shipX + dx, y: y, vy: -H * 1.75 });
  }
  sfx.shoot();
}

/* ---------- 맞았다 ---------- */

function playerHit() {
  if (invuln > 0) return;
  if (shield) {
    shield = false;
    invuln = 1.2;
    burst(shipX, shipY, '#4FB6E8', 18, 1.2);
    banner('🛡️ 방패가 막아 줬다!');
    sfx.item();
    paint();
    return;
  }
  lives--;
  gunLvl = Math.max(1, gunLvl - 1);
  invuln = 1.8;
  shake = 14;
  flash = 1;
  burst(shipX, shipY, '#FF6B8A', 26, 1.5);
  sfx.ouch();
  paint();
  if (lives <= 0) { gameOver('😵 우주선이 다 부서졌다'); return; }
  say('😣 맞았다! 목숨 <b>' + lives + '</b>개 남음');
}

function gameOver(msg) {
  phase = 'over';
  sfx.over();
  if (score > best) { best = score; put('best', best); }
  coverMsg.innerHTML = msg + '<small>점수 ' + score + ' · ' + wave + '물결까지 갔다<br>최고 기록 ' + best + '</small>';
  coverBtn.textContent = '다시 하기';
  coverEl.classList.add('on');
  paint();
}

/* ---------- 물건 떨어뜨리기 ---------- */

function maybeDrop(x, y, opt) {
  opt = opt || {};
  if (!opt.sure && Math.random() > 0.14) return;
  const k2 = opt.kind || ITEM_KEYS[Math.floor(Math.random() * ITEM_KEYS.length)];
  items.push({ x: x, y: y, kind: k2, amt: opt.amt || 1, t: 0 });
}

function takeItem(it) {
  const info = ITEMS[it.kind];
  const amt = it.amt || 1;
  if (it.kind === 'gun') {
    if (gunLvl < MAXGUN) { gunLvl = Math.min(MAXGUN, gunLvl + amt); banner('🔫 총이 ' + gunLvl + '줄로!'); }
    else { score += 50; banner('🔫 100줄 꽉 찼다 · +50점'); }
  } else if (it.kind === 'fast') {
    if (fastLvl < 2) { fastLvl++; banner('⚡ 더 빨리 쏜다!'); }
    else { score += 50; banner('⚡ 이미 꽉 찼다 · +50점'); }
  } else if (it.kind === 'shield') {
    shield = true;
    banner('🛡️ 방패가 생겼다!');
  } else {
    lives = Math.min(MAXLIFE, lives + amt);
    banner('❤️ 목숨이 ' + lives + '개!');
  }
  pop(it.x, it.y - unit * 0.4, info.emo, '#FFC53D');
  sfx.item();
  paint();
}

/* ---------- 한 칸씩 흐르는 시간 ---------- */

function update(dt) {
  clock += dt;
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 3);
  invuln = Math.max(0, invuln - dt);

  stars.forEach(s => { s.y += s.spd * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } });

  bits.forEach(b => { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 220 * dt; });
  bits = bits.filter(b => b.t < b.life);
  pops.forEach(p => p.t += dt);
  pops = pops.filter(p => p.t < 0.9);

  if (phase !== 'play' && phase !== 'clear') return;

  /* 우주선 */
  shipX += (aimX - shipX) * Math.min(1, dt * 16);
  const half = unit * 0.5;
  shipX = Math.max(half, Math.min(W - half, shipX));

  /* 총알 */
  if (phase === 'play') {
    cool -= dt;
    if (cool <= 0) { fire(); cool = fireGap(); }
  }
  bullets.forEach(b => b.y += b.vy * dt);
  bullets = bullets.filter(b => b.y > -20);

  /* 침략자 무리 */
  const live = aliveFoes();
  if (live.length) {
    const total = foes.length;
    const spd = unit * (1.05 + (1 - live.length / total) * 2.3) * lv.foeSpd * (1 + (wave - 1) * 0.06);
    fx += dir * spd * dt;
    let lo = 1e9, hi = -1e9;
    live.forEach(f => { const x = foeX(f); if (x < lo) lo = x; if (x > hi) hi = x; });
    if (hi > W - unit * 0.6 && dir > 0) { dir = -1; fy += unit * 0.42; }
    if (lo < unit * 0.6 && dir < 0) { dir = 1; fy += unit * 0.42; }
    /* 아래까지 내려오면 끝이다 */
    for (const f of live) {
      if (foeY(f) > shipY - unit * 0.6) { gameOver('👾 침략자가 내려왔다'); return; }
    }
  }

  /* 우두머리 */
  if (boss && boss.hp > 0) {
    boss.hurt = Math.max(0, boss.hurt - dt * 3);
    boss.x += boss.dir * unit * 1.9 * lv.foeSpd * dt;
    if (boss.x > W - unit * 1.3) { boss.x = W - unit * 1.3; boss.dir = -1; }
    if (boss.x < unit * 1.3) { boss.x = unit * 1.3; boss.dir = 1; }
    boss.y = unit * 2 + Math.sin(clock * 1.4) * unit * 0.3;
  }

  /* 폭탄 떨어뜨리기 */
  if (phase === 'play') {
    bombCool -= dt;
    if (bombCool <= 0) {
      const rate = lv.bomb * (1 + (wave - 1) * 0.1);
      bombCool = (1.15 / rate) * (0.6 + Math.random() * 0.9);
      if (boss && boss.hp > 0) {
        [-unit * 0.6, 0, unit * 0.6].forEach(dx => bombs.push({ x: boss.x + dx, y: boss.y + unit * 0.8, vy: H * 0.5 }));
      } else if (live.length) {
        const f = live[Math.floor(Math.random() * live.length)];
        bombs.push({ x: foeX(f), y: foeY(f) + unit * 0.4, vy: H * 0.42 });
      }
    }
  }
  bombs.forEach(b => b.y += b.vy * dt);
  bombs = bombs.filter(b => b.y < H + 20);

  /* 떨어지는 물건 */
  items.forEach(it => { it.y += H * 0.3 * dt; it.t += dt; });
  items = items.filter(it => it.y < H + 20);

  /* 총알이 맞았나 */
  bullets = bullets.filter(b => {
    if (boss && boss.hp > 0 && Math.hypot(b.x - boss.x, b.y - boss.y) < unit * 1.15) {
      boss.hp--;
      boss.hurt = 1;
      burst(b.x, b.y, '#7BE0A8', 5);
      sfx.boom();
      if (boss.hp <= 0) {
        score += 200 + wave * 40;
        pop(boss.x, boss.y, '+' + (200 + wave * 40), '#FFC53D', true);
        burst(boss.x, boss.y, '#7BE0A8', 44, 1.8);
        shake = 16;
        sfx.big();
        maybeDrop(boss.x - unit * 0.8, boss.y, { sure: true, kind: 'gun', amt: 5 });
        maybeDrop(boss.x + unit * 0.8, boss.y, { sure: true });
        paint();
      }
      return false;
    }
    for (const f of foes) {
      if (!f.alive) continue;
      const x = foeX(f), y = foeY(f);
      if (Math.abs(b.x - x) < unit * 0.55 && Math.abs(b.y - y) < unit * 0.5) {
        f.hp--;
        f.hurt = 1;
        if (f.hp <= 0) {
          f.alive = false;
          const pts = KINDS[f.kind].pts + wave;
          score += pts;
          pop(x, y, '+' + pts, '#FFD75E');
          burst(x, y, KINDS[f.kind].col, 14, 1.1);
          sfx.boom();
          maybeDrop(x, y);
          paint();
        } else {
          burst(b.x, b.y, KINDS[f.kind].col, 5);
          sfx.shoot();
        }
        return false;
      }
    }
    return true;
  });

  /* 폭탄이 나를 맞혔나 */
  bombs = bombs.filter(b => {
    if (Math.abs(b.x - shipX) < unit * 0.5 && Math.abs(b.y - shipY) < unit * 0.45) {
      playerHit();
      return false;
    }
    return true;
  });

  /* 물건을 받아 먹었나 */
  items = items.filter(it => {
    if (Math.abs(it.x - shipX) < unit * 0.75 && Math.abs(it.y - shipY) < unit * 0.6) {
      takeItem(it);
      return false;
    }
    return true;
  });

  /* 물결을 다 막았나 */
  if (phase === 'play') {
    const done = boss ? boss.hp <= 0 : aliveFoes().length === 0;
    /* 떨어지는 물건이 남아 있으면 다 받아 먹을 때까지 기다려 준다 */
    if (done && items.length) {
      say('🎁 떨어지는 걸 받아 먹자! 다 먹으면 다음 물결로 간다');
    }
    if (done && items.length === 0) {
      phase = 'clear';
      const bonus = 50 * wave + lives * 20;
      score += bonus;
      sfx.wave();
      banner('🎉 ' + wave + '물결 끝! +' + bonus);
      say('🎉 <b>' + wave + '물결</b>을 막았다! 보너스 +' + bonus);
      paint();
      setTimeout(() => { if (phase === 'clear') startWave(wave + 1); }, 1500);
    }
  }
}

/* ---------- 그리기 ---------- */

function drawShip() {
  const u = unit;
  if (invuln > 0 && Math.floor(clock * 14) % 2 === 0) return;
  ctx.save();
  ctx.translate(shipX, shipY);

  /* 불꽃 */
  const fl = 0.5 + Math.random() * 0.5;
  ctx.fillStyle = '#FF9F43';
  ctx.beginPath();
  ctx.moveTo(-u * 0.16, u * 0.34);
  ctx.lineTo(0, u * (0.5 + fl * 0.35));
  ctx.lineTo(u * 0.16, u * 0.34);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFD75E';
  ctx.beginPath();
  ctx.moveTo(-u * 0.08, u * 0.34);
  ctx.lineTo(0, u * (0.42 + fl * 0.22));
  ctx.lineTo(u * 0.08, u * 0.34);
  ctx.closePath(); ctx.fill();

  /* 몸통 */
  ctx.fillStyle = '#6C8BFF';
  ctx.beginPath();
  ctx.moveTo(0, -u * 0.56);
  ctx.lineTo(u * 0.44, u * 0.3);
  ctx.lineTo(u * 0.16, u * 0.34);
  ctx.lineTo(-u * 0.16, u * 0.34);
  ctx.lineTo(-u * 0.44, u * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#A8BEFF';
  ctx.beginPath();
  ctx.moveTo(0, -u * 0.5);
  ctx.lineTo(u * 0.14, u * 0.2);
  ctx.lineTo(-u * 0.14, u * 0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#EAF3FF';
  ctx.beginPath(); ctx.arc(0, -u * 0.16, u * 0.12, 0, 7); ctx.fill();

  if (shield) {
    ctx.strokeStyle = 'rgba(79,182,232,.9)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, u * 0.72 + Math.sin(clock * 5) * 2, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(79,182,232,.13)';
    ctx.beginPath(); ctx.arc(0, 0, u * 0.72, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  /* 우주 */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#191947');
  g.addColorStop(1, '#0B0B22');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  const neb = ctx.createRadialGradient(W * 0.75, H * 0.2, 4, W * 0.75, H * 0.2, W * 0.6);
  neb.addColorStop(0, 'rgba(120,90,220,.28)');
  neb.addColorStop(1, 'rgba(120,90,220,0)');
  ctx.fillStyle = neb;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.r * 0.3) + ')';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  });

  /* 침략자 */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  foes.forEach(f => {
    if (!f.alive) return;
    const x = foeX(f), y = foeY(f);
    const wob = Math.sin(clock * 3 + f.c * 0.6 + f.r) * 2;
    if (f.hurt > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (f.hurt * 0.5) + ')';
      ctx.beginPath(); ctx.arc(x, y + wob, unit * 0.55, 0, 7); ctx.fill();
      f.hurt = Math.max(0, f.hurt - 0.08);
    }
    ctx.font = Math.round(unit * 0.86) + 'px serif';
    ctx.fillText(KINDS[f.kind].emo, x, y + wob);
    if (f.hp > KINDS[f.kind].hp) {
      ctx.font = '800 10px sans-serif';
      ctx.fillStyle = '#FFD75E';
      ctx.fillText('+' + (f.hp - KINDS[f.kind].hp), x + unit * 0.4, y - unit * 0.34 + wob);
    }
  });

  /* 우두머리 */
  if (boss && boss.hp > 0) {
    if (boss.hurt > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (boss.hurt * 0.45) + ')';
      ctx.beginPath(); ctx.arc(boss.x, boss.y, unit * 1.2, 0, 7); ctx.fill();
    }
    ctx.font = Math.round(unit * 2) + 'px serif';
    ctx.fillText('👽', boss.x, boss.y);
    const bw = W * 0.62;
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.fillRect((W - bw) / 2, 8, bw, 10);
    ctx.fillStyle = '#FF6B8A';
    ctx.fillRect((W - bw) / 2, 8, bw * Math.max(0, boss.hp / boss.max), 10);
  }

  /* 총알 */
  bullets.forEach(b => {
    ctx.fillStyle = '#9BF6FF';
    ctx.fillRect(b.x - 2, b.y - 9, 4, 14);
    ctx.fillStyle = 'rgba(155,246,255,.35)';
    ctx.fillRect(b.x - 4, b.y - 12, 8, 20);
  });

  /* 폭탄 */
  bombs.forEach(b => {
    ctx.fillStyle = 'rgba(255,120,90,.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y - 8, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#FF7043';
    ctx.beginPath(); ctx.arc(b.x, b.y, 5.5, 0, 7); ctx.fill();
  });

  /* 떨어지는 물건 */
  items.forEach(it => {
    const bob = Math.sin(it.t * 6) * 2;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(it.x, it.y + bob, unit * 0.34, 0, 7); ctx.fill();
    ctx.strokeStyle = '#FFC53D';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.font = Math.round(unit * 0.42) + 'px serif';
    ctx.fillStyle = '#2C3560';
    ctx.fillText(ITEMS[it.kind].emo, it.x, it.y + bob + 1);
  });

  drawShip();

  /* 조각 */
  bits.forEach(b => {
    ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
    ctx.fillStyle = b.col;
    ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  });
  ctx.globalAlpha = 1;

  /* 떠오르는 글씨 */
  pops.forEach(p => {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
    ctx.font = '800 ' + (p.big ? 22 : 15) + 'px "Apple SD Gothic Neo", sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(20,20,50,.8)';
    ctx.strokeText(p.txt, p.x, p.y - p.t * 30);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, p.x, p.y - p.t * 30);
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,80,110,' + (flash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function tick(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);
  draw();
  raf = requestAnimationFrame(tick);
}

/* ---------- 손가락 ---------- */

function toX(e) {
  const rect = cv.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!started) return;
  holding = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  aimX = toX(e);
});
cv.addEventListener('pointermove', e => {
  if (!holding || !started) return;
  e.preventDefault();
  aimX = toX(e);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => {
  cv.addEventListener(ev, () => { holding = false; });
  window.addEventListener(ev, () => { holding = false; });
});

const KEYS = { ArrowLeft: -1, ArrowRight: 1, a: -1, d: 1 };
let keyDir = 0;
window.addEventListener('keydown', e => {
  if (KEYS[e.key] === undefined || !started) return;
  e.preventDefault();
  keyDir = KEYS[e.key];
});
window.addEventListener('keyup', e => { if (KEYS[e.key] !== undefined) keyDir = 0; });
setInterval(() => { if (keyDir) aimX = Math.max(0, Math.min(W, aimX + keyDir * unit * 0.5)); }, 40);

coverBtn.addEventListener('click', () => {
  ensureAudio();
  started = true;
  newGame();
  say('손가락을 대고 좌우로! 총은 저절로 나간다');
});

newBtn.addEventListener('click', () => {
  ensureAudio();
  started = true;
  newGame();
  say('🔄 새로 시작!');
});

levelRow.addEventListener('click', e => {
  const b = e.target.closest('button[data-lv]');
  if (!b) return;
  key = b.dataset.lv;
  lv = LEVELS[key];
  put('level', key);
  [...levelRow.children].forEach(x => x.setAttribute('aria-pressed', x.dataset.lv === key));
  if (started) { newGame(); say(lv.name + '(으)로 바꾸고 처음부터!'); }
  else paint();
});

window.addEventListener('resize', fit);

/* ---------- 시작 ---------- */

key = get('level') || 'easy';
if (!LEVELS[key]) key = 'easy';
lv = LEVELS[key];
[...levelRow.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.lv === key));
best = +get('best') || 0;
lives = lv.lives;

fit();
fit();
startWave(1);
phase = 'ready';
paint();

coverMsg.innerHTML = '👾 우주 침략자 막기<small>손가락으로 우주선을 움직여 막아 내자<br>총은 저절로 나간다<br>5물결마다 👽 우두머리가 온다</small>';
coverBtn.textContent = '시작';
coverEl.classList.add('on');

last = performance.now();
raf = requestAnimationFrame(tick);
</script>
