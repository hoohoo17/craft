<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌 깨기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff7e6;
    color: #2b2b4a;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px; touch-action: none;
  }
  h1 { font-size: 26px; margin-bottom: 6px; letter-spacing: 2px; }
  .hud { display: flex; gap: 24px; font-size: 18px; margin-bottom: 8px; }
  canvas {
    background: #e0f4ff;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    max-width: 100%;
  }
  .msg {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); text-align: center;
  }
  .msg.show { display: flex; }
  .box { background: #fff; color: #2b2b4a; padding: 28px 36px; border-radius: 16px; }
  .box h2 { font-size: 28px; margin-bottom: 10px; }
  .box p { font-size: 18px; margin-bottom: 18px; }
  button {
    font: inherit; font-size: 20px; padding: 10px 26px;
    border: none; border-radius: 10px; background: #ff7a45; color: #fff; cursor: pointer;
  }
  .hint { margin-top: 10px; font-size: 14px; opacity: .7; }
</style>
</head>
<body>
<h1>🧱 벽돌 깨기</h1>
<div class="hud"><span>단계 <b id="level">1</b></span><span>점수 <b id="score">0</b></span></div>
<canvas id="c" width="480" height="560"></canvas>
<div class="hint">← → 키 또는 손가락으로 움직여요. 스페이스로 시작!</div>

<div class="msg" id="msg">
  <div class="box">
    <h2 id="msgTitle"></h2>
    <p id="msgText"></p>
    <button onclick="restart()">다시 하기</button>
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const COLORS = ['#ff6b81','#ffb347','#ffe94d','#5ee27a','#4fc3f7','#b388ff'];
let paddle, ball, bricks, score, level, running, started, keys = {};
const MAX_LEVEL = 8;

function reset() {
  paddle = { w: 90, h: 14, x: W/2 - 45, y: H - 40 };
  score = 0; level = 1; started = false; running = true;
  newBall(); makeBricks(); updateHud();
}
function newBall() {
  ball = { x: paddle.x + paddle.w/2, y: paddle.y - 10, r: 8, dx: 0, dy: 0 };
  started = false;
}
function launch() {
  if (started) return;
  started = true;
  const sp = 5.5 + (level - 1) * 0.7;
  ball.dx = (Math.random() < .5 ? -1 : 1) * sp * 0.8;
  ball.dy = -sp;
}
function makeBricks() {
  bricks = [];
  const rows = 2 + level, cols = 8, bw = 52, bh = 20, gap = 6;
  const startX = (W - (cols*bw + (cols-1)*gap)) / 2;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      bricks.push({ x: startX + c*(bw+gap), y: 60 + r*(bh+gap), w: bw, h: bh, color: COLORS[(r + level) % COLORS.length], alive: true });
}
function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level + ' / ' + MAX_LEVEL;

}
function endGame(win) {
  running = false;
  document.getElementById('msgTitle').textContent = win ? '🎉 8단계 모두 클리어!' : '😵 게임 오버';
  document.getElementById('msgText').textContent = '점수: ' + score;
  document.getElementById('msg').classList.add('show');
}
function restart() { document.getElementById('msg').classList.remove('show'); reset(); }

function update() {
  if (!running) return;
  const speed = 8;
  if (keys['ArrowLeft']) paddle.x -= speed;
  if (keys['ArrowRight']) paddle.x += speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (!started) { ball.x = paddle.x + paddle.w/2; ball.y = paddle.y - 10; return; }

  ball.x += ball.dx; ball.y += ball.dy;
  if (ball.x < ball.r || ball.x > W - ball.r) ball.dx *= -1;
  if (ball.y < ball.r) ball.dy *= -1;

  // paddle
  if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
    const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.dx = hit * 6.5; ball.dy = -Math.abs(ball.dy);
    ball.y = paddle.y - ball.r;
  }
  // bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      b.alive = false; score += 10; updateHud();
      const fromSide = ball.x < b.x || ball.x > b.x + b.w;
      if (fromSide) ball.dx *= -1; else ball.dy *= -1;
      break;
    }
  }
  if (bricks.every(b => !b.alive)) {
    if (level >= MAX_LEVEL) { endGame(true); return; }
    level++; paddle.w = Math.max(60, 90 - (level-1)*4);
    makeBricks(); newBall(); updateHud();
  }

  if (ball.y > H + ball.r) newBall();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) if (b.alive) {
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
  }
  ctx.fillStyle = '#3d5afe'; roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fillStyle = '#ff3d71'; ctx.fill();
  if (!started && running) {
    ctx.fillStyle = 'rgba(43,43,74,.8)'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(level + '단계! 스페이스 또는 탭해서 시작', W/2, H/2);
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') { e.preventDefault(); launch(); } });
addEventListener('keyup', e => keys[e.key] = false);
function pointerMove(clientX) {
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w/2));
}
cv.addEventListener('mousemove', e => pointerMove(e.clientX));
cv.addEventListener('touchmove', e => { e.preventDefault(); pointerMove(e.touches[0].clientX); }, { passive: false });
cv.addEventListener('mousedown', launch);
cv.addEventListener('touchstart', e => { e.preventDefault(); pointerMove(e.touches[0].clientX); launch(); }, { passive: false });

reset(); loop();
</script>
<script src="../rest.js?v=8"></script>
</body>
</html>
