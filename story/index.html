<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>나의 이야기</title>
<style>
  :root{
    --paper:#F3F7EE; --ink:#33402E;
    --accent:#5C8D4E;
    --quote:#4E6B42;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',serif;
    background:#DCE5D2;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px 12px;
    user-select:none;
  }
  .book{
    position:relative;
    width:100%; max-width:520px;
    height:min(78dvh, 680px);
    perspective:1600px;
  }
  .page{
    position:absolute; inset:0;
    background:var(--paper);
    border-radius:8px;
    box-shadow:0 10px 40px rgba(51,64,46,.25);
    padding:38px 28px;
    background-image:repeating-linear-gradient(transparent, transparent 35px, rgba(51,64,46,.05) 36px);
    overflow-y:auto;
    transform-origin:left center;
    transition:transform .45s ease, opacity .45s ease;
    display:flex; flex-direction:column;
    cursor:pointer;
  }
  .pg-inner{margin:auto 0;}
  .page.flip-out{transform:rotateY(-80deg); opacity:0;}
  .page.flip-in-prep{transform:rotateY(60deg); opacity:0; transition:none;}

  .series{
    text-align:center;
    font-size:.85rem; font-weight:800;
    letter-spacing:.35em;
    color:var(--accent);
    margin-bottom:10px;
  }
  h1{
    text-align:center;
    font-size:2rem;
    letter-spacing:.03em;
    margin-bottom:10px;
  }
  .author{
    text-align:center;
    font-size:1.05rem;
    font-weight:800;
    color:var(--quote);
    letter-spacing:.15em;
    margin-bottom:6px;
  }
  .deco{
    text-align:center;
    font-size:1.1rem;
    letter-spacing:.6em;
    color:var(--accent);
    margin:14px 0;
  }
  .hintline{
    text-align:center;
    font-size:.95rem;
    color:var(--quote);
    margin-top:26px;
    animation:breath 2s infinite;
  }
  @keyframes breath{50%{opacity:.4}}
  p{
    font-size:1.1rem;
    line-height:1.95;
    margin-bottom:14px;
    word-break:keep-all;
  }
  p.quote{
    color:var(--quote);
    font-weight:700;
    padding-left:14px;
    border-left:4px solid var(--accent);
  }
  p.turn{
    text-align:center;
    font-weight:900;
    font-size:1.6rem;
    color:var(--accent);
    letter-spacing:.1em;
    margin:18px 0;
  }
  p.list{
    font-size:1.02rem;
    line-height:1.8;
    margin-bottom:8px;
  }
  .chapter{
    text-align:center;
    font-size:.85rem; font-weight:900;
    letter-spacing:.3em;
    color:var(--accent);
    margin-bottom:16px;
  }
  .goal{
    text-align:center;
    font-weight:900;
    font-size:1.5rem;
    color:var(--accent);
    margin:16px 0;
  }
  .ending{
    text-align:center;
    font-weight:900;
    font-size:1.5rem;
    letter-spacing:.5em;
    margin-top:30px;
  }

  .nav{
    display:flex; align-items:center; gap:16px;
    margin-top:14px;
  }
  .nav button{
    font-family:inherit;
    font-size:1.1rem; font-weight:900;
    background:var(--paper); color:var(--ink);
    border:none; border-radius:12px;
    padding:10px 20px;
    box-shadow:0 3px 10px rgba(51,64,46,.2);
    cursor:pointer;
  }
  .nav button:disabled{opacity:.35; cursor:default;}
  .nav button:not(:disabled):active{transform:translateY(2px);}
  .page-num{
    font-weight:900; font-size:1rem;
    color:var(--quote);
    min-width:64px; text-align:center;
  }
  .toc-bg{
    position:fixed; inset:0;
    background:rgba(51,64,46,.5);
    display:none;
    align-items:center; justify-content:center;
    z-index:20;
    padding:20px;
  }
  .toc-bg.show{display:flex;}
  .toc{
    background:var(--paper);
    border-radius:16px;
    padding:24px 20px;
    width:100%; max-width:380px;
    max-height:70dvh;
    overflow-y:auto;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .toc h2{text-align:center; margin-bottom:14px; font-size:1.2rem;}
  .toc-item{
    display:flex; justify-content:space-between; gap:8px;
    width:100%;
    font-family:inherit; font-size:1.05rem; font-weight:800;
    background:none; border:none;
    border-bottom:1px dashed rgba(51,64,46,.2);
    color:var(--ink);
    padding:11px 6px;
    cursor:pointer;
    text-align:left;
  }
  .toc-item:active{background:rgba(92,141,78,.1);}
  .toc-item .pg{color:var(--accent); font-size:.9rem;}
  .toc-close{
    margin-top:14px; width:100%;
    font-family:inherit; font-size:1rem; font-weight:800;
    background:rgba(0,0,0,.07); color:var(--ink);
    border:none; border-radius:10px;
    padding:11px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="book">
  <div class="page" id="page" onclick="tapPage(event)"></div>
</div>
<div class="nav">
  <button id="prev-btn" onclick="go(-1)">◀</button>
  <div class="page-num" id="page-num"></div>
  <button onclick="openToc()">📑 차례</button>
  <button id="next-btn" onclick="go(1)">▶</button>
</div>

<div class="toc-bg" id="toc-bg" onclick="if(event.target===this) closeToc()">
  <div class="toc">
    <h2>📑 차례</h2>
    <div id="toc-list"></div>
    <button class="toc-close" onclick="closeToc()">닫기</button>
  </div>
</div>

<script>
const PAGES = [
  `<h1>나의 이야기</h1>
   <div class="author">글 곽재후</div>
   <div class="deco">✦ ✦ ✦</div>
   <div class="hintline">화면을 탭해서 책장을 넘겨 보세요 👉</div>`,

  `<p>옛날 옛날에 추루룹 씨와 그의 딸 촤르릅이 있었다.</p>
   <p>추루룹 씨는 차추초추의 간장 공장 공장장이었고 뽀파뽀프의 간장 공장 공장장의 간장 공장 공장장이었다.</p>
   <p>그리고 사촌 딸의 이름을 따서 빠푸뽀푸 간장 공장을 지었다.</p>`,

  `<div class="chapter">설날</div>
   <p>그리고 설날에 뽀파뽀프 씨네 집에 놀러 갔다.</p>
   <p>거기에는 추루룹, 촤르릅, 초차초츠, 차추초추, 뽀파뽀프, 빠푸뽀푸가 있었다.</p>
   <p>거기서 차추초추 씨가 가져온 윷놀이를 했다.</p>`,

  `<p>팀은 추루룹, 촤르릅 한 팀, 초차초츠, 차추초추 한 팀, 뽀파뽀프, 빠푸뽀푸 한 팀이었다.</p>
   <p>그리고 관람객은 빠푸뽀푸의 어머니 뿌파뿌포, 촤르릅의 어머니 추르릅이 있었고</p>
   <p>심판은 차추초추의 어머니 초추초추였다.</p>
   <p>경기를 해서 지는 팀이 커피 쏘기였다.</p>`,

  `<p>경기가 시작되었다.</p>
   <p>먼저 추루룹 팀이 윷을 던졌다. 개가 나왔다.</p>
   <p>다음으로 초차초츠 팀이 던졌다. 모가 나왔다!</p>
   <p class="quote">"모다!! 한 번 더!!"</p>`,

  `<p>초차초츠 씨가 너무 신나서 옛날 버릇대로 아들에게 손가락 신호를 보냈다.</p>
   <p class="turn">하지만!</p>
   <p>윷놀이는 신호를 보내도 소용이 없는 게임이었다.</p>
   <p>그때 심판 초추초추가 말했다.</p>
   <p class="quote">"여보, 한 번만 더 신호 보내면 우리 팀이어도 실격입니다."</p>`,

  `<p>뽀파뽀프 팀의 빠푸뽀푸는 던질 때마다 소감을 말해서 경기가 자꾸 길어졌다.</p>
   <p>말들이 잡고 잡히고 업고 뒤집히면서 세 팀은 마지막까지 딱 붙었다.</p>
   <p>그리고 드디어 마지막 윷 하나로 승부가 정해지는 순간이 왔다.</p>`,

  `<p>마지막 윷은 추루룹 씨 차례였다.</p>
   <p>추루룹 씨 팀이 이기려면 딱 "걸"이 나와야 했다.</p>
   <p>추루룹 씨는 손을 부들부들 떨면서 윷을 던졌다.</p>
   <p>윷가락이 빙글빙글 돌면서 하늘 높이 올라갔다.</p>
   <p>모두가 숨을 참고 쳐다봤다.</p>`,

  `<p class="turn">하지만!</p>
   <p>윷가락 하나가 상 위에 있던 간장 종지에 빠져 버렸다.</p>
   <p class="quote">"이... 이건 몇 점입니까, 심판님?"</p>
   <p>심판 초추초추도 이런 건 처음 봤다.</p>
   <p>심판이 고민 끝에 말했다.</p>
   <p class="quote">"간장에 빠진 윷은... 낙이므로 무효! 다시 던지세요!"</p>`,

  `<div class="chapter">간장 종지 사건</div>
   <p>그런데 그때, 촤르릅이 소리쳤다.</p>
   <p class="quote">"잠깐만요! 저 간장 종지, 아까 차추초추 오빠가 슬쩍 올려놨어요!"</p>
   <p>심판 초추초추가 말했다.</p>
   <p class="quote">"CCTV 확인하겠습니다!"</p>`,

  `<p>그때 차추초추가 말했다.</p>
   <p class="quote">"왜 CCTV가 있나요?"</p>
   <p>뽀파뽀프가 말했다.</p>
   <p class="quote">"집집마다 다 있지요."</p>
   <p>CCTV를 확인한 심판이 말했다.</p>
   <p class="quote">"CCTV에 없는데요?"</p>
   <p>뽀파뽀프가 말했다.</p>
   <p class="quote">"왜 그러냐면요, 오늘 전력 수리를 해서......"</p>`,

  `<p class="turn">그럼 적외선 탐지기 출동!!!!</p>
   <p class="quote">"적외선에 증거가 있어요!!!!"</p>
   <p class="quote">"다 범인입니다!!!!"</p>
   <p>하지만 가장 최근에는~</p>
   <p class="quote">"초추초추인데요?"</p>
   <p class="quote">"또 단서가 있네요."</p>
   <p class="quote">"초추초추가 주범이고 빠푸뽀푸랑 뽀파뽀프가 같이 했네요."</p>`,

  `<p class="turn">그래서 초추초추가 쏩니다!!!!!</p>
   <p>그래서 커피/주스도 마시고 헤어졌다.</p>
   <p>그리고 축구를 했다.</p>
   <p>온라인 축구.</p>`,

  `<div class="chapter">온라인 축구</div>
   <p>잉잉을할랑이 만들어서 잉잉을할랑이 심판이다.</p>
   <p>첫 번째 조별리그.</p>
   <p>그리고 이 게임은 아는 사람들이 다 나온다.</p>
   <p>잉잉을할랑이 추첨 버튼을 눌렀다. 조별리그 대진이 발표됐다.</p>`,

  `<p class="list">1조: 뽀파뽀프, 초차초츠, 뾰뿝, 꼴깍꿀</p>
   <p class="list">2조: 빠푸뽀푸, 차추초추, 쀼보부, 뚜두둡</p>
   <p class="list">3조: 추루룹, 홀짝훌, 삐뽀삐, 냠냠냠</p>
   <p class="list">4조: 촤르릅, 쭈룹쭙, 빠바밥, 찌지직</p>
   <p class="list">5조: 초추초추, 콰콰쾅, 뿌부붑, 챠르르</p>
   <p class="list">6조: 뿌파뿌포, 딸깍딱, 쓱싹쓱, 후루룩</p>
   <p class="list">7조: 추르릅, 텀벙텀, 데굴데, 팡파팡</p>
   <p class="list">8조: 꿀꺽꿀, 짭짭짭, 우당탕, 스르륵</p>
   <p class="list">9조: 부릉부, 킁킁킁, 또각또, 촉촉촉</p>
   <p class="list">10조: 헐레벌, 방긋방, 꼬르륵, 쨍그랑</p>`,

  `<p>1조에서는 뽀파뽀프와 초차초츠가 첫 경기부터 만났다.</p>
   <p>초차초츠는 옛날 버릇대로 화면에 대고 손가락 신호를 보냈다.</p>
   <p class="turn">하지만!</p>
   <p>온라인 게임이라 아무도 신호를 볼 수 없었다.</p>
   <p>뽀파뽀프 2 대 1 승리. 뽀파뽀프 조 1등.</p>`,

  `<p>2조에서 빠푸뽀푸는 골 넣을 때마다 소감을 말해서 경기가 세 배로 길어졌다.</p>
   <p class="quote">"제가 넣은 골은 다른 사람들이 넣은 골보다 잘 넣은 골이라고 생각합니다!"</p>
   <p>차추초추는 이번엔 반칙을 안 했다. 다들 놀랐다.</p>
   <p>빠푸뽀푸 1등.</p>`,

  `<p>3조에서 추루룹 씨는 윷놀이의 한을 풀듯이 3전 전승을 했다. 조 1등.</p>
   <p>4조에서 촤르릅이 1등을 했다. 이번에도 눈이 좋아서 상대가 오프사이드인 걸 심판보다 먼저 알아챘다.</p>
   <p>5조에서는 커피를 쐈던 초추초추가 조용히, 정정당당하게 3전 전승을 했다. 모두가 박수를 쳤다.</p>`,

  `<p>6조는 뿌파뿌포가 1등. 딸깍딱은 마우스를 너무 세게 딸깍거리다가 마우스가 부서졌다.</p>
   <p>7조는 추르릅이 1등. 텀벙텀은 골 세리머니로 물에 뛰어드는 흉내를 내다가 의자에서 떨어졌다.</p>
   <p>8조는 우당탕이 이름값을 하며 우당탕탕 1등을 했다.</p>
   <p>9조는 부릉부가 너무 빨라서 아무도 못 잡았다. 1등.</p>
   <p>10조는 꼬르륵이 배고픔을 참고 1등을 했다.</p>`,

  `<p>조별리그가 끝나고 잉잉을할랑이 발표했다.</p>
   <p class="quote">"8강 진출자는 뽀파뽀프, 빠푸뽀푸, 추루룹, 촤르릅, 초추초추, 우당탕, 부릉부, 꼬르륵입니다!"</p>
   <p class="turn">하지만!</p>
   <p>그때 누군가 소리쳤다.</p>
   <p class="quote">"잠깐만요!! 뭔가 이상합니다!! 조 1등이 10명인데 왜 8명만 올라갑니까!!"</p>`,

  `<p>탈락한 두 명의 조 1등, 뿌파뿌포와 추르릅이 항의했다.</p>
   <p>잉잉을할랑이 계산을 다시 해 보니 진짜였다.</p>
   <p class="quote">"죄송합니다... 제가 만든 게임인데 제가 계산을 틀렸네요. 10강으로 하겠습니다!"</p>
   <p class="turn">그래서 10강 시작!</p>
   <p>10강 진출자: 뽀파뽀프, 빠푸뽀푸, 추루룹, 촤르릅, 초추초추, 뿌파뿌포, 추르릅, 우당탕, 부릉부, 꼬르륵!</p>`,

  `<div class="chapter">10강</div>
   <p class="list">1경기: 뽀파뽀프 대 뿌파뿌포 (부부 대결!)</p>
   <p class="list">2경기: 추루룹 대 촤르릅 (부녀 대결!)</p>
   <p class="list">3경기: 빠푸뽀푸 대 초추초추</p>
   <p class="list">4경기: 추르릅 대 우당탕</p>
   <p class="list">5경기: 부릉부 대 꼬르륵</p>`,

  `<p>1경기. 뽀파뽀프 대 뿌파뿌포, 부부 대결이 시작됐다.</p>
   <p>뽀파뽀프가 골을 넣으려는 순간, 뿌파뿌포가 말했다.</p>
   <p class="quote">"여보, 오늘 저녁 반찬 뭐 먹을 거예요?"</p>
   <p>뽀파뽀프가 "어? 간장 계란밥?" 하고 대답하는 사이에 공을 뺏겼다.</p>
   <p>뿌파뿌포 1 대 0 승리. 말 걸기 작전이었다.</p>`,

  `<p>2경기. 추루룹 대 촤르릅, 부녀 대결.</p>
   <p>촤르릅은 눈이 좋아서 아빠가 어디로 찰지 다 보였다.</p>
   <p>촤르릅 3 대 0 완승. 추루룹 씨는 딸에게 져서 기분이 좋으면서도 나빴다.</p>

   <p class="quote">"아니에요!! 저는 훔친 게 아니라 옮긴 거예요! 뾰뿝!"</p>
   <p class="quote">"옮기다니? 누가 시켰는데?!"</p>
   <p>뾰뿝이 대답하려는 순간—</p>
   <p class="turn">하지만!</p>
   <p>누군가 마당으로 뛰어 들어오며 소리쳤다.</p>
   <p class="quote">"잠깐만요!!! 제가 시켰습니다!!!"</p>`,

  `<p>모두가 뒤를 돌아봤다.</p>
   <p>거기 서 있는 사람은 바로...</p>
   <p class="turn">차추초추였다!!</p>
   <p class="quote">"차추초추?! 네가 왜?!"</p>
   <p>차추초추가 숨을 헐떡이며 말했다.</p>
   <p class="quote">"이건 도둑질이 아니라... 깜짝 선물이었어요."</p>
   <p class="quote">"깜짝 선물???"</p>`,

  `<div class="chapter">차추초추의 비밀</div>
   <p>차추초추가 고개를 숙이고 말했다.</p>
   <p class="quote">"저는 그림 대회에서도 반칙하고, 윷놀이에서도 간장 종지로 반칙했어요."</p>
   <p class="quote">"다들 알지."</p>
   <p class="quote">"그래서 사과하고 싶었어요. 제대로."</p>
   <p>차추초추는 용돈을 모아서 뾰뿝이네 트럭을 빌렸다.</p>
   <p>그리고 간장 100통에 몰래 사과 편지를 한 장씩 붙이고 있었던 것이다.</p>
   <p>간장통에는 정말로 편지가 붙어 있었다.</p>
   <p class="quote">"미안했습니다. 이제 정정당당하게 살겠습니다. — 차추초추"</p>`,

  `<p>촤르릅이 물었다.</p>
   <p class="quote">"그럼 그 윷가락은 뭐예요? 공장에 떨어져 있던 거."</p>
   <p>차추초추가 주머니에서 나머지 윷가락 세 개를 꺼냈다.</p>
   <p class="quote">"간장 종지에 빠졌던 윷이에요. 반칙하지 말자고 다짐하려고 갖고 다녔는데... 한 개를 공장에서 흘렸나 봐요."</p>
   <p>모든 수수께끼가 풀렸다.</p>
   <p>온라인 축구에서 차추초추가 반칙을 안 한 이유도 이것이었다.</p>
   <p>차추초추는 진짜로 변하는 중이었던 것이다.</p>`,

  `<p>추루룹 씨가 물었다.</p>
   <p class="quote">"그런데 왜 하필 새벽 4시에 옮겼어?"</p>
   <p class="quote">"깜짝 선물이니까요. 아침에 여러분이 공장 문을 열면, 사과 편지 100장이 짠! 하고 보이게 하려고요."</p>
   <p class="quote">"그래서 우리한테 말을 안 했구나!"</p>
   <p class="quote">"네. 근데 옮기다가 너무 무거워서... 다시 갖다 놓으려고 트럭에 실어 둔 거예요. 뾰뿝이 형이 도와줬어요."</p>
   <p>뾰뿝이 고개를 끄덕였다.</p>
   <p class="quote">"품삯은 떡볶이 세 접시로 받기로 했어요. 뾰뿝!"</p>`,

  `<p>다들 한참 동안 아무 말이 없었다.</p>
   <p>그러다가 초추초추가 아들을 꼭 안아 주었다.</p>
   <p class="quote">"우리 아들, 다 컸네."</p>
   <p>초차초츠도 눈물을 닦으며 말했다.</p>
   <p class="quote">"아빠도 이제 신호 안 보낼게."</p>
   <p>추루룹 씨가 크게 웃으며 말했다.</p>
   <p class="quote">"좋아! 그럼 간장 100통은 다시 공장으로! 사과 편지는 공장 벽에 다 붙이자! 손님들이 보게!"</p>
   <p class="quote">"정말요?!"</p>
   <p class="quote">"그럼! 세상에서 제일 정직한 간장 공장이 되는 거지!"</p>`,

  `<p>그래서 아홉 명과 뾰뿝과 차추초추는 다 같이 간장통을 공장에 다시 옮겼다.</p>
   <p>꼬르륵이 제일 힘이 셌다. 밥을 많이 먹어서였다.</p>
   <p>사과 편지 100장은 공장 벽에 쫙 붙었다.</p>
   <p>빠푸뽀푸 간장 공장은 "사과 편지 공장"으로 유명해져서 손님이 두 배로 늘었다.</p>
   <p>그리고 다 같이 떡볶이를 먹으러 갔다.</p>
   <p>뾰뿝의 품삯 세 접시에, 열 접시를 더 시켰다.</p>
   <p>물론 꼬르륵이 제일 많이 먹었다.</p>`,

  `<p>모두가 웃으며 떡볶이를 먹고 있을 때였다.</p>
   <p>가게 문이 열리더니, 우편배달부가 들어왔다.</p>
   <p class="quote">"추루룹 씨! 촤르릅 양! 여기 계시죠? 편지입니다!"</p>
   <p>금색 봉투에 든 편지였다.</p>
   <p>촤르릅이 봉투를 열었다.</p>
   <p class="quote">"제2회 뾰뿝 쀼보부 네가 그린 기차 위에 기린이 있다 대회에 초대합니다. 이번에는 관객 점수도 진짜로 더합니다. — 주최자"</p>
   <p>다들 서로를 쳐다봤다.</p>
   <p class="turn">그 대회가... 돌아온다!!</p>`,

  `<div class="chapter">제2회 대회</div>
   <p>대회 날이 되었다.</p>
   <p>이번에는 아무도 늦지 않았다. 다들 어제부터 대회장 앞에서 기다렸기 때문이다.</p>
   <p>주최자가 무대에 올라와 말했다.</p>
   <p class="quote">"제2회 뾰뿝 쀼보부 네가 그린 기차 위에 기린이 있다 대회를 시작합니다!"</p>
   <p class="quote">"이번에는 대본도 세 번 확인했고, 관객 조사 기계도 새로 샀습니다!"</p>`,

  `<p>참가자는 다섯 명이었다.</p>
   <p class="list">1번 빠푸뽀푸. 지난 대회 우승자.</p>
   <p class="list">2번 차추초추. 이번엔 정정당당하게 나왔다. 아버지 초차초츠는 아예 집에 있기로 했다.</p>
   <p class="list">3번 촤르릅. 축구 우승자가 그림에도 도전했다.</p>
   <p class="list">4번 잉잉을할랑. 지난 대회 꼴찌의 복수전.</p>
   <p class="list">5번 꼬르륵. 상품이 "떡볶이 1년 무료"라는 소문을 듣고 나왔다.</p>`,

  `<p>그리기 시간 한 시간이 시작되었다.</p>
   <p>빠푸뽀푸는 기차 위에 기린을 그리고, 기린 위에 또 기차를 그렸다.</p>
   <p>차추초추는 아무 속임수 없이 천천히, 정성껏 그렸다.</p>
   <p>촤르릅은 눈이 좋아서 진짜 기린이랑 똑같이 그렸다.</p>
   <p>잉잉을할랑은 밤새 연습한 실력을 다 쏟아부었다.</p>
   <p>꼬르륵은 기린 대신 떡볶이를 실은 기차를 그렸다.</p>
   <p class="quote">"꼬르륵 참가자, 기린은요?"</p>
   <p class="quote">"아 맞다."</p>
   <p>꼬르륵은 급하게 떡볶이 접시 위에 기린을 그렸다.</p>`,

  `<p>한 시간이 끝나고, 소감 말하기 시간이 왔다.</p>
   <p>그런데 그때!</p>
   <p>대회장의 불이 갑자기 꺼졌다.</p>
   <p>암흑 속에서 주최자의 목소리가 들렸다.</p>
   <p class="quote">"저... 정전인 것 같습니다. 침착하세요!"</p>
   <p>잠시 후 불이 다시 켜졌다.</p>
   <p class="turn">하지만!</p>
   <p>무대 위에 있던 그림 다섯 점 중에... 한 점이 사라져 있었다.</p>
   <p>사라진 그림은 바로, 촤르릅의 그림이었다.</p>`,

  `<div class="chapter">사라진 그림</div>
   <p class="quote">"제 그림이 없어졌어요!!"</p>
   <p>촤르릅이 소리쳤다. 대회장이 웅성웅성했다.</p>
   <p>주최자가 진땀을 흘리며 말했다.</p>
   <p class="quote">"치... 침착하세요! 이번엔 CCTV가 있습니다! 정전 대비 배터리도 달았습니다!"</p>
   <p class="quote">"오오오!!"</p>
   <p>드디어 이 세계에서 처음으로 CCTV가 제대로 작동한 순간이었다.</p>`,

  `<p>다들 화면 앞에 모였다.</p>
   <p>정전이 되고 3초 뒤, 화면에 뭔가가 지나갔다.</p>
   <p>그런데 사람이 아니었다.</p>
   <p>네 발로 걷고, 목이 아주아주 길었다.</p>
   <p class="quote">"저건...... 기린?????"</p>
   <p>진짜 기린이었다.</p>
   <p>기린이 촤르릅의 그림을 입에 물고 유유히 걸어 나가고 있었다.</p>
   <p>다들 입이 떡 벌어졌다.</p>
   <p class="quote">"아니, 기린이 왜 대회장에?!"</p>`,

  `<p>그때 꼬르륵이 창밖을 가리켰다.</p>
   <p class="quote">"저기!! 기린이다!!"</p>
   <p>대회장 밖 공원에 진짜 기린이 서 있었다.</p>
   <p>그리고 그 기린은 촤르릅의 그림을 나뭇가지에 걸어 놓고, 물끄러미 바라보고 있었다.</p>
   <p>촤르릅이 조심조심 다가갔다.</p>
   <p class="quote">"저기... 기린아? 그거 내 그림인데......"</p>
   <p>기린이 고개를 숙여 촤르릅을 바라봤다.</p>
   <p>그리고 그림과 촤르릅을 번갈아 봤다.</p>`,

  `<p>촤르릅은 알 것 같았다.</p>
   <p class="quote">"너... 내 그림 속 기린이 너랑 똑같아서 온 거야?"</p>
   <p>기린이 고개를 끄덕끄덕했다.</p>
   <p>알고 보니 근처 동물원에서 산책 나온 기린이었다.</p>
   <p>촤르릅의 그림이 창문 너머로 보였는데, 너무 진짜 같아서 친구인 줄 알고 데려간 것이다.</p>
   <p class="quote">"그림은 대회에 내야 해. 대신... 대회 끝나면 너 보여 줄게. 약속!"</p>
   <p>기린이 아쉬운 듯 그림을 돌려주었다.</p>
   <p>그렇게 그림 도난 사건은 3분 만에 해결되었다.</p>
   <p>이 세계관 역사상 가장 빠른 사건 해결이었다.</p>`,

  `<div class="chapter">소감과 심사</div>
   <p>소감 말하기가 다시 시작되었다.</p>
   <p>빠푸뽀푸가 말했다.</p>
   <p class="quote">"제가 그린 기차 위에 기린 위에 기차 그림은 기차 위에 기린만 그린 그림보다 두 배로 그린 그림이라고 생각합니다!"</p>
   <p>차추초추가 말했다.</p>
   <p class="quote">"저는 이번에 아무 반칙도 안 했습니다. 그게 제일 자랑스럽습니다."</p>
   <p>관객들이 박수를 쳤다.</p>`,

  `<p>촤르릅이 말했다.</p>
   <p class="quote">"제 그림은... 진짜 기린이 친구인 줄 알았던 그림입니다."</p>
   <p>더 말할 필요가 없었다.</p>
   <p>잉잉을할랑이 말했다.</p>
   <p class="quote">"저는 지난 대회에서 18점으로 꼴찌였습니다. 그래서 매일 연습했습니다. 결과보다 그게 자랑스럽습니다."</p>
   <p>꼬르륵이 말했다.</p>
   <p class="quote">"떡볶이는 맛있습니다."</p>`,

  `<p>심사가 시작되었다. 그리고 이번에는!</p>
   <p>관객 점수 기계가 정상 작동했다!!</p>
   <p>주최자가 감격의 눈물을 흘리며 결과를 발표했다.</p>
   <p class="quote">"5위 꼬르륵, 12점. 기린 대신 떡볶이를 그렸기 때문입니다."</p>
   <p class="quote">"4위 빠푸뽀푸, 21점. 기차가 너무 많아서 기린이 안 보였습니다."</p>
   <p class="quote">"3위 차추초추, 24점! 역대 최고 점수를 정정당당하게 받았습니다!"</p>
   <p class="quote">"2위는...... 촤르릅, 29점! 기린이 인정한 그림입니다!"</p>`,

  `<p class="quote">"그럼 1위는......"</p>
   <p>다들 숨을 참았다.</p>
   <p class="goal">"1위, 잉잉을할랑!! 30점 만점!!!"</p>
   <p>대회장이 뒤집어졌다.</p>
   <p>지난 대회 꼴찌가, 매일매일 연습해서, 만점 우승을 한 것이다.</p>
   <p>잉잉을할랑이 트로피를 들고 엉엉 울면서 말했다.</p>
   <p class="quote">"저는 최선을 다해 그렸습니다!! 저를 뽑아 주셔서 감사합니다!!"</p>
   <p>지난 대회에서 했던 소감과 똑같은 말이었다.</p>
   <p>하지만 이번에는, 모두가 일어나서 박수를 쳤다.</p>`,

  `<p>그날 저녁, 다들 떡볶이를 먹으러 갔다.</p>
   <p>5위 상품이 "떡볶이 다섯 접시"여서 꼬르륵도 행복했다.</p>
   <p>그리고 대회장 밖 공원에서는, 기린이 촤르릅과 나란히 앉아 노을을 보고 있었다.</p>`,

  `<div class="chapter">기다랑</div>
   <p>다음 날부터 촤르릅은 약속대로 매일 공원에 갔다.</p>
   <p>기린은 늘 같은 나무 아래에서 촤르릅을 기다렸다.</p>
   <p>촤르릅은 기린에게 이름을 지어 주기로 했다.</p>
   <p class="quote">"음...... 너는 목이 기니까...... 기다랑!"</p>
   <p>기린이 마음에 든다는 듯 고개를 끄덕끄덕했다.</p>
   <p>그렇게 기다랑은 촤르릅의 친구가 되었다.</p>`,

  `<p>그런데 어느 날, 동물원 원장님이 찾아왔다.</p>
   <p class="quote">"저기...... 부탁이 하나 있습니다."</p>
   <p class="quote">"무슨 부탁이요?"</p>
   <p class="quote">"기다랑이가 요즘 밥을 안 먹습니다. 촤르릅 양이 그려 준 그림만 쳐다봐요."</p>
   <p class="quote">"왜요?!"</p>
   <p class="quote">"그림 속 기린이...... 친구인 줄 아는 것 같아요. 기다랑이는 동물원에서 혼자거든요."</p>
   <p>촤르릅은 가슴이 찡했다.</p>
   <p>기다랑이는 그림 속 기린이 진짜 친구가 되기를 바랐던 것이다.</p>`,

  `<p>촤르릅이 결심한 듯 말했다.</p>
   <p class="quote">"그럼...... 친구를 찾아 주면 되잖아요!"</p>
   <p class="quote">"어디서요?! 기린이 흔한 동물이 아닌데요!"</p>
   <p class="turn">하지만!</p>
   <p>촤르릅에게는 든든한 사람들이 있었다.</p>

   <p>간장병이 비어 있었다.</p>
   <p class="quote">"뭐야?! 분명히 가득 채워 왔는데?!"</p>
   <p>옆을 보니, 냠냠냠의 접시에서 간장 냄새가 진하게 났다.</p>
   <p class="quote">"냠냠냠!! 너 설마 내 간장……"</p>
   <p class="quote">"너무 고소해서…… 맛만 본다는 게……"</p>
   <p class="quote">"간장을 병째 마셨다고?!?!"</p>
   <p>추루룹 씨의 요리는 간장 없는 간장 계란밥이 될 위기였다.</p>
   <p>남은 시간은 단 오십구 분.</p>`,

  `<div class="chapter">급속 간장</div>
   <p>추루룹 씨는 눈을 감았다. 그리고 천천히 심호흡을 했다.</p>
   <p class="quote">"침착하자. 나는 누구지?"</p>
   <p class="quote">"간장 공장 공장장의 간장 공장 공장장이다."</p>
   <p class="quote">"간장 공장 공장장의 간장 공장 공장장에게 간장이 없다?"</p>
   <p>추루룹 씨가 눈을 번쩍 떴다.</p>
   <p class="turn">"만들면 되잖아."</p>
   <p class="quote">"네?! 간장은 만드는 데 몇 달이 걸리는데요?!"</p>
   <p class="quote">"보통 간장은 그렇지."</p>`,

  `<p>추루룹 씨는 소매를 걷어붙였다.</p>
   <p>그리고 30년 공장장 인생의 모든 기술을 쏟아붓기 시작했다.</p>
   <p>멸치와 다시마로 국물을 내고, 거기에 소금과 설탕을 넣고, 마지막으로 공장에서 늘 갖고 다니는 비상 메주 가루를 털어 넣었다.</p>
   <p class="quote">"공장장은 언제나 메주 가루를 갖고 다닌다. 그게 공장장이다."</p>
   <p>그런 규칙은 처음 듣지만, 아무튼 멋있었다.</p>
   <p>보글보글. 보글보글.</p>
   <p>십 분 뒤, 냄비 안에는 진짜로 황금빛 급속 간장이 완성되어 있었다.</p>
   <p class="quote">"이건 정식 간장은 아니야. 하지만 오늘 하루만 쓰는, 세상에서 제일 신선한 간장이지."</p>
   <p>추루룹 씨는 그 간장으로 간장 계란밥을 완성했다.</p>`,

  `<div class="chapter">심사</div>
   <p>드디어 심사 시간. 주최자가 다섯 요리를 하나씩 맛봤다.</p>
   <p>냠냠냠의 요리는 세 입 분량밖에 안 남아 있었다. 본인이 다 먹어서.</p>
   <p class="quote">"탈락입니다. 근데 남은 세 입은 맛있네요."</p>
   <p>빠푸뽀푸의 간장 볶음밥은 맛있었지만, 소감이 십오 분이었다.</p>
   <p class="quote">"요리 팔 점, 소감 감점 삼 점."</p>
   <p>추르릅의 잔치국수를 먹은 주최자의 눈이 커졌다.</p>
   <p class="quote">"이건...... 집 맛이다. 백 번 만든 사람의 맛."</p>
   <p>꼬르륵의 간장 떡볶이에는 쨍그랑이 엄지를 두 개 들었다.</p>`,

  `<p>그리고 마지막, 추루룹 씨의 간장 계란밥.</p>
   <p>주최자가 한 숟갈 떠서 입에 넣었다. 아무 말이 없었다.</p>
   <p>두 숟갈. 세 숟갈.</p>
   <p class="quote">"저기...... 심사평을......"</p>
   <p class="quote">"잠깐만요. 지금 말하면 못 먹잖아요."</p>
   <p>주최자는 그릇을 싹 비웠다.</p>
   <p>이제 남은 건 특별 심사위원, 기다랑.</p>
   <p>기다랑은 긴 목을 천천히 숙여서 냄새를 맡았다.</p>
   <p>그리고 딱 두 요리 앞에서 멈췄다.</p>
   <p>추르릅의 잔치국수. 그리고 추루룹 씨의 간장 계란밥.</p>
   <p>부부의 요리 앞에서, 기린의 목이 왔다 갔다 했다.</p>
   <p>대회장이 조용해졌다.</p>
   <p>기다랑의 코가 마침내 한 그릇 앞에 멈췄다.</p>`,

  `<div class="chapter">우승자</div>
   <p>기다랑의 코가 멈춘 곳은...... 추르릅의 잔치국수였다.</p>
   <p>기다랑은 잔치국수를 순식간에 다 먹고, 그릇까지 핥았다.</p>
   <p>주최자가 발표했다.</p>
   <p class="goal">"제3회 간장 요리 대회 우승은, 추르릅!!!"</p>
   <p>대회장에 박수가 터졌다.</p>
   <p>추르릅이 간장 기린 트로피를 들어 올렸다.</p>
   <p>유리 기린 속 간장이 반짝반짝 출렁였다.</p>
   <p class="quote">"매일 하던 요리 그대로 했는데...... 매일 한 게 비법이었나 봐요."</p>`,

  `<p>추루룹 씨는 잠시 조용히 있다가, 아내에게 다가갔다.</p>
   <p>그리고 씩 웃으며 말했다.</p>
   <p class="quote">"졌는데 기분이 좋네. 간장 공장 공장장의 간장 공장 공장장보다 간장을 잘 쓰는 사람이 우리 집에 있었어."</p>
   <p class="quote">"당신 급속 간장도 대단했어요. 그건 나도 못 해요."</p>
   <p class="quote">"그럼 우리 둘이 합치면?"</p>
   <p>두 사람은 서로를 쳐다봤다.</p>
   <p>그렇게 꼬르륵식당의 신메뉴가 정해졌다.</p>
   <p>신메뉴 이름은 "추르릅 잔치국수와 추루룹 간장 계란밥 반반 세트".</p>
   <p>줄여서 "추루룹추르릅 세트"였다.</p>
   <p>주문할 때 이름을 말하다가 혀가 꼬이는 손님이 속출했지만, 맛은 별 여섯 개였다.</p>`,

  `<div class="chapter">차추초추의 고민</div>
   <p>요리 대회가 끝나고 일주일 뒤.</p>
   <p>차추초추가 꼬르륵식당에 왔다.</p>
   <p>그런데 떡볶이를 시켜 놓고 먹지를 않았다.</p>
   <p class="quote">"차추초추야, 무슨 고민 있어?"</p>
   <p>차추초추가 한참 있다가 입을 열었다.</p>
   <p class="quote">"형...... 저도 뭔가 하고 싶어요."</p>
   <p class="quote">"뭔가라니?"</p>
   <p class="quote">"다들 뭔가가 있잖아요. 촤르릅 누나는 좋은 눈, 잉잉을할랑 형은 게임 만들기, 꼬르륵 형은 요리......"</p>
   <p class="quote">"저는 반칙 안 하는 것 말고는...... 잘하는 게 없어요."</p>`,

  `<p>가게 안이 잠깐 조용해졌다.</p>
   <p>그때 꼬르륵이 떡볶이 접시를 내려놓으며 말했다.</p>
   <p class="quote">"차추초추야. 너 사과 편지 백 장 쓴 거 기억나?"</p>
   <p class="quote">"네? 그건 그냥...... 미안해서......"</p>
   <p class="quote">"나 그거 다 읽어 봤다? 백 장이 다 달랐어. 간장통마다 다른 말이 쓰여 있었다고."</p>
   <p class="quote">"받는 사람 생각하면서 쓰다 보니까 그렇게 됐어요."</p>
   <p class="quote">"그거야."</p>
   <p class="quote">"네?"</p>
   <p class="quote">"너는 편지를 잘 써. 마음이 전해지는 편지."</p>
   <p>차추초추의 눈이 조금 커졌다.</p>`,

  `<p>그러고 보니, 공장 벽에 붙은 사과 편지 백 장을 보러 오는 손님들이 아직도 있었다.</p>
   <p>어떤 손님은 편지를 읽고 울었다.</p>
   <p>어떤 손님은 편지를 읽고, 오랫동안 연락 안 하던 친구에게 전화를 걸었다.</p>
   <p>그날 밤, 차추초추는 잠이 안 왔다.</p>
   <p>그리고 다음 날 아침, 결심했다.</p>
   <p class="quote">"편지 가게를 하겠습니다."</p>
   <p class="quote">"편지...... 가게?"</p>
   <p class="quote">"네. 사과하고 싶은데 말로 못 하는 사람들을 위해서, 제가 대신 편지를 써 주는 가게요."</p>
   <p>가게 이름은 금방 정해졌다.</p>
   <p class="turn">"미안해 편지 가게"</p>`,

  `<div class="chapter">1호 손님</div>
   <p>1호 손님은 뜻밖의 인물이었다.</p>
   <p>문을 열고 들어온 사람은...... 아버지, 초차초츠였다.</p>
   <p class="quote">"아버지?! 여긴 왜......"</p>
   <p>초차초츠가 머뭇머뭇하다가 말했다.</p>
   <p class="quote">"편지...... 한 장 부탁하러 왔다."</p>
   <p class="quote">"누구한테 보내는 편진데요?"</p>
   <p class="quote">"너한테."</p>`,

  `<p>차추초추는 아버지를 자리에 앉혔다.</p>
   <p class="quote">"편지는 제가 대신 써 드리는 건데...... 저한테 보내는 편지를 제가 쓸 수는 없잖아요."</p>
   <p class="quote">"그럼 어떡하냐."</p>
   <p class="quote">"말로 하시면 돼요. 제가 받아 적을게요."</p>
   <p>초차초츠는 한참 동안 말이 없었다.</p>
   <p>가게 안에는 시계 소리만 째깍째깍 났다.</p>
   <p>그러다가 초차초츠가 천천히 입을 열었다.</p>
   <p class="quote">"그림 대회 때...... 신호 보낸 거."</p>
   <p class="quote">"네."</p>
   <p class="quote">"그거, 네가 해 달라고 한 적 없었지."</p>
   <p class="quote">"......네."</p>`,

  `<p class="quote">"아빠가 그냥...... 네가 이기는 걸 보고 싶어서. 네 실력을 못 믿어서 그랬다."</p>
   <p>차추초추의 연필이 잠깐 멈췄다.</p>
   <p class="quote">"근데 요리 대회 때 보니까, 다들 지고도 웃더라. 추루룹이도 지고 웃고."</p>
   <p class="quote">"그때 알았다. 아빠가 너한테 이기는 법만 가르치고, 지는 법을 안 가르쳤구나."</p>
   <p class="quote">"미안하다."</p>
   <p class="quote">"그리고...... 반칙 안 하고 정정당당한 지금 네가, 우승했을 때보다 백 배 자랑스럽다."</p>
   <p>차추초추는 고개를 숙인 채 받아 적었다.</p>
   <p>연필이 자꾸 느려졌다. 글씨가 조금 삐뚤빼뚤해졌다.</p>
   <p>눈물이 종이에 떨어졌기 때문이다.</p>`,

  `<p>편지가 완성되었다.</p>
   <p>차추초추는 편지를 봉투에 넣고, 받는 사람 칸에 자기 이름을 적었다.</p>
   <p>그리고 봉투를 자기한테 건넸다.</p>
   <p class="quote">"배달 완료입니다, 손님."</p>
   <p class="quote">"얼마냐."</p>
   <p class="quote">"1호 손님은...... 무료예요."</p>
   <p>부자는 마주 보고 웃었다.</p>`,

  `<p>그날 이후, 미안해 편지 가게에는 소문이 났다.</p>
   <p class="quote">"그 가게 편지를 받으면, 아무리 화가 났던 사람도 운다더라."</p>
   <p>손님이 줄을 서기 시작했다.</p>
   <p>싸운 친구에게, 고마운 선생님에게, 하늘나라 강아지에게.</p>
   <p>차추초추는 매일 밤늦게까지 편지를 썼다.</p>
   <p>반칙왕이라고 불리던 아이는, 이제 마을에서 이렇게 불렸다.</p>
   <p class="turn">"마음 배달부."</p>`,

  `<div class="chapter">부릉부의 배달</div>
   <p>어느 날, 마을에 큰일이 났다.</p>
   <p>꼬르륵식당의 배달 주문이 너무 많아진 것이다.</p>
   <p class="quote">"떡볶이 식기 전에 배달을 못 하겠어!!"</p>
   <p>별 여섯 개 소문이 옆 마을, 그 옆 마을까지 퍼져서 주문이 산더미였다.</p>
   <p>그때 문을 박차고 들어온 사람이 있었다.</p>
   <p class="quote">"제가 하겠습니다."</p>
   <p>부릉부였다.</p>
   <p>온라인 축구에서 너무 빨라서 공보다 먼저 골대에 도착했던, 그 부릉부.</p>`,

  `<p class="quote">"저는 세상에서 제일 빠릅니다. 근데 지금까지 빠른 걸 쓸 데가 없었어요."</p>
   <p class="quote">"축구에서는 너무 빨라서 졌고, 달리기 대회는 이 마을에 없고."</p>
   <p class="quote">"근데 배달은...... 빠를수록 좋은 거잖아요?"</p>
   <p>꼬르륵의 눈이 반짝였다.</p>
   <p class="turn">"채용!!"</p>
   <p>부릉부의 첫 배달. 옆 마을까지 떡볶이 배달.</p>
   <p>보통 삼십 분 걸리는 거리였다.</p>
   <p>부릉부는 사 분 만에 돌아왔다.</p>
   <p class="quote">"다녀왔습니다."</p>
   <p class="quote">"벌써?!?! 떡볶이는?!"</p>
   <p class="quote">"따끈따끈하게 배달 완료입니다."</p>`,

  `<p>손님한테서 전화가 왔다.</p>
   <p class="quote">"저기...... 방금 주문했는데 벌써 왔어요. 혹시 미리 만들어 놓은 건가요?"</p>
   <p class="quote">"아니요, 방금 만든 겁니다. 배달부가 빠른 겁니다."</p>
   <p>소문은 순식간에 퍼졌다.</p>
   <p class="quote">"꼬르륵식당은 주문하면 눈 깜짝할 새에 온다더라!"</p>
   <p>부릉부는 마을의 전설이 되었다.</p>
   <p>그런데 어느 날, 이상한 주문이 들어왔다.</p>
   <p>주문서에는 이렇게 적혀 있었다.</p>
   <p class="quote">"떡볶이 백 인분. 배달 주소: 바다 건너 섬 동물원."</p>`,

  `<div class="chapter">섬 잔치 대작전</div>
   <p class="quote">"바다 건너 섬이요?! 배로 이틀 걸리는 데인데요?!"</p>
   <p class="quote">"떡볶이가 이틀이면...... 떡이 다 불어!!"</p>
   <p>꼬르륵식당에 비상이 걸렸다.</p>
   <p>부릉부가 팔짱을 끼고 말했다.</p>
   <p class="quote">"저는 물 위를 못 달립니다. 딱 한 번 해 봤는데 가라앉았어요."</p>
   <p class="quote">"해 봤다는 게 더 놀랍다......"</p>
   <p>그때 주문서 아래에 작은 글씨가 있는 걸 촤르릅이 발견했다.</p>
   <p class="quote">"이번 주 토요일, 섬 동물원 개원 50년 잔치가 열립니다. 잔치 음식으로 별 여섯 개 떡볶이를 대접하고 싶습니다. — 섬 동물원 원장"</p>
   <p class="quote">"기다래가 살던 그 동물원이다!!"</p>`,

  `<p>작전 회의가 열렸다.</p>
   <p class="quote">"배로 가면 이틀. 떡볶이는 불어 터짐."</p>
   <p class="quote">"그럼 답은 하나야."</p>
   <p>꼬르륵이 주먹을 쥐었다.</p>
   <p class="turn">"가서 만든다!!"</p>
   <p class="quote">"재료를 싣고 가서, 섬에서 바로 만들어서, 따끈따끈하게 대접하는 거야!"</p>
   <p>그렇게 꼬르륵식당 원정대가 꾸려졌다.</p>
   <p class="list">요리 담당 꼬르륵과 우승자 추르릅.</p>
   <p class="list">간장 담당 추루룹 씨.</p>
   <p class="list">배달과 심부름 담당 부릉부.</p>
   <p class="list">그림 간판 담당 촤르릅.</p>
   <p class="list">그리고 트럭과 배 담당, 뾰뿝.</p>
   <p class="quote">"이 조합...... 기린 데리러 갈 때랑 똑같잖아!"</p>`,

  `<p>토요일 아침, 원정대는 섬에 도착했다.</p>
   <p>동물원은 잔치 준비로 북적북적했다.</p>
   <p>그런데 원장님이 나와서 미안한 얼굴로 말했다.</p>
   <p class="quote">"먼 길 와 주셔서 감사합니다. 그런데...... 문제가 하나 생겼습니다."</p>
   <p class="quote">"무슨 문제요?"</p>
   <p class="quote">"잔치 손님이...... 생각보다 많이 왔습니다."</p>
   <p class="quote">"몇 명인데요?"</p>
   <p class="quote">"삼백 명입니다."</p>
   <p class="turn">"저희 재료는 백 인분인데요?!?!"</p>`,

  `<p>원정대는 머리를 맞댔다.</p>
   <p class="quote">"떡을 삼 배로 얇게 썰까?"</p>
   <p class="quote">"그건 떡볶이가 아니라 떡국이야......"</p>
   <p>그때 추르릅이 조용히 손을 들었다.</p>
   <p class="quote">"방법이 있어요. 잔치국수."</p>
   <p class="quote">"국수는 적은 재료로 많은 사람을 먹일 수 있어요. 옛날부터 잔치에 국수를 내는 이유예요."</p>
   <p class="quote">"떡볶이 백 인분에, 제 잔치국수 이백 인분을 더하면......"</p>
   <p class="goal">"삼백 인분!!!"</p>
   <p class="quote">"게다가 여긴 50년 잔치잖아요. 잔치에는 잔치국수죠."</p>
   <p>역시 요리 대회 우승자였다.</p>`,

  `<p class="quote">"국수 재료가 없잖아요! 여기는 섬인데!"</p>
   <p>그때 부릉부가 일어났다.</p>
   <p class="quote">"섬 안에서 구하면 됩니다. 제가 세상에서 제일 빠릅니다."</p>
   <p>부릉부가 출발했다.</p>
   <p class="quote">슈우웅——!!</p>
   <p>국수 가게에서 국수를, 밭에서 애호박을, 바닷가에서 멸치를.</p>
   <p>부릉부는 섬을 세 바퀴 돌았다.</p>
   <p>십일 분 만에 이백 인분 재료가 모였다.</p>`,

  `<p>요리가 시작되었다.</p>
   <p>추루룹 씨는 멸치로 급속 간장 국물을 만들었다. 요리 대회에서 배운 그 기술이었다.</p>
   <p>꼬르륵은 떡볶이 백 인분을 볶고, 추르릅은 국수 이백 인분을 삶았다.</p>
   <p>촤르릅은 간판을 그렸다.</p>
   <p class="quote">"50년 축하 잔치 특별 메뉴: 떡볶이와 잔치국수"</p>
   <p>드디어 잔치가 시작되었다. 삼백 명이 줄을 섰다.</p>
   <p>따끈한 국수와 매콤한 떡볶이가 착착 나갔다.</p>
   <p class="quote">"맛있다!!" "별 여섯 개가 진짜였네!!"</p>`,

  `<p>그리고 잔치의 마지막 손님이 왔다.</p>
   <p>손님은 사람이 아니었다.</p>
   <p>목이 아주아주 긴 손님이 둘.</p>
   <p class="turn">기다랑과 기다래였다.</p>
   <p>50년 잔치의 주인공으로 초대받아, 배를 타고 온 것이다.</p>
   <p>촤르릅이 달려가서 기다랑을 끌어안았다.</p>
   <p>두 기린 앞에는 특별 메뉴가 나왔다.</p>
   <p>아카시아 잎 위에 떡 한 조각씩.</p>
   <p>기린용 떡볶이(안 매운맛)였다.</p>`,

  `<p>해가 질 때까지 잔치는 계속되었다.</p>
   <p>뾰뿝의 트럭 위에 앉아서, 원정대는 노을을 봤다.</p>
   <p class="quote">"우리...... 꽤 대단한 팀 아니야?"</p>
   <p class="quote">"간장도 만들고, 기린도 데려오고, 삼백 명도 먹이고."</p>
   <p>그때 꼬르륵이 말했다.</p>
   <p class="quote">"저 다음 꿈이 생겼어요."</p>
   <p class="quote">"뭔데?"</p>
   <p class="quote">"꼬르륵식당 2호점. 이 섬에요."</p>`,

  `<div class="chapter">편지 도둑</div>
   <p>섬에서 돌아온 다음 날 아침.</p>
   <p>추루룹 씨가 공장 문을 열다가 굳어 버렸다.</p>
   <p>공장 벽에 붙어 있던 사과 편지 백 장 중에......</p>
   <p>딱 한 장이 사라져 있었다.</p>
   <p class="turn">"편지 도둑이다!!!"</p>
   <p>백 장 중에 하필 한 장만 훔쳐 갔다.</p>
   <p>없어진 편지는 벽 한가운데, 37번 편지였다.</p>
   <p>급하게 수사팀이 소집되었다.</p>
   <p>좋은 눈 촤르릅, 적외선 초추초추, 그리고 이번엔 특별 수사관 — 편지를 쓴 본인, 차추초추.</p>`,

  `<p class="quote">"차추초추야, 37번 편지에 뭐라고 썼는지 기억나?"</p>
   <p>차추초추가 눈을 감고 떠올렸다.</p>
   <p class="quote">"기억났어요. 37번엔 이렇게 썼어요."</p>
   <p class="quote">"'미안하다는 말을 못 해서 매일 밤 천장만 봤습니다. 이 편지를 읽는 당신도 그런 사람이라면, 용기 내세요. — 차추초추'"</p>
   <p>다들 조용해졌다.</p>
   <p class="quote">"그러니까...... 이 편지를 훔쳐 간 사람은......"</p>
   <p class="quote">"사과를 못 해서 매일 밤 천장만 보는 사람이다."</p>`,

  `<p>CCTV를 확인했다. 이번에도 정상 작동이었다.</p>
   <p>이제 이 세계 CCTV는 성실해졌다.</p>
   <p>새벽 다섯 시, 화면에 누군가 나타났다.</p>
   <p>그 사람은 편지 앞에 한참을 서 있었다.</p>
   <p>삼십 분 동안 편지를 읽고 또 읽었다.</p>
   <p>그리고 편지를 떼서 품에 안더니, 꾸벅 인사를 하고 갔다.</p>
   <p class="quote">"어? 도둑이 인사를 하고 가네?"</p>
   <p>촤르릅이 화면을 뚫어져라 봤다.</p>
   <p class="quote">"손에 뭘 들고 있어요. 국자예요. 커다란 국자."</p>
   <p>그때 차추초추가 벌떡 일어났다.</p>
   <p class="quote">"저 알 것 같아요. 잔치국수 가게 홀짝훌 아저씨요."</p>`,

  `<div class="chapter">홀짝훌과 훌짝훌</div>
   <p>수사팀은 잔치국수 가게로 향했다.</p>
   <p>그런데 가게 문에 종이가 붙어 있었다.</p>
   <p class="quote">"오늘 쉽니다. 어디 좀 다녀옵니다. — 홀짝훌"</p>
   <p>그때 가게 앞을 지나가던 뾰뿝이 말했다.</p>
   <p class="quote">"홀짝훌 아저씨요? 아침에 제 트럭 타고 항구 갔는데요. 뾰뿝. 배 타러 간댔어요."</p>
   <p class="quote">"배?! 설마......"</p>
   <p class="quote">"네. 바다 건너 섬이요."</p>
   <p>수사팀은 다음 배를 타고 섬으로 쫓아갔다.</p>`,

  `<p>섬에 도착해서 물어물어 찾아간 곳은, 섬 구석의 작은 국수 가게였다.</p>
   <p>가게 이름은 "훌짝훌".</p>
   <p class="quote">"홀짝훌...... 훌짝훌...... 이름이 비슷한데?"</p>
   <p>가게 안을 들여다보니, 홀짝훌 아저씨가 어떤 할아버지 앞에 서 있었다.</p>
   <p>두 사람은 얼굴이 똑 닮아 있었다.</p>
   <p>홀짝훌 아저씨가 떨리는 손으로 편지를 내밀었다.</p>
   <p class="quote">"형님...... 이거."</p>
   <p>훌짝훌 할아버지가 편지를 읽었다. 37번 편지였다.</p>`,

  `<p>알고 보니 두 사람은 형제였다.</p>
   <p>삼십 년 전, 아버지의 국수 가게를 물려받는 문제로 크게 싸우고, 동생 홀짝훌은 육지로 떠났다.</p>
   <p>그 뒤로 한 번도 안 만났다.</p>
   <p class="quote">"지난주에 섬 잔치에서 국수 냄새를 맡았습니다. 형님 국수 냄새였어요. 삼십 년이 지나도 알겠더라고요."</p>
   <p class="quote">"그날부터 잠이 안 왔습니다. 그러다가 공장 벽의 편지를 봤고......"</p>
   <p class="quote">"편지를 살 수도 있었는데, 그건 파는 게 아니라길래...... 훔쳤습니다. 죄송합니다."</p>
   <p class="quote">"근데 이 편지가 없으면 용기가 안 날 것 같았습니다."</p>`,

  `<p>훌짝훌 할아버지는 한참 동안 편지만 보고 있었다.</p>
   <p>그러더니 말없이 주방으로 들어갔다.</p>
   <p>그리고 잠시 후, 국수 두 그릇을 들고나왔다.</p>
   <p class="quote">"먹어라."</p>
   <p class="quote">"형님......"</p>
   <p class="quote">"삼십 년 치 국수, 오늘부터 갚을 테니까. 앉아라."</p>
   <p>형제는 마주 앉아 국수를 먹었다.</p>
   <p>홀짝훌. 훌짝훌.</p>
   <p>국수 먹는 소리인지 우는 소리인지 모를 소리가 가게에 가득했다.</p>`,

  `<p>수사팀은 문밖에서 조용히 지켜보다가, 그냥 돌아가기로 했다.</p>
   <p class="quote">"편지 도둑 사건, 종결?"</p>
   <p class="quote">"종결. 범인은...... 무죄."</p>
   <p>돌아오는 배에서 차추초추가 말했다.</p>
   <p class="quote">"저 편지 가게 하길 잘한 것 같아요."</p>
   <p>며칠 뒤, 공장 벽 37번 자리에는 새 편지가 붙었다.</p>
   <p class="quote">"37번 편지 덕분에 형을 되찾았습니다. 빌려 간 용기, 여기 갚습니다. — 홀짝훌"</p>
   <p>그리고 그 옆에는 작은 쪽지가 하나 더 붙어 있었다.</p>
   <p class="quote">"국수 두 그릇 무료 쿠폰 (형제 가게 어디서나 사용 가능)"</p>`,

  `<div class="chapter">벽 속의 그림</div>
   <p>꼬르륵식당 2호점 공사가 시작되었다.</p>
   <p>자리는 섬 항구 앞, 오래된 빈 건물이었다.</p>
   <p>다 같이 벽지를 뜯고 청소를 하던 중, 촤르릅이 소리쳤다.</p>
   <p class="quote">"여기 뭐가 있어요!!"</p>
   <p>벽지 뒤에서 나온 것은, 아주아주 오래된 그림 한 점이었다.</p>
   <p>그림에는 기차가 달리고 있었다.</p>
   <p>그리고 기차 지붕 위에...... 기린이 타고 있었다.</p>
   <p class="quote">"이거...... 기차 위에 기린이잖아?!"</p>
   <p class="quote">"대회 이름이랑 똑같아!!"</p>
   <p>그림 구석에는 작은 글씨로 이름이 적혀 있었다.</p>
   <p class="turn">"쀼보부."</p>`,

  `<p class="quote">"쀼보부?! 대회 이름에 나오는 그 쀼보부?!"</p>
   <p>대회의 정식 이름은 "뾰뿝 쀼보부 네가 그린 기차 위에 기린이 있다 대회".</p>
   <p>뾰뿝은 트럭 아저씨인데, 쀼보부가 누군지는 아무도 몰랐다.</p>
   <p>주최자한테 전화를 걸었다.</p>
   <p class="quote">"주최자님! 쀼보부가 누구예요?!"</p>
   <p>전화기 너머에서 주최자가 숨을 헉 들이켰다.</p>
   <p class="quote">"쀼보부 님을...... 찾았습니까?"</p>
   <p class="quote">"그림을 찾았어요! 섬 건물 벽 속에서요!"</p>
   <p class="quote">"지금 갑니다. 배 타고 갑니다. 아니, 헤엄쳐서라도 갑니다."</p>`,

  `<p>주최자는 진짜로 그날 배를 타고 왔다.</p>
   <p>그리고 그림 앞에 서더니, 모자를 벗고 꾸벅 인사를 했다.</p>
   <p class="quote">"이 그림이...... 모든 것의 시작입니다."</p>
   <p class="quote">"쉰 해 전, 이 섬에 기차가 다녔습니다. 그리고 동물원에서 기린 한 마리가 탈출한 날......"</p>
   <p class="quote">"기린이 하필 달리는 기차 지붕 위로 올라갔습니다."</p>
   <p class="quote">"네?! 기린이 왜요?!"</p>
   <p class="quote">"높은 데를 좋아했나 보죠. 기린이니까."</p>
   <p class="quote">"그때 기차를 운전하던 기관사가 뾰뿝 할아버지, 지금 뾰뿝 씨의 할아버지였습니다."</p>`,

  `<p class="quote">"그리고 그 광경을 보고 너무 놀라서 소리친 사람이 있었습니다."</p>
   <p class="turn">"네가 그린 기차 위에 기린이 있다!!!"</p>
   <p class="quote">"......네? 그게 무슨 말이에요?"</p>
   <p class="quote">"그 사람이 바로 화가 쀼보부였습니다. 쀼보부 님은 그날 아침, 기차 위에 기린이 있는 그림을 그렸거든요."</p>
   <p class="quote">"자기가 아침에 그린 그림이, 오후에 진짜로 일어난 겁니다."</p>
   <p>대회 이름의 비밀이 쉰 해 만에 풀렸다.</p>`,

  `<div class="chapter">쀼보부를 찾아서</div>
   <p class="quote">"그래서 쀼보부 님은 지금 어디 계신데요?"</p>
   <p>주최자가 고개를 저었다.</p>
   <p class="quote">"모릅니다. 그 그림을 남기고 어느 날 사라지셨습니다. 쉰 해 동안 아무도 못 봤습니다."</p>
   <p class="quote">"제1회 대회는 사실, 쀼보부 님을 찾으려고 만든 대회였습니다."</p>
   <p class="quote">"그분 이름을 대회에 넣으면, 어디선가 소문을 듣고 나타나실 줄 알았습니다."</p>
   <p class="quote">"그래서 대회 이름이 그렇게 길었구나......"</p>`,

  `<p>다들 그림을 다시 봤다.</p>
   <p>그때, 좋은 눈 촤르릅이 그림에 얼굴을 바짝 붙였다.</p>
   <p class="quote">"잠깐만요. 이 그림...... 구석에 있는 이 바다색, 물감이 아직 덜 말랐어요."</p>
   <p class="quote">"뭐?! 쉰 해 된 그림인데?!"</p>
   <p class="quote">"쉰 해 된 그림이 아니에요. 이 부분은...... 최근에 누가 덧그린 거예요."</p>
   <p>가게 안이 얼어붙었다.</p>
   <p class="quote">"쀼보부 님이 살아 계시고, 최근에 여기 왔다는 거예요. 이 건물에, 자기 그림을 돌보러."</p>`,

  `<p>그때 뾰뿝이 천천히 손을 들었다.</p>
   <p class="quote">"저...... 이 건물을 저희한테 빌려준 할아버지요. 계약서를 쓰는데 이름을 안 쓰고 그림을 그리셨어요. 뾰뿝."</p>
   <p class="quote">"무슨 그림?"</p>
   <p class="quote">"기린 그림이요. 조그맣게. 도장 대신이라고."</p>
   <p class="quote">"그 할아버지 지금 어디 계셔?!"</p>
   <p class="quote">"매일 저녁에 항구 방파제에서 노을 그리세요. 뾰뿝."</p>
   <p>다들 방파제로 달려갔다.</p>`,

  `<p>노을 지는 방파제 끝에, 조그만 의자에 앉아 그림을 그리는 할아버지가 있었다.</p>
   <p>이젤 위 그림에는 노을, 바다, 그리고 저 멀리 동물원의 기린 두 마리가 담겨 있었다.</p>
   <p>주최자가 떨리는 목소리로 불렀다.</p>
   <p class="quote">"쀼...... 쀼보부 님?"</p>
   <p>할아버지가 천천히 돌아봤다.</p>
   <p class="quote">"그 이름을 아직 기억하는 사람이 있네."</p>
   <p class="quote">"쉰 해 동안 찾았습니다!! 대회도 만들었습니다!! 이름에 넣었습니다!!"</p>
   <p class="quote">"알고 있네."</p>
   <p class="quote">"네?! 알고 계셨어요?! 근데 왜 안 나타나셨어요?!"</p>`,

  `<p>쀼보부 할아버지가 붓을 내려놓고 말했다.</p>
   <p class="quote">"그날 이후로 사람들이 자꾸 물었네. '다음엔 무슨 그림이 진짜가 되나요?' 하고."</p>
   <p class="quote">"내 그림이 신기해서 보는 거지, 그림이 좋아서 보는 게 아니었어."</p>
   <p class="quote">"그래서 아무도 나를 모르는 데서, 그냥 그리고 싶은 걸 그리며 살았네."</p>
   <p class="quote">"근데 얼마 전에 말이야. 동물원 잔치에서 국수를 먹는데, 어떤 아이가 그린 간판이 보이더군."</p>
   <p>촤르릅의 눈이 커졌다.</p>
   <p class="quote">"그거...... 제가 그렸는데요."</p>
   <p class="quote">"그래. 그 간판을 보고 알았네. 아, 이 마을엔 그림을 그림으로 봐 주는 사람들이 아직 있구나."</p>`,

  `<p>주최자가 무릎을 꿇을 기세로 말했다.</p>
   <p class="quote">"제4회 대회 심사위원을...... 맡아 주시겠습니까?!"</p>
   <p>쀼보부 할아버지가 노을을 보며 한참 있다가, 씩 웃었다.</p>
   <p class="quote">"한 가지 조건이 있네."</p>
   <p class="quote">"뭐든지요!!"</p>
   <p class="quote">"대회 이름 좀 줄여 주게. 쉰 해 동안 너무 길었어."</p>`,

  `<div class="chapter">그린 대회</div>
   <p>대회 이름을 줄이는 회의가 열렸다.</p>
   <p>마을 사람들이 다 모였다. 이름 후보가 쏟아졌다.</p>
   <p class="quote">"그냥 '기린 대회'는 어때요?"</p>
   <p class="quote">"쉰 해 역사가 사라지잖아!"</p>
   <p class="quote">"'뾰쀼기기 대회'는요? 뾰뿝, 쀼보부, 기차, 기린 앞 글자."</p>
   <p class="quote">"암호 같아......"</p>
   <p>세 시간째 결론이 안 났다.</p>
   <p>그때 쀼보부 할아버지가 조용히 말했다.</p>
   <p class="quote">"'그린 대회'는 어떤가. '네가 그린'의 그린. 그림 그린 것도 그린."</p>
   <p class="goal">"찬성!!!"</p>
   <p>쉰 해 만에 대회 이름이 두 글자가 되었다.</p>`,

  `<p>제4회 그린 대회가 발표되었다.</p>
   <p>이번 주제는 역대 최고로 자유로웠다.</p>
   <p class="quote">"네가 그리고 싶은 것을 그려라."</p>
   <p>심사위원: 쀼보부. 참가 자격: 누구나.</p>
   <p>그러자 역대 최다 인원이 몰렸다.</p>
   <p>참가자 명단에는 아는 이름이 줄줄이 있었다.</p>
   <p>빠푸뽀푸, 차추초추, 잉잉을할랑, 꼬르륵, 그리고 촤르릅.</p>
   <p>그런데 명단 맨 끝에, 아무도 예상 못 한 이름이 하나 있었다.</p>
   <p class="turn">참가자 마지막 번호: 추루룹.</p>
   <p class="quote">"아빠?!?! 아빠가 그림 대회를 왜 나가?!"</p>
   <p class="quote">"요리 대회에서 배웠거든. 지는 것도 재밌더라. 그리고 아빠가 그리고 싶은 게 하나 생겼어."</p>`,

  `<p>대회 날, 그리기 두 시간이 시작되었다.</p>
   <p>참가자가 너무 많아서 항구 광장에서 열렸다.</p>
   <p>바다를 등지고, 백 개의 이젤이 늘어섰다.</p>
   <p>빠푸뽀푸는 "소감 말하는 자기 모습"을 그렸다. 그림 속 자기도 입을 벌리고 있었다.</p>
   <p>차추초추는 편지 쓰는 손을 그렸다.</p>
   <p>잉잉을할랑은 자기가 만든 축구 게임 화면을 그렸다.</p>
   <p>꼬르륵은 김이 모락모락 나는 떡볶이를 그렸다. 너무 진짜 같아서 지나가던 사람이 냄새를 맡았다.</p>
   <p>촤르릅은 두 기린이 코를 맞대는 순간을 그렸다. 항구에서 봤던 그 장면이었다.</p>
   <p>그리고 추루룹 씨는...... 아무도 안 보여 주고 이젤을 돌려놓은 채 그렸다.</p>`,

  `<p>심사 시간이 되었다.</p>
   <p>쀼보부 할아버지가 그림 사이를 천천히 걸었다.</p>
   <p>점수판도, 수첩도 없었다.</p>
   <p>그냥 한 점 한 점, 오래오래 봤다.</p>
   <p>그리고 마지막, 추루룹 씨의 이젤 앞에 섰다.</p>
   <p>이젤이 돌아갔다. 사람들이 웅성거렸다.</p>
   <p>그림 속에는...... 오늘의 항구 광장이 그대로 있었다.</p>
   <p>백 개의 이젤, 그림 그리는 마을 사람들, 소감 연습하는 빠푸뽀푸, 냄새나는 떡볶이 그림 앞의 행인까지.</p>
   <p>그리고 그림 한가운데에는, 그림 사이를 걷고 있는 쀼보부 할아버지가 있었다.</p>`,

  `<p class="quote">"제목이 뭔가?"</p>
   <p class="quote">"'네가 그린 것을 보는 사람'입니다."</p>
   <p class="quote">"쉰 해 전에는 할아버지가 그린 그림이 진짜가 됐다면서요. 오늘은 반대로 해 봤습니다. 진짜를 통째로 그림에 넣었어요."</p>
   <p class="quote">"이 그림 속에는 오늘 여기서 그림을 그린 우리 전부가 있습니다."</p>
   <p>쀼보부 할아버지는 그 그림을 아주 오래 봤다.</p>
   <p>그리고 관객들을 향해 돌아서서 말했다.</p>
   <p class="quote">"쉰 해 만에 심사를 하러 왔는데, 미안하게 됐네. 우승자를 못 정하겠어."</p>
   <p class="quote">"저 그림 속에 다 있잖나. 오늘 그린 사람 전부."</p>
   <p class="quote">"그러니 제4회 그린 대회의 우승은—"</p>
   <p class="goal">"전원이네."</p>`,

  `<p>광장이 뒤집어졌다.</p>
   <p>역대 대회 사상 처음으로, 참가자 전원 우승이었다.</p>
   <p>주최자가 울면서 소리쳤다.</p>
   <p class="quote">"트로피가 하나뿐인데요!!!"</p>
   <p>그러자 유리 장인 쨍그랑이 앞으로 나섰다.</p>
   <p class="quote">"제가 백 개 만들겠습니다. 아주 조그만 걸로."</p>
   <p>그렇게 한 달 뒤, 참가자 전원에게 새끼손가락만 한 유리 기린이 배달되었다.</p>
   <p>속에는 간장이 딱 한 방울씩 들어 있었다.</p>
   <p>마을 사람들은 그걸 창가에 올려놓았다.</p>
   <p>저녁마다 노을이 지면, 집집마다 창가에서 조그만 기린들이 반짝였다.</p>`,

  `<div class="chapter">2호점 개업식</div>
   <p>드디어 꼬르륵식당 2호점 개업 날이 왔다.</p>
   <p>벽 속에서 나온 쀼보부 할아버지의 그림은 액자에 넣어 가게 한가운데에 걸렸다.</p>
   <p>2호점의 자랑이었다.</p>
   <p>개업식에는 육지에서 배 세 척을 타고 다들 건너왔다.</p>
   <p>훌짝훌 할아버지도 옆 가게에서 국수를 삶으며 축하했다.</p>
   <p>형제 가게는 이제 벽을 뚫어서 서로 오갈 수 있게 되어 있었다.</p>
   <p>그런데 개업식 테이프를 자르려는 순간—</p>
   <p class="turn">하지만!</p>
   <p>하늘이 갑자기 어두워졌다.</p>
   <p class="quote">우르릉. 쿠구궁.</p>
   <p class="quote">"태풍이다!!!"</p>`,

  `<p>섬 스피커에서 방송이 나왔다.</p>
   <p class="quote">"주민 여러분, 태풍이 예상보다 빨리 옵니다. 오늘 밤 배가 모두 끊깁니다."</p>
   <p class="quote">"뭐?! 그럼 육지 사람들은 못 돌아가잖아!!"</p>
   <p>백 명이 넘는 손님이 섬에 갇히게 생겼다.</p>
   <p>그때 꼬르륵이 앞으로 나섰다.</p>
   <p class="quote">"여러분!! 걱정 마세요!! 여기는 식당입니다. 그리고 오늘은 개업 날입니다."</p>
   <p class="quote">"재료는 잔뜩 있고, 옆에는 국수 가게가 있고, 태풍은...... 언젠가 지나갑니다."</p>
   <p class="quote">"그러니까 오늘 밤은— 전원, 우리 가게에서 재워 드립니다!!! 밥도 무제한!!!"</p>
   <p class="goal">"와아아아!!!"</p>`,

  `<p>그렇게 역사상 가장 긴 개업식이 시작되었다.</p>
   <p>밖에서 태풍이 우르릉거리는 동안, 가게 안은 떡볶이 냄새와 국수 김으로 따뜻했다.</p>
   <p>잉잉을할랑은 노트북으로 즉석 게임 대회를 열었다.</p>
   <p>빠푸뽀푸는 한 명 한 명에게 소감을 시켰다. 백 명의 소감은 새벽까지 이어졌다.</p>
   <p>차추초추는 종이를 꺼내 놓고 "태풍이 끝나면 보내고 싶은 편지"를 받아 적어 줬다.</p>
   <p>쀼보부 할아버지는 창밖 태풍을 그렸다.</p>
   <p class="quote">"태풍도 그려 놓으면 추억이 되지."</p>`,

  `<p>새벽 세 시쯤, 아이들이 하나둘 잠들었다.</p>
   <p>촤르릅도 아빠 어깨에 기대 잠들었다.</p>
   <p>추루룹 씨는 딸을 안고 창밖을 봤다.</p>
   <p>그리고 옆에 앉은 뽀파뽀프에게 조용히 말했다.</p>
   <p class="quote">"설날에 윷 던지다가 간장 종지 사건 난 게 엊그제 같은데."</p>
   <p class="quote">"그러게. 그게 시작이었지."</p>
   <p class="quote">"그 뒤로 참 별일이 다 있었어."</p>
   <p>두 사촌은 잠든 마을 사람들을 둘러봤다.</p>
   <p>태풍 속 식당 안에서, 백 명이 넘는 사람들이 서로 어깨를 빌려주며 자고 있었다.</p>
   <p class="quote">"근데 추루룹아. 다음 설날에...... 윷놀이 또 할 거지?"</p>
   <p>추루룹 씨가 씩 웃었다.</p>
   <p class="quote">"당연하지. 이번엔 간장 종지 백 개 깔아 놓고 하자."</p>`,

  `<div class="chapter">수리 삼총사</div>
   <p>태풍이 지나간 다음 날 아침.</p>
   <p>섬은 엉망이 되어 있었다.</p>
   <p>지붕이 날아가고, 나무가 쓰러지고, 동물원 울타리도 부서졌다.</p>
   <p>사람도 기린도 다행히 무사했다.</p>
   <p>하지만 문제가 하나 있었다.</p>
   <p class="quote">"물이 안 나와요!!"</p>
   <p>태풍에 섬의 물탱크가 부서진 것이다.</p>
   <p>물이 없으면 요리도, 청소도, 아무것도 못 한다.</p>
   <p class="quote">"육지에서 수리공을 불러야 하는데, 배가 아직......"</p>`,

  `<p>그때, 부서진 물탱크 앞에 낯선 세 사람이 나타났다.</p>
   <p class="quote">"부수는 건 제 전문입니다. 콰콰쾅입니다."</p>
   <p class="quote">"아니, 지금 부서져서 문제인데요?!"</p>
   <p class="quote">"제대로 부숴야 제대로 고칩니다. 부서진 부분을 깔끔하게 떼어 내야 새 걸 붙이죠."</p>
   <p class="quote">"물은 제 전문입니다. 촉촉촉입니다. 저는 물이 어디서 새는지 소리만 듣고도 압니다."</p>
   <p>세 번째 사람은 아무 말 없이 씩 웃기만 했다.</p>
   <p class="quote">"저분은요?"</p>
   <p class="quote">"방긋방입니다. 말은 없는데...... 저 사람이 웃으면서 옆에 있으면 이상하게 일이 빨리 끝납니다."</p>
   <p>알고 보니 세 사람은 섬을 돌아다니며 부서진 것을 고치는 수리 삼총사였다.</p>`,

  `<p>수리가 시작되었다.</p>
   <p class="quote">콰콰쾅!!</p>
   <p>부서진 부분이 깔끔하게 떨어져 나갔다.</p>
   <p>촉촉촉이 물탱크에 귀를 댔다.</p>
   <p class="quote">"여기, 여기, 그리고 저 밑에. 세 군데 샙니다."</p>
   <p>방긋방은 옆에서 방긋방긋 웃었다. 그러자 이상하게 다들 힘이 났다.</p>
   <p>부릉부는 부품을 나르고, 뾰뿝은 트럭으로 물을 실어 오고, 꼬르륵은 일꾼들 밥을 했다.</p>
   <p>반나절 만에 물탱크가 고쳐졌다.</p>
   <p class="goal">콸콸콸!! 물이 다시 나왔다.</p>`,

  `<p>그날 저녁, 수리 삼총사는 꼬르륵식당 2호점의 첫 단골이 되었다.</p>
   <p>계산을 하려는데 꼬르륵이 손을 저었다.</p>
   <p class="quote">"섬을 고쳐 주셨는데 무슨 돈입니까. 평생 반값입니다."</p>
   <p>그러자 방긋방이 처음으로 입을 열었다.</p>
   <p class="quote">"그럼...... 평생 오겠습니다."</p>
   <p>다들 깜짝 놀랐다.</p>
   <p class="quote">"말...... 할 줄 아셨어요?!"</p>
   <p class="quote">"네. 근데 웃는 게 더 빨라서요."</p>`,

  `<div class="chapter">설날 준비</div>
   <p>태풍의 계절이 지나고, 마을에 찬 바람이 불기 시작했다.</p>
   <p>설날이 다가오고 있었다.</p>
   <p>그런데 올해 설날은 뭔가 달랐다.</p>
   <p>추루룹 씨와 뽀파뽀프가 마을 회관에 커다란 종이를 붙였기 때문이다.</p>
   <p class="turn">"제1회 온 마을 설날 대윷놀이 — 참가 자격: 전원"</p>
   <p class="quote">"작년엔 우리 가족끼리 했지만, 올해는 다 같이 합시다!"</p>
   <p>마을이 들썩였다. 준비할 게 산더미였다.</p>`,

  `<p>먼저, 장소. 백 명이 넘게 모일 곳이 필요했다.</p>
   <p>수리 삼총사가 나섰다. 콰콰쾅이 마을 회관의 낡은 벽을 시원하게 텄고, 방긋방이 웃는 동안 공사가 이틀 만에 끝났다.</p>
   <p>다음, 초대형 윷판. 촤르릅이 광장 바닥에 그렸다. 쀼보부 할아버지가 옆에서 훈수를 뒀다.</p>
   <p class="quote">"말 자리는 더 크게. 사람이 직접 말이 될 거니까."</p>
   <p class="quote">"사람이 말이 돼요?!"</p>
   <p class="quote">"백 명이 노는데 작은 말로 되겠나. 사람이 윷판 위를 걸어 다녀야지."</p>`,

  `<p>다음, 초대형 윷. 이건 나무꾼 꿀꺽꿀과 목수 뚜두둡이 맡았다.</p>
   <p>산에서 제일 곧은 나무로, 어린이 팔뚝만 한 윷가락 네 개가 만들어졌다.</p>
   <p>던지기 연습을 하던 우당탕이 자기 발등에 떨어뜨렸다. 역시 우당탕이었다.</p>
   <p>다음, 음악. 마을 밴드가 결성되었다.</p>
   <p>드럼 빠바밥, 기타 찌지직, 트라이앵글 딸깍딱, 나팔 팡파팡.</p>
   <p>밴드 이름은 "빠찌딸팡"이었다. 밴드 이름 회의만 사흘 걸렸다.</p>`,

  `<p>다음, 음식. 꼬르륵식당 총출동에, 홀짝훌·훌짝훌 형제의 국수, 그리고 새 얼굴 — 만두 가게 짭짭짭과 식혜 명인 후루룩이 합류했다.</p>
   <p>시식회 날, 냠냠냠이 시식 담당을 자원했다.</p>
   <p class="quote">"시식은 제 인생 최고의 특기입니다."</p>
   <p class="quote">"너무 잘하는 게 문제야. 남겨."</p>
   <p>다음, 안전 담당. 소방관 삐뽀삐가 맡았다.</p>
   <p class="quote">"윷놀이에 무슨 소방관이 필요해요?"</p>
   <p class="quote">"이 마을은 무슨 일이든 터지잖아요. 저는 준비돼 있겠습니다."</p>
   <p>반박할 수 없었다.</p>`,

  `<p>다음, 진행. 사회는 당연히 주최자.</p>
   <p class="quote">"이번엔 계산 실수 안 하겠습니다. 계산 담당을 따로 뽑았거든요."</p>
   <p>계산 담당은 은행원 또각또였다. 주판을 또각또각 튕기는 소리가 시원했다.</p>
   <p>마지막으로, 심판. 다들 한 사람을 쳐다봤다.</p>
   <p>초추초추였다.</p>
   <p class="quote">"저...... 저요? 저 작년에 간장 종지 주범이었는데요?"</p>
   <p>추루룹 씨가 씩 웃으며 말했다.</p>
   <p class="quote">"그러니까 심판이지. 반칙을 해 본 사람이 반칙을 제일 잘 잡아."</p>
   <p class="quote">"게다가 올해는 정정당당 그 자체잖아. 축구 대회 때 다 봤어."</p>
   <p>초추초추는 심판 모자를 받아 들고, 조금 울 뻔했다.</p>
   <p>이제 남은 건 설날뿐이었다.</p>`,

  `<div class="chapter">온 마을 대윷놀이</div>
   <p>설날 아침이 밝았다.</p>
   <p>광장에는 눈이 소복이 쌓여 있었다.</p>
   <p>마을 사람들이 눈을 쓸고, 바닥의 초대형 윷판이 드러났다.</p>
   <p>밴드 빠찌딸팡의 연주와 함께, 주최자가 무대에 올랐다.</p>
   <p class="turn">"제1회 온 마을 설날 대윷놀이를 시작합니다!!"</p>
   <p class="quote">"참가 팀은 총 다섯 팀! 각 팀은 던지는 사람과 말이 되는 사람들로 이루어집니다!"</p>`,

  `<p>팀 발표가 이어졌다.</p>
   <p class="list">간장 공장 팀. 대표 추루룹. 촤르릅, 추르릅, 뾰뿝, 쨍그랑.</p>
   <p class="list">식당 팀. 대표 꼬르륵. 홀짝훌, 훌짝훌, 짭짭짭, 후루룩, 냠냠냠.</p>
   <p class="list">빠른 팀. 대표 부릉부. 우당탕, 헐레벌, 스르륵, 데굴데.</p>
   <p class="list">만들기 팀. 대표 잉잉을할랑. 꿀꺽꿀, 뚜두둡, 수리 삼총사.</p>
   <p class="list">소감 팀. 대표 빠푸뽀푸. 뽀파뽀프, 뿌파뿌포, 차추초추, 초차초츠.</p>
   <p class="quote">"소감 팀은 이름부터 불안한데......"</p>
   <p>관중석에는 육지와 섬에서 온 사람들이 가득했다.</p>
   <p>배를 타고 온 기다랑과 기다래도 광장 가장 좋은 자리에서 목을 쭉 빼고 구경했다.</p>`,

  `<p>심판 초추초추가 호루라기를 불었다.</p>
   <p class="turn">삑——!! "정정당당하게! 시작!!"</p>
   <p>첫 윷은 간장 공장 팀, 촤르릅이 던졌다.</p>
   <p>팔뚝만 한 윷가락이 하늘 높이 날았다. 빙글빙글, 눈발 사이로.</p>
   <p class="goal">걸!</p>
   <p class="quote">"말, 세 칸 전진!!"</p>
   <p>말이 된 뾰뿝이 윷판 위를 세 칸 걸어갔다. "뾰뿝! 뾰뿝! 뾰뿝!" 한 칸에 한 번씩 외치면서.</p>
   <p>식당 팀 차례. 꼬르륵이 던졌다. 모!!</p>`,

  `<p>빠른 팀 차례. 부릉부가 던지자마자 말인 우당탕이 미리 뛰어나갔다.</p>
   <p class="quote">"아직 결과 안 나왔어!! 돌아와!!"</p>
   <p>윷은 개였는데 우당탕은 네 칸을 가 있었다. 두 칸 후진 판정.</p>
   <p>만들기 팀은 잉잉을할랑이 던지기 전에 바람 방향을 계산했다.</p>
   <p class="quote">"풍속 초속 2미터, 각도 45도......"</p>
   <p>윷! 계산이 맞았다.</p>
   <p>소감 팀 차례. 빠푸뽀푸가 윷을 들었다.</p>
   <p class="quote">"제가 이 윷을 던지기 전에 먼저 말씀드리고 싶은 것은—"</p>
   <p class="turn">"던지고 말해!!!"</p>`,

  `<p>경기는 접전이었다.</p>
   <p>사람 말들이 잡고 잡히고, 업고 업히고.</p>
   <p>훌짝훌 할아버지가 홀짝훌을 업고 두 칸을 갔다.</p>
   <p>삼십 년 만에 동생을 업은 형이었다.</p>
   <p>그렇게 한 시간이 지나고—</p>
   <p>다섯 팀의 말이 전부, 마지막 한 칸을 남겨 놓게 되었다.</p>
   <p>또각또의 주판이 멈췄다.</p>
   <p class="quote">"계산 결과...... 다섯 팀 전부 동점입니다."</p>
   <p class="quote">"이 마을 전통이 나왔다!!!"</p>
   <p class="quote">"그럼 마지막 승부는— 각 팀 대표가 한 번씩 던져서, 제일 높은 것이 나온 팀이 우승!! 단판 승부입니다!!!"</p>`,

  `<div class="chapter">마지막 던지기</div>
   <p>광장이 조용해졌다. 눈발만 사락사락 내렸다.</p>
   <p>첫 번째, 잉잉을할랑.</p>
   <p>바람을 계산하고, 각도를 계산하고, 던졌다. 개.</p>
   <p class="quote">"계산상 개가 최선이었습니다. 후회 없습니다."</p>
   <p>두 번째, 부릉부.</p>
   <p>너무 빠르게 던져서 윷이 보이지도 않았다. 떨어져 보니 도.</p>
   <p class="quote">"빠른 게 항상 좋은 건 아니네요......"</p>
   <p>세 번째, 빠푸뽀푸.</p>
   <p class="quote">"제가 던질 이 윷은—"</p>
   <p class="quote">"던져!!!"</p>
   <p>걸. 현재 1등. 소감 팀이 술렁였다.</p>`,

  `<p>네 번째, 꼬르륵.</p>
   <p>손에 입김을 불고, 크게 심호흡하고, 던졌다.</p>
   <p class="goal">윷!!</p>
   <p class="quote">"꼬르륵 팀 1등!!! 남은 건 한 명!!"</p>
   <p>마지막, 추루룹 씨.</p>
   <p>추루룹 씨가 이기려면 딱 하나, 모가 나와야 했다.</p>
   <p>작년 설날이 떠올랐다.</p>
   <p>그때도 마지막 윷은 추루룹 씨였다. 그때는 간장 종지에 빠졌지.</p>
   <p>추루룹 씨는 씩 웃고, 딸을 봤다. 촤르릅이 고개를 끄덕였다. 아내 추르릅도 끄덕였다.</p>`,

  `<p>추루룹 씨는 하늘 높이 윷을 던졌다.</p>
   <p>팔뚝만 한 윷가락 네 개가 눈발 사이로 빙글빙글 돌았다.</p>
   <p>온 마을이 숨을 참았다.</p>
   <p>기다랑과 기다래도 목을 최대한 뺐다.</p>
   <p>툭. 툭. 툭.</p>
   <p>세 개가 떨어졌다. 전부 엎어졌다.</p>
   <p>모까지 남은 건 하나.</p>
   <p>마지막 윷가락이 데굴...... 데굴...... 굴렀다.</p>
   <p class="turn">하지만!</p>
   <p>마지막 윷가락이 굴러가다가, 광장 구석에 놓여 있던 것에 톡 부딪혀 멈췄다.</p>
   <p>그것은 바로— 잔치 음식 상 위의, 간장 종지였다.</p>
   <p class="quote">"또?!?!?! 또 간장 종지야?!?!"</p>`,

  `<p>온 광장이 뒤집어졌다.</p>
   <p>심판 초추초추가 달려갔다.</p>
   <p>작년 간장 종지 사건의 주범이, 올해는 심판으로서 간장 종지 앞에 섰다.</p>
   <p>초추초추는 무릎을 꿇고, 윷가락을 아주 오래 들여다봤다.</p>
   <p>그리고 천천히 일어나서, 선언했다.</p>
   <p class="quote">"윷가락은 간장 종지에 빠지지 않고, 기대어 멈췄습니다."</p>
   <p class="quote">"그리고 윷가락의 등이...... 하늘을 보고 있습니다. 네 개 전부 엎어짐. 즉—"</p>
   <p class="goal">"모!!!!! 간장 공장 팀 우승!!!!!"</p>`,

  `<div class="chapter">설날 밤</div>
   <p>광장이 함성으로 가득 찼다.</p>
   <p>밴드 빠찌딸팡이 우승 팡파레를 연주했다. 팡파팡의 나팔이 제일 컸다.</p>
   <p>간장 공장 팀에게 우승 트로피가 전달되었다.</p>
   <p>쨍그랑이 만든, 어른 팔뚝만 한 대형 유리 기린 트로피였다.</p>
   <p>속의 간장이 노을빛으로 출렁였다.</p>
   <p>추루룹 씨가 트로피를 들고 말했다.</p>
   <p class="quote">"작년에 간장 종지는 반칙 도구였습니다. 올해는 우리 윷을 받쳐 줬네요."</p>
   <p class="quote">"간장 종지는 그대로인데, 우리가 달라진 겁니다."</p>`,

  `<p>저녁이 되자 광장에 잔칫상이 차려졌다.</p>
   <p>떡볶이와 잔치국수와 만두와 식혜가 김을 냈다.</p>
   <p>진 팀도 이긴 팀도 같은 상에 둘러앉았다.</p>
   <p>커피는 아무도 안 쐈다. 올해는 내기가 없었으니까.</p>
   <p class="quote">"내기가 없으니까 반칙도 없네?"</p>
   <p class="quote">"그러네. 근데 더 재밌었어."</p>
   <p>냠냠냠은 시식 담당답게 모든 음식을 다 먹었고, 삐뽀삐는 결국 출동할 일이 없어서 제일 기뻐했다.</p>`,

  `<p>밤이 깊어지고, 눈이 다시 내리기 시작했다.</p>
   <p>기다랑과 기다래는 목을 서로 기대고 잠들었다.</p>
   <p>쀼보부 할아버지는 그 모습을 그렸다.</p>
   <p>차추초추는 오늘 있었던 일을 편지로 쓰기 시작했다. 받는 사람: 내년의 나.</p>
   <p>촤르릅은 아빠 옆에 앉아 트로피 속 간장이 출렁이는 걸 보고 있었다.</p>
   <p class="quote">"아빠, 내년 설날에도 하는 거지?"</p>
   <p class="quote">"당연하지. 내후년에도, 그다음에도."</p>`,

  `<div class="chapter">그 후 이야기</div>
   <p>그 뒤로 마을이 어떻게 되었는지, 조금만 이야기하자면.</p>
   <p>빠푸뽀푸 간장 공장은 "사과 편지 공장"이자 "트로피 간장 공장"으로 전국에서 제일 유명한 간장 공장이 되었다.</p>
   <p>공장 벽의 편지는 이제 백 장이 아니라 삼백 장이 되었다. 마을 사람들이 자기 편지를 붙이러 왔기 때문이다.</p>`,

  `<p>꼬르륵식당은 3호점 계획을 세우고 있다.</p>
   <p>후보지는 산꼭대기다.</p>
   <p class="quote">"산에서 먹는 떡볶이가 제일 맛있거든요."</p>
   <p>배달은 물론 부릉부 담당이다. 산길 배달 기록은 칠 분.</p>`,

  `<p>차추초추의 미안해 편지 가게는 2호점을 냈다.</p>
   <p>2호점 이름은 "고마워 편지 가게"다.</p>
   <p class="quote">"미안하다는 말보다 고맙다는 말을 못 하는 사람이 더 많더라고요."</p>
   <p>1호 손님은 이번에도 초차초츠였다. 받는 사람도 이번에도 아들이었다.</p>`,

  `<p>잉잉을할랑은 새 게임을 만들었다.</p>
   <p>제목은 "온 마을 대윷놀이 온라인".</p>
   <p>이번에는 계산 담당 또각또를 처음부터 채용해서, 단 한 번의 계산 실수도 없었다.</p>
   <p>다만 서버가 자주 터졌다. 접속자가 너무 많아서였다.</p>`,

  `<p>홀짝훌과 훌짝훌 형제는 가게를 합쳤다.</p>
   <p>새 가게 이름은 "홀짝훌짝"이다.</p>
   <p>간판에는 이렇게 쓰여 있다.</p>
   <p class="quote">"국수 두 그릇 시키면 한 그릇 값. 형제니까."</p>`,

  `<p>쀼보부 할아버지는 마을에 그림 교실을 열었다.</p>
   <p>수업료는 그림 한 장이다.</p>

let cur = 0;
let animating = false;
const pageEl = document.getElementById('page');
const POS_KEY = 'chururup-book-pos';
try{
  const saved = parseInt(localStorage.getItem(POS_KEY));
  if(!isNaN(saved) && saved >= 0 && saved < PAGES.length) cur = saved;
}catch(e){}

function renderPage(){
  pageEl.innerHTML = '<div class="pg-inner">' + PAGES[cur] + '</div>';
  pageEl.scrollTop = 0;
  try{ localStorage.setItem(POS_KEY, cur); }catch(e){}
  document.getElementById('page-num').textContent = (cur+1) + ' / ' + PAGES.length;
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === PAGES.length-1;
}

function go(dir){
  if(animating) return;
  const next = cur + dir;
  if(next < 0 || next >= PAGES.length) return;
  animating = true;
  pageEl.classList.add('flip-out');
  setTimeout(()=>{
    cur = next;
    renderPage();
    pageEl.classList.remove('flip-out');
    pageEl.classList.add('flip-in-prep');
    void pageEl.offsetWidth;
    pageEl.classList.remove('flip-in-prep');
    setTimeout(()=>{ animating = false; }, 450);
  }, 420);
}

function tapPage(e){
  const rect = pageEl.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  if(x < 0.3) go(-1);
  else go(1);
}

window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === ' ') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

function openToc(){
  const list = document.getElementById('toc-list');
  let items = '<button class="toc-item" onclick="jumpTo(0)"><span>📕 표지</span><span class="pg">1쪽</span></button>';
  PAGES.forEach((p, i)=>{
    const m = p.match(/<div class="chapter">(.*?)<\/div>/);
    if(m){
      items += `<button class="toc-item" onclick="jumpTo(${i})"><span>${m[1]}</span><span class="pg">${i+1}쪽</span></button>`;
    }
  });
  list.innerHTML = items;
  document.getElementById('toc-bg').classList.add('show');
}
function closeToc(){
  document.getElementById('toc-bg').classList.remove('show');
}
function jumpTo(i){
  closeToc();
  cur = i;
  renderPage();
}

renderPage();
</script>
