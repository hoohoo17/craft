<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>끝말잇기</title>
<style>
  :root{
    --bg:#F4EFE6; --ink:#3B3630;
    --me:#FFE28A; --bot:#FFFFFF;
    --accent:#E07A3F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex; justify-content:center;
  }
  .wrap{
    width:100%; max-width:460px; height:100dvh;
    display:flex; flex-direction:column;
  }
  header{
    padding:12px 16px 8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  h1{font-size:1.3rem;}
  .streak{font-weight:900; font-size:.95rem; background:#fff; border-radius:20px; padding:5px 12px; box-shadow:0 2px 6px rgba(0,0,0,.08);}

  .timer-wrap{padding:0 16px 8px;}
  .timer{
    height:10px; background:rgba(0,0,0,.08); border-radius:6px; overflow:hidden;
  }
  .timer > div{
    height:100%; width:100%;
    background:#6BA368;
    border-radius:6px;
    transition:width .2s linear, background .3s;
  }
  .timer > div.low{background:#D7263D;}

  #chat{
    flex:1; overflow-y:auto;
    padding:8px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .bubble{
    max-width:75%;
    padding:10px 14px;
    border-radius:16px;
    font-size:1.15rem; font-weight:800;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
    line-height:1.4;
    word-break:keep-all;
  }
  .bubble .sub{display:block; font-size:.8rem; font-weight:700; opacity:.55; margin-top:2px;}
  .bot-b{align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px;}
  .me-b{align-self:flex-end; background:var(--me); border-bottom-right-radius:4px;}
  .sys{
    align-self:center;
    font-size:.9rem; font-weight:700;
    background:rgba(0,0,0,.06);
    border-radius:20px;
    padding:6px 14px;
    text-align:center;
  }
  .last-char{color:var(--accent);}

  #input-bar{
    display:flex; gap:8px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:#fff;
    box-shadow:0 -3px 12px rgba(0,0,0,.06);
  }
  #word-in{
    flex:1; min-width:0;
    font-family:inherit; font-size:1.2rem; font-weight:800;
    border:3px solid rgba(0,0,0,.12);
    border-radius:14px;
    padding:12px 14px;
  }
  #word-in:focus{outline:none; border-color:var(--accent);}
  #give-up-btn{
    flex:none;
    font-family:inherit; font-size:1.3rem;
    background:rgba(0,0,0,.06);
    border:3px solid rgba(0,0,0,.1);
    border-radius:14px;
    padding:0 14px;
    cursor:pointer;
  }
  #give-up-btn:active{transform:scale(.94);}
  #give-up-btn.armed{
    background:#E74C3C; color:#fff;
    border-color:#E74C3C;
    font-size:.95rem; font-weight:900;
    animation:pulse .5s infinite alternate;
  }
  @keyframes pulse{to{transform:scale(1.08);}}
  #send-btn{
    flex:none;
    font-family:inherit; font-size:1.1rem; font-weight:900;
    color:#fff; background:var(--accent);
    border:none; border-radius:14px;
    padding:0 18px;
    white-space:nowrap;      /* 좁은 폰에서 '보내 기'로 쪼개지지 않게 */
    cursor:pointer;
  }
  #send-btn:active{transform:scale(.96);}

  .choice-row{display:flex; gap:8px; align-self:center; flex-wrap:wrap; justify-content:center;}
  .choice-btn{
    font-family:inherit; font-size:.95rem; font-weight:800;
    border:2px solid var(--accent);
    background:#fff; color:var(--accent);
    border-radius:20px;
    padding:8px 16px;
    cursor:pointer;
  }
  .choice-btn.primary{background:var(--accent); color:#fff;}

  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(59,54,48,.85);
    color:#FFF7EA;
    text-align:center;
    padding:24px; z-index:10;
  }
  .overlay h2{font-size:2rem; margin-bottom:10px;}
  .overlay p{font-size:1.05rem; line-height:1.7; white-space:pre-line;}
  .big-btn{
    margin-top:20px;
    font-family:inherit;
    font-size:1.2rem; font-weight:900;
    color:#3B3630; background:#FFE28A;
    border:none; border-radius:14px;
    padding:13px 40px;
    cursor:pointer;
    box-shadow:0 5px 0 #C9A93F;
  }
  .big-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #C9A93F;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗣️ 끝말잇기</h1>
    <div class="streak">🔥 <span id="streak">0</span>연승</div>
  </header>
  <div id="chat"></div>
  <div id="input-bar">
    <button id="give-up-btn" onclick="surrender()" title="항복">🏳️</button>
    <input id="word-in" placeholder="단어를 써 보세요!" autocomplete="off">
    <button id="send-btn" onclick="submitWord()">보내기</button>
  </div>
</div>

<div class="overlay" id="result" style="display:none">
  <h2 id="res-title"></h2>
  <p id="res-sub"></p>
  <button class="big-btn" onclick="newGame()">다시 하기</button>
</div>

  if(hasCloudStorage){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem(k);
}
async function storageSet(k,v){
  try{ if(hasCloudStorage) await window.storage.set(k,v); else localStorage.setItem(k,v); }catch(e){}
}

const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
function decomp(ch){
  const code = ch.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null;
  return { cho: Math.floor(code/588), jung: Math.floor((code%588)/28), jong: code%28 };
}
function comp(cho, jung, jong){
  return String.fromCharCode(0xAC00 + cho*588 + jung*28 + jong);
}
// 두음법칙: 시작 글자로 허용되는 글자들
function allowedStarts(ch){
  const set = new Set([ch]);
  const d = decomp(ch);
  if(!d) return set;
  const R = CHO.indexOf('ㄹ'), N = CHO.indexOf('ㄴ'), NG = CHO.indexOf('ㅇ');
  const iVowels = ['ㅑ','ㅕ','ㅛ','ㅠ','ㅣ','ㅖ','ㅒ'].map(v=>JUNG.indexOf(v));
  if(d.cho === R){
    set.add(comp(N, d.jung, d.jong));               // 라→나
    if(iVowels.includes(d.jung)) set.add(comp(NG, d.jung, d.jong)); // 력→역
  }
  if(d.cho === N && iVowels.includes(d.jung)){
    set.add(comp(NG, d.jung, d.jong));               // 녀→여
  }
  return set;
}

/* ---------- game state ---------- */
let used = new Set();
let lastChar = null;   // 이어야 하는 글자
let myTurn = true;
let timer = 15, timerId = null;
let streak = 0;
let pendingWord = null; // 우기기 대기 중
let insistLeft = 3;     // 우기기 남은 횟수
let gameOver = false;

const chat = document.getElementById('chat');

function addBubble(cls, html){
  const b = document.createElement('div');
  b.className = cls;
  b.innerHTML = html;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return b;
}
function addWordBubble(who, word){
  const last = word[word.length-1];
  const head = word.slice(0,-1);
  addBubble('bubble ' + (who==='me'?'me-b':'bot-b'),
    `${escapeH(head)}<span class="last-char">${escapeH(last)}</span>` +
    (who==='bot' ? `<span class="sub">"${escapeH(last)}"(으)로 시작하는 말이에요!</span>` : ''));
}
function escapeH(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* ---------- timer (제거됨: 느긋하게 생각해도 됨) ---------- */
function startTimer(){}
function stopTimer(){}

/* ---------- flow ---------- */
function newGame(){
  document.getElementById('result').style.display = 'none';
  chat.innerHTML = '';
  used = new Set();
  lastChar = null;
  gameOver = false;
  pendingWord = null;
  insistLeft = 3;
  myTurn = true;
  addBubble('sys', '먼저 시작하세요! 아무 단어나 좋아요 😊');
  document.getElementById('word-in').focus();
}

function playBotWord(w){
  used.add(w);
  lastChar = w[w.length-1];
  addWordBubble('bot', w);
  myTurn = true;
  startTimer();
  document.getElementById('word-in').focus();
}

function submitWord(){
  if(gameOver || !myTurn) return;
  const inp = document.getElementById('word-in');
  const w = inp.value.trim().replace(/\s+/g,'');
  if(!w) return;
  inp.value = '';

  // 항복 선언 (타자로도 가능 — 직접 쓴 거니까 바로 항복)
  if(w === '항복'){
    surrenderArmed = true;
    surrender();
    return;
  }

  // 기본 검사
  if(w.length < 2){ addBubble('sys', '두 글자 이상이어야 해요!'); return; }
  if(!/^[가-힣]+$/.test(w)){ addBubble('sys', '한글만 쓸 수 있어요!'); return; }
  if(used.has(w)){ lose('🔁 이미 나온 말!', `"${w}"는 아까 나왔어요!`); return; }
  if(lastChar){
    const ok = allowedStarts(lastChar);
    if(!ok.has(w[0])){
      lose('❌ 잇기 실패!', `"${lastChar}"(으)로 시작해야 하는데 "${w[0]}"(으)로 시작했어요!`);
      return;
    }
  }

  // 사전 검사 → 없으면 우기기 찬스 (한 판에 세 번까지)
  if(!DICT.has(w)){
    stopTimer();
    if(insistLeft <= 0){
      addBubble('sys', `"${escapeH(w)}"... 죄송해요, 봐드리는 건 한 판에 세 번까지예요 🙏 다른 말로 부탁드릴게요!`);
      return;
    }
    pendingWord = w;
    addWordBubble('me', w);
    addBubble('sys', `"${escapeH(w)}"... 제 사전에 없는 말이에요. 제가 모르는 말일 수도 있어요! 진짜 있는 말이면 알려 주세요 🙇`);
    const btns = document.createElement('div');
    btns.className = 'choice-row';
    btns.innerHTML = `
      <button class="choice-btn primary" onclick="insist()">진짜 있는 말이에요! (${insistLeft}번 남음)</button>
      <button class="choice-btn" onclick="retract()">앗, 다시 쓸게요</button>`;
    chat.appendChild(btns);
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  acceptMyWord(w, true);
}

// 실수로 눌러서 지지 않게, 두 번 눌러야 항복된다
let surrenderArmed = false;
let surrenderTimer = null;
function surrender(){
  if(gameOver) return;
  const btn = document.getElementById('give-up-btn');
  if(!surrenderArmed){
    // 1차: 버튼만 '진짜?' 로 바꾸고 3초 기다린다
    surrenderArmed = true;
    if(btn){ btn.textContent = '진짜?'; btn.classList.add('armed'); }
    clearTimeout(surrenderTimer);
    surrenderTimer = setTimeout(()=>{
      surrenderArmed = false;
      if(btn){ btn.textContent = '🏳️'; btn.classList.remove('armed'); }
    }, 3000);
    return;
  }
  // 2차: 항복 확정
  clearTimeout(surrenderTimer);
  surrenderArmed = false;
  if(btn){ btn.textContent = '🏳️'; btn.classList.remove('armed'); }
  removeChoices();
  pendingWord = null;
  addBubble('bubble me-b', '항복 🏳️');
  lose('🏳️ 항복!', '항복을 선언했어요. 잘 싸웠어요! 다음 판엔 이길 수 있어요 💪');
}

function insist(){
  if(!pendingWord) return;
  removeChoices();
  insistLeft--;
  addBubble('sys', insistLeft >= 1
    ? `알겠습니다, 믿어 드릴게요 🙏 (앞으로 ${insistLeft}번 더 봐드려요)`
    : '이번이 정말 마지막이에요~ 🙇 다음부터는 못 믿어 드려요!');
  acceptMyWord(pendingWord, false);
  pendingWord = null;
}
function retract(){
  if(!pendingWord) return;
  removeChoices();
  used.delete(pendingWord);
  pendingWord = null;
  addBubble('sys', '다시 써 보세요!');
  startTimer();
}
function removeChoices(){
  document.querySelectorAll('.choice-row').forEach(e=>e.remove());
}

function acceptMyWord(w, showBubble){
  stopTimer();
  used.add(w);
  lastChar = w[w.length-1];
  if(showBubble) addWordBubble('me', w);
  myTurn = false;
  setTimeout(botTurn, 700 + Math.random()*600);
}

function botTurn(){
  const starts = allowedStarts(lastChar);
  const options = [...DICT].filter(w => starts.has(w[0]) && !used.has(w));
  if(!options.length){
    win('🏆 승리!', `"${lastChar}"(으)로 시작하는 말이 생각이 안 나요! 항복할게요!! 🏳️`);
    return;
  }
  const w = options[Math.floor(Math.random()*options.length)];
  playBotWord(w);
}

/* ---------- win / lose ---------- */
function win(title, sub){
  gameOver = true;
  stopTimer();
  streak++;
  updateStreak();
  storageSet(KEY+'-streak', String(streak));
  showResult(title, sub + `\n🔥 ${streak}연승!`);
}
function lose(title, sub){
  gameOver = true;
  stopTimer();
  streak = 0;
  updateStreak();
  storageSet(KEY+'-streak', '0');
  showResult(title, sub);
}
function showResult(title, sub){
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;
  setTimeout(()=>{ document.getElementById('result').style.display = 'flex'; }, 700);
}
function updateStreak(){
  document.getElementById('streak').textContent = streak;
}

document.getElementById('word-in').addEventListener('keydown', e=>{
  if(e.key === 'Enter') submitWord();
});

/* ---------- boot ---------- */
(async function(){
  const st = await storageGet(KEY+'-streak');
  if(st) streak = parseInt(st)||0;
  updateStreak();
  newGame();
})();
</script>
