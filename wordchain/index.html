<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>끝말잇기</title>
<style>
  :root{
    --bg:#F4EFE6; --ink:#3B3630;
    --me:#FFE28A; --bot:#FFFFFF;
    --accent:#E07A3F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex; justify-content:center;
  }
  .wrap{
    width:100%; max-width:460px; height:100dvh;
    display:flex; flex-direction:column;
  }
  header{
    padding:12px 16px 8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  h1{font-size:1.3rem;}
  .streak{font-weight:900; font-size:.95rem; background:#fff; border-radius:20px; padding:5px 12px; box-shadow:0 2px 6px rgba(0,0,0,.08);}

  .timer-wrap{padding:0 16px 8px;}
  .timer{
    height:10px; background:rgba(0,0,0,.08); border-radius:6px; overflow:hidden;
  }
  .timer > div{
    height:100%; width:100%;
    background:#6BA368;
    border-radius:6px;
    transition:width .2s linear, background .3s;
  }
  .timer > div.low{background:#D7263D;}

  #chat{
    flex:1; overflow-y:auto;
    padding:8px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .bubble{
    max-width:75%;
    padding:10px 14px;
    border-radius:16px;
    font-size:1.15rem; font-weight:800;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
    line-height:1.4;
    word-break:keep-all;
  }
  .bubble .sub{display:block; font-size:.8rem; font-weight:700; opacity:.55; margin-top:2px;}
  .bot-b{align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px;}
  .me-b{align-self:flex-end; background:var(--me); border-bottom-right-radius:4px;}
  .sys{
    align-self:center;
    font-size:.9rem; font-weight:700;
    background:rgba(0,0,0,.06);
    border-radius:20px;
    padding:6px 14px;
    text-align:center;
  }
  .last-char{color:var(--accent);}

  #input-bar{
    display:flex; gap:8px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:#fff;
    box-shadow:0 -3px 12px rgba(0,0,0,.06);
  }
  #word-in{
    flex:1;
    font-family:inherit; font-size:1.2rem; font-weight:800;
    border:3px solid rgba(0,0,0,.12);
    border-radius:14px;
    padding:12px 14px;
  }
  #word-in:focus{outline:none; border-color:var(--accent);}
  #send-btn{
    font-family:inherit; font-size:1.1rem; font-weight:900;
    color:#fff; background:var(--accent);
    border:none; border-radius:14px;
    padding:0 22px;
    cursor:pointer;
  }
  #send-btn:active{transform:scale(.96);}

  .choice-row{display:flex; gap:8px; align-self:center;}
  .choice-btn{
    font-family:inherit; font-size:.95rem; font-weight:800;
    border:2px solid var(--accent);
    background:#fff; color:var(--accent);
    border-radius:20px;
    padding:8px 16px;
    cursor:pointer;
  }
  .choice-btn.primary{background:var(--accent); color:#fff;}

  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(59,54,48,.85);
    color:#FFF7EA;
    text-align:center;
    padding:24px; z-index:10;
  }
  .overlay h2{font-size:2rem; margin-bottom:10px;}
  .overlay p{font-size:1.05rem; line-height:1.7;}
  .big-btn{
    margin-top:20px;
    font-family:inherit;
    font-size:1.2rem; font-weight:900;
    color:#3B3630; background:#FFE28A;
    border:none; border-radius:14px;
    padding:13px 40px;
    cursor:pointer;
    box-shadow:0 5px 0 #C9A93F;
  }
  .big-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #C9A93F;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗣️ 끝말잇기</h1>
    <div class="streak">🔥 <span id="streak">0</span>연승</div>
  </header>
  <div id="chat"></div>
  <div id="input-bar">
    <input id="word-in" placeholder="단어를 써 보세요!" autocomplete="off">
    <button id="send-btn" onclick="submitWord()">보내기</button>
  </div>
</div>

<div class="overlay" id="result" style="display:none">
  <h2 id="res-title"></h2>
  <p id="res-sub"></p>
  <button class="big-btn" onclick="newGame()">다시 하기</button>
</div>

<script>
/* ---------- storage ---------- */
const KEY = 'word-chain-v1';
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;
async function storageGet(k){
  if(hasCloudStorage){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem(k);
}
async function storageSet(k,v){
  try{ if(hasCloudStorage) await window.storage.set(k,v); else localStorage.setItem(k,v); }catch(e){}
}

/* ---------- dictionary ---------- */
const DICT = new Set(`가방 가위 가족 가지 가마솥 가로등 가루 가슴 가을 가재 가지치기 각도 각설탕 간식 간장 간호사 갈매기 갈비 갈색 감기 감자 감정 감사 강아지 강물 강당 강산 개구리 개미 개나리 거미 거북이 거울 거리 거인 건물 건강 걸음 검정 게임 겨울 겨자 결석 결혼 경찰 경기 경주 계단 계란 계산 계절 고구마 고양이 고래 고추 고기 고모 고드름 고민 고사리 곡식 골목 곰팡이 공책 공원 공부 공기 공룡 공주 과일 과자 과학 관심 광장 교실 교문 구름 구두 구슬 구멍 국수 국어 국밥 군인 굴뚝 궁전 귀신 귤껍질 그림 그네 그늘 극장 근육 글자 금붕어 금색 기차 기린 기름 기억 기분 기술 김밥 김치 까치 깍두기 깜빡이 꼬리 꼬마 꽃밭 꽃병 꽃잎 꿀벌 나무 나비 나라 나침반 나팔 낙타 낚시 난로 날개 날씨 남매 남산 낮잠 냄비 냄새 냇물 너구리 넥타이 노래 노랑 노트 녹차 놀이터 농구 농부 뇌물 누나 눈사람 눈물 눈썹 늑대 다람쥐 다리 다이아 단추 단어 달걀 달력 달빛 달팽이 닭갈비 담요 당근 대나무 대문 대장 대추 도깨비 도토리 도서관 도시 도장 도마 독수리 돌고래 돌멩이 동생 동물 동전 동화 돼지 두더지 두부 드럼 들판 등대 등산 딸기 땅콩 떡국 떡볶이 라디오 라면 라일락 레몬 로봇 리본 마늘 마당 마차 마을 마음 막대기 만두 만화 말미잘 맛집 망고 망치 매미 맥주 머리 먹구름 메뚜기 메아리 메일 며느리 명절 모기 모래 모자 모범 목도리 목소리 목욕 목장 무지개 무릎 문어 문제 물감 물고기 물병 미끄럼틀 미술 미역 민들레 밀가루 바나나 바다 바람 바지 바퀴 박수 박물관 반지 반찬 발가락 발바닥 밤하늘 방귀 방석 방울 방학 배구 배꼽 배추 백조 버섯 버스 번개 벌레 벚꽃 베개 벼락 별똥별 병아리 병원 보라 보리 보물 보름달 복숭아 볶음밥 봄비 부엌 부자 부채 북극 분수 불꽃 붕어빵 비누 비둘기 비밀 비행기 빙수 빨래 사과 사슴 사자 사진 사탕 사람 사막 산소 산책 살구 삼촌 상어 상자 상추 새우 새벽 색종이 생일 생선 생각 서점 선물 선생님 선풍기 설탕 섬마을 세수 세상 소나기 소나무 소풍 소금 소망 손가락 손수건 송아지 수박 수건 수업 수영 수저 숙제 순두부 숟가락 숲속 스키 시계 시장 시소 시골 식탁 신발 신호등 실내화 심장 십자가 싸움 쌀밥 쓰레기 씨앗 아기 아빠 아침 아이스크림 악어 안개 안경 알사탕 앞치마 애벌레 야구 야채 약속 양파 양말 양초 어깨 어른 어린이 얼음 엄마 여름 여우 여행 연필 연못 연극 열쇠 엽서 영어 영화 옆집 예술 오리 오이 오징어 옥수수 온천 올챙이 옷장 왕관 외투 요리 요정 용암 우산 우유 우주 운동 울타리 웃음 원숭이 월요일 유리 유치원 육지 은행 음식 음악 의사 의자 이불 이야기 이사 인형 일기 잉어 자동차 자석 자전거 자유 잔치 잠자리 장갑 장난감 장마 장미 재채기 저녁 전화 점심 접시 젓가락 정원 젖소 제비 조개 조카 종이 주머니 주사위 주스 주인공 죽순 줄넘기 지구 지도 지렁이 지우개 지하철 진주 짜장면 쪽지 찌개 차표 참새 참외 창문 채소 책상 책가방 천둥 청소 체육 초콜릿 초록 촛불 추석 축구 치약 치즈 친구 침대 칫솔 카메라 캥거루 커피 컴퓨터 케이크 코끼리 코알라 코스모스 콩나물 크레파스 큰집 키위 타조 탁구 태양 태풍 택시 터널 토끼 토마토 통조림 튤립 트럭 파도 파랑 파리 파인애플 팥빙수 편지 포도 폭포 표범 풍선 피아노 피자 하늘 하마 하품 학교 학생 한글 할머니 할아버지 항구 해바라기 해변 해적 햇살 행복 허수아비 헬리콥터 형제 호랑이 호수 호박 홍수 화분 화살 화요일 환자 회오리 휴지 흙탕물 희망 힘줄 라마 락스 레고 로켓 루비 리듬 링거 마술 매실 무용 미소 밀림 바위 백합 벽돌 볼펜 비타민 사이다 성문 소원 수정 아우 안내 애국 야영 어항 얼굴 에어컨 오빠 왕자 요구르트 우물 유령 은하수 자랑 잔디 정글 주말 지팡이 진달래 창고 천사 총알 카드 콜라 탬버린 파티 폭죽 필통 핫도그 호두 화가 흰색 나이 니모 냉면 노을 능금 다슬기 도넛 두루미 딱지 라벤더 레일 마법 매듭 모험 무대 미로 바구니 버터 별자리 부엉이 사슬 새싹 샘물 소 /* ---------- 한글 처리 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
function decomp(ch){
  const code = ch.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null;
  return { cho: Math.floor(code/588), jung: Math.floor((code%588)/28), jong: code%28 };
}
function comp(cho, jung, jong){
  return String.fromCharCode(0xAC00 + cho*588 + jung*28 + jong);
}
// 두음법칙: 시작 글자로 허용되는 글자들
function allowedStarts(ch){
  const set = new Set([ch]);
  const d = decomp(ch);
  if(!d) return set;
  const R = CHO.indexOf('ㄹ'), N = CHO.indexOf('ㄴ'), NG = CHO.indexOf('ㅇ');
  const iVowels = ['ㅑ','ㅕ','ㅛ','ㅠ','ㅣ','ㅖ','ㅒ'].map(v=>JUNG.indexOf(v));
  if(d.cho === R){
    set.add(comp(N, d.jung, d.jong));               // 라→나
    if(iVowels.includes(d.jung)) set.add(comp(NG, d.jung, d.jong)); // 력→역
  }
  if(d.cho === N && iVowels.includes(d.jung)){
    set.add(comp(NG, d.jung, d.jong));               // 녀→여
  }
  return set;
}

/* ---------- game state ---------- */
let used = new Set();
let lastChar = null;   // 이어야 하는 글자
let myTurn = true;
let timer = 15, timerId = null;
let streak = 0;
let pendingWord = null; // 우기기 대기 중
let insistLeft = 2;     // 우기기 남은 횟수
let gameOver = false;

const chat = document.getElementById('chat');

function addBubble(cls, html){
  const b = document.createElement('div');
  b.className = cls;
  b.innerHTML = html;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return b;
}
function addWordBubble(who, word){
  const last = word[word.length-1];
  const head = word.slice(0,-1);
  addBubble('bubble ' + (who==='me'?'me-b':'bot-b'),
    `${escapeH(head)}<span class="last-char">${escapeH(last)}</span>` +
    (who==='bot' ? `<span class="sub">"${escapeH(last)}"(으)로 시작하는 말이에요!</span>` : ''));
}
function escapeH(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* ---------- timer (제거됨: 느긋하게 생각해도 됨) ---------- */
function startTimer(){}
function stopTimer(){}

/* ---------- flow ---------- */
function newGame(){
  document.getElementById('result').style.display = 'none';
  chat.innerHTML = '';
  used = new Set();
  lastChar = null;
  gameOver = false;
  pendingWord = null;
  insistLeft = 2;
  myTurn = true;
  addBubble('sys', '먼저 시작하세요! 아무 단어나 좋아요 😊');
  document.getElementById('word-in').focus();
}

function playBotWord(w){
  used.add(w);
  lastChar = w[w.length-1];
  addWordBubble('bot', w);
  myTurn = true;
  startTimer();
  document.getElementById('word-in').focus();
}

function submitWord(){
  if(gameOver || !myTurn) return;
  const inp = document.getElementById('word-in');
  const w = inp.value.trim().replace(/\s+/g,'');
  if(!w) return;
  inp.value = '';

  // 기본 검사
  if(w.length < 2){ addBubble('sys', '두 글자 이상이어야 해요!'); return; }
  if(!/^[가-힣]+$/.test(w)){ addBubble('sys', '한글만 쓸 수 있어요!'); return; }
  if(used.has(w)){ lose('🔁 이미 나온 말!', `"${w}"는 아까 나왔어요!`); return; }
  if(lastChar){
    const ok = allowedStarts(lastChar);
    if(!ok.has(w[0])){
      lose('❌ 잇기 실패!', `"${lastChar}"(으)로 시작해야 하는데 "${w[0]}"(으)로 시작했어요!`);
      return;
    }
  }

  // 사전 검사 → 없으면 우기기 찬스 (한 판에 2번까지)
  if(!DICT.has(w)){
    stopTimer();
    if(insistLeft <= 0){
      addBubble('sys', `"${escapeH(w)}"...? 죄송해요, 이제는 못 믿어 드려요 🙏 제가 아는 말로 부탁드릴게요!`);
      return;
    }
    pendingWord = w;
    addWordBubble('me', w);
    addBubble('sys', `음... "${escapeH(w)}"? 처음 듣는 말인데, 진짜 있는 말인가요? 🤔`);
    const btns = document.createElement('div');
    btns.className = 'choice-row';
    btns.innerHTML = `
      <button class="choice-btn primary" onclick="insist()">진짜 있는 말이에요! (${insistLeft}번 남음)</button>
      <button class="choice-btn" onclick="retract()">앗, 다시 쓸게요</button>`;
    chat.appendChild(btns);
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  acceptMyWord(w, true);
}

function insist(){
  if(!pendingWord) return;
  removeChoices();
  insistLeft--;
  addBubble('sys', insistLeft === 1
    ? '알겠습니다, 믿어 드릴게요 🙏 (한 번만 더 봐드려요)'
    : '이번이 정말 마지막이에요~ 🙇 다음부터는 못 믿어 드려요!');
  acceptMyWord(pendingWord, false);
  pendingWord = null;
}
function retract(){
  if(!pendingWord) return;
  removeChoices();
  used.delete(pendingWord);
  pendingWord = null;
  addBubble('sys', '다시 써 보세요!');
  startTimer();
}
function removeChoices(){
  document.querySelectorAll('.choice-row').forEach(e=>e.remove());
}

function acceptMyWord(w, showBubble){
  stopTimer();
  used.add(w);
  lastChar = w[w.length-1];
  if(showBubble) addWordBubble('me', w);
  myTurn = false;
  setTimeout(botTurn, 700 + Math.random()*600);
}

function botTurn(){
  const starts = allowedStarts(lastChar);
  const options = [...DICT].filter(w => starts.has(w[0]) && !used.has(w));
  if(!options.length){
    win('🏆 승리!', `"${lastChar}"(으)로 시작하는 말이 생각이 안 나요! 항복할게요!! 🏳️`);
    return;
  }
  const w = options[Math.floor(Math.random()*options.length)];
  playBotWord(w);
}

/* ---------- win / lose ---------- */
function win(title, sub){
  gameOver = true;
  stopTimer();
  streak++;
  updateStreak();
  storageSet(KEY+'-streak', String(streak));
  showResult(title, sub + `\n🔥 ${streak}연승!`);
}
function lose(title, sub){
  gameOver = true;
  stopTimer();
  streak = 0;
  updateStreak();
  storageSet(KEY+'-streak', '0');
  showResult(title, sub);
}
function showResult(title, sub){
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;
  setTimeout(()=>{ document.getElementById('result').style.display = 'flex'; }, 700);
}
function updateStreak(){
  document.getElementById('streak').textContent = streak;
}

document.getElementById('word-in').addEventListener('keydown', e=>{
  if(e.key === 'Enter') submitWord();
});

/* ---------- boot ---------- */
(async function(){
  const st = await storageGet(KEY+'-streak');
  if(st) streak = parseInt(st)||0;
  updateStreak();
  newGame();
})();
</script>
