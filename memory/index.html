<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F6FD">
<title>🃏 짝 맞추기</title>
<style>
  :root {
    --bg: #F4F6FD;
    --card: #ffffff;
    --ink: #2C3560;
    --muted: #7C86A8;
    --line: #E3E9F8;
    --blue: #6C8BFF;
    --pink: #FF6B8A;
    --gold: #FFC53D;
    --shadow: 0 3px 10px rgba(80,100,160,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(123,167,255,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,170,210,.16), transparent 40%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 6px 0 10px; letter-spacing: .04em; }

  /* ---------- 난이도 ---------- */
  .seg {
    display: flex; gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .seg button {
    flex: 1;
    background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700;
    border: none; border-radius: 10px;
    padding: 9px 2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }

  /* ---------- 점수 ---------- */
  .bars { display: flex; gap: 8px; margin-bottom: 10px; }
  .bar {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 8px 6px 9px;
    box-shadow: var(--shadow);
  }
  .bar b { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .bar span { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 18px; }
  #hint b { color: #23883C; font-weight: 800; }

  /* ---------- 판 ---------- */
  #boardwrap { position: relative; }
  #board {
    display: grid;
    gap: 8px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 10px;
  }

  /* ---------- 딱지 ---------- */
  .tile {
    position: relative;
    aspect-ratio: 3 / 4;
    background: none; border: none; padding: 0;
    perspective: 600px;
    cursor: pointer;
  }
  .tile .inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .34s ease;
  }
  .tile.open .inner, .tile.done .inner { transform: rotateY(180deg); }
  .tile .face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .tile .back {
    background: linear-gradient(160deg, #8CA6FF, #6C8BFF);
    color: #fff; font-size: 20px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
  }
  .tile .front {
    background: #FFF7E3;
    border: 2px solid #FFE6AE;
    transform: rotateY(180deg);
    font-size: 30px;
  }
  .tile.done { cursor: default; }
  .tile.done .front { background: #E8F7EC; border-color: #B6E3C3; }
  .tile.done { animation: pop .3s ease-out; }
  .tile.miss .front { background: #FFEDF1; border-color: #FFC9D5; }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile .inner { transition: none; }
    .tile.done { animation: none; }
  }

  /* ---------- 덮는 화면 ---------- */
  #cover {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    background: rgba(255,255,255,.93);
    border-radius: 16px;
  }
  #cover.on { display: flex; }
  #cover p { margin: 0; font-size: 23px; font-weight: 800; }
  #cover small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }

  /* ---------- 버튼 ---------- */
  button {
    font: inherit; font-weight: 700;
    border: none; border-radius: 12px;
    padding: 11px 18px;
    background: var(--blue); color: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.warm { background: var(--pink); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .row button { flex: 1; max-width: 200px; }
  #peekBtn { background: var(--card); color: var(--ink); }
  #tip { margin: 12px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>🃏 짝 맞추기</h1>

  <div class="seg" id="levelRow" role="group" aria-label="난이도">
    <button data-k="easy">쉬움</button>
    <button data-k="normal">보통</button>
    <button data-k="hard">어려움</button>
  </div>

  <div class="bars">
    <div class="bar"><b>맞춘 짝</b><span id="pairs">0</span></div>
    <div class="bar"><b>뒤집기</b><span id="flips">0</span></div>
    <div class="bar"><b>최고 기록</b><span id="best">-</span></div>
  </div>

  <p id="hint">딱지를 눌러서 시작</p>

  <div id="boardwrap">
    <div id="board"></div>
    <div id="cover">
      <p id="coverMsg"></p>
      <div class="row" style="margin:0">
        <button id="coverBtn" class="warm">🔄 다시 하기</button>
      </div>
    </div>
  </div>

  <div class="row">
    <button id="peekBtn">👀 잠깐 보기</button>
    <button id="newBtn" class="warm">🔄 새 게임</button>
  </div>

  <p id="tip">딱지 두 장을 뒤집어서 같은 그림이면 그대로 남는다<br>다르면 도로 엎어진다 · 틀려도 잃는 건 없다<br>잠깐 보기는 한 판에 한 번, 전부 두 번 보여 준다</p>
</main>

<script>
/* 짝이 맞을 때까지 몇 번이든 뒤집어도 된다. 지는 일이 없다.
   기록으로 남는 건 다 맞추기까지 뒤집은 횟수뿐이다. */
const LEVELS = {
  easy:   { name: '쉬움',   cols: 3, pairs: 6  },
  normal: { name: '보통',   cols: 4, pairs: 8  },
  hard:   { name: '어려움', cols: 4, pairs: 10 }
};
const FACES = ['🐶','🐱','🐰','🐼','🦊','🐯','🦁','🐸','🐵','🐨','🐷','🐔','🦄','🐝','🐳','🦋','🌻','🍓','🍉','🍰','🚗','🚀','⚽','🎈'];
const PEEK_MS = 2000;              // 잠깐 보기로 열어 두는 시간
const HIDE_MS = 700;               // 틀린 딱지가 도로 엎어지기까지
const KEY_LEVEL = 'craft-memory-level';
const KEY_BEST  = 'craft-memory-best';   // 난이도별로 따로 쌓인다

const boardEl = document.getElementById('board');
const coverEl = document.getElementById('cover');
const coverMsg = document.getElementById('coverMsg');
const coverBtn = document.getElementById('coverBtn');
const pairsEl = document.getElementById('pairs');
const flipsEl = document.getElementById('flips');
const bestEl = document.getElementById('best');
const hintEl = document.getElementById('hint');
const peekBtn = document.getElementById('peekBtn');
const levelRow = document.getElementById('levelRow');

let key, lv;
let tiles = [];          // { el, face, done }
let opened = [];         // 지금 열려 있는 딱지
let flips, matched;
let locked = false;      // 되엎는 동안은 못 누른다
let peekLeft = 1;
let done = false;

/* ---------- 새 게임 ---------- */

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newGame() {
  tiles = [];
  opened = [];
  flips = 0;
  matched = 0;
  locked = false;
  peekLeft = 1;
  done = false;

  const picked = shuffle(FACES.slice()).slice(0, lv.pairs);
  const deck = shuffle(picked.concat(picked));

  boardEl.style.gridTemplateColumns = 'repeat(' + lv.cols + ', 1fr)';
  boardEl.innerHTML = '';
  deck.forEach((face, i) => {
    const el = document.createElement('button');
    el.className = 'tile';
    el.type = 'button';
    el.setAttribute('aria-label', '딱지 ' + (i + 1));
    el.innerHTML = '<span class="inner">' +
      '<span class="face back">?</span>' +
      '<span class="face front">' + face + '</span>' +
      '</span>';
    const t = { el, face, done: false };
    el.addEventListener('click', () => tap(t));
    boardEl.appendChild(el);
    tiles.push(t);
  });

  coverEl.classList.remove('on');
  peekBtn.disabled = false;
  hintEl.textContent = '딱지를 눌러서 시작';
  paint();
}

/* ---------- 뒤집기 ---------- */

function tap(t) {
  if (locked || done || t.done || opened.includes(t)) return;

  t.el.classList.add('open');
  opened.push(t);

  if (opened.length < 2) {
    hintEl.textContent = '한 장 더 뒤집어 보자';
    return;
  }

  flips++;
  paint();

  const [a, b] = opened;
  if (a.face === b.face) {
    a.done = b.done = true;
    a.el.classList.add('done');
    b.el.classList.add('done');
    a.el.classList.remove('open');
    b.el.classList.remove('open');
    opened = [];
    matched++;
    paint();
    if (matched === lv.pairs) return win();
    hintEl.innerHTML = '<b>짝이다!</b> 남은 짝 ' + (lv.pairs - matched) + '개';
    return;
  }

  locked = true;
  a.el.classList.add('miss');
  b.el.classList.add('miss');
  hintEl.textContent = '다른 그림이다';
  setTimeout(() => {
    [a, b].forEach(t => t.el.classList.remove('open', 'miss'));
    opened = [];
    locked = false;
  }, HIDE_MS);
}

/* ---------- 잠깐 보기 ---------- */

function peek() {
  if (locked || done || peekLeft <= 0) return;
  peekLeft--;
  peekBtn.disabled = true;
  locked = true;

  const shown = tiles.filter(t => !t.done && !opened.includes(t));
  shown.forEach(t => t.el.classList.add('open'));
  hintEl.textContent = '잘 봐 두자';

  setTimeout(() => {
    shown.forEach(t => t.el.classList.remove('open'));
    locked = false;
    hintEl.textContent = '이제 찾아 보자';
  }, PEEK_MS);
}

/* ---------- 다 맞췄을 때 ---------- */

function win() {
  done = true;
  peekBtn.disabled = true;

  const best = loadBest();
  const isNew = best === null || flips < best;
  if (isNew) saveBest(flips);
  paint();

  coverMsg.innerHTML = '다 맞췄다! 🎉' +
    '<small>' + flips + '번 뒤집었다' +
    (isNew ? ' · 새 기록이다!' : ' · 최고 기록은 ' + best + '번') + '</small>';
  coverEl.classList.add('on');
  hintEl.innerHTML = '<b>' + lv.pairs + '짝 모두 완성</b>';
}

/* ---------- 기록 ---------- */

function loadBest() {
  let raw = null;
  try { raw = localStorage.getItem(KEY_BEST + '-' + key); } catch (e) {}
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : null;
}
function saveBest(n) {
  try { localStorage.setItem(KEY_BEST + '-' + key, String(n)); } catch (e) {}
}

function paint() {
  pairsEl.textContent = matched;
  flipsEl.textContent = flips;
  const best = loadBest();
  bestEl.textContent = best === null ? '-' : best + '번';
}

/* ---------- 난이도 ---------- */

function setLevel(k) {
  key = LEVELS[k] ? k : 'normal';
  lv = LEVELS[key];
  try { localStorage.setItem(KEY_LEVEL, key); } catch (e) {}
  [...levelRow.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === key)));
  newGame();
}

levelRow.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setLevel(b.dataset.k);
});
peekBtn.addEventListener('click', peek);
document.getElementById('newBtn').addEventListener('click', newGame);
coverBtn.addEventListener('click', newGame);

let startKey = 'normal';
try { startKey = localStorage.getItem(KEY_LEVEL) || 'normal'; } catch (e) {}
setLevel(startKey);
</script>
</body>
</html>
