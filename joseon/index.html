<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>평민에서 왕까지</title>
<style>
  :root{
    --paper:#F7EEDB; --ink:#3A2E22; --dim:#8A7860;
    --red:#C1362F; --blue:#2E5E86; --gold:#D8A63C; --green:#41794C;
    --line:rgba(58,46,34,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#E3D2B2;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.55), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(193,54,47,.10), transparent 45%);
    color:var(--ink);
    user-select:none;
  }
  .wrap{
    height:100dvh;
    max-width:520px; margin:0 auto;
    padding:10px 12px 12px;
    display:flex; flex-direction:column; gap:8px;
  }

  /* ---------- 위쪽: 지금 내 신분 ---------- */
  .top{
    background:var(--paper);
    border-radius:14px;
    padding:8px 12px;
    box-shadow:0 3px 10px rgba(58,46,34,.16);
    display:flex; align-items:center; gap:10px;
  }
  .badge{
    width:44px; height:44px; flex:none;
    border-radius:50%;
    background:#fff; border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    transition:transform .3s;
  }
  .badge.pop{transform:scale(1.35) rotate(-12deg);}
  .who{flex:1; min-width:0;}
  .who b{font-size:clamp(17px,5vw,21px); letter-spacing:.02em;}
  .who small{display:block; font-size:12px; color:var(--dim); margin-top:1px;}
  .restart{
    flex:none;
    border:none; background:transparent;
    font-size:18px; color:var(--dim);
    padding:6px; cursor:pointer;
  }

  /* ---------- 가진 것 ---------- */
  .stats{display:flex; gap:6px;}
  .chip{
    flex:1;
    background:var(--paper);
    border-radius:12px;
    padding:6px 4px;
    text-align:center;
    box-shadow:0 2px 6px rgba(58,46,34,.12);
    position:relative;
    transition:transform .18s;
  }
  .chip.pop{transform:translateY(-4px) scale(1.06);}
  .chip .ic{font-size:15px;}
  .chip .num{display:block; font-size:clamp(15px,4.4vw,19px); font-weight:800; line-height:1.2;}
  .chip .nm{display:block; font-size:10.5px; color:var(--dim);}
  .fly{
    position:absolute; left:0; right:0; top:-2px;
    font-size:14px; font-weight:800;
    pointer-events:none;
    animation:fly .9s ease-out forwards;
  }
  .fly.up{color:var(--green);}
  .fly.down{color:var(--red);}
  @keyframes fly{
    from{opacity:0; transform:translateY(6px) scale(.8);}
    25%{opacity:1; transform:translateY(-6px) scale(1.1);}
    to{opacity:0; transform:translateY(-26px) scale(1);}
  }

  /* ---------- 가운데: 풍경과 말 ---------- */
  .scene{
    flex:1; min-height:0;
    background:linear-gradient(#DCEBF3 0%, #CFE6F0 38%, #E3D3AE 38%, #EDE1C4 100%);
    border-radius:16px;
    box-shadow:inset 0 2px 10px rgba(58,46,34,.14);
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px 12px;
    overflow:hidden;
  }
  .sun{position:absolute; top:8px; right:14px; font-size:20px; opacity:.85;}
  .place{
    font-size:clamp(28px,10vw,46px);
    letter-spacing:.06em;
    line-height:1.1;
    filter:drop-shadow(0 3px 4px rgba(58,46,34,.25));
    transition:transform .35s;
  }
  .place.hop{transform:translateY(-8px);}
  .hero{
    font-size:clamp(34px,12vw,54px);
    line-height:1;
    margin-top:2px;
    filter:drop-shadow(0 4px 5px rgba(58,46,34,.3));
  }
  .hero.work{animation:work .42s ease-in-out;}
  @keyframes work{
    30%{transform:translateY(-10px) rotate(-10deg);}
    60%{transform:translateY(0) rotate(8deg);}
  }
  .say{
    margin-top:8px;
    max-width:92%;
    background:#fff;
    border-radius:4px 14px 14px 14px;
    padding:8px 12px;
    font-size:clamp(13px,3.7vw,15px);
    line-height:1.5;
    text-align:center;
    word-break:keep-all;
    box-shadow:0 3px 9px rgba(58,46,34,.16);
    animation:sayIn .3s ease-out;
  }
  @keyframes sayIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ---------- 다음 신분까지 ---------- */
  .goal{
    background:var(--paper);
    border-radius:14px;
    padding:8px 12px 9px;
    box-shadow:0 3px 10px rgba(58,46,34,.14);
  }
  .goal h2{
    font-size:12.5px; color:var(--dim); font-weight:700;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:5px;
  }
  .goal h2 span{color:var(--ink); font-size:13.5px;}
  .bars{display:flex; flex-direction:column; gap:4px;}
  .bar{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--dim);
  }
  .bar .track{
    flex:1; height:9px;
    background:#E6D8BD; border-radius:9px; overflow:hidden;
  }
  .bar .track i{
    display:block; height:100%;
    border-radius:9px;
    background:linear-gradient(90deg,#E8B94C,#C1362F);
    transition:width .45s cubic-bezier(.2,.9,.3,1);
  }
  .bar.done .track i{background:linear-gradient(90deg,#6BBF7B,#41794C);}
  .bar .n{width:76px; text-align:right; font-variant-numeric:tabular-nums;}
  .up-btn{
    width:100%; margin-top:7px;
    border:none; border-radius:11px;
    padding:10px;
    font-family:inherit; font-size:15px; font-weight:800;
    background:linear-gradient(#E8B94C,#D8A63C);
    color:#4A3410;
    box-shadow:0 3px 0 #A97F22;
    cursor:pointer;
    animation:glow 1.1s ease-in-out infinite alternate;
  }
  .up-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #A97F22;}
  @keyframes glow{from{filter:brightness(1);} to{filter:brightness(1.18);}}

  /* ---------- 아래: 오늘 할 일 카드 ---------- */
  .hand{display:flex; gap:7px;}
  .card{
    position:relative;
    flex:1; min-width:0;
    background:var(--paper);
    border:2px solid transparent;
    border-radius:14px;
    padding:9px 4px 8px;
    font-family:inherit; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 3px 0 rgba(58,46,34,.18);
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
    animation:dealIn .28s ease-out backwards;
  }
  .card:nth-child(2){animation-delay:.05s;}
  .card:nth-child(3){animation-delay:.1s;}
  @keyframes dealIn{from{opacity:0; transform:translateY(14px) rotate(4deg);} to{opacity:1; transform:none;}}
  .card:active{transform:translateY(3px); box-shadow:0 0 0 rgba(58,46,34,.18);}
  .card .ci{font-size:clamp(20px,6.5vw,26px);}
  .card .cn{font-size:clamp(11px,3.2vw,13px); font-weight:700; text-align:center; word-break:keep-all; line-height:1.25;}
  .card .cg{font-size:11px; font-weight:800; display:flex; gap:5px; flex-wrap:wrap; justify-content:center;}
  .card .cg .plus{color:var(--green);}
  .card .cg .minus{color:var(--red);}
  .card.poor{opacity:.42;}
  .card.star{border-color:var(--gold);}
  .card .tag{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#4A3410;
    font-size:10px; font-weight:800; white-space:nowrap;
    border-radius:8px; padding:1px 6px;
  }
  .card.lucky{
    background:linear-gradient(#FFF6D8,#F7E2A0);
    border-color:#E0A21C;
    animation:dealIn .28s ease-out backwards, shine 1s ease-in-out infinite alternate;
  }
  .card.lucky .tag{background:var(--red); color:#fff;}
  @keyframes shine{from{box-shadow:0 3px 0 rgba(58,46,34,.18);} to{box-shadow:0 0 14px 3px rgba(232,185,76,.85);}}
  .realm{
    margin-top:2px; min-height:1em;
    font-size:clamp(17px,5.5vw,24px); letter-spacing:.08em;
    filter:drop-shadow(0 2px 3px rgba(58,46,34,.2));
  }
  .realm .new{display:inline-block; animation:popIn .6s cubic-bezier(.2,1.6,.4,1);}
  @keyframes popIn{from{transform:scale(0) rotate(-40deg);} to{transform:none;}}
  .stars{font-size:28px; letter-spacing:.15em; margin-top:6px;}

  /* ---------- 사건 · 시험 · 즉위 ---------- */
  .veil{
    position:fixed; inset:0;
    background:rgba(40,30,18,.55);
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    z-index:9;
    animation:fade .2s;
  }
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .sheet{
    width:100%; max-width:400px;
    max-height:88dvh; overflow-y:auto;
    background:var(--paper);
    border-radius:18px;
    padding:20px 18px 18px;
    text-align:center;
    box-shadow:0 14px 40px rgba(30,20,10,.4);
    animation:rise .26s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes rise{from{opacity:0; transform:translateY(22px) scale(.95);} to{opacity:1; transform:none;}}
  .sheet .big{font-size:48px; line-height:1.1;}
  .sheet h3{font-size:19px; margin:8px 0 6px; word-break:keep-all;}
  .sheet p{font-size:14px; line-height:1.6; color:#5B4B39; word-break:keep-all;}
  .sheet .kicker{font-size:12px; color:var(--red); font-weight:800; letter-spacing:.1em;}
  .opts{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .opt{
    border:2px solid var(--line); border-radius:12px;
    background:#fff; color:var(--ink);
    font-family:inherit; font-size:14.5px; font-weight:700;
    padding:11px 10px;
    cursor:pointer;
    transition:transform .1s, background .15s;
    word-break:keep-all;
  }
  .opt:active{transform:scale(.97);}
  .opt.right{background:#DFF3E1; border-color:var(--green);}
  .opt.wrong{background:#F6DCDA; border-color:var(--red); opacity:.55;}
  .opt.wrong.shake{animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .ok{
    margin-top:14px; width:100%;
    border:none; border-radius:12px;
    padding:12px;
    font-family:inherit; font-size:15.5px; font-weight:800;
    background:linear-gradient(#E8B94C,#D8A63C); color:#4A3410;
    box-shadow:0 3px 0 #A97F22;
    cursor:pointer;
  }
  .ok:active{transform:translateY(2px); box-shadow:0 1px 0 #A97F22;}
  .gift{font-size:13px; font-weight:800; color:var(--green); margin-top:8px;}
  .note{font-size:11.5px; color:var(--dim); margin-top:12px; line-height:1.5;}
  .deeds{margin-top:10px; text-align:left;}
  .deed{
    background:#fff;
    border-radius:9px;
    padding:7px 10px;
    margin-bottom:5px;
    font-size:13px;
    line-height:1.4;
    word-break:keep-all;
    box-shadow:0 1px 4px rgba(58,46,34,.12);
  }
  .dots{margin-top:10px; font-size:13px; letter-spacing:.3em;}

  /* 승급할 때 뿌리는 색종이 */
  .confetti{
    position:fixed; top:-16px;
    width:9px; height:14px;
    z-index:20; pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(105dvh) rotate(720deg);}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="badge" id="badge">👨‍🌾</div>
    <div class="who">
      <b id="rankName">평민</b>
      <small id="ageLine">15살 · 첫해</small>
    </div>
    <button class="restart" id="restart" type="button" title="처음부터">↺</button>
  </div>

  <div class="stats">
    <div class="chip" id="chipMoney"><span class="ic">💰</span><span class="num" id="numMoney">0</span><span class="nm">엽전</span></div>
    <div class="chip" id="chipStudy"><span class="ic">📚</span><span class="num" id="numStudy">0</span><span class="nm">학문</span></div>
    <div class="chip" id="chipHeart"><span class="ic">❤️</span><span class="num" id="numHeart">0</span><span class="nm">인망</span></div>
  </div>

  <div class="scene">
    <span class="sun" id="sun">☀️</span>
    <div class="place" id="place">🛖 🌾 🌾</div>
    <div class="hero" id="hero">👨‍🌾</div>
    <div class="realm" id="realm"></div>
    <div class="say" id="say">해 뜨면 밭에 나가는 평민. 언젠가 높은 사람이 되고 싶다!</div>
  </div>

  <div class="goal">
    <h2><span id="goalLabel">다음 신분까지</span> <span id="nextName">🧑‍💼 중인</span></h2>
    <div class="bars" id="bars"></div>
    <button class="up-btn" id="upBtn" type="button" hidden>🎉 신분 올리기!</button>
  </div>

  <div class="hand" id="hand"></div>
</div>

<script>
const $ = s => document.querySelector(s);

/* ---------- 소리 ---------- */
let ac = null;
function ensureAudio(){
  if(!ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) ac = new AC();
  }
  if(ac && ac.state === 'suspended') ac.resume();
}
function tone(freq, dur, type, vol){
  if(!ac) return;
  const at = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ac.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function melody(list, gap, dur, vol){
  list.forEach((f,i) => setTimeout(() => tone(f, dur, 'triangle', vol), i*gap));
}
const sfx = {
  tap:  () => tone(620, .06, 'triangle', .07),
  gain: () => melody([700, 980], 70, .09, .08),
  lose: () => tone(200, .12, 'sine', .06),
  right:() => melody([784, 1046], 90, .14, .10),
  wrong:() => tone(170, .16, 'square', .06),
  lucky:() => melody([880, 1175, 1568], 60, .12, .10),
  up:   () => melody([523, 659, 784, 1046], 110, .22, .11),
  king: () => melody([523, 659, 784, 1046, 1318, 1046, 1318], 150, .3, .12)
};

/* ---------- 신분 사다리 ----------
   unit 은 그 신분에서 한 번에 오가는 값의 크기다.
   사건의 보상을 unit 으로 적어 두면 신분이 올라가도 알맞게 커진다. */

    need:{money:30},

      {ico:'🌾', name:'밭 갈기',    gain:{money:10},           line:'하루 종일 밭을 갈아 엽전을 벌었다.'},
      {ico:'🪵', name:'나무하기',   gain:{money:8, heart:2},   line:'나무를 해다 팔고, 이웃집에도 한 짐 나눠 줬다.'},
      {ico:'📖', name:'서당 기웃',  gain:{study:6},            line:'담 너머로 글 읽는 소리를 몰래 따라 했다.'},
      {ico:'🤝', name:'이웃 돕기',  gain:{heart:8},            line:'아픈 이웃의 밭을 대신 매 주었다.'},
      {ico:'🐟', name:'물고기 잡기',gain:{money:7, study:2},   line:'냇가에서 물고기를 잡아 장에 내다 팔았다.'}
    ]
  },
  {
    name:'중인', ico:'🧑‍💼', place:'🏪 🧺 🐴', unit:18,

    need:{money:95, study:60},
    cards:[
      {ico:'🧺', name:'장터에서 팔기', gain:{money:22},            line:'목이 쉬도록 외쳐 물건을 다 팔았다.'},
      {ico:'🌿', name:'약초 팔기',     gain:{money:15, heart:4},   line:'아픈 사람에게 약초를 싸게 내어 주었다.'},
      {ico:'📚', name:'책 사서 읽기',  gain:{money:-8, study:16},  line:'비싼 책을 한 권 사서 밤새 읽었다.'},
      {ico:'🍵', name:'손님 대접',     gain:{heart:12},            line:'먼 길 온 손님에게 따뜻한 차를 내었다.'},
      {ico:'⚖️', name:'저울 고치기',   gain:{money:13, study:5},   line:'저울을 고쳐 주고 셈하는 법도 배웠다.'}
    ]
  },
  {
    name:'양반', ico:'🧑‍🎓', place:'🏯 🎋 📚', unit:30,
    say:'갓을 쓰고 글을 읽는다. 다음은 소과다!',
    need:{study:190, money:215},
    cards:[
      {ico:'✍️', name:'밤새 글공부',  gain:{study:28},              line:'호롱불 아래서 밤이 새도록 글을 읽었다.'},
      {ico:'🧑‍🏫', name:'스승께 배우기',gain:{money:-20, study:42},  line:'이름난 스승을 찾아가 가르침을 받았다.'},

      {ico:'🖋️', name:'책 펴내기',     gain:{money:-30, study:80},  line:'손수 쓴 책을 펴내 이름이 널리 알려졌다.'},
      {ico:'🧒', name:'제자 기르기',   gain:{heart:52},             line:'가난한 아이도 성균관에 들여 가르쳤다.'},
      {ico:'🏫', name:'성균관 살림',   gain:{money:64},             line:'성균관 살림을 알뜰하게 꾸렸다.'},

      {ico:'🏮', name:'사랑방 글방',   gain:{money:56, study:14},   line:'사랑방에 글방을 열자 배우러 몰려왔다.'}

  },
  {
    name:'현감', ico:'🧑‍⚖️', place:'🏛️ 🚩 🐎', unit:66,
    say:'대과에 급제! 한 고을을 맡았다. 백성이 나를 지켜본다.',
    need:{heart:560, money:740},
    cards:[

function fresh(){
  return {rank:0, turn:0, age:15, money:0, study:0, heart:0,
          hand:null, say:RANKS[0].say,
          deeds:[], crown:null, crownAge:0, crownTurn:0, star:null, lucky:null};
}
function isKing(){ return S.rank === RANKS.length - 1; }
function madeSince(k){ return S[k] - (S.crown ? S.crown[k] : 0); }   // 임금이 된 뒤로 모은 것
function nextDeed(k){
  return DEEDS.filter(d => d.k === k && S.deeds.indexOf(d.id) < 0)
              .sort((x, y) => x.at - y.at)[0];
}
function pendingDeeds(){
  return DEEDS.filter(d => S.deeds.indexOf(d.id) < 0 && madeSince(d.k) >= d.at)
              .sort((x, y) => x.at - y.at);
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(typeof d.rank === 'number') return Object.assign(fresh(), d);
    }
  }catch(e){}
  return fresh();
}

/* ---------- 카드 뽑기 ---------- */
function shuffled(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
/* 손패 나눠 주기.
   1) 아직 모자란 것을 깎아 먹는 카드는 잠시 빼 둔다
   2) 모자란 것마다 채워 주는 카드를 한 장씩 넣는다
   3) 적어도 두 장은 도움이 되는 카드로 채운다
   아무 카드나 눌러도 이야기가 앞으로 가야 재미있다. */
function dealHand(){
  const r = RANKS[S.rank];
  if(!r || !r.cards.length){ S.hand = []; return; }
  const pool = r.cards;
  const need = r.need || {};
  const lack = STATS.map(s => s.k).filter(k => (need[k] || 0) > S[k]);
  const ok = pool.map((c, i) => i).filter(i =>
    !lack.some(k => (pool[i].gain[k] || 0) < 0) &&
    S.money + (pool[i].gain.money || 0) >= 0);
  const helps = ok.filter(i => lack.some(k => (pool[i].gain[k] || 0) > 0));
  const take = [];
  const push = i => { if(i !== undefined && take.length < 3 && take.indexOf(i) < 0) take.push(i); };

  lack.slice()
      .sort((a, b) => (need[b] - S[b]) - (need[a] - S[a]))   // 제일 모자란 것부터
      .forEach(k => push(shuffled(helps).find(i =>
        (pool[i].gain[k] || 0) > 0 && take.indexOf(i) < 0)));
  shuffled(helps).forEach(i => { if(take.length < 2) push(i); });
  shuffled(ok).forEach(push);
  shuffled(pool.map((c, i) => i)).forEach(push);
  S.hand = shuffled(take);
  // 지금 제일 도움되는 카드에 ⭐. 고르는 법을 저절로 배운다
  // 남은 만큼만 쳐 준다. 이미 다 모은 것을 더 주는 카드는 도움이 안 되니까
  const left = remaining();
  const score = i => Object.keys(left).reduce((t, k) => t + Math.min(pool[i].gain[k] || 0, left[k]), 0);
  const playable = S.hand.filter(i => S.money + (pool[i].gain.money || 0) >= 0);
  S.star = playable.length ? playable.reduce((a, b) => score(b) > score(a) ? b : a) : null;
  // 다섯 번에 한 번쯤 반짝이는 두 배 카드가 섞인다
  S.lucky = Math.random() < 0.22 ? S.hand[Math.floor(Math.random() * S.hand.length)] : null;
}
/* 아직 더 모아야 하는 양: 신하일 때는 다음 신분까지, 임금일 때는 마지막 치적까지 */
function remaining(){
  const out = {};
  STATS.forEach(s => {
    const goal = isKing() ? Math.max(...DEEDS.filter(d => d.k === s.k).map(d => d.at)) + S.crown[s.k]
                          : (RANKS[S.rank].need || {})[s.k] || 0;
    if(goal > S[s.k]) out[s.k] = goal - S[s.k];
  });
  return out;
}
function luckyGain(g){
  const out = {};
  Object.keys(g).forEach(k => { out[k] = g[k] > 0 ? g[k] * 2 : g[k]; });   // 좋은 것만 두 배
  return out;
}
function drawTop(){
  const r = RANKS[S.rank];
  $('#badge').textContent = r.ico;
  $('#rankName').textContent = r.name;
  $('#ageLine').textContent = S.age + '살 · ' +
    (isKing() ? '다스린 해 ' + reignYears() + ' / ' + REIGN
              : (S.turn === 0 ? '첫해' : (S.turn + 1) + '년째'));
  $('#place').textContent = r.place;
  $('#hero').textContent = r.ico;
  $('#say').textContent = S.say;
  $('#sun').textContent = ['☀️','🌤️','⛅','🌙','⭐'][S.turn % 5];
  drawRealm();
}
/* 임금이 이룬 일이 풍경에 하나씩 늘어난다 */
let realmShown = 0;
function drawRealm(){
  const ds = isKing() ? S.deeds : [];
  $('#realm').innerHTML = ds.map((id, i) =>
    '<span' + (i >= realmShown ? ' class="new"' : '') + '>' +
    DEEDS[id].ico + '</span>').join('');
  realmShown = ds.length;
}
function reignYears(){ return S.turn - S.crownTurn; }
function drawStats(){
  STATS.forEach(s => {
    document.getElementById('num' + s.k[0].toUpperCase() + s.k.slice(1)).textContent = S[s.k];
  });
}
function drawGoal(){
  const r = RANKS[S.rank];
  const bars = $('#bars');
  if(!r.need){                                   // 임금이 되면 신분 대신 치적을 쌓는다
    $('#goalLabel').textContent = '임금이 이룬 일';
    $('#nextName').textContent = '📜 치적 ' + S.deeds.length + ' / ' + DEEDS.length;
    bars.innerHTML = STATS.map(s => {
      const nd = nextDeed(s.k);
      if(!nd) return '<div class="bar done"><span>' + s.ic + '</span>' +
        '<span class="track"><i style="width:100%"></i></span>' +
        '<span class="n">다 이뤘다!</span></div>';
      const made = Math.min(madeSince(s.k), nd.at);
      const pct = Math.round(made / nd.at * 100);
      return '<div class="bar"><span>' + s.ic + '</span>' +
             '<span class="track"><i style="width:' + pct + '%"></i></span>' +
             '<span class="n">' + made + ' / ' + nd.at + '</span></div>';
    }).join('');
    $('#upBtn').hidden = true;
    return;
  }
  const nx = RANKS[S.rank + 1];
  $('#goalLabel').textContent = '다음 신분까지';
  $('#nextName').textContent = nx.ico + ' ' + nx.name;
  bars.innerHTML = STATS.filter(s => r.need[s.k]).map(s => {
    const have = Math.min(S[s.k], r.need[s.k]);
    const pct = Math.round(have / r.need[s.k] * 100);
    return '<div class="bar' + (pct >= 100 ? ' done' : '') + '">' +
             '<span>' + s.ic + '</span>' +
             '<span class="track"><i style="width:' + pct + '%"></i></span>' +
             '<span class="n">' + have + ' / ' + r.need[s.k] + '</span>' +
           '</div>';
  }).join('');
  $('#upBtn').hidden = !canRankUp();
}
function canRankUp(){
  const need = RANKS[S.rank].need;
  if(!need) return false;
  return Object.keys(need).every(k => S[k] >= need[k]);
}
function gainText(g){
  return STATS.filter(s => g[s.k]).map(s => {
    const v = g[s.k];
    return '<span class="' + (v > 0 ? 'plus' : 'minus') + '">' +
           (v > 0 ? '+' : '') + v + s.ic + '</span>';
  }).join('');
}
function drawHand(){
  const pool = (RANKS[S.rank] && RANKS[S.rank].cards) || [];
  const hand = $('#hand');
  hand.innerHTML = '';
  if(!S.hand || !pool.length) return;
  S.hand.forEach(idx => {
    const c = pool[idx];
    if(!c) return;
    const poor = (c.gain.money || 0) < 0 && S.money + c.gain.money < 0;
    const lucky = !poor && idx === S.lucky;
    const star = !poor && !lucky && idx === S.star;
    const b = document.createElement('button');
    b.className = 'card' + (poor ? ' poor' : '') + (lucky ? ' lucky' : '') + (star ? ' star' : '');
    b.type = 'button';
    b.innerHTML = (lucky ? '<span class="tag">✨ 두 배!</span>' : star ? '<span class="tag">⭐ 추천</span>' : '') +
                  '<span class="ci">' + c.ico + '</span>' +
                  '<span class="cn">' + c.name + '</span>' +
                  '<span class="cg">' + (poor ? '엽전 부족' : gainText(lucky ? luckyGain(c.gain) : c.gain)) + '</span>';
    b.addEventListener('click', () => { if(!poor) playCard(idx); else sfx.wrong(); });
    hand.appendChild(b);
  });
}
function drawAll(){ drawTop(); drawStats(); drawGoal(); drawHand(); }

/* ---------- 숫자가 오르내리는 느낌 ---------- */
function apply(gain, quiet){
  STATS.forEach(s => {
    const v = gain[s.k];
    if(!v) return;
    S[s.k] = Math.max(0, S[s.k] + v);
    if(quiet) return;
    const chip = document.getElementById('chip' + s.k[0].toUpperCase() + s.k.slice(1));
    chip.classList.add('pop');
    setTimeout(() => chip.classList.remove('pop'), 200);
    const f = document.createElement('span');
    f.className = 'fly ' + (v > 0 ? 'up' : 'down');
    f.textContent = (v > 0 ? '+' : '') + v;
    chip.appendChild(f);
    setTimeout(() => f.remove(), 900);
  });
  drawStats();
  if(!quiet){
    const down = STATS.some(s => (gain[s.k] || 0) < 0);
    down ? sfx.lose() : sfx.gain();
  }
}

/* ---------- 한 턴 ---------- */
function playCard(idx){
  if(busy) return;
  busy = true;
  ensureAudio();
  sfx.tap();
  const c = RANKS[S.rank] && RANKS[S.rank].cards[idx];
  if(!c){ busy = false; return; }
  const lucky = idx === S.lucky;
  apply(lucky ? luckyGain(c.gain) : c.gain);
  if(lucky){ setTimeout(sfx.lucky, 120); confetti(18); }
  S.say = (lucky ? '✨ 운이 좋았다! ' : '') + c.line;
  S.turn++;
  S.age = isKing() ? S.age + 1 : 15 + Math.floor(S.turn * 0.7);
  const place = $('#place');
  place.classList.add('hop');
  setTimeout(() => place.classList.remove('hop'), 350);
  const hero = $('#hero');
  hero.classList.remove('work');
  void hero.offsetWidth;                       // 같은 동작을 다시 하려면 한 번 끊어 줘야 한다
  hero.classList.add('work');

  setTimeout(() => {
    dealHand();
    drawAll();
    save();
    afterTurn();
  }, 420);
}
/* 한 턴이 끝나면 차례대로 살핀다: 이룬 일 → 돌아가실 때 → 마을에 생긴 일 */
function afterTurn(noEvent){
  if(isKing()){
    const got = pendingDeeds();
    if(got.length){ showDeed(got[0]); return; }      // 치적은 한 번에 하나씩
    if(S.deeds.length >= DEEDS.length || reignYears() >= REIGN){ passThrone(); return; }
  }
  if(!noEvent && Math.random() < 0.34) showEvent();  // 세 번에 한 번쯤
  else busy = false;
}

/* ---------- 사건 ---------- */
function unitize(e){
  const u = RANKS[S.rank].unit;
  const out = {};
  if(e.rand){                                    // 보름달 소원: 아무거나 하나 크게
    const pick = STATS[Math.floor(Math.random() * 3)].k;
    out[pick] = e.rand * u;
    return out;
  }
  STATS.forEach(s => { if(e[s.k]) out[s.k] = Math.round(e[s.k] * u); });
  return out;
}
function sheet(html){
  const veil = document.createElement('div');
  veil.className = 'veil';
  veil.innerHTML = '<div class="sheet">' + html + '</div>';
  document.body.appendChild(veil);
  return veil;
}
/* 사건은 섞어 놓은 더미에서 한 장씩 꺼낸다.
   그래야 열두 가지가 다 나오기 전에 같은 일이 또 생기지 않는다. */
let eventBag = [];
function nextEvent(){
  const list = isKing() ? KING_EVENTS : EVENTS;
  if(eventBag.list !== list || !eventBag.length){ eventBag = shuffled(list.map((e, i) => i)); eventBag.list = list; }
  return list[eventBag.pop()];
}
function showEvent(){
  const ev = nextEvent();
  const veil = sheet(
    '<div class="kicker">이런 일이!</div>' +
    '<div class="big">' + ev.ico + '</div>' +
    '<h3>' + ev.title + '</h3>' +
    '<p>' + ev.text + '</p>' +
    '<div class="opts">' + ev.opts.map((o, i) =>
      '<button class="opt" data-i="' + i + '" type="button">' + o.l + '</button>').join('') +
    '</div>'
  );
  veil.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if(veil.dataset.done) return;            // 두 번 눌러도 한 번만 센다
      veil.dataset.done = '1';
      const o = ev.opts[+btn.dataset.i];
      const gain = unitize(o.e);
      veil.remove();
      apply(gain);
      S.say = o.r;
      drawAll();
      save();
      // 사건으로 치적을 이루면 바로 알려 준다
      if(isKing() && pendingDeeds().length){ showDeed(pendingDeeds()[0]); return; }
      busy = false;
    });
  });
}

/* ---------- 과거 시험 ---------- */
function askQuiz(count, title, done){
  const picks = shuffled(QUIZ.map((q, i) => i)).slice(0, count);
  let at = 0;
  function fail(q){
    sfx.wrong();
    const veil = sheet(
      '<div class="kicker">낙 방</div>' +
      '<div class="big">📕</div>' +
      '<h3>낙방…</h3>' +
      '<p>한 문제를 틀려 이번에는 붙지 못했어요.</p>' +
      '<div class="gift">정답: ' + q.a[0] + '</div>' +
      '<div class="note">외워 두면 다음에는 붙어요!</div>' +
      '<button class="ok" type="button">다시 도전하기</button>'
    );
    veil.querySelector('.ok').addEventListener('click', () => {
      if(veil.dataset.done) return;
      veil.dataset.done = '1';
      veil.remove();
      drawAll();
      busy = false;                              // 신분은 그대로. 언제든 다시 볼 수 있다
    });
  }
  function one(){
    if(at >= picks.length){ done(); return; }
    const q = QUIZ[picks[at]];
    const right = q.a[0];
    const opts = shuffled(q.a);
    const veil = sheet(
      '<div class="kicker">' + title + '</div>' +
      '<div class="big">📜</div>' +
      '<h3>' + q.q + '</h3>' +
      '<div class="opts">' + opts.map(t =>
        '<button class="opt" type="button">' + t + '</button>').join('') +
      '</div>' +
      '<div class="dots">' + picks.map((_, i) => i < at ? '●' : '○').join('') + '</div>' +
      '<div class="note">한 문제라도 틀리면 낙방이에요!</div>'
    );
    veil.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        if(veil.dataset.done) return;
        veil.dataset.done = '1';
        if(btn.textContent === right){
          btn.classList.add('right');
          sfx.right();
          setTimeout(() => { veil.remove(); at++; one(); }, 620);
        }else{
          btn.classList.add('wrong', 'shake');
          setTimeout(() => { veil.remove(); fail(q); }, 700);
        }
      });
    });
  }
  one();
}

/* ---------- 색종이 ---------- */
function confetti(n){
  const colors = ['#C1362F','#D8A63C','#2E5E86','#41794C','#E86A9B','#F7EEDB'];
  for(let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}

/* ---------- 신분 올리기 ---------- */
function rankUp(){
  if(busy || !canRankUp() || S.rank >= RANKS.length - 1) return;
  busy = true;
  ensureAudio();
  // 과거는 두 번 본다. 소과에 붙으면 성균관, 대과에 붙으면 벼슬이다
  if(S.rank === 2){
    askQuiz(2, '소 과', () => celebrate());
  }else if(S.rank === 3){
    askQuiz(3, '대 과', () => celebrate());
  }else{
    celebrate();
  }
}
function celebrate(){
  if(S.rank >= RANKS.length - 1) return;
  const nx = RANKS[S.rank + 1];
  const toKing = (S.rank + 1) === RANKS.length - 1;
  S.rank++;
  S.say = nx.say;
  // 새 신분이 되면 녹봉을 받는다 (다음 단계가 너무 멀지 않게)
  const bonus = {};
  if(!toKing) STATS.forEach(s => { bonus[s.k] = nx.unit * 2; });

  drawTop();                                   // 축하 창 뒤로 새 신분이 먼저 보이게
  confetti(toKing ? 90 : 40);
  toKing ? sfx.king() : sfx.up();
  const badge = $('#badge');
  badge.classList.add('pop');
  setTimeout(() => badge.classList.remove('pop'), 420);

  if(toKing){ crownKing(); return; }

  const veil = sheet(
    '<div class="kicker">신분이 올랐어요!</div>' +
    '<div class="big">' + nx.ico + '</div>' +
    '<h3>이제 ' + nx.name + '!</h3>' +
    '<p>' + nx.say + '</p>' +
    '<div class="gift">녹봉 +' + (nx.unit * 2) + ' 💰📚❤️</div>' +
    '<button class="ok" type="button">좋아!</button>'
  );
  veil.querySelector('.ok').addEventListener('click', () => {
    if(veil.dataset.done) return;
    veil.dataset.done = '1';
    veil.remove();
    apply(bonus);
    dealHand();
    drawAll();
    save();
    busy = false;
  });
}

/* ---------- 즉위식 ---------- */
function crownKing(){
  S.crown = {money:S.money, study:S.study, heart:S.heart};
  S.crownAge = S.age;
  S.crownTurn = S.turn;
  S.deeds = [];
  realmShown = 0;

  let best = S.turn;
  try{
    const b = parseInt(localStorage.getItem(KEY + '-best'));
    if(!isNaN(b)) best = Math.min(b, S.turn);
    localStorage.setItem(KEY + '-best', String(best));
  }catch(e){}

  const veil = sheet(
    '<div class="kicker">즉 위 식</div>' +
    '<div class="big">🤴👑</div>' +
    '<h3>전하 만세!</h3>' +
    '<p>밭을 갈던 아이가 ' + S.age + '살에 임금이 되었어요.</p>' +
    '<div class="gift">' + S.turn + '번 만에 해냈어요! (최고 기록 ' + best + '번)</div>' +
    '<div class="note">이제 <b>' + REIGN + '년</b> 동안 나라를 다스려요.<br>' +
    '좋은 일을 할 때마다 <b>치적</b>이 쌓이고 나라에 새 건물이 생겨요.<br>' +
    '치적 ' + DEEDS.length + '개를 모두 이루면 성군이에요! 👑</div>' +
    '<button class="ok" type="button">나라를 다스리러 가자!</button>'
  );
  veil.querySelector('.ok').addEventListener('click', () => {
    if(veil.dataset.done) return;
    veil.dataset.done = '1';
    veil.remove();
    dealHand();
    drawAll();
    save();
    busy = false;
  });
  setTimeout(() => confetti(50), 900);
  dealHand();
  drawAll();
  save();
}

/* ---------- 임금이 이룬 일 ---------- */
function showDeed(d){
  S.deeds.push(d.id);
  sfx.up();
  confetti(30);
  S.say = d.t + '.';
  drawAll();
  save();
  const veil = sheet(
    '<div class="kicker">치 적</div>' +
    '<div class="big">' + d.ico + '</div>' +
    '<h3>' + d.t + '!</h3>' +
    '<p>실록에 길이 남을 일이에요.<br>나라에 ' + d.ico + ' 이(가) 생겼어요!</p>' +
    '<div class="gift">치적 ' + S.deeds.length + ' / ' + DEEDS.length + '</div>' +
    '<button class="ok" type="button">좋아!</button>'
  );
  veil.querySelector('.ok').addEventListener('click', () => {
    if(veil.dataset.done) return;
    veil.dataset.done = '1';
    veil.remove();
    afterTurn(true);                             // 또 이룬 일이 있는지 이어서 살핀다 (사건은 한 턴에 한 번만)
  });
}

/* ---------- 왕위를 물려주다 ----------
   갑자기 돌아가시는 대신, 정해진 해가 다 지나거나 치적을 다 이루면
   세자에게 왕위를 물려주고 끝난다. 남은 해가 화면에 늘 보인다. */
function passThrone(){
  busy = true;
  S.hand = [];
  S.say = '세자에게 왕관을 씌워 주었다.';
  const n = S.deeds.length;
  const all = n >= DEEDS.length;
  const stars = all ? '⭐⭐⭐' : n >= 6 ? '⭐⭐☆' : n >= 3 ? '⭐☆☆' : '☆☆☆';
  const top = STATS.slice().sort((a, b) => madeSince(b.k) - madeSince(a.k))[0].k;
  const siho = all                ? '모든 것을 이룬 성군 👑'
             : top === 'study'    ? '글을 밝힌 임금 📚'
             : top === 'heart'    ? '백성을 품은 임금 ❤️'
             :                      '곳간을 채운 임금 💰';
  const list = n
    ? S.deeds.map(id => '<div class="deed">' + DEEDS[id].ico + ' ' + DEEDS[id].t + '</div>').join('')
    : '<div class="deed">큰 일은 없었지만, 나라는 조용하고 평안했어요.</div>';
  let best = n;
  try{
    const b = parseInt(localStorage.getItem(KEY + '-deeds'));
    if(!isNaN(b)) best = Math.max(b, n);
    localStorage.setItem(KEY + '-deeds', String(best));
  }catch(e){}
  all ? sfx.king() : sfx.up();
  confetti(all ? 120 : 40);

  const veil = sheet(
    '<div class="kicker">왕 위 를 물 려 주 다</div>' +
    '<div class="big">🤴➡️👦</div>' +
    '<h3>' + siho + '</h3>' +
    '<div class="stars">' + stars + '</div>' +
    '<p>' + (reignYears()) + '해 동안 나라를 다스리고<br>세자에게 왕위를 물려주었어요.</p>' +
    '<div class="gift">실록에 적힌 일 ' + n + ' / ' + DEEDS.length + ' (최고 ' + best + ')</div>' +
    '<div class="deeds">' + list + '</div>' +
    '<div class="note">' + (all ? '' : '다음에는 ⭐ 추천 카드를 골라 보세요. 치적을 더 빨리 이뤄요!<br><br>') +
    '진짜 조선에서는 평민이 임금이 될 수 없었어요. 임금의 아들이 임금이 되었거든요.<br>' +
    '태종은 살아 있을 때 아들 세종에게 왕위를 물려주기도 했어요.</div>' +
    '<button class="ok" type="button">처음부터 다시</button>'
  );
  veil.querySelector('.ok').addEventListener('click', () => {
    if(veil.dataset.done) return;
    veil.dataset.done = '1';
    veil.remove();
    reset();
  });
  drawAll();
  save();
}

/* ---------- 시작 ---------- */
function reset(){
  S = fresh();
  dealHand();
  drawAll();
  save();
  busy = false;
}
$('#upBtn').addEventListener('click', rankUp);
$('#restart').addEventListener('click', () => {
  if(confirm('처음부터 다시 할까요?')) reset();
});

S = load();
if(S.rank >= RANKS.length && S.rank !== RANKS.length - 1) S = fresh();   // 알 수 없는 신분이면 새로
if(isKing() && (reignYears() >= REIGN || S.deeds.length >= DEEDS.length)) S = fresh();   // 이미 끝난 판은 새로
if(S.deathAge && S.age >= S.deathAge) S = fresh();                       // 예전 방식으로 승하한 판도 새로
delete S.deathAge;                                                       // 이제는 승하가 없으니 지운다
if(isKing() && S.deeds.some(id => !DEEDS[id])) S.deeds = [];                    // 예전 저장이면 치적만 새로
if(!S.hand || !S.hand.length) dealHand();
realmShown = isKing() ? S.deeds.length : 0;
drawAll();
</script>
