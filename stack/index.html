<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>낙하 스택 쌓기</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#12121F;
    color:#F2F2FA;
    display:flex; justify-content:center;
    touch-action:manipulation;
  }
  #wrap{position:relative; width:100%; max-width:480px; height:100%;}
  canvas{display:block; width:100%; height:100%;}

  #score{
    position:absolute; top:20px; left:0; right:0;
    text-align:center;
    font-size:3rem; font-weight:900;
    text-shadow:0 3px 12px rgba(0,0,0,.5);
    pointer-events:none;
    z-index:2;
  }
  #combo{
    position:absolute; top:86px; left:0; right:0;
    text-align:center;
    font-size:1.1rem; font-weight:800;
    color:#FFD166;
    opacity:0; transition:opacity .2s;
    pointer-events:none;
    z-index:2;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(18,18,31,.9);
    text-align:center;
    padding:24px;
    z-index:5;
  }
  .overlay h1{font-size:2.1rem; margin-bottom:10px;}
  .overlay p{font-size:1.05rem; line-height:1.6; opacity:.85; margin-bottom:4px;}
  .big-btn{
    margin-top:22px;
    font-family:inherit;
    font-size:1.3rem; font-weight:900;
    color:#12121F; background:#5EF0C6;
    border:none; border-radius:14px;
    padding:14px 42px;
    cursor:pointer;
    box-shadow:0 5px 0 #2FA383;
  }
  .big-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #2FA383;}

  /* 기록 등록 + 순위판 */
  .save-row{display:flex; gap:8px; margin-top:16px; width:min(320px,90%);}
  .save-row input{
    flex:1; min-width:0;
    font-family:inherit; font-size:1rem;
    background:rgba(255,255,255,.1); color:#F2F2F7;
    border:2px solid #3A3A55; border-radius:10px;
    padding:9px 12px; outline:none; text-align:center;
  }
  .save-row input:focus{border-color:#5EF0C6;}
  .save-row button{
    font-family:inherit; font-size:1rem; font-weight:800;
    color:#12121F; background:#5EF0C6;
    border:none; border-radius:10px; padding:9px 18px; cursor:pointer;
  }
  .save-row.done{display:none;}

  .rank-box{margin-top:18px; width:min(320px,90%);}
  .rank-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:.95rem; font-weight:800; opacity:.85; margin-bottom:6px;
  }
  .rank-head button{
    font-family:inherit; font-size:1rem;
    background:none; border:none; color:#5EF0C6; cursor:pointer; padding:2px 6px;
  }
  .rank-list{list-style:none; font-size:.95rem; text-align:left;}
  .rank-list li{
    display:flex; gap:8px; align-items:baseline;
    padding:3px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .rank-list li:last-child{border-bottom:none;}
  .rank-list .no{width:18px; opacity:.5; font-size:.85rem;}
  /* 메달은 숫자보다 넓으니 자리를 더 주고, 흐리게 하지 않는다 */
  .rank-list .no.medal{width:22px; opacity:1; font-size:1rem; text-align:center;}
  .rank-list .nm{flex:1; min-width:4em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-list .fl{font-weight:900; color:#5EF0C6;}
  .rank-list li.fresh .nm{color:#FFD166;}
  .rank-list li.empty{opacity:.5; justify-content:center; border:none;}
  .rank-note{font-size:.8rem; opacity:.55; margin-top:6px; min-height:1.1em;}
  .rank-note.warn{color:#FF8FA3; opacity:.9;}
  .final{font-size:3.4rem; font-weight:900; color:#5EF0C6; margin:8px 0;}
  .best{font-size:1rem; opacity:.7;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="score">0</div>
  <div id="combo"></div>

  <div class="overlay" id="start">
    <h1>🏗️ 낙하 스택 쌓기</h1>
    <p>움직이는 블록을 <b>탭</b>해서 떨어뜨려!</p>
    <p>어긋난 만큼 잘려서 점점 좁아져 😱</p>
    <p>딱 맞추면 <b style="color:#FFD166">PERFECT!</b> 보너스</p>
    <button class="big-btn" onclick="startGame(event)">시작!</button>
  </div>

  <div class="overlay hidden" id="over">
    <h1>💥 와르르!</h1>
    <div class="final" id="final">0층</div>
    <div class="best" id="best"></div>

    <div class="save-row" id="saveRow" style="display:none">
      <input id="nameInput" maxlength="6" placeholder="이름" autocomplete="off">
      <button type="button" id="saveBtn">등록</button>
    </div>

    <div class="rank-box">
      <div class="rank-head">
        <span>🏗️ 높이 순위 <span id="rankCount"></span></span>
        <button type="button" id="refreshBtn" title="순위 새로고침" aria-label="순위 새로고침">↻</button>
      </div>
      <ol class="rank-list" id="rankList"><li class="empty">아직 기록 없음</li></ol>
      <div class="rank-note" id="rankNote"></div>
    </div>

    <button class="big-btn" onclick="startGame(event)">다시 쌓기</button>
  </div>
</div>

<script>
const KEY = 'stack-tower-best-v1';

/* ---------- 높이 순위 (이미 떠 있는 댓글 서버를 그대로 쓴다) ----------
   그 서버는 승인 전 글의 내용은 감추고 '이름'만 공개하므로,
   기록을 이름 칸에 '이름|층수' 형태로 담는다. */
const RKEY = 'stacktower:ranking:1';
const API = 'https://craft-comments.jaehoo.workers.dev?page=stack-rank-v1';
let ranking = [], lastRun = null, lastName = '', rankBusy = false;

const rankList = document.getElementById('rankList');
const rankNote = document.getElementById('rankNote');
const rankCount = document.getElementById('rankCount');
const refreshBtn = document.getElementById('refreshBtn');
const saveRow = document.getElementById('saveRow');
const nameInput = document.getElementById('nameInput');
const saveBtn = document.getElementById('saveBtn');

function sane(list){
  return Array.isArray(list)
    ? list.filter(r => r && typeof r.n === 'string' && Number.isFinite(+r.f))
          .map(r => ({ n: r.n, f: +r.f })).slice(0, 5)
    : [];
}
// 5등까지만 남긴다(높이 순)
const TOP = 5;
const sortRank = list => list.sort((a,b) => b.f - a.f).slice(0, TOP);

function renderRank(freshIdx = -1){
  rankCount.textContent = ranking.length ? `TOP ${TOP}` : '';
  if(!ranking.length){ rankList.innerHTML = '<li class="empty">아직 기록 없음</li>'; return; }
  // 1~3등은 메달, 나머지는 숫자
  const MEDAL = ['🥇', '🥈', '🥉'];
  rankList.innerHTML = ranking.map((r,i) =>
    `<li class="${i === freshIdx ? 'fresh' : ''}">` +
    `<span class="no${i < 3 ? ' medal' : ''}">${MEDAL[i] || (i+1)}</span>` +
    `<span class="nm">${String(r.n).replace(/[<>&]/g,'')}</span>` +
    `<span class="fl">${r.f}층</span></li>`).join('');
}
function note(msg, warn){
  rankNote.textContent = msg || '';
  rankNote.classList.toggle('warn', !!warn);
}
function readLocalRank(){
  try{ return sane(JSON.parse(localStorage.getItem(RKEY))); }catch(e){ return []; }
}
function writeLocalRank(){
  try{ localStorage.setItem(RKEY, JSON.stringify(ranking)); }catch(e){}
}

const encodeRank = e => `${e.n.split('|').join('')}|${e.f}`.slice(0, 20);
function decodeRank(name){
  const m = /^(.*)\|(\d+)$/.exec(String(name || ''));
  return m && m[1] ? { n: m[1], f: +m[2] } : null;
}

async function fetchBoard(){
  const res = await fetch(API, { cache:'no-store' });
  if(!res.ok) throw new Error('http ' + res.status);
  const rows = await res.json();
  if(!Array.isArray(rows)) throw new Error('bad payload');
  return sortRank(rows.map(c => decodeRank(c && c.name)).filter(Boolean));
}

async function loadRank(){
  if(rankBusy) return;
  rankBusy = true;
  try{
    if(!ranking.length){ ranking = readLocalRank(); renderRank(); }
    ranking = await fetchBoard();
    writeLocalRank();
    note('');
  }catch(e){
    ranking = readLocalRank();
    note('오프라인 · 이 기기 기록만 표시', true);
  }
  renderRank();
  rankBusy = false;
}

async function submitScore(){
  if(!lastRun || rankBusy) return;
  rankBusy = true;
  const n = (nameInput.value || '').trim().slice(0,6) || '이름없음';
  lastName = n;
  const entry = { n, f: lastRun.f };
  lastRun = null;
  saveRow.style.display = 'none';

  ranking = sortRank(ranking.concat([entry]));
  writeLocalRank();
  renderRank(ranking.indexOf(entry));

  try{
    const res = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ name: encodeRank(entry), message: `${entry.f}층` }),
    });
    if(!res.ok) throw new Error('http ' + res.status);
    ranking = await fetchBoard();
    writeLocalRank();
    note('');
    renderRank(ranking.findIndex(r => r.n === entry.n && r.f === entry.f));
  }catch(e){
    note('저장 실패 · 이 기기에만 기록됨', true);
  }
  rankBusy = false;
}

saveBtn.addEventListener('click', e => { e.stopPropagation(); submitScore(); });
refreshBtn.addEventListener('click', e => { e.stopPropagation(); loadRank(); });
nameInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if(e.key === 'Enter') submitScore();
});
saveRow.addEventListener('pointerdown', e => e.stopPropagation());
loadRank();

const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;
async function storageGet(k){
  if(hasCloudStorage){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem(k);
}
async function storageSet(k,v){
  try{
    if(hasCloudStorage) await window.storage.set(k,v);
    else localStorage.setItem(k,v);
  }catch(e){}
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = document.getElementById('wrap').clientWidth;
  H = document.getElementById('wrap').clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(typeof buildScenery === 'function') buildScenery();
}
window.addEventListener('resize', resize);
resize();

const BLOCK_H = 34;
let running = false;
let stack, moving, debris, score, combo, speed, dir, camY, best = 0, hueBase;
let shakeT = 0;

function hue(i){ return (hueBase + i*7) % 360; }
function blockColor(i, light=0){ return `hsl(${hue(i)}, 65%, ${48+light}%)`; }

function startGame(e){
  saveRow.style.display = 'none';
  lastRun = null;
  if(e) e.stopPropagation();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  hueBase = Math.random()*360;
  score = 0; combo = 0;
  speed = 160; dir = 1;
  camY = 0;
  debris = [];
  const baseW = Math.min(W*0.6, 260);
  stack = [{x:(W-baseW)/2, w:baseW, y:H-80}];
  spawnMoving();
  running = true;
  updateScore();
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function spawnMoving(){
  const top = stack[stack.length-1];
  const fromLeft = stack.length % 2 === 1;
  moving = {
    x: fromLeft ? -top.w : W,
    w: top.w,
    y: top.y - BLOCK_H
  };
  dir = fromLeft ? 1 : -1;
}

function drop(){
  if(!running || !moving) return;
  const top = stack[stack.length-1];
  const left = Math.max(moving.x, top.x);
  const right = Math.min(moving.x + moving.w, top.x + top.w);
  const overlap = right - left;

  if(overlap <= 4){
    // 완전 빗나감 → 게임 오버
    debris.push({x:moving.x, w:moving.w, y:moving.y, vy:0, vx:dir*40, rot:0, vr:dir*2, i:stack.length});
    moving = null;
    endGame();
    return;
  }

  const offCut = moving.w - overlap;
  const PERFECT = 7;
  if(offCut <= PERFECT){
    // 퍼펙트: 안 자름 + 콤보
    combo++;
    score += 1 + combo;
    showCombo(`PERFECT! x${combo} ⚡ +${combo}`);
    // 퍼펙트 3연속마다 블록 살짝 넓어짐 (보상)
    let w = top.w;
    if(combo % 3 === 0) w = Math.min(w + 14, Math.min(W*0.6, 260));
    stack.push({x: top.x + (top.w - w)/2, w, y: moving.y});
    flash = 0.4;
  }else{
    combo = 0;
    score += 1;
    // 잘림
    stack.push({x:left, w:overlap, y:moving.y});
    // 잘린 조각 낙하
    const cutX = moving.x < top.x ? moving.x : right;
    debris.push({x:cutX, w:offCut, y:moving.y, vy:0, vx:(cutX<left?-1:1)*30, rot:0, vr:(cutX<left?-1:1)*3, i:stack.length-1});
  }

  speed = Math.min(520, speed + 7);
  updateScore();
  spawnMoving();
}

function endGame(){
  running = false;
  shakeT = 0.5;
  best = Math.max(best, score);
  storageSet(KEY, String(best));
  setTimeout(()=>{
    document.getElementById('final').textContent = score + '층';
    document.getElementById('best').textContent = '🏆 최고 기록: ' + best + '층';
    document.getElementById('over').classList.remove('hidden');
    lastRun = { f: score };
    nameInput.value = lastName;
    saveRow.style.display = 'flex';
    loadRank();
    // 마지막 프레임 잔해 몇 프레임 더 그리기
  }, 900);
  // 잔해 애니메이션은 loop가 잠깐 더 돎
  lastT = performance.now();
  requestAnimationFrame(deathLoop);
}

function updateScore(){
  document.getElementById('score').textContent = score;
}
let comboTimer = null;
function showCombo(text){
  const el = document.getElementById('combo');
  el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(()=>{ el.style.opacity = 0; }, 900);
}

/* ---------- input ---------- */
function onTap(e){
  if(e.target.closest('.overlay')) return;
  drop();
}
window.addEventListener('pointerdown', onTap);
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); drop(); }
});

/* ---------- loop ---------- */
let lastT = 0, flash = 0;
function loop(t){
  if(!running) return;
  const dt = Math.min((t-lastT)/1000, 0.05);
  lastT = t;

  // 이동 블록
  if(moving){
    moving.x += dir*speed*dt;
    if(dir===1 && moving.x > W - moving.w*0.15) dir = -1;
    if(dir===-1 && moving.x < -moving.w*0.85) dir = 1;
  }

  // 카메라: 탑이 높아지면 아래로 스크롤
  const targetCam = Math.max(0, (H-160) - stack[stack.length-1].y);
  camY += (targetCam - camY) * Math.min(1, dt*5);

  updateDebris(dt);
  if(flash > 0) flash -= dt;
  if(shakeT > 0) shakeT -= dt;

  render();
  requestAnimationFrame(loop);
}

function deathLoop(t){
  if(running) return;
  const dt = Math.min((t-lastT)/1000, 0.05);
  lastT = t;
  if(shakeT > 0) shakeT -= dt;
  updateDebris(dt);
  render();
  if(debris.length) requestAnimationFrame(deathLoop);
}

function updateDebris(dt){
  for(let i=debris.length-1; i>=0; i--){
    const d = debris[i];
    d.vy += 900*dt;
    d.y += d.vy*dt;
    d.x += d.vx*dt;
    d.rot += d.vr*dt;
    if(d.y - camY > H + 100) debris.splice(i,1);
  }
}

/* ---------- 배경: 땅에서 하늘로 ---------- */
var stars = [], clouds = [];   // resize()가 먼저 불려도 안전하도록 var
function buildScenery(){
  // 화면 크기가 바뀔 때만 다시 만든다(매 프레임 흔들리지 않게)
  stars = [];
  for(let i=0;i<70;i++){
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4 + .4,
                 tw: Math.random()*Math.PI*2, sp: .25 + Math.random()*.45 });
  }
  clouds = [];
  for(let i=0;i<5;i++){
    clouds.push({ x: Math.random()*W, y: Math.random()*H, w: W*0.16 + Math.random()*W*0.14,
                  sp: .35 + Math.random()*.3, a: .05 + Math.random()*.07 });
  }
}

buildScenery();

const lerp = (a,b,t) => a + (b-a)*t;
const mix = (c1,c2,t) => `rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`;

function drawSky(){
  const t = Math.min(1, camY / 1800);          // 0 = 땅, 1 = 높은 하늘
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix([38,56,96],  [4,5,12],   t));   // 위쪽
  g.addColorStop(1, mix([120,150,196],[10,13,26], t));  // 아래쪽(지평선 빛)
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 별: 높이 올라갈수록 진해진다
  if(t > 0.15){
    ctx.save();
    ctx.globalAlpha = Math.min(1, (t - 0.15) / 0.5);
    for(const st of stars){
      const y = ((st.y + camY * st.sp) % (H + 40)) - 20;
      ctx.globalAlpha *= 1;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(st.x, y, st.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 구름: 낮은 곳에서만 보인다
  const cloudAlpha = 1 - Math.min(1, camY / 1400);
  if(cloudAlpha > 0.02){
    ctx.save();
    for(const c of clouds){
      const y = ((c.y + camY * c.sp) % (H + 120)) - 60;
      ctx.globalAlpha = c.a * cloudAlpha;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(c.x, y, c.w*.5, c.w*.20, 0, 0, Math.PI*2);
      ctx.ellipse(c.x - c.w*.22, y + 5, c.w*.30, c.w*.15, 0, 0, Math.PI*2);
      ctx.ellipse(c.x + c.w*.24, y + 4, c.w*.28, c.w*.14, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// 땅은 탑과 같은 좌표계에 있어서 올라가면 함께 멀어진다
function drawGround(groundY){
  ctx.fillStyle = '#3C7A3C';                    // 잔디
  ctx.fillRect(-40, groundY, W + 80, 16);
  ctx.fillStyle = '#5A3E28';                    // 흙
  ctx.fillRect(-40, groundY + 16, W + 80, 1400);
  ctx.fillStyle = 'rgba(0,0,0,.18)';            // 흙 결
  for(let i=0;i<8;i++){
    ctx.fillRect(-40, groundY + 40 + i*70, W + 80, 3);
  }
  ctx.fillStyle = '#2E5F2E';                    // 잔디 그림자
  ctx.fillRect(-40, groundY + 16, W + 80, 4);
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  ctx.save();
  if(shakeT>0) ctx.translate((Math.random()-.5)*10, (Math.random()-.5)*10);
  ctx.translate(0, camY);

  // 맨 아래 블록이 놓인 자리가 땅 높이
  if(stack && stack.length) drawGround(stack[0].y + BLOCK_H);

  // 쌓인 블록
  for(let i=0;i<stack.length;i++){
    const b = stack[i];
    drawBlock(b.x, b.y, b.w, blockColor(i), i===stack.length-1 && flash>0);
  }
  // 이동 블록
  if(moving){
    drawBlock(moving.x, moving.y, moving.w, blockColor(stack.length, 8));
  }
  // 잔해
  for(const d of debris){
    ctx.save();
    ctx.translate(d.x + d.w/2, d.y + BLOCK_H/2);
    ctx.rotate(d.rot);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = blockColor(d.i, -8);
    ctx.fillRect(-d.w/2, -BLOCK_H/2, d.w, BLOCK_H);
    ctx.restore();
  }
  ctx.restore();
}

function drawBlock(x, y, w, color, glow){
  ctx.save();
  if(glow){ ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 24; }
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, BLOCK_H);
  // 윗면 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(x, y, w, 6);
  // 옆면 그림자
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(x, y+BLOCK_H-5, w, 5);
  ctx.restore();
}

/* ---------- boot ---------- */
(async function(){
  const raw = await storageGet(KEY);
  if(raw) best = parseInt(raw)||0;
