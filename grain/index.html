<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>알갱이 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 한 화면 앱: 위 머리띠, 가운데 실험 수조(캔버스), 아래 원소 팔레트 5×2. 색은 원소가 담당하고 틀은 조용하게. */
  --bg:#f2f4f7;
  --tank:#dfe8f0;
  --panel:#ffffff;
  --press:#fff1cf;
  --line:#c9d1da;
  --text:#1b222b;
  --muted:#5b6673;
  --accent:#c47d08;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  display:flex;flex-direction:column;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 16px 8px}
h1{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;margin:0 auto 0 0;letter-spacing:.01em}
h1 span{color:var(--accent)}
button{font-family:var(--body);color:var(--text);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act{font-size:13px;font-weight:500;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.act:active{background:var(--press)}
.stage{flex:1;min-height:0;position:relative;margin:0 16px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--tank)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
.hint{flex:none;margin:0;padding:8px 16px 0;height:63px;overflow:hidden;font-size:13px;line-height:1.4;color:var(--muted)}
.tools{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:32px;min-width:32px;padding:0 9px;white-space:nowrap;font-size:13px;font-weight:500;background:var(--panel);border:0;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--press);font-weight:600}
.hint b{color:var(--text);font-weight:600}
.brush{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.brush button{width:36px;height:32px;display:grid;place-items:center;background:var(--panel);border:0;border-left:1px solid var(--line);padding:0}
.brush button:first-child{border-left:0}
.brush button i{display:block;border-radius:50%;background:var(--muted)}
.brush button[aria-pressed="true"]{background:var(--press)}
.brush button[aria-pressed="true"] i{background:var(--accent)}
.find{display:flex;gap:6px;padding:0 16px 8px;flex:none}
.find input{flex:1;min-width:0;height:34px;padding:0 10px;font:400 16px var(--body);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.find input::placeholder{color:var(--muted);font-size:14px}
.find input:focus{outline:2px solid var(--accent);outline-offset:1px}
.find input::-webkit-search-cancel-button{display:none}
.find button{height:34px;padding:0 10px;font-size:13px;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.palette.searching{overflow-y:auto}
.palette .none{grid-column:1/-1;margin:0;padding:10px 2px;font-size:13px;color:var(--muted)}
.palette{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:52px;align-content:start;gap:6px;height:124px;padding:0 16px 14px;overflow:hidden;flex:none}
.el{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;height:52px;padding:0 2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:500;line-height:1}
.el i{display:block;flex:none;width:70%;max-width:40px;height:22px;border-radius:3px}
.el span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.el i.sym{display:flex;align-items:center;justify-content:center;gap:2px;font:600 13px/1 var(--body);font-style:normal;font-variant-numeric:tabular-nums}
.el i.sym small{font-size:8px;font-weight:500;align-self:flex-start;margin-top:3px;opacity:.85}
.el[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--press)}
@media (min-width:700px){
  .palette{grid-template-columns:repeat(10,1fr);height:66px}
  .palette.searching{height:124px}
}
</style>
</head>
<body>
<header>
  <h1>알갱이 <span>실험실</span></h1>
  <button class="act" id="btn-pause" type="button">멈춤</button>
  <button class="act" id="btn-clear" type="button">비우기</button>
  <button class="act" id="btn-seed" type="button">새 장면</button>
</header>
<div class="stage" id="stage"><canvas id="tank" aria-label="알갱이 실험 수조. 문지르면 선택한 원소가 쏟아진다."></canvas></div>
<p class="hint" id="hint"></p>
<div class="tools">
  <div class="seg" role="group" aria-label="원소 묶음">
    <button type="button" id="tab-0" data-tab="0" aria-pressed="true">기본</button>
    <button type="button" id="tab-1" data-tab="1" aria-pressed="false">원소 1</button>
    <button type="button" id="tab-2" data-tab="2" aria-label="원소 2" aria-pressed="false">2</button>
    <button type="button" id="tab-3" data-tab="3" aria-label="원소 3" aria-pressed="false">3</button>
    <button type="button" id="tab-4" data-tab="4" aria-label="원소 4" aria-pressed="false">4</button>
    <button type="button" id="tab-5" data-tab="5" aria-label="원소 5" aria-pressed="false">5</button>
  </div>
  <div class="brush" role="group" aria-label="붓 크기">
    <button type="button" id="brush-s" data-r="1" aria-label="붓 작게" aria-pressed="false"><i style="width:5px;height:5px"></i></button>
    <button type="button" id="brush-m" data-r="3" aria-label="붓 보통" aria-pressed="true"><i style="width:10px;height:10px"></i></button>
    <button type="button" id="brush-l" data-r="6" aria-label="붓 크게" aria-pressed="false"><i style="width:16px;height:16px"></i></button>
  </div>
</div>
<div class="find">
  <input id="find" type="search" placeholder="원소 찾기: 이름, 기호, 번호" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="원소 찾기">
  <button type="button" id="find-clear" aria-label="검색어 지우기" hidden>지우기</button>
</div>
<div class="palette" id="palette" role="group" aria-label="원소"></div>

<script>
(function(){
"use strict";
const EMPTY=0,SAND=1,WATER=2,STONE=3,PLANT=4,FIRE=5,OIL=6,STEAM=7,LAVA=8,POWDER=9,ICE=10,
      HYD=11,CARBON=12,NITRO=13,OXY=14,FLUOR=15,SODIUM=16,IRON=17,GOLD=18,HG=19,RUST=20,EMBER=21,
      HE=22,NEON=23,MG=24,FLARE=25,AL=26,PHOS=27,CL=28,SALT=29,POT=30,TUNG=31,URAN=32,
      SULF=33,AR=34,CA=35,CU=36,PATINA=37,GA=38,GAL=39,BR=40,IOD=41,IGAS=42,CS=43,PT=44,
      LI=45,SR=46,AG=47,TARN=48,XE=49,BA=50,PB=51,BI=52,RN=53,RA=54,SPK_R=55,SPK_G=56,
      SI=57,TI=58,NI=59,ZN=60,KR=61,SN=62,TINP=63,ND=64,FR=65,PU=66,MAXT=66;
const ELS=[
  {t:SAND,  tab:0,n:"모래",  c:"#d4a44e", d:"쌓이고 무너진다. 물과 기름 아래로 가라앉는다."},
  {t:WATER, tab:0,n:"물",    c:"#3a84d6", d:"흐른다. 불을 끄고 식물을 키운다."},
  {t:STONE, tab:0,n:"돌",    c:"#7a808a", d:"움직이지 않는 벽. 폭발에도 버틴다. 플루오린에는 삭는다."},
  {t:PLANT, tab:0,n:"식물",  c:"#46a852", d:"물에 닿으면 자란다. 불에 탄다."},
  {t:FIRE,  tab:0,n:"불",    c:"#ff8c28", d:"위로 오른다. 식물, 기름, 화약, 수소에 옮겨붙는다."},
  {t:OIL,   tab:0,n:"기름",  c:"#7c543a", d:"물 위에 뜬다. 불이 닿으면 탄다."},
  {t:LAVA,  tab:0,n:"용암",  c:"#ee5c20", d:"느리게 흐른다. 물과 만나면 돌과 증기가 된다."},
  {t:POWDER,tab:0,n:"화약",  c:"#685c80", d:"불이나 용암에 닿으면 터진다."},
  {t:ICE,   tab:0,n:"얼음",  c:"#70bce8", d:"곁의 물을 얼린다. 불 옆에서 녹는다."},
  {t:HYD,   tab:1,n:"수소",  c:"#f09696", sym:"H", z:1,  d:"가장 가벼운 기체. 불이 닿으면 타서 증기(물)가 된다."},
  {t:CARBON,tab:1,n:"탄소",  c:"#28282e", sym:"C", z:6,  d:"숯가루. 불이 붙으면 벌겋게 달아올라 오래 탄다. 물에 꺼진다."},
  {t:NITRO, tab:1,n:"질소",  c:"#96a0f0", sym:"N", z:7,  d:"액체 질소. 물을 얼리고 불과 용암을 식힌 뒤 날아간다."},
  {t:OXY,   tab:1,n:"산소",  c:"#c86edc", sym:"O", z:8,  d:"불을 키우는 기체. 불이 닿으면 크게 타오른다."},
  {t:FLUOR, tab:1,n:"플루오린",c:"#bec83c",fg:"#1b222b",sym:"F", z:9,  d:"닿는 것을 거의 다 삭이는 기체. 돌도 없앤다. 금과 수은은 버틴다."},
  {t:SODIUM,tab:1,n:"나트륨",c:"#c6beac",fg:"#1b222b",sym:"Na",z:11, d:"물에 뜬다. 물과 만나면 수소를 내며 불붙는다."},
  {t:IRON,  tab:1,n:"철",    c:"#4a5464", sym:"Fe",z:26, d:"단단한 고체. 물에 닿으면 녹슬어 부서진다. 용암에 녹는다."},
  {t:GOLD,  tab:1,n:"금",    c:"#f5c400", fg:"#1b222b",sym:"Au",z:79, d:"무겁고 변하지 않는다. 수은 속으로도 가라앉는다."},
  {t:HG,    tab:1,n:"수은",  c:"#848c9c", sym:"Hg",z:80, d:"무거운 액체 금속. 모래와 물이 그 위에 뜬다."},
  {t:HE,    tab:2,n:"헬륨",  c:"#fab078", fg:"#1b222b",sym:"He",z:2,  d:"아무것과도 반응하지 않는 가벼운 기체. 위로 올라갈 뿐이다."},
  {t:NEON,  tab:2,n:"네온",  c:"#ff6046", sym:"Ne",z:10, d:"반응하지 않는 기체. 네온사인처럼 빛난다."},
  {t:MG,    tab:2,n:"마그네슘",c:"#aab2bc",fg:"#1b222b",sym:"Mg",z:12, d:"불이 붙으면 눈부시게 탄다. 물을 부으면 수소가 생겨 더 탄다."},
  {t:AL,    tab:2,n:"알루미늄",c:"#92a8cc",fg:"#1b222b",sym:"Al",z:13, d:"녹(철이 물에 녹슨 가루)과 섞어 불을 붙이면 쇳물이 된다. 테르밋 반응."},
  {t:PHOS,  tab:2,n:"인",    c:"#e0d66e", fg:"#1b222b",sym:"P", z:15, d:"백린. 공기에 닿으면 저절로 불붙는다. 물속에서는 안전하다."},
  {t:CL,    tab:2,n:"염소",  c:"#3cbe96", sym:"Cl",z:17, d:"가라앉는 기체. 식물을 죽인다. 나트륨과 만나면 소금이 된다."},
  {t:POT,   tab:2,n:"칼륨",  c:"#b0a0c8", fg:"#1b222b",sym:"K", z:19, d:"물에 뜬다. 물에 닿으면 바로 터진다."},
  {t:TUNG,  tab:2,n:"텅스텐",c:"#3a3460", sym:"W", z:74, d:"가장 단단한 벽. 용암, 폭발, 플루오린에 모두 버틴다."},
  {t:URAN,  tab:2,n:"우라늄",c:"#78d228", fg:"#1b222b",sym:"U", z:92, d:"무겁고 뜨겁다. 물을 끓인다. 많이 모이면 크게 터져 돌도 부순다."},
  {t:SULF,  tab:3,n:"황",    c:"#e2e632", fg:"#1b222b",sym:"S", z:16, d:"노란 가루. 불에 탄다. 탄소와 섞이면 화약이 된다."},
  {t:AR,    tab:3,n:"아르곤",c:"#5a54be", sym:"Ar",z:18, d:"가라앉는 기체. 반응하지 않고, 불을 덮어 끈다."},
  {t:CA,    tab:3,n:"칼슘",  c:"#dec4a0", fg:"#1b222b",sym:"Ca",z:20, d:"물과 만나면 수소 거품을 내고 석회(돌)로 굳는다."},
  {t:CU,    tab:3,n:"구리",  c:"#ce7e4e", sym:"Cu",z:29, d:"단단한 고체. 물이나 산소에 닿으면 푸른 녹(녹청)이 슨다."},
  {t:GA,    tab:3,n:"갈륨",  c:"#78aab4", sym:"Ga",z:31, d:"열에 약한 금속. 불 가까이에서 녹아 흐르고, 식으면 다시 굳는다."},
  {t:BR,    tab:3,n:"브로민",c:"#9c2424", sym:"Br",z:35, d:"붉은 액체. 물 아래로 가라앉고 식물을 죽인다. 알루미늄과 만나면 불탄다."},
  {t:IOD,   tab:3,n:"아이오딘",c:"#3c2846",sym:"I", z:53, d:"어두운 가루. 뜨거워지면 보라색 기체가 되고, 식으면 다시 가루로 내려앉는다."},

  {t:PT,    tab:3,n:"백금",  c:"#b0b6c4", fg:"#1b222b",sym:"Pt",z:78, d:"변하지 않는 금속. 수소와 산소가 함께 닿으면 불 없이도 타게 한다. 촉매."},
  {t:LI,    tab:4,n:"리튬",  c:"#dcbec8", fg:"#1b222b",sym:"Li",z:3,  d:"가장 가벼운 금속. 물에 뜨고, 물과 만나면 수소를 내며 조용히 사라진다."},
  {t:SR,    tab:4,n:"스트론튬",c:"#c88c82",sym:"Sr",z:38, d:"불이 붙으면 빨간 불꽃으로 솟는다. 불꽃놀이의 빨강. 화약과 섞어 터뜨려 보자."},
  {t:AG,    tab:4,n:"은",    c:"#b8beca", fg:"#1b222b",sym:"Ag",z:47, d:"무거운 가루. 황에 닿으면 검게 변한다. 은수저가 검어지는 까닭."},
  {t:XE,    tab:4,n:"제논",  c:"#788cff", sym:"Xe",z:54, d:"반응하지 않는 무거운 기체. 푸르게 빛나며 가라앉는다."},
  {t:BA,    tab:4,n:"바륨",  c:"#96be96", fg:"#1b222b",sym:"Ba",z:56, d:"불이 붙으면 초록 불꽃으로 솟는다. 불꽃놀이의 초록."},
  {t:PB,    tab:4,n:"납",    c:"#5c6070", sym:"Pb",z:82, d:"무겁고 무른 금속 가루. 잘 변하지 않는다. 라듐이 붕괴한 끝에 남는다."},
  {t:BI,    tab:4,n:"비스무트",c:"#c878b4",sym:"Bi",z:83, d:"무지갯빛으로 빛나는 결정. 움직이지 않는다."},
  {t:RN,    tab:4,n:"라돈",  c:"#c8dc50", fg:"#1b222b",sym:"Rn",z:86, d:"빛나는 무거운 기체. 시간이 지나면 붕괴해 납이 된다."},
  {t:RA,    tab:4,n:"라듐",  c:"#50dcc8", fg:"#1b222b",sym:"Ra",z:88, d:"스스로 빛난다. 라돈 기체를 내뿜다가 결국 납이 된다. 방사성 붕괴."},
  {t:SI,    tab:5,n:"규소",  c:"#404c78", sym:"Si",z:14, d:"어두운 가루. 산소와 만나면 모래가 된다. 모래의 주성분."},
  {t:TI,    tab:5,n:"티타늄",c:"#c4baaa", fg:"#1b222b",sym:"Ti",z:22, d:"가볍고 단단한 금속. 녹슬지 않고 용암과 폭발에 버틴다."},
  {t:NI,    tab:5,n:"니켈",  c:"#969c8c", sym:"Ni",z:28, d:"자석에 끌리는 가루. 네오디뮴 자석 가까이 뿌려 보자."},
  {t:ZN,    tab:5,n:"아연",  c:"#8ca4b8", fg:"#1b222b",sym:"Zn",z:30, d:"철에 붙여 두면 철 대신 삭아서 녹을 막는다. 아연 도금."},
  {t:KR,    tab:5,n:"크립톤",c:"#c8aaff", fg:"#1b222b",sym:"Kr",z:36, d:"반응하지 않는 기체. 연보라로 빛나며 떠다닌다."},

      case EMBER:{
        if(life[i]<=1){set(i,EMPTY);break}
        if(R()<.25)life[i]--;
        for(let q=0;q<4;q++){
          const nx=x+DX[q],ny=y+DY[q];
          if(nx<0||nx>=W||ny<0||ny>=H)continue;
          const n=ny*W+nx,tn=g[n];
          if(tn===CARBON){if(R()<.04)set(n,EMBER,150+R()*100|0)}
          else if(tn===PLANT){if(R()<.1)set(n,FIRE,40+R()*50|0)}
          else if(tn===OIL){if(R()<.35)set(n,FIRE,25+R()*30|0)}
          else if(tn===POWDER){explode(nx,ny)}
          else if(tn===HYD||tn===OXY){set(n,FIRE,20+R()*30|0)}
          else if(tn===WATER){set(n,STEAM,initLife(STEAM));set(i,CARBON);break}
          else if(tn===NITRO){set(i,CARBON);break}
          else if(tn===MG){if(R()<.1)set(n,FLARE,initLife(FLARE))}
          else if(tn===PHOS){if(R()<.5)set(n,FIRE,40+R()*40|0)}
          else if(tn===SULF){if(R()<.15)set(n,FIRE,60+R()*40|0)}
          else if(tn===SR||tn===BA){if(R()<.3)set(n,tn===SR?SPK_R:SPK_G,initLife(SPK_R))}
          else if(tn===ICE){if(R()<.05)set(n,WATER)}
          else if(tn===EMPTY&&q===0){if(R()<.15)set(n,FIRE,6+R()*9|0)}
        }
        if(g[i]===EMBER&&stamp[i]!==tick)fallPowder(i,x,y,SINK_STD);
        break;}
      case HG:flow(i,x,y,PASS_HG,2,false);break;
      case HYD:gasMove(i,x,y,-1,.9,true);break;
      case OXY:gasMove(i,x,y,R()<.55?-1:1,.4,false);break;
      case IRON:
        if(R()<.02){
          const q=R()*4|0,nx=x+DX[q],ny=y+DY[q];
          if(nx>=0&&nx<W&&ny>=0&&ny<H&&g[ny*W+nx]===WATER&&R()<.25){
            let zn=-1;
            for(let q2=0;q2<4;q2++){
              const zx=x+DX[q2],zy=y+DY[q2];
              if(zx>=0&&zx<W&&zy>=0&&zy<H&&g[zy*W+zx]===ZN)zn=zy*W+zx;
            }
            if(zn>=0){if(R()<.3)set(zn,EMPTY)}else set(i,RUST);
          }
        }
        break;
      case SODIUM:{
        for(let q=0;q<4;q++){
          const nx=x+DX[q],ny=y+DY[q];
          if(nx<0||nx>=W||ny<0||ny>=H)continue;
          const n=ny*W+nx;
          if(g[n]===WATER&&R()<.2){
            set(n,HYD);set(i,FIRE,10+R()*10|0);
            if(R()<.08)explode(x,y);
            break;
          }
        }
        if(g[i]===SODIUM)fallPowder(i,x,y,SINK_NONE);
        break;}
      case NITRO:{
        if(life[i]<=1){set(i,EMPTY);break}
        if(R()<.25)life[i]--;
        let used=false;
        for(let q=0;q<4;q++){
          const nx=x+DX[q],ny=y+DY[q];
          if(nx<0||nx>=W||ny<0||ny>=H)continue;
          const n=ny*W+nx,tn=g[n];
          if(tn===WATER){if(R()<.5){set(n,ICE);used=true}}
          else if(tn===STEAM){set(n,WATER);used=true}
          else if(tn===FIRE){set(n,EMPTY);used=true}
          else if(tn===LAVA){set(n,STONE);used=true}
        }
        if(used&&R()<.5){set(i,EMPTY);break}
        flow(i,x,y,PASS_OIL,3,false);
        break;}
      case FLUOR:{
        for(let q=0;q<4;q++){
          const nx=x+DX[q],ny=y+DY[q];
          if(nx<0||nx>=W||ny<0||ny>=H)continue;
          const n=ny*W+nx,tn=g[n];
          if(CORR[tn]){if(R()<.3){set(n,EMPTY);if(R()<.5)set(i,EMPTY);break}}
          else if(tn===WATER){if(R()<.3){set(i,EMPTY);break}}
          else if(tn===HYD){set(n,FIRE,8);set(i,FIRE,8);break}
        }
        if(g[i]===FLUOR)gasMove(i,x,y,1,.5,true);
        break;}
      case WATER:flow(i,x,y,PASS_WATER,4,false);break;
      case OIL:flow(i,x,y,PASS_OIL,3,false);break;
      case PLANT:
        if(R()<.03){
          const q=R()*4|0,nx=x+DX[q],ny=y+DY[q];
          if(nx>=0&&nx<W&&ny>=0&&ny<H){const n=ny*W+nx;if(g[n]===WATER)set(n,PLANT)}
        }
        break;
      case ICE:
        if(R()<.02){
          const q=R()*4|0,nx=x+DX[q],ny=y+DY[q];
          if(nx>=0&&nx<W&&ny>=0&&ny<H){
            const n=ny*W+nx,tn=g[n];
            if(tn===WATER){if(R()<.3)set(n,ICE)}
            else if(tn===STEAM)set(i,WATER);
          }
        }
        break;
      case FIRE:{
        if(life[i]<=1){set(i,EMPTY);break}
        life[i]--;
        for(let q=0;q<4;q++){
          const nx=x+DX[q],ny=y+DY[q];
          if(nx<0||nx>=W||ny<0||ny>=H)continue;
          const n=ny*W+nx,tn=g[n];
          if(tn===PLANT){if(R()<.1)set(n,FIRE,40+R()*50|0)}
          else if(tn===OIL){if(R()<.35)set(n,FIRE,25+R()*30|0)}
          else if(tn===POWDER){explode(nx,ny)}
          else if(tn===WATER){set(n,STEAM,initLife(STEAM));set(i,EMPTY);break}
          else if(tn===ICE){if(R()<.06)set(n,WATER)}
          else if(tn===HYD){set(n,R()<.6?FIRE:STEAM,R()<2?8+R()*8|0:0);if(g[n]===STEAM)life[n]=initLife(STEAM)}
          else if(tn===OXY){set(n,FIRE,50+R()*60|0)}
          else if(tn===CARBON){if(R()<.12)set(n,EMBER,150+R()*100|0)}
          else if(tn===NITRO){set(i,EMPTY);break}
          else if(tn===MG){if(R()<.2)set(n,FLARE,initLife(FLARE))}
          else if(tn===PHOS){if(R()<.5)set(n,FIRE,40+R()*40|0)}
          else if(tn===SULF){if(R()<.15)set(n,FIRE,60+R()*40|0)}
          else if(tn===SR||tn===BA){if(R()<.3)set(n,tn===SR?SPK_R:SPK_G,initLife(SPK_R))}
        }
        if(g[i]!==FIRE||stamp[i]===tick)break;
        if(y>0&&R()<.45){
          const d=(R()*3|0)-1,nx=x+d;
          if(nx>=0&&nx<W){const n=i-W+d;if(g[n]===EMPTY)swap(i,n)}
        }
        break;}
      case LAVA:{
        for(let q=0;q<4;q++){
          const nx=x+DX[q],ny=y+DY[q];
          if(nx<0||nx>=W||ny<0||ny>=H)continue;
          const n=ny*W+nx,tn=g[n];
          if(tn===WATER){set(n,STEAM,initLife(STEAM));if(R()<.6){set(i,STONE);break}}
          else if(tn===PLANT){if(R()<.3)set(n,FIRE,40+R()*50|0)}
          else if(tn===OIL){if(R()<.5)set(n,FIRE,25+R()*30|0)}
          else if(tn===POWDER){explode(nx,ny)}
          else if(tn===ICE){if(R()<.2)set(n,WATER)}
          else if(tn===HYD||tn===OXY){set(n,FIRE,20+R()*30|0)}
          else if(tn===CARBON){if(R()<.1)set(n,EMBER,150+R()*100|0)}
          else if(tn===IRON){if(R()<.01)set(n,LAVA)}
          else if(tn===SODIUM){if(R()<.2)set(n,FIRE,20+R()*20|0)}
          else if(tn===NITRO){set(n,EMPTY);set(i,STONE);break}
          else if(tn===MG){if(R()<.3)set(n,FLARE,initLife(FLARE))}
          else if(tn===PHOS){set(n,FIRE,40+R()*40|0)}
          else if(tn===SULF){if(R()<.3)set(n,FIRE,60+R()*40|0)}
          else if(tn===SR||tn===BA){if(R()<.3)set(n,tn===SR?SPK_R:SPK_G,initLife(SPK_R))}
        }
        if(g[i]!==LAVA)break;
        if(y>0&&g[i-W]===EMPTY&&R()<.003)set(i-W,FIRE,6+R()*10|0);
        flow(i,x,y,PASS_LAVA,1,true);
        break;}
      case STEAM:{
        if(life[i]<=1){set(i,WATER);break}
        life[i]--;
        if(R()<.7){
          if(y>0){
            const a=i-W,ta=g[a];
            if(ta===EMPTY||ta===WATER||ta===OIL){swap(i,a);break}
            const d=R()<.5?1:-1;
            if(x+d>=0&&x+d<W&&g[a+d]===EMPTY){swap(i,a+d);break}
            if(x-d>=0&&x-d<W&&g[a-d]===EMPTY){swap(i,a-d);break}
          }
          const d=R()<.5?1:-1;
          if(x+d>=0&&x+d<W&&g[i+d]===EMPTY)swap(i,i+d);
        }
        break;}
      }
    }
  }
}

function render(){
  const n=W*H;let nd=0;
  for(let i=0;i<n;i++){
    const t=g[i];
    if(t===EMPTY){px[i]=BGPX;continue}
    if(t===ND)nd++;
    let r,gg,b;
    if(t===FIRE){
      const l=life[i],f=(shade[i]+tick*7)&31;
      if(l>28){r=255;gg=214+f;b=96}
      else if(l>12){r=255;gg=128+f;b=36}
      else{r=206+f;gg=58+f;b=28}
    }else if(t===FLARE){
      const f=(shade[i]+tick*11)&31;r=255;gg=236+(f>>1);b=110+f*4;
    }else if(t===SPK_R){
      const f=(shade[i]+tick*13)&63;r=255;gg=40+f;b=70+f;
    }else if(t===SPK_G){
      const f=(shade[i]+tick*13)&63;r=40+f*2;gg=225;b=80+f;
    }else if(t===BI){
      const ph=((i%W)+(i/W|0))*.3+(shade[i]&7)*.12;
      r=150+90*Math.sin(ph);gg=150+90*Math.sin(ph+2.09);b=150+90*Math.sin(ph+4.19);
    }else if(t===KR){
      const ph=(tick+shade[i])*.05;r=200+40*Math.sin(ph);gg=170+30*Math.sin(ph+1.5);b=255;
    }else if(t===XE){
      const ph=(tick+shade[i])*.05;r=120+50*Math.sin(ph);gg=150+40*Math.sin(ph+1);b=255;
    }else if(t===RN){
      const ph=(tick+shade[i])*.05;r=195+40*Math.sin(ph);gg=222;b=70+40*Math.sin(ph+2);
    }else if(t===NEON){
      const ph=(tick+shade[i])*.05;r=255;gg=96+50*Math.sin(ph);b=70+60*Math.sin(ph*.7+2);
    }else{
      const c=BASE[t];
      let v=((shade[i]&31)-16)*c[3]/16;
      if(t===LAVA||t===EMBER)v+=Math.sin((tick+shade[i])*.08)*16;
      else if(t===HG||t===GAL)v+=Math.sin((tick+shade[i])*.12)*22;
      else if(t===URAN||t===RA||t===FR||t===PU)v+=Math.sin((tick+shade[i])*.06)*26;
      r=c[0]+v;gg=c[1]+v;b=c[2]+v;
    }
    r=r<0?0:r>255?255:r|0;gg=gg<0?0:gg>255?255:gg|0;b=b<0?0:b>255?255:b|0;
    px[i]=(0xff000000|(b<<16)|(gg<<8)|r)>>>0;
  }
  ndCount=nd;
  ctx.putImageData(img,0,0);
}

// 붓
function dab(cx,cy){
  const r=brush;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r+1)continue;
    const x=cx+dx,y=cy+dy;if(x<0||x>=W||y<0||y>=H)continue;
    const i=y*W+x,t=g[i];
    if(sel===EMPTY||sel===STONE){if(t!==sel)set(i,sel)}
    else if(sel===PLANT||sel===ICE||sel===IRON||sel===TUNG||sel===CU||sel===GA||sel===PT||sel===BI||sel===TI||sel===ZN||sel===SN||sel===ND){if(t===EMPTY)set(i,sel)}
    else if(sel===FIRE){if((t===EMPTY||t===PLANT||t===OIL||t===HYD||t===OXY)&&R()<.5)set(i,FIRE,initLife(FIRE));else if(t===CARBON){if(R()<.5)set(i,EMBER,150+R()*100|0)}else if(t===MG){if(R()<.5)set(i,FLARE,initLife(FLARE))}else if(t===PHOS||t===SULF){set(i,FIRE,initLife(FIRE))}else if(t===SR||t===BA){set(i,t===SR?SPK_R:SPK_G,initLife(SPK_R))}else if(t===POWDER)explode(x,y)}
    else if(t===EMPTY&&R()<.5)set(i,sel,initLife(sel));
  }
}
function stroke(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy),1);
  const st=Math.max(1,brush>>1);
  for(let s=0;s<=n;s+=st)dab(Math.round(x0+dx*s/n),Math.round(y0+dy*s/n));
  dab(x1,y1);
}
const ptrs=new Map();
function pos(e){
  const rc=canvas.getBoundingClientRect();
  return [Math.floor((e.clientX-rc.left)/rc.width*W),Math.floor((e.clientY-rc.top)/rc.height*H)];
}
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(document.activeElement===find)find.blur();
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  const [x,y]=pos(e);ptrs.set(e.pointerId,{x,y});dab(x,y);
});
canvas.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  e.preventDefault();
  const [x,y]=pos(e);stroke(p.x,p.y,x,y);p.x=x;p.y=y;
});
const up=e=>ptrs.delete(e.pointerId);
canvas.addEventListener("pointerup",up);
canvas.addEventListener("pointercancel",up);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

// 처음 장면: 물이 담긴 돌 수조와 풀, 선반 위 모래 더미, 용암 그릇
function rect(x0,y0,x1,y1,t,p){
  x0=Math.max(0,x0|0);x1=Math.min(W-1,x1|0);y0=Math.max(0,y0|0);y1=Math.min(H-1,y1|0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(p===undefined||R()<p)set(y*W+x,t,initLife(t));
}
function seed(){
  g.fill(0);life.fill(0);
  const fl=H-1;
  // 수조
  const bx0=W*.08,bx1=W*.58,bh=H*.16;
  rect(bx0,fl-1,bx1,fl,STONE);
  rect(bx0,fl-bh,bx0+1,fl,STONE);
  rect(bx1-1,fl-bh,bx1,fl,STONE);
  rect(bx0+2,fl-bh*.7,bx1-2,fl-2,WATER);
  // 풀
  for(let k=0;k<5;k++){
    const sx=bx0+4+R()*(bx1-bx0-8),sh=bh*(.3+R()*.5);
    rect(sx,fl-1-sh,sx+1,fl-2,PLANT);
  }
  rect(bx0-2,fl-bh-3,bx0+3,fl-bh-1,PLANT);
  // 선반과 모래
  const sy=H*.36;
  rect(W*.5,sy,W*.96,sy+1,STONE);
  rect(W*.56,sy-H*.13,W*.92,sy-1,SAND);
  // 용암 그릇
  const lx0=W*.7,lx1=W*.94,lh=H*.08;
  rect(lx0,fl-1,lx1,fl,STONE);
  rect(lx0,fl-lh,lx0+1,fl,STONE);
  rect(lx1-1,fl-lh,lx1,fl,STONE);
  rect(lx0+2,fl-lh*.75,lx1-2,fl-2,LAVA);
}

function dims(){
  const cw=stage.clientWidth||360,ch=stage.clientHeight||480;
  const w=Math.max(96,Math.min(220,Math.round(cw/3)));
  const h=Math.max(48,Math.min(420,Math.round(w*ch/cw)));
  return [w,h];
}
function fit(){
  if(W&&document.activeElement===find)return;
  const [w,h]=dims();
  if(w===W&&h===H)return;
  const og=g,ol=life,os=shade,oW=W,oH=H;
  alloc(w,h);
  if(!og)return;
  const mh=Math.min(oH,h),mw=Math.min(oW,w);
  for(let yy=0;yy<mh;yy++){
    const so=(oH-1-yy)*oW,dn=(h-1-yy)*w;
    for(let x=0;x<mw;x++){g[dn+x]=og[so+x];life[dn+x]=ol[so+x];shade[dn+x]=os[so+x]}
  }
}

// 조작부
const hint=document.getElementById("hint"),pal=document.getElementById("palette");
let tab=0;
const tabBtns=document.querySelectorAll(".seg button");
function mark(){pal.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.el===sel)))}
function choose(t){
  sel=t;
  const e=ELS.find(o=>o.t===t);
  hint.innerHTML="<b>"+e.n+"</b> "+e.d;
  mark();
}
const find=document.getElementById("find"),findClear=document.getElementById("find-clear");
let query="";
function found(){
  const q=query,a=[],b=[],c=[];
  ELS.forEach(e=>{
    if(e.t===EMPTY)return;
    const sym=(e.sym||"").toLowerCase();
    if((sym&&sym===q)||(e.z!==undefined&&String(e.z)===q))a.push(e);
    else if(e.n.includes(q)||(sym&&sym.startsWith(q)))b.push(e);
    else if(q.length>=2&&e.d.includes(q))c.push(e);
  });
  return a.concat(b,c);
}
function addBtn(e){
  const b=document.createElement("button");
  b.type="button";b.className="el";b.id="el-"+e.t;b.dataset.el=e.t;
  const sw=document.createElement("i");
  if(e.sym){
    sw.className="sym";sw.style.background=e.c;sw.style.color=e.fg||"#fff";
    const z=document.createElement("small");z.textContent=e.z;
    sw.appendChild(z);sw.appendChild(document.createTextNode(e.sym));
  }else if(e.c)sw.style.background=e.c;
  else{sw.style.border="1px dashed #5b6673";sw.style.background="#dfe8f0"}
  const nm=document.createElement("span");nm.textContent=e.n;
  b.appendChild(sw);b.appendChild(nm);
  b.addEventListener("click",()=>choose(e.t));
  pal.appendChild(b);
}
function buildPalette(){
  pal.textContent="";
  pal.classList.toggle("searching",!!query);
  if(query){
    const list=found();
    if(list.length)list.forEach(addBtn);
    else{
      const m=document.createElement("p");m.className="none";
      m.textContent="맞는 원소가 없다. 이름(수소), 기호(H), 원자 번호(1), 성질(터진다)로 찾는다.";
      pal.appendChild(m);
    }
  }else ELS.forEach(e=>{if(e.t===EMPTY||e.tab===tab)addBtn(e)});
  tabBtns.forEach(b=>b.setAttribute("aria-pressed",String(!query&&+b.dataset.tab===tab)));
  mark();
}
function setQuery(v){
  query=String(v||"").trim().toLowerCase();
  findClear.hidden=!query;
  buildPalette();
}
function setTab(n){
  tab=n;
  if(query){find.value="";query="";findClear.hidden=true}
  buildPalette();
}
tabBtns.forEach(b=>b.addEventListener("click",()=>setTab(+b.dataset.tab)));
find.addEventListener("input",()=>setQuery(find.value));
find.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  e.preventDefault();
  const list=query?found():[];
  if(list.length)choose(list[0].t);
  find.blur();
});
find.addEventListener("blur",()=>fit());
findClear.addEventListener("click",()=>{find.value="";setQuery("")});
const brushBtns=document.querySelectorAll(".brush button");
function setBrush(r){brush=r;brushBtns.forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.r===r)))}
brushBtns.forEach(b=>b.addEventListener("click",()=>setBrush(+b.dataset.r)));
const btnPause=document.getElementById("btn-pause");
function setPaused(p){paused=p;btnPause.textContent=p?"재생":"멈춤"}
btnPause.addEventListener("click",()=>setPaused(!paused));
document.getElementById("btn-clear").addEventListener("click",()=>{g.fill(0);life.fill(0)});
document.getElementById("btn-seed").addEventListener("click",seed);

function frame(){
  ptrs.forEach(p=>dab(p.x,p.y));
  if(!paused){step();step()}
  render();
  requestAnimationFrame(frame);
}

function snapshot(){
  let s="";
  for(let i=0;i<g.length;i+=8192)s+=String.fromCharCode.apply(null,g.subarray(i,i+8192));
  return {w:W,h:H,g:s,sel:sel,brush:brush,paused:paused,tab:tab};
}
function start(d){
  d=d||{};
  if(d.g&&d.w&&d.h&&d.g.length===d.w*d.h){
    alloc(d.w,d.h);
    for(let i=0;i<g.length;i++){const t=d.g.charCodeAt(i);g[i]=t<=MAXT?t:0;life[i]=initLife(g[i]);shade[i]=R()*256|0}
    fit();
  }else{
    fit();seed();
  }
  setTab(d.tab>=1&&d.tab<=5?d.tab:0);
  choose(typeof d.sel==="number"&&d.sel<=MAXT?d.sel:SAND);
  setBrush(d.brush||3);
  setPaused(d.paused!==undefined?!!d.paused:matchMedia("(prefers-reduced-motion: reduce)").matches);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);else addEventListener("resize",fit);
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(snapshot);
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
