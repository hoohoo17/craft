<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0f8fb"><title>선셋 레이서 · 자동차 경주</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><a href="../">← 게임 모음</a><span>SUNSET <b>RACER</b></span><button id="pause" aria-label="일시정지">Ⅱ</button></header>
  <div class="dashboard"><div><small>POSITION</small><strong id="rank">1 <em>/ 6</em></strong></div><div><small>LAP</small><strong id="lap">1 <em>/ 10</em></strong></div><div><small>TIME</small><strong id="time">00:00.0</strong></div></div>
  <div class="stage">
    <canvas id="track" aria-label="노을 속 도로를 달리는 자동차 경주"></canvas>
    <div id="announcement" role="status"></div>
    <div class="telemetry"><div><strong id="speed">0</strong><span>km/h</span></div><div class="boost"><small>⚡ NITRO</small><meter id="nitro" min="0" max="100" value="100" aria-label="니트로 잔량"></meter></div></div>
    <div id="overlay"><section>
      <span class="eyebrow">THE GOLDEN HOUR GRAND PRIX</span><h1 id="title">선셋 레이서</h1><p id="description">노을을 향해, 마지막 추월.<br>6대의 자동차 · 10바퀴 · 하나의 우승컵</p>
      <div id="settings"><label for="difficulty">난이도</label><select id="difficulty"><option value="easy">여유롭게 달리기</option><option value="normal" selected>짜릿한 레이스</option><option value="hard">챔피언 도전</option></select></div>
      <p class="guide">자동으로 가속해요.<br>← → / A D 조향 · Space 브레이크 · Shift 니트로<br>휴대폰은 아래 버튼을 누르세요.</p>
      <p id="best"></p><button id="start" class="primary">시동 걸고 출발 →</button><button id="restart" hidden>처음부터 다시</button>
    </section></div>
  </div>
  <div class="controls"><button data-input="left" aria-label="왼쪽 조향">◀</button><button data-input="right" aria-label="오른쪽 조향">▶</button><button data-input="brake">브레이크</button><button data-input="boost" class="nitro-button">⚡ 니트로</button></div>
  <p class="hint">도로 밖에서는 느려져요. 직선에서 니트로로 추월해 보세요!</p>
</main><script src="model.js"></script><script src="game.js"></script><script src="../rest.js?v=9"></script>
</body></html>
