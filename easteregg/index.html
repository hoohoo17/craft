<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="숨은 이스터애그를 찾아 400개 스테이지를 넘기는 게임. 소리·힌트·한/영 버튼도 수상해요.">
<title>이스터애그 400</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column — header, controls, instruction, square play box (container units), hint note */
:root{
  --bg:#e2ecdc; --paper:#fbfdf6; --ink:#22301f; --soft:#5f7059; --line:#c8d7c0;
  --yolk:#f2b31b; --berry:#d6407a; --sky:#cfe6f4; --night:#1a2340; --veil:rgba(34,48,31,.55);
  --sil:brightness(0);
  --disp:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a15; --paper:#1d2721; --ink:#e7efe2; --soft:#9fb09a; --line:#34463b;
  --yolk:#f6c443; --berry:#f06a9b; --sky:#27435a; --night:#0c1226; --veil:rgba(5,8,6,.7); --sil:brightness(0) invert(.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --paper:#1d2721; --ink:#e7efe2; --soft:#9fb09a; --line:#34463b;
  --yolk:#f6c443; --berry:#f06a9b; --sky:#27435a; --night:#0c1226; --veil:rgba(5,8,6,.7); --sil:brightness(0) invert(.88); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:540px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--disp);font-weight:400;font-size:1.55rem;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
h1 .logo{width:18px;height:24px;border-radius:50%/60% 60% 40% 40%;background:linear-gradient(var(--berry) 0 33%,var(--yolk) 33% 66%,#7cc4e8 66%)}
.count{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--soft);display:flex;align-items:center;gap:6px}
.hx{display:inline-flex;min-width:0}
.hegg{display:inline-block;width:11px;height:14px;border-radius:50%/60% 60% 40% 40%;background:#ffd86b;cursor:pointer;box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--yolk);transition:width .4s}
.ctrl{display:flex;gap:8px}
.cb{flex:1;font-family:var(--disp);font-size:1.05rem;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.cb:focus-visible,.sbtn:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.cb .off{opacity:.45}
.inst{font-family:var(--disp);font-weight:400;font-size:1.35rem;line-height:1.3;text-align:center;min-height:2.6em;display:grid;place-items:center;text-wrap:balance;margin:0}
.hint{background:var(--paper);border:2px dashed var(--yolk);border-radius:14px;padding:10px 14px;font-size:1rem;line-height:1.5}
.hint b{font-family:var(--disp);font-weight:400;color:var(--berry);margin-right:6px}

/* play box */
.box{position:relative;width:100%;aspect-ratio:1;background:var(--paper);border:2px solid var(--line);border-radius:26px;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:rotate .8s ease,background .6s;color:var(--ink);box-sizing:border-box}
.box.night{background:var(--night);color:#e9edf8}
.box.flipped{rotate:180deg}
.box.shake{animation:shake .4s}
@keyframes shake{20%{translate:-2% 0}40%{translate:2% 0}60%{translate:-1.5% 0}80%{translate:1% 0}}
.obj{position:absolute;transform:translate(-50%,-50%);transform-origin:0 0;line-height:1;text-align:center;white-space:nowrap}
.tappable{cursor:pointer}
.draggable{cursor:grab;touch-action:none;z-index:5}
.draggable.held{cursor:grabbing;scale:1.08;z-index:20}
.layer{position:absolute;inset:0}
.egg{aspect-ratio:3/4;border-radius:50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 34% 28%,rgba(255,255,255,.75) 0 10%,transparent 11%),var(--pat,none),var(--c,#ffd86b);box-shadow:inset -1.2cqw -1.6cqw 0 rgba(0,0,0,.1),0 .8cqw 0 rgba(0,0,0,.08)}
.egg.tiny::before{content:"";position:absolute;inset:-2.5cqw}
.egg.gold{--c:#f5c542;animation:shine 1.6s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.18) drop-shadow(0 0 3cqw #ffe28a)}}
.slide{transition:left .35s ease,top .35s ease}
.zip{transition:left .55s cubic-bezier(.3,1.4,.6,1),top .55s cubic-bezier(.3,1.4,.6,1)}
.popin{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{scale:0}}
.wob{animation:wob .4s}
@keyframes wob{25%{rotate:-12deg}75%{rotate:10deg}}
.float{animation:float 2s ease-in-out infinite}
.bob{animation:float 3s ease-in-out infinite}
@keyframes float{50%{translate:0 -3cqw}}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{rotate:360deg}}
.ring{animation:wob .25s infinite}
.roll{animation:roll 1.4s ease-in-out infinite}
@keyframes roll{25%{rotate:-22deg}75%{rotate:22deg}}
.flat{border-radius:50% 50% 30% 30%/60% 60% 12% 12%}
.drop{animation:drop .7s ease-in forwards}
@keyframes drop{to{translate:4cqw 45cqw;rotate:200deg}}
.fly{animation:fly .9s ease-out forwards}
@keyframes fly{from{scale:.2}to{translate:0 -28cqw;scale:1;rotate:340deg}}
.launch{animation:launch 1s ease-in forwards}
@keyframes launch{to{translate:0 -90cqw}}
.zoom{animation:zoom .8s ease-in forwards}
@keyframes zoom{to{translate:90cqw 0}}
.say{word-break:keep-all;overflow-wrap:anywhere;position:absolute;left:50%;top:3.5%;transform:translateX(-50%);transform-origin:0 50%;background:var(--ink);color:var(--paper);padding:1.6cqw 3.6cqw;border-radius:999px;font-size:4.4cqw;max-width:88%;text-align:center;z-index:40;pointer-events:none;font-family:var(--disp);white-space:normal;box-sizing:border-box}
.box.night .say{background:#e9edf8;color:var(--night)}
.say.pulse{animation:popin .3s}
.sbtn{font-family:var(--disp);background:var(--yolk);color:#3a2a00;border:0;border-radius:999px;padding:.55em 1.1em;box-shadow:0 .22em 0 #b9850b;cursor:pointer}
.sbtn:active{translate:0 .15em;box-shadow:0 .07em 0 #b9850b}
.sbtn.red{background:#e5383b;color:#fff;width:34cqw;height:34cqw;padding:0;border-radius:50%;box-shadow:0 1.6cqw 0 #9b1d20,inset 0 -1.5cqw 0 rgba(0,0,0,.15);line-height:1.1}
.sbtn.red2{background:#e5383b;color:#fff;box-shadow:0 .22em 0 #9b1d20}
.label{font-family:var(--disp);color:var(--soft)}
.wrapt{white-space:normal;width:80cqw;line-height:1.3}
.para{white-space:normal;width:78cqw;line-height:1.7;text-align:left;user-select:text;-webkit-user-select:text}
.hid{color:var(--paper);display:block;touch-action:none}
.hid::selection{background:transparent;color:var(--paper)}

.word{border-radius:1cqw;padding:0 .3cqw}
.num{width:12cqw;height:12cqw;border-radius:50%;background:var(--sky);color:var(--ink);display:grid;place-items:center;font-family:var(--disp)}
.num.ok{background:var(--yolk);color:#3a2a00}
.crumb{width:1.6cqw;aspect-ratio:1;border-radius:50%;background:var(--c)}
.switch{width:5cqw;height:8cqw;border-radius:1cqw;background:#2d332f;box-shadow:0 0 2.5cqw rgba(255,220,120,.4);z-index:3}
.switch::after{content:"";position:absolute;left:1.2cqw;right:1.2cqw;top:1.2cqw;height:2.6cqw;border-radius:.6cqw;background:#9aa39c}
.switch.on::after{top:auto;bottom:1.2cqw;background:var(--yolk)}
.dark{background:#070a08}
.torch{pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),transparent 0 10cqw,rgba(5,7,6,.97) 15cqw)}
.pad{width:34cqw;aspect-ratio:1;border-radius:22%;opacity:.5;transition:opacity .1s,scale .1s}
.pad.lit{opacity:1;scale:1.05}
.bulb.off{filter:grayscale(1) brightness(.6);opacity:.5}
.key{width:14cqw;height:30cqw;background:#fff;color:#333;border:.5cqw solid #333;border-radius:0 0 2cqw 2cqw;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2.5cqw;box-sizing:border-box;font-family:var(--disp)}
.key.down{filter:brightness(.88);translate:0 1cqw}
.ansrow{display:flex;gap:1.6cqw}
.adot{width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;color:#3a2a00;font-family:var(--disp);font-size:4cqw;transition:scale .15s}
.adot.on{scale:1.3;box-shadow:0 0 0 .6cqw var(--ink)}
.notes{font-family:var(--disp);letter-spacing:.05em}
.tile{width:14cqw;height:14cqw;border-radius:2.5cqw;background:var(--yolk);color:#3a2a00;display:grid;place-items:center;font-family:var(--disp);box-shadow:0 1cqw 0 #b9850b}
.tile.used{opacity:.25}
.lcd{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{width:60cqw;height:4cqw;border-radius:2cqw;background:var(--line);overflow:hidden}
.bar i,.load i{display:block;height:100%;width:0}
.bar i{background:var(--berry)}
.tlight{width:12cqw;height:24cqw;background:#222;border-radius:3cqw;display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.tlight i{width:8cqw;height:8cqw;border-radius:50%;background:#e63946;box-shadow:0 0 3cqw #e63946}
.tlight i:last-child{background:#24382a;box-shadow:none}
.tlight.go i:first-child{background:#4a2224;box-shadow:none}
.tlight.go i:last-child{background:#2ecc71;box-shadow:0 0 3cqw #2ecc71}
.ad{background:rgba(0,0,0,.45);z-index:10;display:grid;place-items:center}
.adc{position:relative;width:70%;background:#fff;color:#222;border-radius:4cqw;padding:6cqw 5cqw 5cqw;text-align:center;font-size:4.4cqw;line-height:1.4;box-shadow:0 2cqw 6cqw rgba(0,0,0,.3)}
.adc b{font-family:var(--disp);font-weight:400;font-size:6cqw;display:block;color:#e5383b}
.adc p{margin:2cqw 0}
.adbig{font-family:var(--disp);font-size:5cqw;background:#3a86ff;color:#fff;border:0;border-radius:999px;padding:2cqw 7cqw;cursor:pointer}
.adx{position:absolute;top:1cqw;right:2cqw;border:0;background:none;color:#bbb;font-size:3.6cqw;cursor:pointer;padding:.5cqw}
.domino{width:3.2cqw;height:18cqw;background:var(--ink);border-radius:.8cqw;transform-origin:50% 50%;transition:rotate .18s ease-in}
.domino.fall{rotate:72deg}
.ghost{background:none;outline:.5cqw dashed var(--soft)}
.ledge{width:16cqw;height:2cqw;background:var(--soft);border-radius:1cqw}
.well{width:24cqw;height:36cqw;background:#2b2f3a;border-radius:2cqw 2cqw 0 0;box-shadow:inset 0 2cqw 0 #444b5c}
.water{top:55%;background:linear-gradient(rgba(142,202,230,.65),rgba(33,158,188,.8))}
.fline{width:.5cqw;height:40cqw;background:var(--soft)}
.hook{width:4cqw;height:5cqw;border:.8cqw solid var(--soft);border-top:0;border-radius:0 0 3cqw 3cqw;box-sizing:border-box}
.rain{pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(80,140,220,.4) 9px 10px);background-size:60px 60px;animation:rain .5s linear infinite}
@keyframes rain{to{background-position:-10px 60px}}
.fence{width:20cqw;height:12cqw;background:linear-gradient(90deg,#a0703f 0 2cqw,transparent 2cqw 9cqw,#a0703f 9cqw 11cqw,transparent 11cqw 18cqw,#a0703f 18cqw),linear-gradient(transparent 30%,#a0703f 30% 42%,transparent 42% 68%,#a0703f 68% 80%,transparent 80%)}
.ground{left:0;right:0;width:100%;height:1cqw;background:var(--line);transform:none}
.dot{width:3cqw;height:3cqw;border-radius:50%;opacity:.85}
.wire{width:64cqw;height:3cqw;border-radius:2cqw}
.wire.cut{-webkit-mask:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%);mask:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%)}
.door{width:36cqw;height:56cqw;background:#9c6b3f;border-radius:1.5cqw;border:1cqw solid #6b4524;transform-origin:-50% 0;transition:scale .6s;box-sizing:border-box;display:grid;place-items:start center;padding-top:6cqw}
.door.open{scale:.08 1}
.sign{background:#fff;color:#333;font-family:var(--disp);font-size:4.2cqw;padding:1cqw 2cqw;border-radius:1cqw}
.knob{width:5cqw;height:5cqw;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 .8cqw #6b4524}
.track{width:70cqw;height:13cqw;border-radius:999px;background:var(--line);display:grid;place-items:center;color:var(--soft);font-family:var(--disp)}
.thumb{width:12cqw;height:12cqw;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.25)}
.load{width:76cqw;height:9cqw;border-radius:999px;background:var(--line);overflow:hidden}
.load i{background:repeating-linear-gradient(-45deg,var(--berry) 0 3cqw,#e86d9b 3cqw 6cqw);transition:width .1s}
.capt{display:flex;align-items:center;gap:2.5cqw;background:#f9f9f9;color:#333;border:.4cqw solid #ccc;border-radius:1.5cqw;padding:3.5cqw 5cqw}
.capt .bx{width:6cqw;height:6cqw;border:.5cqw solid #999;border-radius:.6cqw;background:#fff}
.cell{width:18cqw;height:18cqw;border-radius:2cqw;background:var(--sky);display:grid;place-items:center}
.cell.sel{outline:1cqw solid var(--berry);outline-offset:-1cqw}
.bub{width:15cqw;height:15cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,rgba(180,220,255,.65) 13% 100%);box-shadow:inset 0 0 0 .5cqw rgba(120,170,220,.6)}
.bub.popped{background:none;box-shadow:inset 0 0 0 .4cqw rgba(120,170,220,.4);scale:.85}
.hole{width:18cqw;height:6cqw;border-radius:50%;background:#3b2a1d}
.card{width:20cqw;height:26cqw;border-radius:2.5cqw;background:var(--berry);display:grid;place-items:center;box-shadow:0 1cqw 0 rgba(0,0,0,.15)}
.card.up{background:var(--paper);outline:.5cqw solid var(--line)}
.ans{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;gap:2cqw;z-index:30;width:80cqw}
.ans input{flex:1;min-width:0;font-size:max(16px,4.6cqw);padding:2cqw 3.5cqw;border-radius:999px;border:.5cqw solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--body)}
.ans button{font-family:var(--disp);font-size:max(16px,4.6cqw);border:0;border-radius:999px;background:var(--berry);color:#fff;padding:0 5cqw;cursor:pointer}
.clear{position:absolute;inset:0;background:var(--veil);display:grid;place-items:center;z-index:60;overflow:hidden}
.cc{position:relative;background:var(--paper);color:var(--ink);border-radius:5cqw;padding:7cqw 8cqw;text-align:center;display:flex;flex-direction:column;gap:3.5cqw;align-items:center;max-width:72cqw;animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.cc .big{font-family:var(--disp);font-size:12cqw;color:var(--berry);line-height:1}
.cc p{margin:0;font-size:4.8cqw;line-height:1.4}
.cc .sbtn{font-size:5cqw}
.conf i{position:absolute;top:-8%;width:3cqw;aspect-ratio:3/4;border-radius:50%/60% 60% 40% 40%;animation:fall 1.8s linear forwards}
@keyframes fall{to{translate:0 120cqw;rotate:540deg}}
.gseg{transform:none;height:2.2cqw;background:var(--soft);border-radius:.5cqw}
.plank{background:#a0703f}
.grow{animation:grow .4s}
@keyframes grow{from{scale:0 1}}
.blink{animation:blink .25s infinite}
@keyframes blink{50%{opacity:.3}}
.pitbg{transform:none;height:28%;background:rgba(0,0,0,.1)}
.spikes{color:#d62828;letter-spacing:-.05em}
.spikes.up2{scale:1 .2;opacity:.45;transition:scale .15s,opacity .15s}
.spikes.up2.on{scale:1 1;opacity:1}
.pplate{width:8cqw;height:2.4cqw;border-radius:2cqw 2cqw 0 0;background:#e63946;box-shadow:0 0 2cqw rgba(230,57,70,.5)}
.pplate.down{height:1cqw;background:#9b1d20;box-shadow:none}
.glow{opacity:.04}
.glow.lit{opacity:1;box-shadow:0 0 4cqw #8fffb0,0 0 9cqw #4dff88}
.dark2{background:rgba(4,6,10,.93)}
.ztrack{width:44cqw;height:1.4cqw;background:repeating-linear-gradient(90deg,#555 0 1cqw,#999 1cqw 2cqw);border-radius:1cqw}
.zpull{width:5cqw;height:9cqw;border-radius:1.5cqw;background:var(--yolk);box-shadow:0 .6cqw 0 #b9850b}
.scard{width:70cqw;height:46cqw;border-radius:3cqw;background:#fff8e1;overflow:hidden;box-shadow:0 1cqw 3cqw rgba(0,0,0,.18)}
.prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;color:#3a2a00;font-family:var(--disp);font-size:6cqw}
.prize .egg{display:block}
.prize b{font-weight:400}
.sc{position:absolute;width:10.5%;height:17.5%;background:#b9bdb6}
.sc.gone{opacity:0;pointer-events:none}
.spinl{animation:spinl 2.6s cubic-bezier(.2,.6,.3,1)}
@keyframes spinl{to{rotate:1800deg}}
.spinr{animation:spinr 1s ease-out}
@keyframes spinr{20%{rotate:40deg}40%{rotate:-25deg}60%{rotate:15deg}80%{rotate:-5deg}}
.mirror{width:40cqw;height:58cqw;border-radius:20cqw 20cqw 3cqw 3cqw;background:linear-gradient(135deg,#e4f1f8,#b7d2e4);border:1.5cqw solid #b08a5a;box-sizing:border-box}
.shadow{filter:var(--sil)}
.cell2{width:20cqw;height:20cqw;border-radius:3cqw;background:var(--sky);display:grid;place-items:center}
.stick{width:2.4cqw;height:9cqw;border-radius:.6cqw;background:repeating-linear-gradient(-30deg,#9fd3f2 0 1.5cqw,#fff 1.5cqw 3cqw)}
.flame{padding:1.5cqw}
.flame.out{opacity:.08}
.vline{width:.6cqw;height:100%;background:var(--line);top:50%}
.carton{width:78cqw;height:22cqw;border-radius:3cqw;background:#c9a77c;box-shadow:inset 0 -1.5cqw 0 rgba(0,0,0,.12)}
.slot{width:13cqw;height:15cqw;border-radius:50%;background:#b08d63;border:.8cqw dashed #fff;box-sizing:border-box}
.wordb{padding:1.4cqw 3cqw;border-radius:999px;background:var(--sky);font-family:var(--body)}
.wordb.sel{background:var(--yolk);color:#3a2a00}
.pin{width:4cqw;height:9cqw;border-radius:2cqw 2cqw 1cqw 1cqw;background:linear-gradient(#fff 0 30%,#e63946 30% 40%,#fff 40%);box-shadow:0 .4cqw 0 rgba(0,0,0,.15);transition:rotate .4s,opacity .4s}
.lane{width:40cqw;height:84cqw;background:linear-gradient(90deg,var(--line) 0 3cqw,transparent 3cqw 37cqw,var(--line) 37cqw);opacity:.6}
.ball{width:12cqw;height:12cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7aa7ff,#22409a)}
.roll2{transition:left .8s ease-out,top .8s ease-out}
.pegg{display:inline-block;width:1.3cqw;height:1.7cqw;margin-left:.3cqw;border-radius:50%/60% 60% 40% 40%;background:var(--ink);position:relative;vertical-align:baseline;transition:width .4s,height .4s,background .4s}
.pegg::before{content:"";position:absolute;inset:-2.5cqw}
.pegg.big{width:6cqw;height:8cqw;background:#ffd86b}
.scard.plain{background:transparent;box-shadow:none}
.scard.window{background:linear-gradient(#bfe3f7,#e9f6ff);outline:2cqw solid #b08a5a}
.scard.tub{background:#bfe3f7}

.cracks{z-index:6}

@keyframes hero{25%{translate:-30cqw -40cqw}50%{translate:30cqw -50cqw}75%{translate:10cqw -30cqw}}
.xray{width:36cqw;height:36cqw;border-radius:2cqw;background:rgba(10,20,40,.85);box-shadow:inset 0 0 0 1cqw #4fd1ff;z-index:6}
.xs{position:absolute;left:50%;top:55%;width:10cqw;height:13cqw;transform:translate(-50%,-50%);border-radius:50%/60% 60% 40% 40%;box-shadow:0 0 0 .6cqw #bff3ff,0 0 4cqw #4fd1ff;opacity:0;transition:opacity .2s}
.xscreen{width:60cqw;height:20cqw;border-radius:2cqw;background:#0f2a3a;color:#bff3ff;display:grid;place-items:center;font-size:8cqw;filter:grayscale(.3)}
.glowegg{display:inline-block;width:6cqw;height:8cqw;border-radius:50%/60% 60% 40% 40%;box-shadow:0 0 0 .5cqw #ffe28a,0 0 3cqw #ffe28a}
.xgate{width:24cqw;height:30cqw;border:1.4cqw solid #888;border-bottom:0;box-sizing:border-box;background:rgba(80,120,160,.15)}
.eggcar{position:relative;display:block}
.eggcar i{position:absolute;bottom:-2cqw;width:6cqw;height:6cqw;border-radius:50%;background:#333}
.eggcar i:first-of-type{left:2cqw}.eggcar i:last-of-type{right:2cqw}
.rpot{width:44cqw;height:26cqw;background:#aab4bc;border-radius:1.5cqw 1.5cqw 8cqw 8cqw}

.rpot.boil i{animation:float .5s infinite;background:#bfe3f7}
.gmat{width:70cqw;height:40cqw;background:repeating-linear-gradient(90deg,#c8a96b 0 2.4cqw,#a8874b 2.4cqw 3cqw);border-radius:1cqw;transition:height .3s}
.gmat.rolled{height:12cqw;border-radius:6cqw;background:#1f3a24}
.gslice{width:13cqw;height:13cqw;border-radius:50%;background:radial-gradient(circle,#ffd86b 0 22%,#e63946 23% 30%,#52b788 31% 38%,#fff 39% 72%,#1f3a24 73%)}
.clam{width:30cqw;height:18cqw;border-radius:50% 50% 45% 45%;background:linear-gradient(#d9c7b8 50%,#c4ab96 50%);transition:background .2s}
.clam.open,.clam.stay{background:radial-gradient(ellipse at 50% 50%,#ffd86b 0 18%,#f7e7d7 19% 46%,#c4ab96 47%)}
.crumbx{display:inline-block;width:2cqw;height:2cqw;border-radius:30%;background:#c69250;margin-left:.5cqw}
.pupa{display:inline-block;width:12cqw;height:24cqw;border-radius:50%;background:linear-gradient(#7fb069,#4c7a3a)}
.flour{width:2cqw;height:2cqw;border-radius:50%;background:#f4efe6;animation:popin .4s both}
.yut{width:8cqw;height:36cqw;border-radius:4cqw;background:#e9d8a6;box-shadow:inset 0 0 0 .6cqw #c8a96b;transition:rotate .2s}
.yut.back{background:repeating-linear-gradient(0deg,#e9d8a6 0 4cqw,#a0703f 4cqw 5cqw)}
.mold{width:56cqw;height:30cqw;border-radius:3cqw;background:#555;box-shadow:inset 0 0 0 2cqw #333;display:grid;place-items:center}
.mold.hot{box-shadow:inset 0 0 0 2cqw #333,0 0 6cqw rgba(255,120,0,.6)}
.bread{display:grid;place-items:center;width:36cqw;height:20cqw;border-radius:3cqw;background:#e0a35c}
.ddot{width:4cqw;height:4cqw;border-radius:50%;background:#7a5200;cursor:pointer}
.ddot::before{content:"";position:absolute;inset:-2cqw}
.ddot.ok{background:#fff3c4}
.gourd{width:34cqw;height:30cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e6eadf);box-shadow:inset -2cqw -2cqw 0 #cfd6c4}
.gourd.split{clip-path:polygon(0 0,46% 0,40% 100%,0 100%);opacity:.6}
.hab{display:block;width:22cqw;height:26cqw;border-radius:50% 50% 40% 40%;background:repeating-linear-gradient(90deg,#e63946 0 3cqw,#ffd166 3cqw 6cqw);box-shadow:0 14cqw 0 -8cqw #a0703f}
.ppball{width:10cqw;height:10cqw;border-radius:50%;background:#fbfbf7;box-shadow:inset -.6cqw -.8cqw 0 rgba(0,0,0,.06),0 0 0 .3cqw #e7e7df}
.stk{width:40cqw;height:40cqw;border-radius:50%;background:#fff;box-shadow:0 1cqw 3cqw rgba(0,0,0,.15);display:grid;place-items:center;font-size:24cqw;transition:rotate .5s,translate .5s,opacity .5s;transform-origin:20% 20%}
.stk.peel{rotate:-60deg;translate:-30cqw -30cqw;opacity:0}
.scorner{width:10cqw;height:10cqw;background:linear-gradient(135deg,transparent 50%,#e7e7df 50%);border-radius:0 0 2cqw 0;z-index:4}
.meringue{width:40cqw;height:24cqw;border-radius:50% 50% 30% 30%;background:radial-gradient(circle at 30% 70%,#fff 0 30%,transparent 31%),radial-gradient(circle at 60% 40%,#fff 0 34%,transparent 35%),radial-gradient(circle at 50% 10%,#fff 0 18%,transparent 19%);filter:drop-shadow(0 .6cqw 0 #e6e2d8);transition:scale .2s}
.target{width:20cqw;height:20cqw;border-radius:50%;background:radial-gradient(circle,#e63946 0 18%,#fff 19% 38%,#e63946 39% 58%,#fff 59% 78%,#e63946 79%)}
.spinx{animation:spinx .6s}
@keyframes spinx{to{transform:translate(-50%,-50%) rotateY(720deg)}}
.ice{width:30cqw;height:30cqw;border-radius:3cqw;background:linear-gradient(135deg,rgba(220,240,255,.75),rgba(170,210,240,.6));box-shadow:inset 0 0 0 .8cqw rgba(255,255,255,.8);--k:0;opacity:calc(1 - var(--k)*.12)}
.cotton{width:40cqw;height:34cqw;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffd6e7,#f7a8c4);box-shadow:0 0 0 1cqw rgba(255,214,231,.6);scale:.2;transition:scale .2s}
.letter{width:56cqw;padding:8cqw 4cqw;background:#fffaf0;color:#333;border-radius:1.5cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.15);font-family:var(--disp);display:grid;place-items:center}
.dream{width:30cqw;height:24cqw;border-radius:50%;background:#fff;box-shadow:0 0 0 .6cqw #dfe7ee,-12cqw 14cqw 0 -9cqw #fff,-16cqw 20cqw 0 -11cqw #fff;display:grid;place-items:center;font-size:12cqw}
.credits{width:80cqw;height:80cqw;overflow:hidden;background:#111;border-radius:2cqw;white-space:normal}
.credits .roll{position:absolute;left:0;right:0;top:100%;text-align:center;color:#eee;font-family:var(--disp);font-size:5cqw;animation:roll2 9s linear infinite}
.credits p{margin:0 0 7cqw}
@keyframes roll2{to{top:-120%}}
.hegg.big2{width:7cqw;height:9cqw;vertical-align:middle}
.breath{width:24cqw;height:24cqw;border-radius:50%;background:radial-gradient(circle,#bfe3f7,#8ecae6);transition:scale 1.5s ease}
.breath.in{scale:2.2}
.count #cnt{cursor:pointer;padding:4px 6px;border-radius:8px}
.count #cnt:focus-visible{outline:3px solid var(--berry)}
.jump{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.jump .jr{display:flex;gap:8px;align-items:center}
.jump input{flex:1;min-width:0;font-size:16px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--mono)}
.jump button{font-family:var(--disp);font-size:1rem;border:0;border-radius:999px;padding:8px 14px;background:var(--berry);color:#fff;cursor:pointer}
.jump .jx{background:transparent;color:var(--soft);padding:8px}
.jump .jm{margin:0;color:var(--soft);font-size:.9rem}
.board{width:90cqw;height:48cqw;border-radius:3cqw;background:var(--sky);box-shadow:inset 0 0 0 .6cqw var(--line)}
.qtile{width:26cqw;height:26cqw;overflow:hidden;background:var(--sky);outline:.4cqw solid var(--paper);transition:rotate .2s}
.qpic{position:absolute;width:200%;height:200%}
.qpic .egg{position:absolute;left:50%;top:50%;width:34cqw;transform:translate(-50%,-50%);--c:#f7a8c4;--pat:linear-gradient(transparent 0 38%,#ffd86b 38% 50%,transparent 50%)}
.qpic b{position:absolute;left:22%;top:16%;font-size:9cqw;font-weight:400}
@media (prefers-reduced-motion:reduce){.float,.bob,.spin,.ring,.rain,.egg.gold{animation:none}.conf{display:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<div class="wrap">
  <div class="top">
    <h1><span class="logo"></span><span id="ttl">이스터애그 400</span></h1>
    <div class="count"><span class="hx" id="hx"></span><span id="cnt">1 / 400</span></div>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div class="jump" id="jump" hidden></div>
  <div class="ctrl">
    <button class="cb" id="bSnd" type="button">🔊 소리</button>
    <button class="cb" id="bHint" type="button">💡 힌트</button>
    <button class="cb" id="bLang" type="button">한 / <span class="off">EN</span></button>
  </div>
  <h2 class="inst" id="inst"></h2>
  <div class="box" id="box"></div>
  <div class="hint" id="hint" hidden></div>
</div>

<script>
(()=>{
const R=Math.random, rnd=(a,b)=>a+R()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1)), pick=x=>x[Math.floor(R()*x.length)];
const shuf=x=>{x=[...x];for(let i=x.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const EC=['#f7a8c4','#9fd3f2','#ffd86b','#b5e48c','#c9a7f5','#ffb38a'];
const $=s=>document.getElementById(s);
const box=$('box');
let L='ko', snd=true, cur=0, best=0, api=null;
try{const d=JSON.parse(localStorage.getItem('egg70')||'{}'); if(d.L)L=d.L; if(d.snd===false)snd=false; if(Number.isInteger(d.cur))cur=d.cur; if(Number.isInteger(d.best))best=d.best;}catch(e){}
const save=()=>{try{localStorage.setItem('egg70',JSON.stringify({L,snd,cur,best}))}catch(e){}};
const T=a=>L==='ko'?a[0]:a[1];

/* sound */
let ac=null;
function tone(f,d=.12,type='sine',v=.15,delay=0){
  if(!snd)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sfx={
  tap:()=>tone(660,.06,'triangle',.12),
  pop:()=>{tone(900,.05,'square',.07);tone(300,.08,'triangle',.1,.03)},
  no:()=>{tone(220,.15,'sawtooth',.07);tone(170,.2,'sawtooth',.07,.12)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.14,i*.09)),
  knock:()=>tone(160,.09,'triangle',.3),
  note:f=>tone(f,.3,'sine',.18)
};

function mk(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function spots(n,md=16,x0=10,x1=90,y0=14,y1=86){const r=[];let g=0;while(r.length<n&&g<3000){g++;const p={x:rnd(x0,x1),y:rnd(y0,y1)};if(r.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=md))r.push(p)}while(r.length<n)r.push({x:rnd(x0,x1),y:rnd(y0,y1)});return r}

const S=[];
const st=(t,h,s)=>S.push({t,h,s});

/* ---------- 70 stages ---------- */
// 1
st(['버튼을 절대 누르지 마세요','Do NOT press the button'],['가끔은 말을 안 들어도 괜찮아요','Sometimes it’s fine to disobey'],a=>{
  a.btn(50,50,a.T(['누르지<br>마!','DON’T!']),a.win,{cls:'red',size:7});
});
// 2
st(['알이 쿨쿨 자고 있어요','The egg is fast asleep'],['여러 번 톡톡 두드려 보세요','Tap it again and again'],a=>{
  const e=a.egg(50,55,30,'#ffd86b'),z=a.put(66,24,'💤',{size:10,cls:'float'});let n=0;
  const w=a.T([['톡','톡톡','똑똑똑!','으음…','깼다!'],['tap','tap tap','knock knock!','mmm…','awake!']]);
  a.tap(e,()=>{a.say(w[n]);n++;sfx.tap();a.wob(e);if(n===5){z.remove();e.remove();a.put(50,55,'🐣',{size:30,cls:'popin'});a.after(700,a.win)}});
});
// 3
st(['닭이 뭔가를 품고 있어요','The hen is sitting on something'],['닭을 끌어서 옮겨 보세요','Drag the hen away'],a=>{
  const e=a.egg(50,64,20,'#9fd3f2');a.tap(e,a.win);
  const h=a.put(50,55,'🐔',{size:34});
  a.drag(h,{end:p=>{if(a.dist(p,{x:50,y:55})>16)a.say(a.T(['꼬꼬! 내 알이야!','Bawk! My egg!']))}});
});
// 4
st(['너무 깜깜해요','It’s pitch dark'],['구석 어딘가에 작은 스위치가 있어요','There’s a tiny switch in a corner'],a=>{
  const e=a.egg(rnd(20,80),rnd(30,80),13,pick(EC));a.tap(e,a.win);
  const d=a.layer('dark'),s=a.put(91,9,'',{cls:'switch',size:1});
  a.tap(s,()=>{if(s.classList.contains('on'))return;sfx.tap();d.remove();s.classList.add('on');a.say(a.T(['찰칵!','Click!']))});
});
// 5
st(['고양이가 알을 지키고 있어요','The cat is guarding an egg'],['아무것도 누르지 말고 가만히 기다려 보세요','Don’t touch anything. Just wait'],a=>{
  const c=a.put(50,50,'🐱',{size:34});let last=Date.now(),out=false,z=false;
  a.on(box,'pointerdown',()=>{if(out)return;last=Date.now();z=false;c.textContent='🙀';a.say(a.T(['냐옹! 시끄러워!','Meow! Too noisy!']));a.after(800,()=>{if(!out)c.textContent='🐱'})});
  a.every(300,()=>{if(out)return;const d=Date.now()-last;
    if(d>2500&&!z){z=true;a.say('…zZ')}
    if(d>=5000){out=true;c.textContent='😽';a.say(a.T(['쿨쿨…','Zzz…']));const e=a.egg(78,72,13,'#b5e48c',{cls:'popin'});a.tap(e,a.win)}});
});
// 6
st(['수탉이 너무 시끄러워요','The rooster is way too loud'],['위에 있는 소리 버튼을 눌러 보세요','Try the sound button up top'],a=>{
  const r=a.put(50,52,'🐓',{size:34});let q=false;
  a.every(1000,()=>{if(q)return;a.say(a.T(['꼬끼오!!!','COCK-A-DOODLE-DOO!!!']));a.wob(r);tone(700,.18,'sawtooth',.05);tone(950,.3,'sawtooth',.05,.15)});
  a.onSound=()=>{a.onSound=null;q=true;r.textContent='🐔';a.say(a.T(['…쉿, 조용','…shh']));a.after(700,a.win)};
});
// 7
st(['힌트 버튼은 절대 누르지 마세요','Never press the hint button'],['…눌렀네요? 통과!','…You pressed it? You pass!'],a=>{
  a.put(50,50,'🤫',{size:32});a.say(a.T(['쉿! 힌트는 비밀이에요','Shh! Hints are a secret']));
  a.onHint=()=>{a.onHint=null;a.after(700,a.win)};
});
// 8 (title shows the other language on purpose)
st(['Press the language button!','언어 버튼을 눌러 보세요!'],['위쪽의 한 / EN 버튼을 눌러 보세요','Press the 한 / EN button up top'],a=>{
  a.put(50,50,'🌏',{size:32,cls:'spin'});a.say(a.T(['무슨 말인지 모르겠어요?','Can’t read it?']));
  a.onLang=()=>{a.onLang=null;a.after(500,a.win)};
});
// 9
st(['어딘가에 아주아주 작은 알이 있어요','There’s a teeny tiny egg somewhere'],['보라색 점처럼 생겼어요','It looks like a purple dot'],a=>{
  for(let i=0;i<16;i++){const s=a.put(rnd(5,95),rnd(8,95),'',{cls:'crumb',size:1});s.style.setProperty('--c',pick(['#d8c9a8','#b9cba9','#e2c7a4']))}
  const e=a.egg(rnd(8,92),rnd(12,92),2.8,'#9b6ee8',{cls:'tiny'});a.tap(e,()=>{a.say(a.T(['찾았다!','Found it!']));a.win()});
});
// 10
st(['알을 잡아 보세요','Catch the egg'],['알도 계속 도망가면 지쳐요','Even eggs get tired of running'],a=>{
  const e=a.egg(50,50,14,'#ffb38a',{cls:'slide'});let n=0;
  const run=()=>{if(n>=6)return;n++;sfx.pop();a.move(e,rnd(12,88),rnd(16,86));a.say(n>=6?a.T(['헥헥… 힘들어','Huff… so tired']):a.T(['메롱!','Nyah!']))};
  a.on(e,'pointerenter',run);a.tap(e,()=>{if(n<6)run();else a.win()});
});
// 11
st(['숫자를 1부터 차례로 눌러요','Tap the numbers from 1 up'],['틀리면 처음부터예요','A wrong tap starts over'],a=>{
  let k=1;const ps=spots(5,20);
  for(let n=1;n<=5;n++){const e=a.put(ps[n-1].x,ps[n-1].y,String(n),{cls:'num',size:7});
    a.tap(e,()=>{if(n===k){k++;e.classList.add('ok');sfx.note(400+n*80);if(k>5){a.say(a.T(['짠! 알이 굴러 나왔어요','Ta-da!']));a.after(400,a.win)}}
      else{k=1;box.querySelectorAll('.num').forEach(x=>x.classList.remove('ok'));a.no(a.T(['처음부터!','Start over!']))}})}
});
// 12
st(['풍선 속에 알이 숨었어요','An egg is hiding in a balloon'],['풍선을 전부 터뜨려 보세요','Pop every balloon'],a=>{
  const ps=spots(8,18,12,88,20,84);let left=8;
  ps.forEach(p=>{const b=a.put(p.x,p.y,'🎈',{size:13,cls:'bob'});b.style.filter=`hue-rotate(${rint(0,300)}deg)`;b.style.animationDelay=(-R()*3)+'s';
    a.tap(b,()=>{sfx.pop();b.textContent='💥';b.style.pointerEvents='none';a.after(250,()=>b.remove());
      if(--left===0){const e=a.egg(p.x,p.y,13,pick(EC),{cls:'popin'});a.say(a.T(['마지막 풍선에서 나왔다!','It was in the last one!']));a.tap(e,a.win)}})});
});
// 13

function plank(a,G,x0,x1){const e=a.put(0,0,'',{cls:'gseg plank grow',size:1});e.style.cssText+=`left:${x0}%;width:${x1-x0}%;top:${G}%;`;return e}

    a.put((o.pit[0]+o.pit[1])/2,95,'▲'.repeat(Math.round((o.pit[1]-o.pit[0])/4)),{cls:'spikes',size:4.5})}
  (o.pit?[[0,o.pit[0]],[o.pit[1],100]]:[[0,100]]).forEach(([x0,x1])=>{const e=a.put(0,0,'',{cls:'gseg',size:1});e.style.cssText+=`left:${x0}%;width:${x1-x0}%;top:${G}%;`});

  w.near=d=>!!d&&Math.abs(w.x-a.xy(d).x)<6;

  w.step=d=>{if(w.busy||a.done)return;if(o.rev)d=-d;w.x=Math.max(4,Math.min(96,w.x+8*d));a.move(w.h,w.x,w.hy());

  holdBtn(a,50,88,a.T(['후~ 하~','Breathe']),{size:5,down:()=>{hold=true;t0=performance.now();c.classList.add('in')},up:()=>{hold=false;c.classList.remove('in');if(n>=3)return;if(performance.now()-t0>1300){n++;lb.textContent=n+' / 3';tone(300+n*100,.4,'sine',.08);
    if(n===3){lb.textContent='';a.say(a.T(['마음이 편해졌어요. 준비 완료!','All calm. Ready!']));eggThen(a,50,44,12)}}else a.say(a.T(['조금 더 길게 들이쉬어요','Breathe in a bit longer']))}});
});
// 400
st(['황금알이 나타났어요!','The golden egg appears!'],['일곱 번 두드려요','Tap it seven times'],a=>{
  const e=a.egg(50,50,36,'',{cls:'gold'});let n=0;
  a.tap(e,()=>{if(n>=7)return;n++;a.wob(e);tone(700+n*80,.15,'triangle',.15);a.say('✨'.repeat(n));
    if(n===7){e.remove();a.put(50,40,'👑',{size:12,cls:'popin'});a.put(50,56,'🐥',{size:26,cls:'popin'});a.say(a.T([`고마워! ${S.length}개 모두 찾았어!`,`Thanks! You found all ${S.length}!`]));a.after(1000,a.win)}});
});

/* ---------- engine ---------- */
let outside=[];
function teardown(){if(api)api._kill();outside.forEach(e=>e.remove());outside=[];}
function build(i){
  teardown();
  const timers=[];let done=false;
  box.innerHTML='';box.className='box';box.style.cssText='';$('hint').hidden=true;
  const a={
    L,T,get done(){return done},
    put(x,y,html,o={}){const e=mk(o.tag||'div','obj '+(o.cls||''),html);e.style.left=x+'%';e.style.top=y+'%';e.style.fontSize=(o.size||12)+'cqw';box.appendChild(e);return e},
    layer(cls){const e=mk('div','layer '+(cls||''));box.appendChild(e);return e},
    tap(e,fn){e.classList.add('tappable');e.addEventListener('click',ev=>{ev.stopPropagation();if(done)return;fn(ev)});return e},
    btn(x,y,label,fn,o={}){const e=a.put(x,y,label,{...o,tag:'button',cls:'sbtn '+(o.cls||''),size:o.size||5});e.type='button';a.tap(e,()=>{sfx.tap();fn(e)});return e},
    egg(x,y,w,c,o={}){const e=a.put(x,y,'',{cls:'egg '+(o.cls||''),size:1});e.style.width=w+'cqw';if(c)e.style.setProperty('--c',c);return e},
    on(t,ev,fn){t.addEventListener(ev,fn);timers.push(()=>t.removeEventListener(ev,fn))},
    after(ms,fn){const id=setTimeout(()=>{if(!done)fn()},ms);timers.push(()=>clearTimeout(id));return id},
    every(ms,fn){const id=setInterval(()=>{if(!done)fn()},ms);timers.push(()=>clearInterval(id));return id},
    raf(fn){let on=true;const loop=t=>{if(!on||done)return;fn(t);requestAnimationFrame(loop)};requestAnimationFrame(loop);timers.push(()=>{on=false})},
    say(txt){let b=box.querySelector('.say');if(!b){b=mk('div','say');box.appendChild(b)}b.textContent=txt;b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')},
    wob(e){e.classList.remove('wob');void e.offsetWidth;e.classList.add('wob')},
    no(msg){sfx.no();box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');if(msg)a.say(msg)},
    win(){if(done)return;done=true;celebrate(i)},
    reset(ms){done=true;const id=setTimeout(()=>{if(cur===i)build(i)},ms);timers.push(()=>clearTimeout(id))},
    fin(fn){timers.push(fn)},
    outside(e,par){(par||$('hx')).appendChild(e);outside.push(e)},
    pos(ev){const r=box.getBoundingClientRect();let x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100;if(box.classList.contains('flipped')){x=100-x;y=100-y}return{x,y}},
    move(e,x,y){e.style.left=x+'%';e.style.top=y+'%'},
    xy(e){return{x:parseFloat(e.style.left),y:parseFloat(e.style.top)}},
    dist(p,q){return Math.hypot(p.x-q.x,p.y-q.y)},
    drag(e,o={}){e.classList.add('draggable');let sx,sy,ox,oy,on=false;
      e.addEventListener('pointerdown',ev=>{if(done)return;on=true;try{e.setPointerCapture(ev.pointerId)}catch(x){}const p=a.pos(ev),q=a.xy(e);sx=p.x;sy=p.y;ox=q.x;oy=q.y;e.classList.add('held');ev.preventDefault()});
      e.addEventListener('pointermove',ev=>{if(!on||done)return;const p=a.pos(ev);let nx=Math.max(3,Math.min(97,ox+p.x-sx)),ny=Math.max(3,Math.min(97,oy+p.y-sy));if(o.lockY)ny=oy;a.move(e,nx,ny);o.move&&o.move({x:nx,y:ny})});
      const end=()=>{if(!on)return;on=false;e.classList.remove('held');if(o.end&&!done)o.end(a.xy(e))};
      e.addEventListener('pointerup',end);e.addEventListener('pointercancel',end);return e},
    input(ph,check,num){const f=mk('form','ans');f.innerHTML=`<input id="ans${i}" autocomplete="off" ${num?'inputmode="numeric"':''} placeholder="${ph}"><button type="submit">${T(['확인','OK'])}</button>`;box.appendChild(f);
      f.addEventListener('submit',ev=>{ev.preventDefault();if(done)return;const v=f.querySelector('input').value.trim().toLowerCase();if(check(v)){sfx.tap();a.win()}else a.no(T(['아니에요!','Nope!']))});return f},
    onSound:null,onHint:null,onLang:null,
    _kill(){done=true;timers.forEach(f=>{try{f()}catch(e){}})}
  };
  api=a;cur=i;save();ui();
  S[i].s(a);
}
const WINL=[['찾았다!','알 수 없는 재능이에요!','천재인가요?','삐약! 고마워요','대단해요!'],['Found it!','Egg-cellent!','Are you a genius?','Cheep! Thank you','Egg-straordinary!']];
function celebrate(i){box.classList.remove('flipped','shake');sfx.win();best=Math.max(best,i+1);save();showClear(i)}
function showClear(i){
  const last=i===S.length-1,o=mk('div','clear');
  o.innerHTML=`<div class="conf"></div><div class="cc"><div class="big">${last?T(['🏆 완주!','🏆 All done!']):T(['통과!','Clear!'])}</div><p>${last?T([`이스터애그 ${S.length}개를 모두 찾았어요!`,`You found all ${S.length} easter eggs!`]):T(WINL)[i%5]}</p><button class="sbtn" type="button">${last?T(['처음부터 다시','Play again']):T(['다음 스테이지 →','Next stage →'])}</button></div>`;
  const cf=o.querySelector('.conf');
  for(let k=0;k<18;k++){const s=mk('i');s.style.left=rnd(2,96)+'%';s.style.background=pick(EC);s.style.animationDelay=rnd(0,.6)+'s';s.style.animationDuration=rnd(1.4,2.4)+'s';cf.appendChild(s)}
  o.querySelector('button').addEventListener('click',()=>{sfx.tap();if(last){best=0;go(0)}else go(i+1)});
  box.appendChild(o);o.querySelector('button').focus({preventScroll:true});
}
function go(i){build(Math.max(0,Math.min(S.length-1,i)))}
function ui(){
  document.documentElement.lang=L;
  $('cnt').textContent=`${cur+1} / ${S.length}`;
  $('bar').style.width=(cur/S.length*100)+'%';
  const it=T(S[cur].t);if($('inst').textContent!==it)$('inst').textContent=it;
  $('ttl').textContent=T(['이스터애그 400','Easter Egg 400']);
  $('bSnd').textContent=snd?T(['🔊 소리','🔊 Sound']):T(['🔇 소리','🔇 Sound']);
  $('bSnd').setAttribute('aria-pressed',String(snd));
  $('bHint').textContent=T(['💡 힌트','💡 Hint']);
  $('bLang').innerHTML=L==='ko'?'한 / <span class="off">EN</span>':'<span class="off">한</span> / EN';
  const h=$('hint');if(!h.hidden)h.innerHTML=`<b>${T(['힌트','Hint'])}</b>${T(S[cur].h)}`;
}
$('bSnd').addEventListener('click',()=>{snd=!snd;save();ui();sfx.tap();if(api&&api.onSound)api.onSound(snd)});
$('bHint').addEventListener('click',()=>{sfx.tap();const h=$('hint');h.hidden=false;h.innerHTML=`<b>${T(['힌트','Hint'])}</b>${T(S[cur].h)}`;if(api&&api.onHint&&!api.done)api.onHint()});
$('bLang').addEventListener('click',()=>{sfx.tap();L=L==='ko'?'en':'ko';save();const hv=!$('hint').hidden;
  if(api&&api.onLang&&!api.done){ui();api.onLang()}
  else if(api&&api.done){ui();const c=box.querySelector('.clear');if(c){c.remove();showClear(cur)}}
  else{build(cur);if(hv){$('hint').hidden=false;ui()}}});

/* secret stage select: tap the stage counter, password 0823 */
const cnt=$('cnt');cnt.setAttribute('role','button');cnt.tabIndex=0;
const jp=$('jump');
function openJump(){
  jp.hidden=false;
  jp.innerHTML=`<form class="jr" id="jpw"><input id="jpin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="${T(['비밀번호','Password'])}"><button type="submit">${T(['확인','OK'])}</button><button type="button" class="jx" aria-label="close">✕</button></form><p class="jm" id="jmsg">🔒</p>`;
  jp.querySelector('.jx').addEventListener('click',()=>{jp.hidden=true});
  const i=$('jpin');i.focus();
  $('jpw').addEventListener('submit',ev=>{ev.preventDefault();
    if(i.value.trim()!=='0823'){sfx.no();$('jmsg').textContent=T(['비밀번호가 틀렸어요','Wrong password']);i.value='';return}
    sfx.win();
    jp.innerHTML=`<form class="jr" id="jgo" novalidate><input id="jnum" type="number" inputmode="numeric" min="1" max="${S.length}" value="${cur+1}"><button type="submit">${T(['이동','Go'])}</button><button type="button" class="jx" aria-label="close">✕</button></form><p class="jm">${T([`1부터 ${S.length}까지, 시작할 스테이지를 골라요`,`Pick a stage from 1 to ${S.length}`])}</p>`;
    jp.querySelector('.jx').addEventListener('click',()=>{jp.hidden=true});
    const n=$('jnum');n.focus();n.select();
    $('jgo').addEventListener('submit',e2=>{e2.preventDefault();const v=parseInt(n.value,10);
      if(!(v>=1&&v<=S.length)){sfx.no();jp.querySelector('.jm').textContent=T([`1부터 ${S.length} 사이 숫자를 넣어요`,`Enter a number from 1 to ${S.length}`]);return}
      jp.hidden=true;window.scrollTo({top:0});go(v-1)});
  });
}
cnt.addEventListener('click',ev=>{if(ev.target.closest('.hegg'))return;jp.hidden?openJump():jp.hidden=true});
cnt.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();cnt.click()}});
window.__egg={S,go,get api(){return api}};
go(cur);
})();
</script>
