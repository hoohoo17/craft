<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>낙서런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EFE7;
    --grid:#B7C9D6;
    --grid-strong:#9DB4C4;
    --ink:#1D2B38;
    --pen:#2E4B6B;
    --red:#CC4234;
    --pencil:#8A9199;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    font-family:'Gaegu','Nanum Pen Script',ui-rounded,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    position:relative;width:100%;max-width:900px;
    background:
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--grid) 27px 28px),
      repeating-linear-gradient(to right, transparent 0 27px, var(--grid) 27px 28px);
    background-color:var(--paper);
    border:1px solid var(--grid-strong);
    border-radius:2px;
    box-shadow:0 1px 0 var(--grid-strong), 0 10px 24px rgba(29,43,56,.10);
    overflow:hidden;
  }
  .margin-line{position:absolute;top:0;bottom:0;left:52px;width:1px;background:var(--red);opacity:.45}
  .holes{position:absolute;left:18px;top:0;bottom:0;width:16px;display:flex;flex-direction:column;justify-content:space-around;padding:36px 0;pointer-events:none}
  .holes i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 1px 2px rgba(29,43,56,.35)}
  .book{display:flex;align-items:stretch}
  .stage{position:relative;flex:1 1 auto;min-width:0;aspect-ratio:9/5;touch-action:none}
  .rank{flex:0 0 178px;border-left:1px dashed var(--ink);padding:14px 12px 10px;display:flex;flex-direction:column}
  .rank h2{font-size:20px;font-weight:700;color:var(--red);margin-bottom:8px;letter-spacing:.04em;
    display:flex;align-items:center;justify-content:space-between;gap:6px}
  .rank h2 button{font-family:inherit;font-size:18px;line-height:1;color:var(--pen);background:transparent;
    border:0;padding:2px 6px;cursor:pointer;border-radius:3px}
  .rank h2 button:hover{color:var(--red)}
  .rank h2 button:active{transform:translateY(1px)}
  .rank h2 button.spin{animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.rank h2 button.spin{animation:none;opacity:.5}}
  .rank-note{margin-top:8px;font-size:14px;color:var(--pencil);min-height:1.2em}
  .rank-note.warn{color:var(--red)}
  .rank h2 .count{flex:1;font-size:14px;font-weight:400;color:var(--pencil);letter-spacing:0}
  .rank ol{list-style:none;font-size:18px;color:var(--pen);line-height:1.55;
    max-height:260px;overflow-y:auto;overscroll-behavior:contain}
  .rank li{display:flex;gap:6px;align-items:baseline;border-bottom:1px dotted var(--grid-strong);padding:2px 0}
  .rank li .no{width:16px;color:var(--pencil);font-size:15px}
  /* 메달은 숫자보다 넓으니 자리를 더 준다 */
  .rank li .no.medal{width:20px;font-size:16px;text-align:center}
  /* 이름은 6자까지 들어간다. 자리가 모자라면 이름 대신 거리부터 줄인다. */
  .rank li .nm{flex:1 1 auto;min-width:4.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .rank li .st{flex:0 0 auto;color:var(--red);font-weight:700}
  .rank li .dm{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--pencil)}
  .rank li.empty{color:var(--pencil);border:0}
  .rank li.fresh .nm{color:var(--red)}
  .save{display:flex;gap:6px;margin-top:12px}
  .save input{flex:1;min-width:0;font-family:inherit;font-size:18px;background:transparent;border:0;
    border-bottom:1.5px solid var(--pen);color:var(--ink);padding:2px 4px;outline:none;text-align:center}
  .save input:focus{border-color:var(--red)}
  .save button{font-family:inherit;font-size:17px;background:var(--ink);color:var(--paper);
    border:0;border-radius:3px;padding:4px 10px;cursor:pointer}
  .save button:active{transform:translateY(1px)}
  .save.done{display:none}
  @media (max-width:620px){
    .book{flex-direction:column}
    .rank{flex:0 0 auto;border-left:0;border-top:1px dashed var(--ink)}
    .rank ol{max-height:200px}
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .hud{position:absolute;top:8px;left:66px;right:14px;display:flex;justify-content:space-between;
       font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em;pointer-events:none;color:var(--pen)}
  .hud b{font-weight:700}
  #lives{color:var(--red);letter-spacing:3px}

  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:6px;text-align:center;padding:0 24px;background:rgba(233,239,231,.72);backdrop-filter:blur(1px)}
  .card.hide{display:none}
  .title{font-size:clamp(34px,7vw,64px);font-weight:700;line-height:.95;color:var(--ink)}
  .title s{text-decoration:none;color:var(--red)}
  .sub{font-size:clamp(15px,2.6vw,21px);color:var(--pen)}
  .keys{margin-top:10px;font-size:clamp(14px,2.3vw,19px);color:var(--pencil)}
  .big{font-size:clamp(26px,5vw,44px);font-weight:700}
  .best{font-size:clamp(15px,2.6vw,20px);color:var(--pen)}
  .blink{animation:blink 1.1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div class="sheet">
  <div class="margin-line"></div>
  <div class="holes"><i></i><i></i><i></i></div>
  <div class="book">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span>거리 <b id="dist">0</b> m</span><span id="lives">♥♥♥</span><span>별 <b id="stars">0</b></span></div>

    <div class="card" id="startCard">
      <div class="title">낙<s>서</s>런</div>
      <div class="sub">탭하면 중력이 뒤집힌다. 목숨은 세 개.</div>
      <div class="keys blink">아무 데나 탭 · 스페이스바로 시작</div>
    </div>

    <div class="card hide" id="overCard">
      <div class="sub">목숨을 다 썼다</div>
      <div class="big"><span id="finalDist">0</span> m · 별 <span id="finalStars">0</span></div>
      <div class="best" id="bestLine">최고 기록 0 m</div>
      <div class="keys blink">다시 하려면 탭</div>
    </div>
  </div>

  <aside class="rank">
    <h2>별 순위 <span class="count" id="rankCount"></span>
      <button id="refreshBtn" title="순위 새로고침" aria-label="순위 새로고침">↻</button></h2>
    <ol id="rankList"><li class="empty">아직 기록 없음</li></ol>
    <div class="rank-note" id="rankNote"></div>
    <div class="save" id="saveRow" style="display:none">
      <input id="nameInput" maxlength="6" placeholder="이름" autocomplete="off">
      <button id="saveBtn">등록</button>
    </div>
  </aside>
  </div>
</div>

<script>
(() => {
  const W = 900, H = 500, CEIL = 46, FLOOR = H - 46;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const elDist = document.getElementById('dist'), elStars = document.getElementById('stars');
  const elLives = document.getElementById('lives');
  const startCard = document.getElementById('startCard'), overCard = document.getElementById('overCard');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit(){
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    const s = cv.width / W;
    ctx.setTransform(s, 0, 0, s, 0, 0);
  }
  addEventListener('resize', fit);

  /* ---------- 손그림 렌더링 (선이 미세하게 흔들리는 boil 효과) ---------- */
  let boil = 0;
  function hash(n){ const x = Math.sin(n * 127.113 + boil * 41.77) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }
  const off = (id, k, p) => hash(id * 17.31 + k * 3.77 + p * 91.7) * 1.7;

  function sketchPath(pts, id, close){
    for (let p = 0; p < 2; p++){
      ctx.beginPath();
      for (let k = 0; k < pts.length; k++){
        const x = pts[k][0] + off(id, k, p), y = pts[k][1] + off(id, k + 40, p);
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      if (close) ctx.closePath();
      ctx.stroke();
    }
  }
  function sketchRect(x, y, w, h, id){
    sketchPath([[x,y],[x+w,y],[x+w,y+h],[x,y+h]], id, true);
  }
  function sketchCircle(cx, cy, r, id, segs = 14){
    const pts = [];
    for (let i = 0; i < segs; i++){
      const a = i / segs * Math.PI * 2;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    sketchPath(pts, id, true);
  }
  function hatch(x, y, w, h, gap, id){
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.lineWidth = 1.1; ctx.globalAlpha = .55;
    for (let i = -h; i < w; i += gap){
      const j = off(id, i, 0);
      ctx.beginPath();
      ctx.moveTo(x + i + j, y + h);
      ctx.lineTo(x + i + h + j, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 상태 ---------- */
  const INK = '#1D2B38', PEN = '#2E4B6B', RED = '#CC4234', PENCIL = '#8A9199';
  let state = 'start', best = 0;

  /* ---------- 별 순위 ---------- */
  const RKEY = 'nakseorun:ranking:1';
  // 이미 떠 있는 댓글 API를 순위판으로 그대로 쓴다(서버 배포 불필요).
  // 미승인 댓글은 message가 가려지고 name만 돌아오므로, 점수를 name에 '이름|별|거리'로 담는다.
  const API = 'https://craft-comments.jaehoo.workers.dev?page=rank-nakseo-run-1';
  const rankList = document.getElementById('rankList');
  const rankNote = document.getElementById('rankNote');
  const rankCount = document.getElementById('rankCount');
  const refreshBtn = document.getElementById('refreshBtn');
  const saveRow = document.getElementById('saveRow');
  const nameInput = document.getElementById('nameInput');
  const saveBtn = document.getElementById('saveBtn');
  let ranking = [], lastRun = null, lastName = '', busy = false;

  function renderRank(freshIdx = -1){
    rankCount.textContent = ranking.length ? `TOP ${TOP}` : '';
    if (!ranking.length){ rankList.innerHTML = '<li class="empty">아직 기록 없음</li>'; return; }
    // 1~3등은 메달, 나머지는 숫자
    const MEDAL = ['🥇', '🥈', '🥉'];
    rankList.innerHTML = ranking.map((r, i) =>
      `<li class="${i === freshIdx ? 'fresh' : ''}">` +
      `<span class="no${i < 3 ? ' medal' : ''}">${MEDAL[i] || (i + 1)}</span>` +
      `<span class="nm">${String(r.n).replace(/[<>&]/g, '')}</span>` +
      `<span class="st">★${r.s}</span><span class="dm">${r.d}m</span></li>`).join('');
  }
  function note(msg, warn){
    rankNote.textContent = msg || '';
    rankNote.classList.toggle('warn', !!warn);
  }
  // 순위에서 빼기로 한 이름들 (서버 글은 지울 수 없어서 여기서 걸러 낸다)
  const HIDDEN = ['박혜담'];
  const hidden = n => HIDDEN.includes(String(n || '').trim());

  // 로컬 사본: 서버가 안 될 때를 위한 폴백
  function sane(list){
    return Array.isArray(list)
      ? list.filter(r => r && typeof r.n === 'string' && Number.isFinite(+r.s) && Number.isFinite(+r.d) && !hidden(r.n))
            .map(r => ({ n: r.n, s: +r.s, d: +r.d })).slice(0, 5)
      : [];
  }
  function readLocal(){
    try { return sane(JSON.parse(localStorage.getItem(RKEY))); } catch (e) { return []; }
  }
  function writeLocal(){
    try { localStorage.setItem(RKEY, JSON.stringify(ranking)); } catch (e) {}
  }
  // '이름|별|거리' 문자열 <-> 기록
  const encode = (e) => `${e.n.replace(/[|]/g, '')}|${e.s}|${e.d}`.slice(0, 20);
  function decode(name){
    const m = /^(.*)\|(\d+)\|(\d+)$/.exec(String(name || ''));
    return m && m[1] ? { n: m[1], s: +m[2], d: +m[3] } : null;
  }
  // 5등까지만 남긴다(별 많은 순 → 멀리 간 순)
  const TOP = 5;
  const sortRank = (list) => list.sort((a, b) => b.s - a.s || b.d - a.d).slice(0, TOP);

  async function fetchBoard(){
    const res = await fetch(API, { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('bad payload');
    // 순위 형식이 아닌 항목(사람이 남긴 댓글 등)은 조용히 무시한다
    return sortRank(data.map(c => decode(c && c.name)).filter(r => r && !hidden(r.n)));
  }
  async function loadRank(){
    if (busy) return;
    busy = true;
    refreshBtn.classList.add('spin');
    // 서버 응답 전에는 로컬 사본을 먼저 보여준다
    if (!ranking.length){ ranking = readLocal(); renderRank(); }
    try {
      ranking = await fetchBoard();
      writeLocal();
      note('');
    } catch (e) {
      ranking = readLocal();
      note('오프라인 · 이 기기 기록만 표시', true);
    }
    renderRank();
    busy = false;
    refreshBtn.classList.remove('spin');
  }
  async function submitScore(){
    if (!lastRun || busy) return;
    busy = true;
    const n = (nameInput.value || '').trim().slice(0, 6) || '이름없음';
    lastName = n;
    const entry = { n, s: lastRun.s, d: lastRun.d };
    lastRun = null;
    saveRow.style.display = 'none';

    // 낙관적 반영: 서버 응답을 기다리지 않고 먼저 보여준다
    ranking = sortRank(ranking.concat([entry]));
    writeLocal();
    renderRank(ranking.indexOf(entry));

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: encode(entry), message: `별 ${entry.s} · ${entry.d}m` }),
      });
      if (!res.ok) throw new Error('http ' + res.status);
      ranking = await fetchBoard();
      writeLocal();
      note('');
      renderRank(ranking.findIndex(r => r.n === entry.n && r.s === entry.s && r.d === entry.d));
    } catch (e) {
      note('저장 실패 · 이 기기에만 기록됨', true);
    }
    busy = false;
  }
  refreshBtn.addEventListener('click', e => { e.stopPropagation(); loadRank(); });
  saveBtn.addEventListener('click', e => { e.stopPropagation(); submitScore(); });
  saveRow.addEventListener('pointerdown', e => e.stopPropagation());
  nameInput.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') submitScore();
  });
  loadRank();
  let P, dir, dist, speed, stars, blocks, coins, bits, trail, nextGap, idSeed, guides, slow, lives, inv, deadT;

  function reset(){
    P = { x: 170, y: FLOOR - 14, vy: 0, r: 13, spin: 0 };
    dir = 1; dist = 0; speed = 215; stars = 0;
    blocks = []; coins = []; bits = []; trail = []; guides = [];
    nextGap = 520; idSeed = 1; slow = 1; lives = 3; inv = 0; deadT = 0;
    elLives.textContent = '♥♥♥';
    for (let i = 0; i < 3; i++) spawn(W + 380 + i * 420);
  }

  function spawn(x){
    const t = dist;
    const pair = false;
    const id = idSeed++;
    if (pair){
      const a = 50 + Math.random() * 60, b = 50 + Math.random() * (190 - a);
      blocks.push({ x, w: 44, h: a, side: 1, id });
      blocks.push({ x, w: 44, h: b, side: -1, id: id + 500 });
      guides.push({ x, y: ((CEIL + b) + (FLOOR - a)) / 2, id: idSeed++ });
    } else {
      const side = Math.random() < .5 ? 1 : -1;
      const h = 40 + Math.random() * Math.min(100, 40 + t / 60);
      blocks.push({ x, w: 38 + Math.random() * 26, h, side, id });
    }
    if (Math.random() < .75){
      const side = Math.random() < .5 ? 1 : -1;
      const y = side === 1 ? FLOOR - 34 : CEIL + 34;
      const n = 1 + (Math.random() < .35 ? 2 : 0);
      for (let i = 0; i < n; i++) coins.push({ x: x - 150 - i * 40, y, id: idSeed++, got: false });
    }
  }

  function flip(){
    dir *= -1;
    for (let i = 0; i < 5; i++)
      bits.push({ x: P.x, y: P.y + P.r * dir * -1, vx: -60 - Math.random() * 90, vy: (Math.random() - .5) * 120, life: .35, id: idSeed++ });
  }

  function die(){
    state = 'over';
    deadT = .6;
    const m = Math.floor(dist / 12);
    best = Math.max(best, m);
    document.getElementById('finalDist').textContent = m;
    document.getElementById('finalStars').textContent = stars;
    document.getElementById('bestLine').textContent = '최고 기록 ' + best + ' m';
    overCard.classList.remove('hide');
    lastRun = { s: stars, d: m };
    nameInput.value = lastName;
    saveRow.style.display = 'flex';
    for (let i = 0; i < 18; i++)
      bits.push({ x: P.x, y: P.y, vx: (Math.random() - .5) * 420, vy: (Math.random() - .5) * 420, life: .7, id: idSeed++ });
  }

  function press(){
    if (state === 'start'){ startCard.classList.add('hide'); reset(); state = 'play'; }
    else if (state === 'play') flip();
    else if (state === 'over' && deadT <= 0){ overCard.classList.add('hide'); saveRow.style.display = 'none'; reset(); state = 'play'; }
  }
  stage.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  addEventListener('keydown', e => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'BUTTON')) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){ e.preventDefault(); press(); }
  });

  /* ---------- 업데이트 ---------- */
  function update(dt){
    if (state !== 'play') { deadT -= dt; bits.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }); bits = bits.filter(b => b.life > 0); return; }

    speed = Math.min(440, 215 + dist / 85);

    // 동시 블록이 다가오면 화면이 느려진다
    const near = guides.some(g => g.x > P.x - 70 && g.x < P.x + 430);
    const target = near ? 0.5 : 1;
    slow += (target - slow) * Math.min(1, dt * (near ? 5 : 2.2));

    const es = speed * slow;
    dist += es * dt;
    P.spin += es * dt / P.r * .5;

    if (inv > 0) inv -= dt;
    P.vy += 1750 * dir * dt;
    P.vy = Math.max(-900, Math.min(900, P.vy));
    P.y += P.vy * dt;
    if (P.y > FLOOR - P.r){ P.y = FLOOR - P.r; P.vy = 0; }
    if (P.y < CEIL + P.r){ P.y = CEIL + P.r; P.vy = 0; }

    trail.push({ x: P.x, y: P.y, life: .32, id: idSeed++ });
    trail.forEach(t => { t.x -= es * dt; t.life -= dt; });
    trail = trail.filter(t => t.life > 0);

    blocks.forEach(b => b.x -= es * dt);
    guides.forEach(g => g.x -= es * dt);
    guides = guides.filter(g => g.x > -80);
    coins.forEach(c => c.x -= es * dt);
    bits.forEach(b => { b.x += b.vx * dt - es * dt; b.y += b.vy * dt; b.life -= dt; });
    bits = bits.filter(b => b.life > 0);
    blocks = blocks.filter(b => b.x + b.w > -60);
    coins = coins.filter(c => c.x > -60 && !c.got);

    let far = 0; blocks.forEach(b => far = Math.max(far, b.x));
    if (far < W + 40){
      nextGap = speed * (0.95 + Math.random() * 0.45);
      spawn(far + Math.max(320, nextGap));
    }

    // 충돌
    for (const b of blocks){
      const by = b.side === 1 ? FLOOR - b.h : CEIL;
      const cx = Math.max(b.x, Math.min(P.x, b.x + b.w));
      const cy = Math.max(by, Math.min(P.y, by + b.h));
      const dx = P.x - cx, dy = P.y - cy;
      if (dx * dx + dy * dy < (P.r - 3.5) ** 2){
        if (inv > 0) continue;
        lives--;
        elLives.textContent = '♥'.repeat(Math.max(0, lives));
        if (lives <= 0){ die(); return; }
        inv = 1.5;
        for (let i = 0; i < 12; i++)
          bits.push({ x: P.x, y: P.y, vx: (Math.random() - .5) * 300, vy: (Math.random() - .5) * 300, life: .5, id: idSeed++, red: true });
        break;
      }
    }
    for (const c of coins){
      if (!c.got && Math.hypot(c.x - P.x, c.y - P.y) < P.r + 12){
        c.got = true; stars++;
        for (let i = 0; i < 6; i++)
          bits.push({ x: c.x, y: c.y, vx: (Math.random() - .5) * 200, vy: (Math.random() - .5) * 200, life: .3, id: idSeed++, red: true });
      }
    }
    elDist.textContent = Math.floor(dist / 12);
    elStars.textContent = stars;
  }

  /* ---------- 그리기 ---------- */
  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // 바닥 / 천장
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    sketchPath([[0, FLOOR], [W, FLOOR]], 7);
    sketchPath([[0, CEIL], [W, CEIL]], 8);
    ctx.strokeStyle = PENCIL;
    hatch(0, FLOOR, W, 46, 16, 11);
    hatch(0, 0, W, CEIL, 16, 12);

    // 동시 블록 통로 안내선
    ctx.strokeStyle = RED; ctx.lineWidth = 1.6;
    ctx.globalAlpha = .35 + (1 - slow) * 1.2;
    for (const g of guides){
      for (let d = -260; d < 44; d += 26)
        sketchPath([[g.x + d, g.y], [g.x + d + 14, g.y]], g.id + d);
    }
    ctx.globalAlpha = 1;

    // 장애물
    for (const b of blocks){
      const by = b.side === 1 ? FLOOR - b.h : CEIL;
      ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
      sketchRect(b.x, by, b.w, b.h, b.id);
      ctx.strokeStyle = PEN;
      hatch(b.x + 2, by + 2, b.w - 4, b.h - 4, 9, b.id);
    }

    // 별
    ctx.strokeStyle = RED; ctx.lineWidth = 2;
    for (const c of coins){
      const pts = [];
      for (let i = 0; i < 10; i++){
        const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4.5 : 11;
        pts.push([c.x + Math.cos(a) * r, c.y + Math.sin(a) * r]);
      }
      sketchPath(pts, c.id, true);
    }

    // 잔상
    ctx.strokeStyle = PENCIL; ctx.lineWidth = 1.4;
    for (const t of trail){
      ctx.globalAlpha = t.life * 1.4;
      sketchPath([[t.x - 6, t.y], [t.x + 6, t.y]], t.id);
    }
    ctx.globalAlpha = 1;

    // 주인공
    if (state !== 'over' || deadT > .2){
      ctx.globalAlpha = inv > 0 ? (Math.sin(inv * 26) > 0 ? .28 : 1) : 1;
      ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
      sketchCircle(P.x, P.y, P.r, 3);
      const a = P.spin;
      ctx.lineWidth = 2;
      sketchPath([[P.x + Math.cos(a) * 5, P.y + Math.sin(a) * 5], [P.x + Math.cos(a) * P.r * .85, P.y + Math.sin(a) * P.r * .85]], 4);
      ctx.globalAlpha = 1;
    }

    // 파편
    ctx.lineWidth = 1.8;
    for (const b of bits){
      ctx.strokeStyle = b.red ? RED : PEN;
      ctx.globalAlpha = Math.min(1, b.life * 2.4);
      sketchPath([[b.x, b.y], [b.x - b.vx * .012, b.y - b.vy * .012]], b.id);
    }
    ctx.globalAlpha = 1;

    // 슬로우 구간 표시
    if (state === 'play' && slow < .93){
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1 - slow) * 2.4);
      ctx.fillStyle = RED;
      ctx.font = "700 24px Gaegu, 'Apple SD Gothic Neo', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('천 천 히', W / 2, CEIL + 34);
      ctx.restore();
    }

    // 중력 방향 화살표
    if (state === 'play'){
      ctx.strokeStyle = RED; ctx.lineWidth = 2;
      const ax = 92, ay = dir === 1 ? FLOOR - 26 : CEIL + 26, s = dir;
      sketchPath([[ax, ay - 12 * s], [ax, ay + 12 * s], [ax - 6, ay + 4 * s], [ax, ay + 12 * s], [ax + 6, ay + 4 * s]], 9);
    }
    ctx.restore();
  }

  let last = performance.now(), acc = 0;
  function loop(now){
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    acc += dt;
    if (acc > (reduce ? .25 : .085)){ boil++; acc = 0; }
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  fit(); reset(); state = 'start'; requestAnimationFrame(loop);
})();
</script>
<script src="../rest.js?v=9"></script>
